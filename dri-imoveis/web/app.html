<style>
  :root{ --ink:#13232E; --muted:#5D6C76; --surface:#F4F6F7; --card:#FFFFFF; --line:#DFE5E8;
    --brand:#0F6E5C; --brand-ink:#FFFFFF; --soft:#E6F2EF; --warn:#9A5B00; --warn-bg:#FFF4E0;
    --bad:#B42318; --bad-bg:#FDECEA; --ok:#0F6E5C; --ok-bg:#E6F2EF; --wa:#1F8B4C; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ink:#E7EDF0; --muted:#9AA8B1; --surface:#0F171C; --card:#162229; --line:#25343C;
    --brand:#3CB39A; --brand-ink:#08130F; --soft:#17302B; --warn:#F2B35B; --warn-bg:#2C2112;
    --bad:#F08A80; --bad-bg:#2D1715; --ok:#3CB39A; --ok-bg:#17302B; --wa:#3DBE73; } }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--surface);font-size:15px;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand h1{font-size:22px} .brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h3{font-size:17px;margin-bottom:10px}
  .muted{color:var(--muted)} .small{font-size:13px}
  label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
  .grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--brand);color:var(--brand-ink)}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn-wa{background:var(--wa);color:#fff} .btn-sm{padding:7px 11px;font-size:13.5px}
  .btn-bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .msg{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;cursor:pointer}
  .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
  .tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;margin-left:6px;text-align:center}
  .steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .steps span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .steps span.on{background:var(--soft);color:var(--brand);border-color:var(--brand);font-weight:600}
  .steps span.done{color:var(--brand)}
  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .tile .l{font-size:13px;color:var(--muted)} .tile .v{font-family:"Space Grotesk";font-size:30px;font-weight:700;margin-top:4px}
  .list>div{border-top:1px solid var(--line);padding:12px 0} .list>div:first-child{border-top:0}
  .imv{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center}
  .imv img,.ph{width:96px;height:72px;object-fit:cover;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin-right:4px}
  .pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent} .pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px} .fotos div{position:relative} .fotos img{width:90px;height:68px;object-fit:cover;border-radius:8px}
  .fotos button{position:absolute;top:2px;right:2px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
  .dia{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;border-top:1px solid var(--line);padding:10px 0}
  .dia:first-child{border-top:0} .janela{display:flex;gap:6px;align-items:center;margin-bottom:6px} .janela input{width:auto}
  .phone{max-width:420px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
  .phone .hd{background:var(--wa);color:#fff;padding:10px 14px;font-weight:600}
  .phone .bd{height:420px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .b{max-width:82%;padding:8px 11px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.4}
  .b.user{align-self:flex-end;background:var(--soft)} .b.dri{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .b.corretor{align-self:flex-end;background:var(--warn-bg)} .b img{max-width:220px;border-radius:8px;display:block}
  .phone .ft{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--card)}
  .conv{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px}
  .conv .lst button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
  .conv .lst button.on{border-color:var(--brand)}
  ol.passo{padding-left:20px;line-height:1.6} ol.passo li{margin-bottom:6px}
  code{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;word-break:break-all}
  @media (max-width:720px){ .conv{grid-template-columns:1fr} .imv{grid-template-columns:72px 1fr} .imv>div:last-child{grid-column:1/-1} .imv img,.ph{width:72px;height:56px} .dia{grid-template-columns:1fr} }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const configurado = !!(SUPABASE_URL && SUPABASE_ANON_KEY && WORKER_URL);
// Link de parceiro (…/?p=codigo): guarda para o cadastro ligar a conta a ele
try{ const p=new URLSearchParams(location.search).get("p"); if(p) localStorage.setItem("dri_parceiro", p.toLowerCase()); }catch{}
const parceiroDoLink = ()=>{ try{ return localStorage.getItem("dri_parceiro")||undefined; }catch{ return undefined; } };
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const brl = (v)=> v==null||v==="" ? "—" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const fmtDT = (iso)=> new Date(iso).toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"America/Bahia"});
const fmtTel = (t)=>{ const d=String(t||"").replace(/\D/g,""); if(d.length===13) return `(${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`; if(d.length===12) return `(${d.slice(2,4)}) ${d.slice(4,8)}-${d.slice(8)}`;
  if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t||"—"; };
// Número em formato brasileiro ("1.200.000", "38,54") ou já numérico (38.54)
const num = (v)=>{ if(v===""||v==null) return null; if(typeof v==="number") return isFinite(v)?v:null;
  const t=String(v).trim().replace(/[R$\s]/g,""); if(!t) return null;
  const n = t.includes(",") ? Number(t.replace(/\./g,"").replace(",",".")) : /^\d+\.\d{1,2}$/.test(t) ? Number(t) : Number(t.replace(/\./g,""));
  return isFinite(n) ? n : null; };

async function worker(caminho, corpo){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(WORKER_URL.replace(/\/$/,"")+caminho, { method:"POST",
    headers:{ "content-type":"application/json", authorization:"Bearer "+(session?.access_token||"") },
    body: JSON.stringify(corpo||{}) });
  const j = await r.json().catch(()=>({error:"Resposta inválida do servidor."}));
  if(!r.ok || j.error) throw new Error(j.error || ("Erro "+r.status));
  return j;
}

// Reduz a foto para no máximo 1600 px (o WhatsApp aceita até 5 MB)
async function reduzirFoto(arquivo){
  const img = await createImageBitmap(arquivo);
  const escala = Math.min(1, 1600/Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width=Math.round(img.width*escala); c.height=Math.round(img.height*escala);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.82));
}

// Texto no estilo do WhatsApp: *negrito* e _itálico_
function Zap({texto}){
  if(!texto) return null;
  const partes = String(texto).split(/(\*[^*\n]+\*|_[^_\n]+_)/g);
  return <>{partes.map((p,i)=> /^\*[^*]+\*$/.test(p) ? <b key={i}>{p.slice(1,-1)}</b> : /^_[^_]+_$/.test(p) ? <i key={i}>{p.slice(1,-1)}</i> : p)}</>;
}

function Aviso({msg,limpar}){ return msg ? <div className={"msg "+msg.t} onClick={limpar}>{msg.x}</div> : null; }

// ======================================================================== login
function Login(){
  const [modo,setModo]=useState("criar"); const [email,setEmail]=useState(""); const [senha,setSenha]=useState("");
  const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState(false);
  async function enviar(e){
    e.preventDefault(); setOcupado(true); setMsg(null);
    try{
      if(modo==="criar"){
        const { data, error } = await sb.auth.signUp({ email, password:senha, options:{ emailRedirectTo: location.href.split("#")[0].split("?")[0], data:{ parceiro: parceiroDoLink() } } });
        if(error) throw error;
        if(!data.session) setMsg({t:"ok",x:"Conta criada! Abra o email que mandamos para "+email+" e clique no link para confirmar. Depois entre aqui."});
      } else if(modo==="entrar"){
        const { error } = await sb.auth.signInWithPassword({ email, password:senha }); if(error) throw error;
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] }); if(error) throw error;
        setMsg({t:"ok",x:"Se o email estiver cadastrado, você vai receber um link para criar uma senha nova."});
      }
    }catch(err){
      if(/not confirmed/i.test(err.message)){
        await sb.auth.resend({ type:"signup", email, options:{ emailRedirectTo: location.href.split("#")[0] } }).catch(()=>{});
        setModo("entrar"); setMsg({t:"bad",x:"Seu email ainda não foi confirmado. Mandamos o link de novo para "+email+": abra o email mais recente, clique no link e depois entre aqui."});
      } else setMsg({t:"bad",x: /Invalid login/i.test(err.message) ? "Email ou senha incorretos." : /already registered/i.test(err.message) ? "Este email já tem conta. Clique em Já tenho conta para entrar." : err.message});
    }
    setOcupado(false);
  }
  return (
    <div className="wrap" style={{maxWidth:440}}>
      <div className="brand" style={{marginBottom:18}}><h1>Dri Imóveis</h1><p>A assistente que atende seus clientes no WhatsApp, apresenta os imóveis e marca a visita na sua agenda.</p></div>
      <form className="card" onSubmit={enviar}>
        <h3>{modo==="criar"?"Criar minha conta":modo==="entrar"?"Entrar":"Esqueci a senha"}</h3>
        <Aviso msg={msg} limpar={()=>setMsg(null)}/>
        <label>Email</label><input type="email" required value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email"/>
        {modo!=="senha" && <><label>Senha {modo==="criar" && <span className="muted">(mínimo 8 caracteres)</span>}</label>
          <input type="password" required minLength={8} value={senha} onChange={e=>setSenha(e.target.value)} autoComplete={modo==="criar"?"new-password":"current-password"}/></>}
        <div className="row" style={{marginTop:14}}>
          <button className="btn btn-primary" disabled={ocupado}>{ocupado?"Aguarde…":modo==="criar"?"Criar conta":modo==="entrar"?"Entrar":"Enviar link"}</button>
        </div>
        <p className="small muted" style={{marginBottom:0}}>
          {modo!=="entrar" && <a href="#" onClick={e=>{e.preventDefault();setModo("entrar")}}>Já tenho conta</a>}
          {modo!=="criar" && <> · <a href="#" onClick={e=>{e.preventDefault();setModo("criar")}}>Criar conta</a></>}
          {modo==="entrar" && <> · <a href="#" onClick={e=>{e.preventDefault();setModo("senha")}}>Esqueci a senha</a></>}
        </p>
      </form>
    </div>
  );
}

function NovaSenha({fim}){
  const [s,setS]=useState(""); const [msg,setMsg]=useState(null);
  async function salvar(e){ e.preventDefault(); const { error } = await sb.auth.updateUser({ password:s }); if(error) setMsg({t:"bad",x:error.message}); else fim(); }
  return <div className="wrap" style={{maxWidth:440}}><form className="card" onSubmit={salvar}><h3>Nova senha</h3><Aviso msg={msg}/>
    <input type="password" minLength={8} required value={s} onChange={e=>setS(e.target.value)}/>
    <div style={{marginTop:12}}><button className="btn btn-primary">Salvar senha</button></div></form></div>;
}

// ======================================================================== perfil
function Perfil({conta, salvo, botao="Salvar"}){
  const [f,setF]=useState(()=>({ nome:"", tipo:"corretor", creci:"", cidade:"", whatsapp_pessoal:"", email_notificacao:"",
    nome_assistente:"Dri", apresentacao:"", duracao_visita_min:60, antecedencia_min_horas:2, avisar_capacidade:true, ...(conta||{}) }));
  const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState(false);
  const set=(k)=>(e)=>setF({...f,[k]:e.target.value});
  async function salvar(e){
    e.preventDefault(); setOcupado(true); setMsg(null);
    const { data:{ user } } = await sb.auth.getUser();
    const linha = { nome:f.nome.trim(), tipo:f.tipo, creci:f.creci||null, cidade:f.cidade||null,
      whatsapp_pessoal:f.whatsapp_pessoal.replace(/\D/g,"")||null, email_notificacao:f.email_notificacao||user.email,
      nome_assistente:f.nome_assistente.trim()||"Dri", apresentacao:f.apresentacao||null,
      duracao_visita_min:Number(f.duracao_visita_min)||60, antecedencia_min_horas:Number(f.antecedencia_min_horas)||0,
      avisar_capacidade: f.avisar_capacidade!==false };
    const r = conta ? await sb.from("contas").update(linha).eq("id",conta.id).select().single()
                    : await sb.from("contas").insert({...linha, owner_id:user.id, onboarding_etapa:2}).select().single();
    setOcupado(false);
    if(r.error) return setMsg({t:"bad",x:r.error.message});
    salvo(r.data); if(conta) setMsg({t:"ok",x:"Perfil salvo."});
  }
  return (
    <form className="card" onSubmit={salvar}>
      <h3>Seu perfil</h3>
      <p className="small muted" style={{marginTop:0}}>É assim que a assistente vai se apresentar para os seus clientes.</p>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      <div className="grid">
        <div><label>Seu nome ou da imobiliária *</label><input required value={f.nome} onChange={set("nome")} placeholder="Ex.: Carlos Andrade Imóveis"/></div>
        <div><label>Você é</label><select value={f.tipo} onChange={set("tipo")}><option value="corretor">Corretor autônomo</option><option value="imobiliaria">Imobiliária</option></select></div>
        <div><label>CRECI</label><input value={f.creci||""} onChange={set("creci")}/></div>
        <div><label>Cidade onde atua</label><input value={f.cidade||""} onChange={set("cidade")} placeholder="Salvador, BA"/></div>
        <div><label>Seu WhatsApp pessoal (avisos)</label><input value={f.whatsapp_pessoal||""} onChange={set("whatsapp_pessoal")} placeholder="71 99999-0000"/></div>
        <div><label>Email para avisos</label><input type="email" value={f.email_notificacao||""} onChange={set("email_notificacao")} placeholder="o mesmo do login"/></div>
        <div><label>Nome da assistente</label><input value={f.nome_assistente} onChange={set("nome_assistente")}/></div>
        <div><label>Duração da visita (min)</label><input type="number" min={15} max={240} step={15} value={f.duracao_visita_min} onChange={set("duracao_visita_min")}/></div>
        <div><label>Antecedência mínima (horas)</label><input type="number" min={0} max={72} value={f.antecedencia_min_horas} onChange={set("antecedencia_min_horas")}/></div>
      </div>
      <label className="row" style={{fontWeight:400,marginTop:12}}><input type="checkbox" style={{width:"auto"}} checked={f.avisar_capacidade!==false} onChange={e=>setF({...f,avisar_capacidade:e.target.checked})}/> Me avisar por email e WhatsApp quando a capacidade de IA do mês estiver acabando</label>
      <label>Orientações para a assistente</label>
      <textarea value={f.apresentacao||""} onChange={set("apresentacao")} placeholder={"Ex.: Atuo na Pituba, Itaigara e Caminho das Árvores. Trabalho com venda e aluguel. Não aceito permuta. Para aluguel peço fiador ou seguro-fiança. Visitas aos sábados podem ser com meu assistente Pedro."}/>
      <div className="row" style={{marginTop:14}}><button className="btn btn-primary" disabled={ocupado}>{ocupado?"Salvando…":botao}</button></div>
    </form>
  );
}

// ======================================================================== imóveis
const SITUACOES = ["lançamento","na planta","em obras","pronto"];
const TIPOS = ["apartamento","casa","casa em condomínio","cobertura","studio","flat","terreno","sala comercial","loja","galpão"];
const CARACTERISTICAS = {
  "Lazer": ["piscina","piscina infantil","playground","brinquedoteca","churrasqueira","espaço gourmet","salão de festas","salão de jogos","academia","quadra poliesportiva","quadra de areia","sauna","espaço pet","pista de cooper","rooftop","cinema","coworking","bicicletário"],
  "Segurança e serviços": ["portaria 24h","câmeras de segurança","elevador","gerador","minimercado","lavanderia","vaga para visitantes","carregador de carro elétrico","coleta seletiva"],
  "Do imóvel": ["varanda","varanda gourmet","suíte master","closet","armários planejados","área de serviço","dependência completa","nascente","vista mar","mobiliado","ar-condicionado","aceita pet"],
};
const SUGERIDAS = Object.values(CARACTERISTICAS).flat();

// Botões de clicar + campo para acrescentar outras
function Caracteristicas({valor, onChange, grupos=Object.keys(CARACTERISTICAS)}){
  const [nova,setNova]=useState("");
  const tem=(c)=>valor.some(v=>v.toLowerCase()===c.toLowerCase());
  const alternar=(c)=>onChange(tem(c)?valor.filter(v=>v.toLowerCase()!==c.toLowerCase()):[...valor,c]);
  const extras=valor.filter(v=>!SUGERIDAS.some(s=>s.toLowerCase()===v.toLowerCase()));
  const acrescentar=()=>{ const itens=nova.split(",").map(x=>x.trim()).filter(Boolean).filter(x=>!tem(x)); if(itens.length) onChange([...valor,...itens]); setNova(""); };

// Fotos: { url } já salva, ou { blob, preview } ainda no aparelho (sobe ao salvar)
function Fotos({itens, onChange, rotulo="Adicionar fotos", unica=false}){
  const [lendo,setLendo]=useState(false);
  async function escolher(e){
    const arquivos=[...e.target.files]; e.target.value=""; if(!arquivos.length) return; setLendo(true);
    const novos=[]; for(const a of arquivos){ try{ const blob=await reduzirFoto(a); novos.push({ blob, preview:URL.createObjectURL(blob) }); }catch{} }
    onChange(unica ? novos.slice(0,1) : [...itens,...novos]); setLendo(false);
  }
  const mover=(i)=>{ const fs=[...itens]; [fs[i-1],fs[i]]=[fs[i],fs[i-1]]; onChange(fs); };
  return (<div>
    <div className="fotos">{itens.map((it,i)=><div key={it.url||it.preview}><img src={it.url||it.preview} alt=""/>
      <button type="button" onClick={()=>onChange(itens.filter((_,j)=>j!==i))} aria-label="Remover">✕</button>
      {i>0 && <button type="button" style={{left:2,right:"auto"}} onClick={()=>mover(i)} aria-label="Mover para a esquerda">◀</button>}</div>)}</div>
    <label className="btn btn-ghost btn-sm" style={{margin:"8px 0 0"}}>{lendo?"Preparando…":rotulo}<input type="file" accept="image/*" multiple={!unica} hidden onChange={escolher}/></label>
  </div>);
}
async function subirFotos(conta, itens){
  const urls=[];
  for(const it of itens){
    if(it.url){ urls.push(it.url); continue; }
    const caminho=`${conta.id}/${crypto.randomUUID()}.jpg`;
    const { error } = await sb.storage.from("fotos-imoveis").upload(caminho, it.blob, { contentType:"image/jpeg" });
    if(error) throw error;
    urls.push(sb.storage.from("fotos-imoveis").getPublicUrl(caminho).data.publicUrl);
  }
  return urls;
}
const LIMITE_BOOK = 50*1024*1024;
const PDFLIB = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
function carregarPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  return new Promise((ok,erro)=>{ const s=document.createElement("script"); s.src=PDFLIB;
    s.onload=()=>ok(window.PDFLib); s.onerror=()=>erro(new Error("Não consegui carregar o compressor de PDF.")); document.head.appendChild(s); });
}
// Página do PDF em JPEG de até 1400 px (fundo branco: JPEG não tem transparência)
async function paginaEmJpeg(pg, qualidade){
  const vp1=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:Math.min(2.5,1400/vp1.width)});
  const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  await pg.render({ canvasContext:ctx, viewport:vp }).promise;
  return { canvas:c, blob: await new Promise(ok=>c.toBlob(ok,"image/jpeg",qualidade)), largura:vp1.width, altura:vp1.height };
}
// Refaz o book com as páginas em imagem otimizada: fica bem menor, chega mais rápido no celular do cliente
// e gasta menos transferência. Se não ficar pelo menos 20% menor (ou der erro), guarda o original.
async function comprimirBook(arquivo, paginas, progresso){
  try{
    let pags = paginas?.every(p=>p.blob && p.largura) ? paginas : null;
    if(!pags){
      const lib=await carregarPdfJs(); const pdf=await lib.getDocument({ data: await arquivo.arrayBuffer() }).promise; pags=[];
      for(let n=1;n<=pdf.numPages;n++){ progresso && progresso(`Comprimindo o book: página ${n} de ${pdf.numPages}…`);
        const pg=await pdf.getPage(n); const { blob, largura, altura } = await paginaEmJpeg(pg, 0.8); pags.push({ blob, largura, altura }); pg.cleanup(); }
    }
    progresso && progresso("Comprimindo o book…");
    const { PDFDocument } = await carregarPdfLib(); const doc = await PDFDocument.create();
    for(const p of pags){ const img=await doc.embedJpg(await p.blob.arrayBuffer());
      doc.addPage([p.largura,p.altura]).drawImage(img,{ x:0, y:0, width:p.largura, height:p.altura }); }
    const bytes = await doc.save();
    if(bytes.length > arquivo.size*0.8) return arquivo;
    return new File([bytes], arquivo.name, { type:"application/pdf" });
  }catch(e){ console.warn("compressão do book", e); return arquivo; }
}
async function subirBook(conta, arquivo){
  if(!arquivo || arquivo.size>LIMITE_BOOK) return null;
  const caminho=`${conta.id}/${crypto.randomUUID()}.pdf`;
  const { error } = await sb.storage.from("books-imoveis").upload(caminho, arquivo, { contentType:"application/pdf" });
  return error ? null : sb.storage.from("books-imoveis").getPublicUrl(caminho).data.publicUrl;
}

function deLinhas(linhas){
  const a=linhas[0];
  const comuns=(a.fotos||[]).filter(u=>linhas.every(l=>(l.fotos||[]).includes(u)));
  return { empreendimento:a.empreendimento||"", construtora:a.construtora||"", finalidade:a.finalidade||"venda", tipo:a.tipo||"apartamento",
    situacao:a.situacao||"", previsao_entrega:a.previsao_entrega||"", programa:a.programa||"", bairro:a.bairro||"", cidade:a.cidade||"", endereco:a.endereco||"",

    caracteristicas:[...new Set(linhas.flatMap(l=>l.caracteristicas||[]))], fotos:comuns.map(url=>({url})), book_url:a.book_url||null,
    plantas:linhas.map(l=>{ const propria=(l.fotos||[]).find(u=>!comuns.includes(u));
      return { id:l.id, nome:nomeDaPlanta(l.titulo,a.empreendimento), quartos:l.quartos??"", suites:l.suites??"", banheiros:l.banheiros??"", vagas:l.vagas??"",

            {f.plantas.length>1 && <button type="button" className="btn btn-bad btn-sm" onClick={()=>setF(x=>({...x,plantas:x.plantas.filter((_,j)=>j!==i)}))}>Remover</button>}
          </div>
        </div>))}
      <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setF(x=>({...x,plantas:[...x.plantas,PLANTA_VAZIA()]}))}>+ Outra planta</button>

      <h3 style={{fontSize:15,marginTop:18}}>Fotos do empreendimento ({f.fotos.length})</h3>
      <p className="small muted" style={{marginTop:0}}>Fachada, lazer, decorado. Valem para todas as plantas; a primeira é a capa.</p>
      <Fotos itens={f.fotos} onChange={v=>setF({...f,fotos:v})}/>
      {paginas && <>
        <div className="small muted" style={{margin:"12px 0 6px"}}>Ou toque nas páginas do book para usar como foto:</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:8}}>
          {paginas.map(p=>{ const i=paginaNasFotos(p.n); return (

            </button>); })}
        </div></>}

      <h3 style={{fontSize:15,marginTop:18}}>Book (PDF)</h3>
      <p className="small muted" style={{marginTop:0}}>Opcional. A assistente manda para o cliente quando ele pede. Ao salvar, o PDF é comprimido para chegar rápido no celular do cliente (até 50 MB depois de comprimido).</p>
      {book ? <p className="small">{book.name} ({(book.size/1048576).toFixed(1)} MB){book.size>8*1048576 && <span className="muted"> · será comprimido ao salvar</span>}</p>
        : f.book_url ? <p className="small"><a href={f.book_url} target="_blank" rel="noreferrer">Abrir o book atual</a></p> : null}
      <label className="btn btn-ghost btn-sm" style={{margin:0}}>{book||f.book_url?"Trocar PDF":"Anexar PDF"}<input type="file" accept="application/pdf" hidden onChange={e=>{ const a=e.target.files[0]; e.target.value=""; if(a) setBook(a); }}/></label>

      <div className="row" style={{marginTop:18}}><button type="button" className="btn btn-primary" disabled={!!ocupado} onClick={salvar}>{ocupado||`Salvar ${f.plantas.length} ${f.plantas.length===1?"planta":"plantas"}`}</button>
        {fechar && <button type="button" className="btn btn-ghost" onClick={fechar}>Cancelar</button>}</div>
    </div>
  );
}

// ------------------------------------------------------------------ importar book (PDF)
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function carregarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok,erro)=>{ const s=document.createElement("script"); s.src=PDFJS+"pdf.min.js";
    s.onload=()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; ok(pdfjsLib); }; s.onerror=()=>erro(new Error("Não consegui carregar o leitor de PDF. Confira a internet.")); document.head.appendChild(s); });
}

function ImportarBook({conta, fechar, pronto}){
  const [fase,setFase]=useState("escolher"); const [prog,setProg]=useState(""); const [msg,setMsg]=useState(null);
  const [arquivo,setArquivo]=useState(null); const [pags,setPags]=useState(null); const [inicial,setInicial]=useState(null);

  async function ler(e){
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    setArquivo(f); setMsg(null); setFase("lendo");
    try{
      const lib = await carregarPdfJs();
      const pdf = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
      const lidas=[];
      for(let n=1;n<=pdf.numPages;n++){
        setProg(`Lendo página ${n} de ${pdf.numPages}…`);
        const pg = await pdf.getPage(n);
        const tc = await pg.getTextContent();
        const texto = tc.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
        const { canvas:c, blob, largura, altura } = await paginaEmJpeg(pg, 0.82);
        const t=document.createElement("canvas"); t.width=260; t.height=Math.round(260*c.height/c.width); t.getContext("2d").drawImage(c,0,0,t.width,t.height);
        lidas.push({ n, texto, blob, largura, altura, mini:t.toDataURL("image/jpeg",0.7) });
        pg.cleanup();
      }
      setProg("A IA está lendo o book…"); setFase("analisando");
      const semTexto = lidas.reduce((a,p)=>a+p.texto.length,0) < 300;
      const imagens = semTexto ? lidas.slice(0,12).map(p=>({ n:p.n, base64: p.mini.split(",")[1] })) : [];
      const { dados:d } = await worker("/importar/analisar",{ total_paginas: lidas.length, paginas: lidas.map(p=>({n:p.n, texto:p.texto})), imagens });
      const pg=(n)=>lidas.find(x=>x.n===n);
      const fotosIniciais=(d.paginas_fotos.length ? d.paginas_fotos : lidas.slice(0,6).map(p=>p.n)).map(n=>({ pagina:n, blob:pg(n).blob, preview:pg(n).mini }));
      setPags(lidas);
      setInicial({ empreendimento:d.empreendimento||"", construtora:d.construtora||"", finalidade:d.finalidade||"venda", tipo:d.tipo||"apartamento",
        situacao:d.situacao||"", previsao_entrega:d.previsao_entrega||"", programa:d.programa||"", bairro:d.bairro||"", cidade:d.cidade||conta.cidade||"",
        endereco:d.endereco||"", descricao:d.descricao||"", caracteristicas:d.caracteristicas||[], fotos:fotosIniciais,
        plantas:(d.plantas.length?d.plantas:[{nome:d.empreendimento||"Unidade"}]).map(p=>({ ...PLANTA_VAZIA(), nome:p.nome||"", quartos:p.quartos??"", suites:p.suites??"",
          vagas:d.vagas??"", area_m2:textoNum(p.area_m2), preco: d.plantas.length<=1 && d.preco_a_partir ? textoNum(d.preco_a_partir) : "",
          planta: p.pagina && pg(p.pagina) ? [{ pagina:p.pagina, blob:pg(p.pagina).blob, preview:pg(p.pagina).mini }] : [] })) });
      setFase("revisar");
    }catch(err){ setMsg({t:"bad",x:err.message}); setFase("escolher"); }
  }

  if(fase==="revisar") return <FormEmpreendimento conta={conta} inicial={inicial} paginas={pags} arquivoBook={arquivo} fechar={fechar} salvo={pronto}/>;
  return (
    <div className="card">
      <div className="between"><h3>Importar book (PDF)</h3><button className="btn btn-ghost btn-sm" onClick={fechar}>Fechar</button></div>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      {fase==="escolher" ? <>
        <p className="small muted" style={{marginTop:0}}>Mande o book do empreendimento (o PDF de divulgação). A IA lê as páginas, separa as plantas e escolhe as melhores imagens. Depois você confere e completa preços e vagas. O PDF é lido aqui no seu aparelho; até 50 MB ele também fica guardado para a {conta.nome_assistente} mandar aos clientes.</p>
        <label className="btn btn-primary" style={{margin:0}}>Escolher PDF<input type="file" accept="application/pdf" hidden onChange={ler}/></label>
      </> : <p className="muted">{prog}</p>}
    </div>
  );
}

function Imoveis({conta, aoMudar}){
  const [lista,setLista]=useState(null); const [tela,setTela]=useState(null); const [msg,setMsg]=useState(null);
  async function carregar(){ const { data, error } = await sb.from("imoveis").select("*").order("criado_em",{ascending:false}); if(error) setMsg({t:"bad",x:error.message}); setLista(data||[]); aoMudar && aoMudar(data||[]); }
  useEffect(()=>{ carregar(); },[]);
  const voltar=(x)=>{ setTela(null); carregar(); if(x) setMsg({t:"ok",x}); };
  if(tela?.tipo==="importar") return <ImportarBook conta={conta} fechar={()=>setTela(null)} pronto={voltar}/>;
  if(tela?.tipo==="empreendimento") return <FormEmpreendimento conta={conta} existentes={tela.linhas} fechar={()=>setTela(null)} salvo={voltar}/>;
  if(tela?.tipo==="avulso") return <FormImovel conta={conta} imovel={tela.imovel} fechar={()=>setTela(null)} salvo={()=>voltar("Imóvel salvo.")}/>;

  // agrupa as plantas de cada empreendimento
  const grupos=[]; const vistos={};
  for(const i of lista||[]){
    if(i.empreendimento){ if(!vistos[i.empreendimento]){ vistos[i.empreendimento]={ tipo:"emp", nome:i.empreendimento, linhas:[] }; grupos.push(vistos[i.empreendimento]); } vistos[i.empreendimento].linhas.push(i); }
    else grupos.push({ tipo:"avulso", imovel:i });
  }
  async function apagar(g){
    const nome = g.tipo==="emp" ? g.nome : g.imovel.titulo;
    if(!confirm(`Apagar "${nome}"? As visitas ligadas a ${g.tipo==="emp"?"essas plantas":"ele"} também somem.`)) return;
    const ids = g.tipo==="emp" ? g.linhas.map(l=>l.id) : [g.imovel.id];
    for(const id of ids){ const { error } = await sb.from("imoveis").delete().eq("id",id); if(error) return setMsg({t:"bad",x:error.message}); }
    carregar();
  }
  const faixa=(vs,fmt)=>{ const v=vs.filter(x=>x!=null); if(!v.length) return null; const a=Math.min(...v), b=Math.max(...v); return a===b?fmt(a):`${fmt(a)} a ${fmt(b)}`; };
  const disponiveis=(lista||[]).filter(i=>i.ativo).length;
  return (
    <div className="card">
      <div className="between"><h3>Imóveis {lista && <span className="muted small">({disponiveis} opções disponíveis)</span>}</h3></div>
      <div className="row" style={{margin:"8px 0 4px"}}>
        <button className="btn btn-primary btn-sm" onClick={()=>setTela({tipo:"importar"})}>Importar book (PDF)</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setTela({tipo:"empreendimento",linhas:null})}>+ Empreendimento</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setTela({tipo:"avulso",imovel:null})}>+ Imóvel avulso</button>
      </div>
      <p className="small muted" style={{marginTop:4}}><b>Empreendimento:</b> lançamento ou condomínio com várias plantas (quartos, vagas e preços diferentes). <b>Imóvel avulso:</b> um apartamento ou casa específico.</p>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      {lista===null ? <p className="muted">Carregando…</p> : !lista.length ? <p className="muted">Nenhum imóvel ainda. A assistente só oferece o que está aqui.</p> :
      <div className="list">{grupos.map(g=>{
        if(g.tipo==="emp"){ const a=g.linhas[0]; const capa=g.linhas.map(l=>l.fotos?.[0]).find(Boolean);
          const precos=faixa(g.linhas.map(l=>l.preco),brl); const quartos=faixa(g.linhas.map(l=>l.quartos),q=>q); const area=faixa(g.linhas.map(l=>l.area_m2),x=>`${String(x).replace(".",",")} m²`);
          return (
          <div key={"e:"+g.nome} className="imv">
            {capa ? <img src={capa} alt=""/> : <div className="ph">sem foto</div>}
            <div><b>{g.nome}</b><div className="small muted">{[a.bairro, `${g.linhas.length} ${g.linhas.length===1?"planta":"plantas"}`, quartos&&`${quartos} quartos`, area, precos?`a partir de ${brl(Math.min(...g.linhas.map(l=>l.preco).filter(x=>x!=null)))}`:"preço sob consulta"].filter(Boolean).join(" · ")}</div>
              <div style={{marginTop:4}}><span className="pill">empreendimento</span>{a.situacao && <span className="pill">{a.situacao}</span>}{a.book_url && <span className="pill ok">book</span>}{g.linhas.some(l=>!l.ativo) && <span className="pill warn">{g.linhas.filter(l=>!l.ativo).length} pausada(s)</span>}{!a.endereco && <span className="pill warn">sem endereço</span>}</div></div>
            <div className="row"><button className="btn btn-ghost btn-sm" onClick={()=>setTela({tipo:"empreendimento",linhas:g.linhas})}>Editar</button><button className="btn btn-bad btn-sm" onClick={()=>apagar(g)}>Apagar</button></div>
          </div>); }
        const i=g.imovel;
        return (
        <div key={i.id} className="imv">
          {i.fotos?.[0] ? <img src={i.fotos[0]} alt=""/> : <div className="ph">sem foto</div>}
          <div><b>{i.titulo}</b><div className="small muted">{[i.bairro,i.quartos!=null&&`${i.quartos} quartos`,i.area_m2&&`${String(i.area_m2).replace(".",",")} m²`,brl(i.preco)+(i.finalidade==="aluguel"?"/mês":"")].filter(Boolean).join(" · ")}</div>
            <div style={{marginTop:4}}><span className="pill">{i.finalidade}</span>{i.ativo?<span className="pill ok">disponível</span>:<span className="pill warn">pausado</span>}{!i.fotos?.length && <span className="pill warn">sem fotos</span>}{!i.endereco && <span className="pill warn">sem endereço</span>}</div></div>
          <div className="row"><button className="btn btn-ghost btn-sm" onClick={()=>setTela({tipo:"avulso",imovel:i})}>Editar</button><button className="btn btn-bad btn-sm" onClick={()=>apagar(g)}>Apagar</button></div>
        </div>); })}</div>}
    </div>
  );
}

const STATUS_CAP = ["nova","em contato","avaliação marcada","captado","descartada"];
function Captacoes({conta, aoContar}){
  const [lista,setLista]=useState(null); const [filtro,setFiltro]=useState("abertas"); const [cadastrando,setCadastrando]=useState(null); const [msg,setMsg]=useState(null);
  async function carregar(){ const { data, error } = await sb.from("captacoes").select("*").order("criado_em",{ascending:false});
    if(error) setMsg({t:"bad",x:error.message}); setLista(data||[]); aoContar && aoContar((data||[]).filter(c=>c.status==="nova").length); }
  useEffect(()=>{ carregar(); const t=setInterval(carregar,20000); return ()=>clearInterval(t); },[]);
  async function mudar(c,status){ const { error } = await sb.from("captacoes").update({status}).eq("id",c.id); if(error) setMsg({t:"bad",x:error.message}); carregar(); }
  if(cadastrando){ const c=cadastrando;
    const tipoTxt=(c.tipo||"imóvel"); const inicial={ titulo:[tipoTxt[0].toUpperCase()+tipoTxt.slice(1), c.quartos?`${c.quartos}/4`:null].filter(Boolean).join(" ")+(c.bairro?` – ${c.bairro}`:""),
      finalidade: c.finalidade==="aluguel"?"aluguel":"venda", tipo: TIPOS.includes(c.tipo)?c.tipo:"apartamento", bairro:c.bairro, cidade:c.cidade||conta.cidade, endereco:c.endereco,
      preco:c.valor_pretendido, condominio:c.condominio, iptu:c.iptu, quartos:c.quartos, suites:c.suites, banheiros:c.banheiros, vagas:c.vagas, area_m2:c.area_m2,
      caracteristicas:c.caracteristicas||[], descricao:c.observacoes, fotos:c.fotos||[], ativo:false };
    return <>
      <div className="msg warn" style={{cursor:"default"}}>Confira os dados de {c.nome||"proprietário"} e complete o que faltar. O imóvel começa <b>pausado</b>: marque "Disponível" quando o contrato com o proprietário estiver fechado.</div>
      <FormImovel conta={conta} inicial={inicial} fechar={()=>setCadastrando(null)} salvo={async (im)=>{ await sb.from("captacoes").update({status:"captado", imovel_id:im.id}).eq("id",c.id); setCadastrando(null); setMsg({t:"ok",x:"Imóvel cadastrado a partir da captação."}); carregar(); }}/>
    </>; }
  const abertas=(lista||[]).filter(c=>!["captado","descartada"].includes(c.status));

      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      <div className="tabs" style={{marginBottom:10}}>
        {[["abertas",`Em aberto (${abertas.length})`],...STATUS_CAP.map(x=>[x,`${x[0].toUpperCase()+x.slice(1)} (${(lista||[]).filter(c=>c.status===x).length})`])].map(([k,n])=>
          <button key={k} className={filtro===k?"on":""} onClick={()=>setFiltro(k)}>{n}</button>)}
      </div>
      {lista===null ? <p className="muted">Carregando…</p> : !mostradas.length ? <p className="muted">{filtro==="abertas" ? `Nenhuma captação em aberto. Quando um proprietário escrever querendo vender ou alugar, a ${conta.nome_assistente} anota tudo aqui.` : "Nada nesta situação."}</p> :
      <div className="list">{mostradas.map(c=>(
        <div key={c.id}>
          <div className="between">
            <div><b>{c.nome||"Proprietário"}</b> · {fmtTel(c.telefone)} {c.status==="nova" && <span className="badge">novo</span>}
              <div className="small muted">{[[c.tipo, c.finalidade&&`para ${c.finalidade}`].filter(Boolean).join(" "), c.bairro].filter(Boolean).join(" · ")||"dados em coleta"} · {fmtDT(c.criado_em)}{!c.completa && " · a Dri ainda está conversando"}</div></div>
            <select value={c.status} onChange={e=>mudar(c,e.target.value)} style={{width:"auto"}} aria-label="Situação da captação">{STATUS_CAP.map(x=><option key={x}>{x}</option>)}</select>
          </div>
          <div className="small" style={{marginTop:6,lineHeight:1.7}}>
            {[v(c.quartos)!=null&&`${c.quartos} quarto${c.quartos===1?"":"s"}`, v(c.suites)!=null&&`${c.suites} suíte${c.suites===1?"":"s"}`, v(c.vagas)!=null&&`${c.vagas} vaga${c.vagas===1?"":"s"}`, v(c.area_m2)&&`${String(c.area_m2).replace(".",",")} m²`,

            {c.endereco && <div>Endereço: {c.endereco}</div>}

            {!c.imovel_id ? <button className="btn btn-primary btn-sm" onClick={()=>setCadastrando(c)}>Cadastrar como imóvel</button> : <span className="pill ok">imóvel cadastrado</span>}
          </div>
        </div>))}</div>}
    </div>
  );
}

function Horarios({conta, salvo, botao="Salvar horários"}){
  const [janelas,setJanelas]=useState(null); const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState(false);
  useEffect(()=>{ (async()=>{
    const { data } = await sb.from("disponibilidades").select("*").is("imovel_id",null);
    setJanelas((data && data.length) ? data.map(d=>({dia_semana:d.dia_semana,hora_inicio:d.hora_inicio.slice(0,5),hora_fim:d.hora_fim.slice(0,5)}))
      : [1,2,3,4,5].map(d=>({dia_semana:d,hora_inicio:"09:00",hora_fim:"18:00"})).concat([{dia_semana:6,hora_inicio:"09:00",hora_fim:"13:00"}]));
  })(); },[]);
  const doDia=(d)=> (janelas||[]).map((j,i)=>({...j,i})).filter(j=>j.dia_semana===d);
  const mudar=(i,k,v)=> setJanelas(js=>js.map((j,n)=>n===i?{...j,[k]:v}:j));
  async function salvar(){
    const ruins = janelas.filter(j=>!(j.hora_fim>j.hora_inicio));
    if(ruins.length) return setMsg({t:"bad",x:"Em algum dia o horário de fim está antes do início."});
    setOcupado(true); setMsg(null);
    const del = await sb.from("disponibilidades").delete().eq("conta_id",conta.id).is("imovel_id",null);
    const ins = janelas.length ? await sb.from("disponibilidades").insert(janelas.map(j=>({conta_id:conta.id, imovel_id:null, dia_semana:j.dia_semana, hora_inicio:j.hora_inicio, hora_fim:j.hora_fim}))) : {};
    setOcupado(false);
    const erro = del.error || ins.error; if(erro) return setMsg({t:"bad",x:erro.message});
    setMsg({t:"ok",x:"Horários salvos."}); salvo && salvo();
  }
  if(!janelas) return <div className="card muted">Carregando…</div>;
  return (
    <div className="card">
      <h3>Horários para visita</h3>
      <p className="small muted" style={{marginTop:0}}>A assistente só oferece horários dentro destas janelas, já tirando as visitas marcadas e os bloqueios. Cada visita dura {conta.duracao_visita_min} min.</p>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      {DIAS.map((nome,d)=>(
        <div className="dia" key={d}><b>{nome}</b>
          <div>{doDia(d).length===0 && <span className="small muted">Sem visitas · </span>}
            {doDia(d).map(j=>(<div className="janela" key={j.i}>
              <input type="time" value={j.hora_inicio} onChange={e=>mudar(j.i,"hora_inicio",e.target.value)}/> até
              <input type="time" value={j.hora_fim} onChange={e=>mudar(j.i,"hora_fim",e.target.value)}/>
              <button className="btn btn-ghost btn-sm" onClick={()=>setJanelas(js=>js.filter((_,n)=>n!==j.i))} aria-label="Remover">✕</button></div>))}
            <button className="btn btn-ghost btn-sm" onClick={()=>setJanelas(js=>[...js,{dia_semana:d,hora_inicio:"09:00",hora_fim:"12:00"}])}>+ janela</button>
          </div></div>))}
      <div className="row" style={{marginTop:14}}><button className="btn btn-primary" onClick={salvar} disabled={ocupado}>{ocupado?"Salvando…":botao}</button></div>
    </div>
  );
}

function Bloqueios({conta}){
  const [lista,setLista]=useState([]); const [f,setF]=useState({inicio:"",fim:"",motivo:""}); const [msg,setMsg]=useState(null);
  async function carregar(){ const { data } = await sb.from("bloqueios").select("*").gte("fim",new Date().toISOString()).order("inicio"); setLista(data||[]); }
  useEffect(()=>{ carregar(); },[]);
  async function add(e){ e.preventDefault();
    const ini = new Date(f.inicio+":00-03:00"), fim = new Date(f.fim+":00-03:00");
    if(!(fim>ini)) return setMsg({t:"bad",x:"O fim precisa ser depois do início."});
    const { error } = await sb.from("bloqueios").insert({conta_id:conta.id, inicio:ini.toISOString(), fim:fim.toISOString(), motivo:f.motivo||null});
    if(error) return setMsg({t:"bad",x:error.message}); setF({inicio:"",fim:"",motivo:""}); carregar(); }
  async function del(id){ await sb.from("bloqueios").delete().eq("id",id); carregar(); }
  return (
    <form className="card" onSubmit={add}>
      <h3>Bloquear horários</h3><p className="small muted" style={{marginTop:0}}>Folga, viagem, outro compromisso: a assistente não marca nada nesses períodos.</p>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      <div className="grid"><div><label>De</label><input type="datetime-local" required value={f.inicio} onChange={e=>setF({...f,inicio:e.target.value})}/></div>
        <div><label>Até</label><input type="datetime-local" required value={f.fim} onChange={e=>setF({...f,fim:e.target.value})}/></div>
        <div><label>Motivo</label><input value={f.motivo} onChange={e=>setF({...f,motivo:e.target.value})}/></div></div>
      <div style={{marginTop:10}}><button className="btn btn-ghost btn-sm">Bloquear</button></div>
      {lista.length>0 && <div className="list" style={{marginTop:10}}>{lista.map(b=><div key={b.id} className="between small"><span>{fmtDT(b.inicio)} → {fmtDT(b.fim)} {b.motivo && <span className="muted">· {b.motivo}</span>}</span><button type="button" className="btn btn-bad btn-sm" onClick={()=>del(b.id)}>Remover</button></div>)}</div>}
    </form>
  );
}

// ======================================================================== simulador
function Simulador({conta}){
  const [msgs,setMsgs]=useState([]); const [txt,setTxt]=useState(""); const [esperando,setEsperando]=useState(false); const fim=useRef(null);
  useEffect(()=>{ fim.current?.scrollIntoView({behavior:"smooth"}); },[msgs,esperando]);
  async function enviar(e){ e.preventDefault(); const t=txt.trim(); if(!t||esperando) return; setTxt(""); setMsgs(m=>[...m,{de:"user",texto:t}]); setEsperando(true);
    try{ const r = await worker("/simular",{texto:t});
      // uma mensagem por vez, com "digitando…" entre elas, como no celular
      for(const [i,x] of r.respostas.entries()){
        if(i>0) await new Promise(ok=>setTimeout(ok, x.tipo==="texto" ? Math.min(1800, 500+(x.texto||"").length*12) : 350));
        setMsgs(m=>[...m, x.tipo==="foto"?{de:"dri",foto:x.url,texto:x.legenda}:x.tipo==="arquivo"?{de:"dri",arquivo:x.nome||"book.pdf",url:x.url}:{de:"dri",texto:x.texto}]);
      } }
    catch(err){ setMsgs(m=>[...m,{de:"dri",texto:"(erro: "+err.message+")"}]); }
    setEsperando(false); }
  async function reiniciar(){ await worker("/simular/reiniciar"); setMsgs([]); }
  return (
    <div className="card">
      <div className="between"><h3>Testar a {conta.nome_assistente}</h3><button className="btn btn-ghost btn-sm" onClick={reiniciar}>Recomeçar conversa</button></div>
      <p className="small muted" style={{marginTop:0}}>Converse como se fosse um cliente. Ela usa seus imóveis e sua agenda de verdade. Visitas marcadas aqui aparecem como <b>teste</b> e não bloqueiam a agenda.</p>
      <div className="phone">
        <div className="hd">{conta.nome_assistente} · {conta.nome}</div>
        <div className="bd">{msgs.length===0 && <div className="small muted">Tente: "Oi, procuro apartamento de 3 quartos para comprar, até 700 mil"</div>}
          {msgs.map((m,i)=><div key={i} className={"b "+m.de}>{m.foto && <img src={m.foto} alt=""/>}{m.arquivo && <div>📄 <b>{m.arquivo}</b><div className="small muted">PDF enviado ao cliente</div></div>}<Zap texto={m.texto}/></div>)}
          {esperando && <div className="b dri muted">digitando…</div>}<div ref={fim}/></div>
        <form className="ft" onSubmit={enviar}><input value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Escreva como cliente…"/><button className="btn btn-wa" disabled={esperando}>Enviar</button></form>
      </div>
    </div>
  );
}

function Capacidade({cap, conta, curto}){
  if(!cap) return null;
  const pct = Math.min(100, Math.round(100*cap.usadas/Math.max(cap.cota,1)));
  const cor = pct>=100 ? "var(--bad)" : pct>=80 ? "var(--warn)" : "var(--brand)";
  const [a,m] = cap.mes.split("-");
  return (
    <div style={{margin:"10px 0"}}>
      <div className="between small"><b>Capacidade incluída em {m}/{a}</b><span>{cap.usadas} de {cap.cota} mensagens</span></div>
      <div style={{height:10,borderRadius:99,background:"var(--surface)",border:"1px solid var(--line)",overflow:"hidden",marginTop:6}}>
        <div style={{width:pct+"%",height:"100%",background:cor}}/></div>
      {!curto && <p className="small muted" style={{margin:"6px 0 0"}}>Conta cada mensagem de cliente respondida pela IA incluída. Renova todo dia 1º.
        {pct>=100 ? ` A capacidade do mês acabou: a ${conta.nome_assistente} está usando suas chaves gratuitas (ou a reserva compartilhada, se você não tiver nenhuma).`
         : pct>=80 ? " Está acabando: cadastre suas chaves gratuitas abaixo para ela continuar sem interrupção." : ""}</p>}
    </div>
  );
}

function IA({conta}){
  const [st,setSt]=useState(null); const [chaves,setChaves]=useState({}); const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState("");
  async function atualizar(){ try{ setSt(await worker("/ia/status")); }catch(e){ setMsg({t:"bad",x:e.message}); } }
  useEffect(()=>{ atualizar(); },[]);
  async function salvar(id){ setOcupado(id); setMsg(null);
    try{ await worker("/ia/salvar",{provedor:id, chave:chaves[id]||""}); setChaves({...chaves,[id]:""}); setMsg({t:"ok",x:"Chave conferida e salva."}); atualizar(); }
    catch(e){ setMsg({t:"bad",x:e.message}); } setOcupado(""); }
  async function remover(id){ if(!confirm("Remover esta chave?")) return; await worker("/ia/remover",{provedor:id}); atualizar(); }
  const minha = (id)=> st?.chaves?.find(c=>c.provedor===id);
  const total = st?.chaves?.length||0;
  return (
    <div className="card">
      <h3>A inteligência da {conta.nome_assistente}</h3>

        ? <p className="small muted" style={{marginTop:0}}>A inteligência da {conta.nome_assistente} já vem incluída, com uma capacidade por mês. Para <b>ampliar</b> essa capacidade, cadastre suas chaves gratuitas abaixo (opcional, uns 5 minutos): quando a capacidade incluída acabar, ela continua com as suas. A do <b>Groq</b> também ajuda a {conta.nome_assistente} a entender os áudios dos clientes.</p>
        : <p className="small muted" style={{marginTop:0}}>A {conta.nome_assistente} usa IAs com plano gratuito. Criando as suas chaves (grátis, sem cartão), o limite de uso é só seu: o movimento de outros corretores não atrapalha o seu atendimento. Se uma IA atingir o limite, a próxima responde no lugar.</p>}
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      {st && (st.ia_inclusa
        ? <><div className="msg ok" style={{cursor:"default"}}>✓ IA incluída e funcionando.{total>0 && ` Reserva própria: ${total} de 3.`}</div><Capacidade cap={st.capacidade} conta={conta}/></>
        : total===0
        ? <div className="msg warn" style={{cursor:"default"}}>{st.reserva_da_plataforma ? "Você ainda não tem chave própria: a assistente está usando a reserva compartilhada da plataforma, que tem limite dividido entre todos. Cadastre pelo menos uma abaixo." : "Cadastre pelo menos uma chave para a assistente funcionar."}</div>
        : <div className="msg ok" style={{cursor:"default"}}>{total} de 3 IAs cadastradas.{total<3 && " Com as três, uma cobre a outra."}</div>)}
      {!st?.ia_inclusa && <p className="small" style={{marginBottom:4}}><b>Recomendado:</b> cadastre o <b>Groq</b> e o <b>Gemini</b> (uns 5 minutos no total). Com duas, quando uma atinge o limite do dia, a outra continua.</p>}
      <div className="list">{IAS.map((p,i)=>{ const m=minha(p.id); const v=(chaves[p.id]||"").trim();
        const prefixoErrado = v.length>8 && !v.startsWith(p.prefixo);
        return (
        <div key={p.id}>
          <details open={!st?.ia_inclusa && !m && (p.recomendada || i===0)}>
            <summary className="between" style={{cursor:"pointer"}}><b>{p.nome}</b>{m ? <span className="pill ok">✓ cadastrada {m.final}</span> : <span className="pill">{p.tempo}</span>}</summary>
            <p className="small muted" style={{margin:"6px 0"}}>{p.nota}</p>
            <ol className="passo small">{p.passos.map((x,k)=><li key={k}>{x}</li>)}</ol>
            <a className="btn btn-ghost btn-sm" href={p.link} target="_blank" rel="noreferrer">Abrir o {p.nome.split(" ")[0]} ↗</a>
          </details>
          {m?.ultimo_erro && <div className="msg bad small" style={{cursor:"default",marginTop:6}}>Falhou em {fmtDT(m.ultimo_erro_em)}: {m.ultimo_erro}. Se continuar, gere uma chave nova e cole aqui.</div>}
          <div className="row" style={{marginTop:8,flexWrap:"nowrap"}}>
            <input type="password" autoComplete="off" placeholder={m?"Colar chave nova para trocar":`Cole a chave (começa com ${p.prefixo})`} value={chaves[p.id]||""} onChange={e=>setChaves({...chaves,[p.id]:e.target.value})}/>
            <button className="btn btn-primary btn-sm" disabled={!v||ocupado===p.id} onClick={()=>salvar(p.id)}>{ocupado===p.id?"Conferindo…":"Salvar"}</button>
            {m && <button className="btn btn-bad btn-sm" onClick={()=>remover(p.id)}>Remover</button>}
          </div>
          {prefixoErrado && <div className="small" style={{color:"var(--warn)",marginTop:4}}>Essa não parece uma chave do {p.nome.split(" ")[0]} (deveria começar com {p.prefixo}). Confira se copiou a chave certa.</div>}
        </div>); })}</div>
    </div>
  );
}

function Copiar({valor}){
  const [ok,setOk]=useState(false);
  return <div className="row" style={{flexWrap:"nowrap"}}><code style={{flex:1}}>{valor||"…"}</code>
    <button type="button" className="btn btn-ghost btn-sm" onClick={(e)=>{
      // se o aparelho recusar copiar, seleciona o texto para a pessoa copiar na mão
      const codigo=e.currentTarget.parentNode.querySelector("code");
      const selecionar=()=>{ const r=document.createRange(); r.selectNodeContents(codigo); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); };
      try{ navigator.clipboard.writeText(valor).then(()=>{ setOk(true); setTimeout(()=>setOk(false),1500); }, selecionar); }catch{ selecionar(); } }}>{ok?"Copiado":"Copiar"}</button></div>;
}

function WhatsApp({conta, conectado}){
  const [st,setSt]=useState(null); const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState(false);
  const [f,setF]=useState({phone_number_id:"",waba_id:"",access_token:"",app_secret:"",pin:""});
  const privacidade = new URL("privacidade.html", location.href).href;
  async function atualizar(rota="/whatsapp/status"){ try{ setSt(await worker(rota)); }catch(e){ setMsg({t:"bad",x:e.message}); } }
  useEffect(()=>{ atualizar("/whatsapp/preparar"); const t=setInterval(()=>atualizar(),10000); return ()=>clearInterval(t); },[]);
  async function conectar(e){ e.preventDefault(); setOcupado(true); setMsg(null);
    try{ const r = await worker("/whatsapp/conectar", f); setMsg({t:"ok",x:`Dados conferidos com a Meta: ${r.numero} (${r.nome||conta.nome}). Agora faça a etapa E.`}); setF({...f,access_token:"",app_secret:""}); atualizar(); conectado && conectado(); }
    catch(err){ setMsg({t:"bad",x:err.message}); } setOcupado(false); }
  const set=(k)=>(e)=>setF({...f,[k]:e.target.value});
  const tudoPronto = st?.conectado && st?.webhook_verificado_em && st?.ultima_mensagem_em;
  const [pedido,setPedido]=useState(undefined); const [modo,setModo]=useState(null);   // null = escolher, "ajuda", "sozinho"
  useEffect(()=>{ worker("/whatsapp/pedido").then(r=>setPedido(r.pedido)).catch(()=>setPedido(null)); },[]);
  const STATUS_PEDIDO={ novo:"Recebemos seu pedido. Vamos te chamar no horário que você indicou para fazer a conexão.", "em andamento":"Estamos conectando seu WhatsApp. Fique de olho: vamos te pedir o código que chega por SMS.", concluido:"Conexão concluída.", cancelado:"Pedido cancelado." };

  if(!st?.conectado && pedido===undefined) return <div className="card muted">Carregando…</div>;
  if(!st?.conectado && modo==="ajuda") return <PedidoConexao conta={conta} pedido={pedido} salvo={(p)=>{ setPedido(p); setModo(null); setMsg({t:"ok",x:"Pedido enviado! A gente te chama no horário que você indicou."}); }} voltar={()=>setModo(null)}/>;
  if(!st?.conectado && modo!=="sozinho") return (<>
    <Aviso msg={msg} limpar={()=>setMsg(null)}/>
    {pedido && pedido.status!=="cancelado" && <div className="card"><h3>Seu pedido de conexão</h3>
      <div className={"msg "+(pedido.status==="concluido"?"ok":"warn")} style={{cursor:"default"}}>{STATUS_PEDIDO[pedido.status]}</div>
      <p className="small muted" style={{margin:0}}>Número {fmtTel(pedido.numero)} · melhor horário: {pedido.melhor_horario||"—"}{pedido.portfolio_convidado?"":" · lembre de convidar o suporte no portfólio da Meta"}</p>
      <div className="row" style={{marginTop:10}}><button className="btn btn-ghost btn-sm" onClick={()=>setModo("ajuda")}>Editar pedido</button></div></div>}
    {!pedido && <div className="card"><h3>Conectar o WhatsApp</h3>
      <p className="small muted" style={{marginTop:0}}>A {conta.nome_assistente} atende pelo seu número usando a API oficial do WhatsApp (Meta). Escolha como prefere fazer:</p>
      <div className="grid" style={{gap:12}}>
        <div className="card" style={{margin:0}}><h3 style={{fontSize:15}}>Façam para mim <span className="pill ok">recomendado</span></h3>
          <p className="small muted">Você faz 2 passos de 5 minutos na Meta, manda os dados e a gente conecta junto com você.</p>
          <button className="btn btn-primary btn-sm" onClick={()=>setModo("ajuda")}>Quero ajuda</button></div>
        <div className="card" style={{margin:0}}><h3 style={{fontSize:15}}>Vou fazer sozinho</h3>
          <p className="small muted">Passo a passo completo no site da Meta. Leva uns 30 minutos, no computador.</p>
          <button className="btn btn-ghost btn-sm" onClick={()=>setModo("sozinho")}>Ver o passo a passo</button></div>
      </div></div>}
    {pedido && <button className="btn btn-ghost btn-sm" onClick={()=>setModo("sozinho")}>Prefiro fazer sozinho: ver o passo a passo</button>}
  </>);

  return (<>
    <div className="card">
      <h3>Conectar o WhatsApp</h3>
      <p className="small muted" style={{marginTop:0}}>Você mesmo liga seu número à {conta.nome_assistente}, pela API oficial do WhatsApp (Meta), sem risco de bloqueio. Leva uns 30 minutos, no computador. Os nomes dos botões no site da Meta podem variar um pouco.</p>
      <Aviso msg={msg} limpar={()=>setMsg(null)}/>
      <b>Situação</b>
      <ul className="small" style={{lineHeight:1.9,marginTop:4}}>
        <Item ok={st?.conectado}>Dados da Meta conectados {st?.numero && <>— <b>{st.numero}</b> {st.nome && `(${st.nome})`}</>}</Item>
        <Item ok={!!st?.webhook_verificado_em}>Webhook confirmado pela Meta (etapa E)</Item>
        <Item ok={!!st?.ultima_mensagem_em}>Primeira mensagem de cliente recebida (etapa F) {st?.ultima_mensagem_em && <span className="muted">· última em {fmtDT(st.ultima_mensagem_em)}</span>}</Item>
      </ul>
      {st?.erro && <div className="msg bad" style={{cursor:"default"}}>{st.erro}</div>}
      {tudoPronto && <div className="msg ok" style={{cursor:"default"}}>Tudo certo! A {conta.nome_assistente} está atendendo esse número.</div>}
    </div>

    <div className="card"><h3>Antes de começar</h3>
      <ul className="small" style={{lineHeight:1.7}}>
        <li>Um número que <b>não esteja em nenhum WhatsApp</b> (nem no comum, nem no Business). Pode ser um chip novo. Se for um número que já usa, apague a conta do WhatsApp dele antes (no app: Configurações → Conta → Apagar conta).</li>
        <li>O celular com esse chip por perto, para receber o código por SMS ou ligação.</li>
        <li>Seu Facebook pessoal (é só para entrar; nada é publicado).</li>
      </ul></div>

    <div className="card"><h3>A. Criar o app na Meta</h3>
      <ol className="passo small">
        <li>Entre em <a href="https://developers.facebook.com" target="_blank" rel="noreferrer">developers.facebook.com</a> com seu Facebook e clique em <b>Começar</b> para virar desenvolvedor (confirma email e telefone).</li>
        <li>Clique em <b>Meus apps → Criar app</b>.</li>
        <li>No caso de uso, escolha <b>Conectar-se com clientes pelo WhatsApp</b>. Se não aparecer, escolha <b>Outro</b> e depois o tipo <b>Empresa</b>.</li>
        <li>Nome do app: <i>Dri {conta.nome}</i>. Quando pedir o <b>portfólio empresarial</b>, crie um com o nome do seu negócio (se ainda não tiver). Conclua.</li>
        <li>Se o app ainda não tiver o WhatsApp, procure <b>WhatsApp</b> na lista de produtos e clique em <b>Configurar</b>.</li>
      </ol></div>

    <div className="card"><h3>B. Colocar o seu número</h3>
      <ol className="passo small" start={6}>
        <li>No menu do app, abra <b>WhatsApp → Configuração da API</b>.</li>
        <li>Clique em <b>Adicionar número de telefone</b>. Preencha o nome que os clientes vão ver (ex.: <i>{conta.nome}</i>), a categoria <b>Imóveis</b> e o número. Confirme com o código que chegar.</li>
        <li>De volta à Configuração da API, escolha o número novo no campo <b>De</b> e copie o <b>ID do número de telefone</b> e o <b>ID da conta do WhatsApp Business</b> para o formulário abaixo. São números compridos, diferentes do telefone.</li>
      </ol></div>

    <div className="card"><h3>C. Criar a chave permanente (token)</h3>
      <p className="small muted" style={{marginTop:0}}>O token que aparece na Configuração da API vence em 24 horas. Este não vence.</p>
      <ol className="passo small" start={9}>
        <li>Abra <a href="https://business.facebook.com/settings/system-users" target="_blank" rel="noreferrer">Configurações do negócio → Usuários do sistema</a> e clique em <b>Adicionar</b>. Nome: <i>Dri</i>. Função: <b>Administrador</b>.</li>
        <li>Clique no usuário criado → <b>Atribuir ativos</b>. Em <b>Apps</b>, marque o seu app com <b>controle total</b>. Em <b>Contas do WhatsApp</b>, marque a sua conta com <b>controle total</b>. Salve.</li>
        <li>Clique em <b>Gerar token</b>: escolha o app, validade <b>Nunca</b>, e marque as permissões <code>whatsapp_business_messaging</code> e <code>whatsapp_business_management</code>. Copie o token (ele só aparece uma vez).</li>
      </ol></div>

    <div className="card"><h3>D. Chave secreta e política de privacidade</h3>
      <ol className="passo small" start={12}>
        <li>No app: <b>Configurações do app → Básico</b>. Em <b>Chave secreta do aplicativo</b>, clique em <b>Mostrar</b> e copie.</li>
        <li>Na mesma tela, em <b>URL da Política de Privacidade</b>, cole o link abaixo e clique em <b>Salvar alterações</b>.<Copiar valor={privacidade}/></li>
        <li>Preencha e envie o formulário:</li>
      </ol>
      <form onSubmit={conectar}>
        <div className="grid">
          <div><label>ID do número de telefone</label><input required inputMode="numeric" value={f.phone_number_id} onChange={set("phone_number_id")}/></div>
          <div><label>ID da conta do WhatsApp Business</label><input required inputMode="numeric" value={f.waba_id} onChange={set("waba_id")}/></div>
          <div><label>Chave secreta do aplicativo</label><input required value={f.app_secret} onChange={set("app_secret")} autoComplete="off"/></div>
          <div><label>Crie um PIN de 6 números <span className="muted">(guarde)</span></label><input inputMode="numeric" maxLength={6} value={f.pin} onChange={set("pin")} placeholder="ex.: 482915"/></div>
        </div>
        <label>Token permanente</label><input required type="password" value={f.access_token} onChange={set("access_token")} autoComplete="off"/>
        <p className="small muted">O PIN ativa o número na API (verificação em duas etapas). Se o número já tinha um PIN de duas etapas, use o mesmo. Se o número já estiver ativo, pode deixar em branco.</p>
        <button className="btn btn-primary" disabled={ocupado}>{ocupado?"Conferindo com a Meta…":"Conectar"}</button>
      </form></div>

    <div className="card"><h3>E. Ligar as mensagens à {conta.nome_assistente} (webhook)</h3>
      <ol className="passo small" start={15}>
        <li>No app: <b>WhatsApp → Configuração</b>. Em <b>Webhook</b>, clique em <b>Editar</b>.</li>
        <li>Em <b>URL de callback</b>, cole:<Copiar valor={st?.webhook_url}/></li>
        <li>Em <b>Token de verificação</b>, cole:<Copiar valor={st?.verify_token}/></li>
        <li>Clique em <b>Verificar e salvar</b>. O segundo item da Situação, lá em cima, fica ✅.</li>
        <li>Logo abaixo, em <b>Campos do webhook</b>, clique em <b>Gerenciar</b> e ative <b>messages</b>.</li>
      </ol></div>

    <div className="card"><h3>F. Publicar e testar</h3>
      <ol className="passo small" start={20}>
        <li>No topo da página do app, mude o modo de <b>Desenvolvimento</b> para <b>Ao vivo</b> (ou clique em <b>Publicar</b>). Sem isso a Meta não entrega as mensagens dos clientes.</li>
        <li>De outro celular, mande um "oi" para o seu número. Em alguns segundos a {conta.nome_assistente} responde e o terceiro item fica ✅.</li>
        <li>Opcional: no <a href="https://business.facebook.com/wa/manage/" target="_blank" rel="noreferrer">Gerenciador do WhatsApp</a>, em Pagamentos, cadastre um cartão. Responder clientes é grátis; a Meta só cobra centavos quando a empresa escreve primeiro.</li>
      </ol>
      <p className="small muted" style={{marginBottom:0}}>Travou em algum passo? A Situação lá em cima mostra o que falta. Se aparecer erro da Meta ao conectar, a mensagem diz qual dado conferir.</p></div>

    <div className="card"><div className="between"><div><h3 style={{marginBottom:4}}>Precisa de ajuda?</h3>
      <p className="small muted" style={{margin:0}}>A gente faz a conexão junto com você, por chamada de vídeo. Conte em qual passo travou.</p></div>
      <a className="btn btn-ghost btn-sm" href={`mailto:${SUPORTE_EMAIL}?subject=${encodeURIComponent("Ajuda para conectar o WhatsApp")}&body=${encodeURIComponent(`Olá! Sou ${conta.nome} e travei no passo: `)}`}>Pedir ajuda</a></div></div>
  </>);
}

// ======================================================================== conversas
function Conversas({conta, aoContar}){
  const [lista,setLista]=useState([]); const [aberta,setAberta]=useState(null); const [txt,setTxt]=useState(""); const [msg,setMsg]=useState(null); const [enviando,setEnviando]=useState(false);
  async function carregar(){ const { data } = await sb.from("conversas").select("id,telefone,nome,transcricao,precisa_corretor,motivo,atualizado_em,ultima_cliente_em").neq("telefone","simulador").order("atualizado_em",{ascending:false}).limit(100);
    setLista(data||[]); aoContar && aoContar((data||[]).filter(c=>c.precisa_corretor).length);
    if(aberta) setAberta((data||[]).find(c=>c.id===aberta.id)||null); }
  useEffect(()=>{ carregar(); const t=setInterval(carregar,15000); return ()=>clearInterval(t); },[aberta?.id]);
  async function resolver(c){ const { error } = await sb.from("conversas").update({precisa_corretor:false,motivo:null}).eq("id",c.id); if(error) setMsg({t:"bad",x:error.message}); else { setMsg({t:"ok",x:`Pronto: a ${conta.nome_assistente} volta a responder esse cliente.`}); carregar(); } }
  async function assumir(c){ await sb.from("conversas").update({precisa_corretor:true,motivo:"Corretor assumiu a conversa"}).eq("id",c.id); carregar(); }
  async function responder(e){ e.preventDefault(); if(!txt.trim()) return; setEnviando(true);
    try{ await worker("/responder",{telefone:aberta.telefone,texto:txt}); setTxt(""); carregar(); }catch(err){ setMsg({t:"bad",x:err.message}); } setEnviando(false); }
  const ordenadas = [...lista].sort((a,b)=>(b.precisa_corretor-a.precisa_corretor));
  return (
    <div className="card">
      <h3>Conversas</h3><Aviso msg={msg} limpar={()=>setMsg(null)}/>
      {!lista.length ? <p className="muted">Nenhuma conversa ainda. Quando clientes escreverem no WhatsApp, elas aparecem aqui.</p> :
      <div className="conv">
        <div className="lst">{ordenadas.map(c=>(<button key={c.id} className={aberta?.id===c.id?"on":""} onClick={()=>setAberta(c)}>
          <b>{c.nome||fmtTel(c.telefone)}</b>{c.precisa_corretor && <span className="badge">!</span>}
          <div className="small muted">{c.precisa_corretor ? (c.motivo||"precisa de você") : (c.transcricao?.at(-1)?.texto||"").slice(0,60)}</div></button>))}</div>
        <div>{!aberta ? <p className="muted">Escolha uma conversa.</p> : <>
          <div className="between" style={{marginBottom:8}}><div><b>{aberta.nome||"Cliente"}</b> · {fmtTel(aberta.telefone)}</div>
            <div className="row">{aberta.precisa_corretor ? <button className="btn btn-primary btn-sm" onClick={()=>resolver(aberta)}>Resolvido, {conta.nome_assistente} pode voltar</button>
              : <button className="btn btn-ghost btn-sm" onClick={()=>assumir(aberta)}>Assumir conversa</button>}
              <a className="btn btn-wa btn-sm" href={"https://wa.me/"+aberta.telefone} target="_blank" rel="noreferrer">Abrir no WhatsApp</a></div></div>
          {aberta.precisa_corretor && <div className="msg warn" style={{cursor:"default"}}>{conta.nome_assistente} está em silêncio nesta conversa: {aberta.motivo||"você assumiu"}.</div>}
          <div className="phone" style={{maxWidth:"none"}}><div className="bd">{(aberta.transcricao||[]).map((m,i)=><div key={i} className={"b "+(m.de==="cliente"?"dri":m.de==="dri"?"user":"corretor")}><Zap texto={m.texto}/><div className="small muted" style={{marginTop:2}}>{m.de==="cliente"?"cliente":m.de==="dri"?conta.nome_assistente:"você"} · {fmtDT(m.em)}</div></div>)}</div>
            <form className="ft" onSubmit={responder}><input value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Responder pelo número da assistente…"/><button className="btn btn-wa" disabled={enviando}>Enviar</button></form></div>
        </>}</div>
      </div>}
    </div>
  );
}

function Inicio({conta, irPara}){
  const [n,setN]=useState(null); const [cap,setCap]=useState(null);
  useEffect(()=>{ worker("/ia/status").then(r=>setCap(r.capacidade)).catch(()=>{}); },[]);
  useEffect(()=>{ (async()=>{ const ini=new Date(Date.now()-30*864e5).toISOString(), agora=new Date().toISOString();
    const [c,p,v,m,cap] = await Promise.all([
      sb.from("conversas").select("id",{count:"exact",head:true}).neq("telefone","simulador").gte("atualizado_em",ini),
      sb.from("conversas").select("id",{count:"exact",head:true}).eq("precisa_corretor",true),
      sb.from("visitas").select("id",{count:"exact",head:true}).eq("status","marcada").gte("inicio",agora),
      sb.from("visitas").select("id",{count:"exact",head:true}).eq("origem","dri").neq("status","teste").gte("criado_em",ini),
      sb.from("captacoes").select("id",{count:"exact",head:true}).eq("status","nova")]);
    setN({conversas:c.count||0, pendentes:p.count||0, proximas:v.count||0, marcadasDri:m.count||0, captacoes:cap.count||0}); })(); },[]);
  if(!n) return <div className="card muted">Carregando…</div>;
  const capPct = cap ? cap.usadas/Math.max(cap.cota,1) : 0;
  return <>
    {capPct>=0.8 && <div className="card" style={{borderColor:capPct>=1?"var(--bad)":"var(--warn)"}}>
      <h3>{capPct>=1 ? "A capacidade de IA do mês acabou" : "A capacidade de IA do mês está acabando"}</h3>
      <Capacidade cap={cap} conta={conta} curto/>
      <p className="small" style={{margin:"0 0 10px"}}>Cadastre suas chaves gratuitas para a {conta.nome_assistente} continuar atendendo sem interrupção. Leva uns 5 minutos.</p>
      <button className="btn btn-primary btn-sm" onClick={()=>irPara("ia")}>Ampliar capacidade</button></div>}
    <div className="tiles">
      <div className="tile"><div className="l">Conversas nos últimos 30 dias</div><div className="v">{n.conversas}</div></div>
      <div className="tile"><div className="l">Visitas marcadas pela {conta.nome_assistente} (30 dias)</div><div className="v">{n.marcadasDri}</div></div>
      <div className="tile"><div className="l">Próximas visitas</div><div className="v">{n.proximas}</div></div>
      <div className="tile" style={{cursor:"pointer"}} onClick={()=>irPara("conversas")}><div className="l">Clientes esperando você</div><div className="v" style={{color:n.pendentes?"var(--bad)":undefined}}>{n.pendentes}</div></div>
      <div className="tile" style={{cursor:"pointer"}} onClick={()=>irPara("captacoes")}><div className="l">Imóveis novos para captar</div><div className="v" style={{color:n.captacoes?"var(--brand)":undefined}}>{n.captacoes}</div></div>
    </div>
    <Visitas/>
  </>;
}

// ======================================================================== onboarding
const ETAPAS = ["Perfil","Imóveis","Horários","IA","Testar","WhatsApp"];
function Onboarding({conta, setConta}){
  const etapa = conta ? Math.min(conta.onboarding_etapa,6) : 1;
  const [imoveis,setImoveis]=useState([]);
  async function avancar(para){ const { data } = await sb.from("contas").update({onboarding_etapa:para}).eq("id",conta.id).select().single(); if(data) setConta(data); }
  return (
    <div>
      <div className="steps">{ETAPAS.map((e,i)=><span key={e} className={i+1===etapa?"on":i+1<etapa?"done":""}>{i+1<etapa?"✓ ":`${i+1}. `}{e}</span>)}</div>
      {etapa===1 && <><div className="card"><h3>Bem-vindo! Vamos deixar sua assistente pronta</h3><p className="muted" style={{margin:0}}>São 6 passos, uns 15 minutos. Você pode parar e continuar depois: fica tudo salvo.</p></div>
        <Perfil conta={conta} salvo={async (c)=>{ setConta(c); if(c.onboarding_etapa<2) await avancar(2); }} botao="Salvar e continuar"/></>}
      {etapa===2 && <><div className="card"><h3>Cadastre seus imóveis</h3><p className="muted" style={{margin:0}}>Tem o book (PDF) de um empreendimento? Use <b>Importar book</b>: a IA preenche as plantas e as fotos para você conferir. Também dá para cadastrar à mão um <b>empreendimento</b> (várias plantas e preços) ou um <b>imóvel avulso</b>. Comece com 1 ou 2 para testar. Você pode cadastrar o resto depois. Capriche nas fotos e no endereço: ela só passa o endereço quando a visita é marcada.</p></div>
        <Imoveis conta={conta} aoMudar={setImoveis}/>
        <div className="row"><button className="btn btn-ghost" onClick={()=>avancar(1)}>Voltar</button><button className="btn btn-primary" disabled={!imoveis.length} onClick={()=>avancar(3)}>Continuar</button>{!imoveis.length && <span className="small muted">Cadastre pelo menos 1 imóvel.</span>}</div></>}
      {etapa===3 && <><Horarios conta={conta} salvo={()=>avancar(4)} botao="Salvar e continuar"/><Bloqueios conta={conta}/><button className="btn btn-ghost" onClick={()=>avancar(2)}>Voltar</button></>}
      {etapa===4 && <><IA conta={conta}/><div className="row"><button className="btn btn-ghost" onClick={()=>avancar(3)}>Voltar</button><button className="btn btn-primary" onClick={()=>avancar(5)}>Continuar</button><span className="small muted">Pode pular se a IA já estiver incluída. Dá para mexer depois, pela aba IA.</span></div></>}
      {etapa===5 && <><Simulador conta={conta}/><div className="row"><button className="btn btn-ghost" onClick={()=>avancar(4)}>Voltar</button><button className="btn btn-primary" onClick={()=>avancar(6)}>Gostei, conectar o WhatsApp</button><span className="small muted">Se algo não ficou bom, ajuste as orientações no perfil.</span></div></>}
      {etapa===6 && <><WhatsApp conta={conta} conectado={()=>{}}/><div className="row"><button className="btn btn-ghost" onClick={()=>avancar(5)}>Voltar</button><button className="btn btn-primary" onClick={()=>avancar(7)}>Ir para o painel</button><span className="small muted">Pode terminar depois, pela aba WhatsApp: fica tudo salvo.</span></div></>}
    </div>
  );
}

// ======================================================================== assinatura
const fmtDia = (iso)=> iso ? new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",timeZone:"America/Bahia"}) : "—";
const reais = (v)=> v==null ? "—" : Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function Assinar({st, fechar}){
  const [email,setEmail]=useState(st.email||""); const [msg,setMsg]=useState(null); const [ocupado,setOcupado]=useState(false);
  async function ir(e){ e.preventDefault(); setOcupado(true); setMsg(null);
    try{ const r=await worker("/assinatura/assinar",{email}); location.href=r.link; }

// Faixa no topo do painel: teste grátis, pagamento recusado, pausada
function FaixaAssinatura(){
  const voltouDoPagamento = /preapproval_id=/.test(location.search);
  const [st,setSt]=useState(null); const [abrir,setAbrir]=useState(false);
  useEffect(()=>{ let n=0, vivo=true;
    const ler=()=>worker("/assinatura/status").then(s=>{ if(!vivo) return; setSt(s);
      // voltou do Mercado Pago: confere de novo enquanto o aviso dele não chega
      if(voltouDoPagamento && !s.tem_cartao && n++<6) setTimeout(ler,5000); }).catch(()=>{});
    ler(); return ()=>{ vivo=false; }; },[]);
  if(!st) return null;
  if(abrir) return <Assinar st={st} fechar={()=>setAbrir(false)}/>;
  const botao=(txt)=> st.pagamento_configurado
    ? <button className="btn btn-primary btn-sm" onClick={()=>setAbrir(true)}>{txt}</button>
    : <span className="small">(pagamento em configuração)</span>;
  const faixa=(tipo,conteudo)=> <div className={"msg "+tipo} style={{cursor:"default"}}><div className="between">{conteudo}</div></div>;
  if(voltouDoPagamento && !st.tem_cartao && st.status!=="ativa") return faixa("ok",<span>Recebemos você de volta do Mercado Pago. Estamos confirmando o pagamento: isso leva alguns segundos.</span>);
  if(st.status==="cortesia" || st.status==="ativa") return null;
  if(st.status==="teste") return st.tem_cartao
    ? faixa("ok",<span>✓ Assinatura registrada. Seu teste grátis vai até {fmtDia(st.teste_ate)}; depois a cobrança é de {reais(st.preco_mensal)} por mês no cartão.</span>)
    : faixa("ok",<><span><b>Teste grátis:</b> {st.dias_restantes===1?"falta 1 dia":`faltam ${st.dias_restantes} dias`} (até {fmtDia(st.teste_ate)}). Depois, {reais(st.preco_mensal)} por mês.</span>{botao("Assinar agora")}</>);
  if(st.status==="atrasada") return faixa("bad",<><span><b>O pagamento da assinatura não foi aprovado.</b> A {"Dri"} pausa em {fmtDT(st.pausa_em)} se não for regularizado.</span>{botao("Atualizar pagamento")}</>);
  if(st.status==="pausada" && st.motivo==="teste_acabou") return faixa("bad",<><span><b>Seu teste grátis terminou e a assistente está pausada.</b> As mensagens dos clientes continuam chegando em Conversas. Assine para ela voltar a responder.</span>{botao("Assinar e reativar")}</>);
  if(st.status==="cancelada") return faixa("bad",<><span><b>Assinatura cancelada:</b> a assistente está pausada. As mensagens dos clientes continuam chegando em Conversas.</span>{botao("Assinar de novo")}</>);
  return faixa("bad",<><span><b>A assistente está pausada por falta de pagamento.</b> As mensagens dos clientes continuam chegando em Conversas. Ela volta assim que o Mercado Pago aprovar.</span>{botao("Atualizar pagamento")}</>);
}
