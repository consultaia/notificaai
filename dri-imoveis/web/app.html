    {aba==="contas" && <div className="card">
      <div className="row" style={{marginBottom:8}}>
        <select value={filtro} onChange={e=>setFiltro(e.target.value)} style={{width:"auto"}}><option value="todas">Todas</option>{Object.entries(STATUS_ROTULO).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select>
        <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por nome, email ou cidade" style={{flex:1,minWidth:200}}/>
      </div>
      {!contas.length ? <p className="muted">Nenhum corretor aqui.</p> : <div className="list">{contas.map(c=><AdminConta key={c.id} c={c} acao={acao}/>)}</div>}
    </div>}

    {aba==="conexoes" && <div className="card">
      <h3>Pedidos de conexão do WhatsApp</h3>
      <p className="small muted" style={{marginTop:0}}>Corretores que pediram para você conectar o WhatsApp. O passo a passo completo está em <code>dri-imoveis/CONECTAR-WHATSAPP.md</code>.</p>
      {!d.pedidos.length ? <p className="muted">Nenhum pedido ainda.</p> :
      <div className="list">{d.pedidos.map(p=><AdminPedido key={p.id} p={p} chamar={chamar}/>)}</div>}
    </div>}

    {aba==="comissoes" && <div className="card">
      <h3>Comissões</h3>
      <p className="small muted" style={{marginTop:0}}>Só gera comissão quem criou a conta pelo link do parceiro <b>e assinou</b>: {reais(cfg.comissao_adesao)} no primeiro pagamento aprovado, uma vez por conta (cancelar e assinar de novo não gera outra). Se parecer a mesma pessoa com outra conta, ou o próprio parceiro, fica <b>em análise</b> para você decidir. Faça o PIX e marque como paga.</p>
      {!d.comissoes.length ? <p className="muted">Nenhuma comissão ainda.</p> :
      <div className="list">{d.comissoes.map(c=><div key={c.id} className="between">
        <div><b>{reais(c.valor)}</b> para <b>{c.parceiro}</b>{c.codigo && <span className="small muted"> (?p={c.codigo})</span>} <span className={"pill "+(c.status==="pago"?"ok":c.status==="cancelada"?"":"warn")}>{c.status}</span>
          <div className="small muted">{c.conta}: cadastro pelo link em {fmtDia(c.cadastro_em)} → primeiro pagamento em {fmtDia(c.criado_em)}{c.pagamento_mp_id?` (Mercado Pago nº ${c.pagamento_mp_id})`:""}{c.pago_em?` · comissão paga em ${fmtDia(c.pago_em)}`:""}</div>
          {c.status==="em análise" && <div className="small" style={{color:"var(--warn)",marginTop:4}}>Em análise: {c.motivo}</div>}
          {c.status==="a pagar" && <div className="small" style={{marginTop:4}}>PIX: {c.pix ? <code>{c.pix}</code> : <span style={{color:"var(--warn)"}}>parceiro sem chave PIX</span>}</div>}</div>
        <div className="row">{c.status==="em análise" ? <>
          <button className="btn btn-primary btn-sm" onClick={()=>chamar("/admin/comissao",{id:c.id,acao:"aprovar"})}>Aprovar</button>
          <button className="btn btn-bad btn-sm" onClick={()=>confirm("Cancelar esta comissão?") && chamar("/admin/comissao",{id:c.id,acao:"cancelar"})}>Cancelar</button></>
          : c.status==="a pagar" ? <>
          <button className="btn btn-primary btn-sm" onClick={()=>chamar("/admin/comissao",{id:c.id,acao:"pago"})}>Marcar como paga</button>
          <button className="btn btn-bad btn-sm" onClick={()=>confirm("Cancelar esta comissão?") && chamar("/admin/comissao",{id:c.id,acao:"cancelar"})}>Cancelar</button></>
          : c.status==="cancelada" ? <button className="btn btn-ghost btn-sm" onClick={()=>chamar("/admin/comissao",{id:c.id,acao:"reabrir"})}>Voltar para a pagar</button>
          : <button className="btn btn-ghost btn-sm" onClick={()=>confirm("Desfazer o pagamento desta comissão? Use só se o PIX não foi feito.") && chamar("/admin/comissao",{id:c.id,acao:"reabrir"})}>Desfazer pagamento</button>}</div>
      </div>)}</div>}
    </div>}

    {aba==="parceiros" && <>
      <div className="card">
        <h3>Parceiros</h3>
        <p className="small muted" style={{marginTop:0}}>Corretores viram parceiros pela aba "Indique e ganhe" do painel deles. Aqui você também cadastra parceiros de fora da plataforma.</p>
        {!d.parceiros.length ? <p className="muted">Nenhum parceiro ainda.</p> :
        <div className="list">{d.parceiros.map(p=><div key={p.id}>
          <div className="between"><div><b>{p.nome}</b> {p.corretor && <span className="pill">corretor</span>}{!p.ativo && <span className="pill warn">inativo</span>}
            <div className="small muted">{p.cadastros} cadastros · {p.pagantes} pagando · {p.adesoes} adesões · a pagar {reais(p.a_pagar)} · pago {reais(p.pago)}{p.pix?` · PIX ${p.pix}`:""}</div></div>
            <button className="btn btn-ghost btn-sm" onClick={()=>chamar("/admin/parceiro",{...p, ativo:!p.ativo})}>{p.ativo?"Desativar":"Ativar"}</button></div>
          <div style={{marginTop:6}}><Copiar valor={p.link}/></div>
          {p.indicados.length>0 && <details style={{marginTop:6}}><summary className="small" style={{cursor:"pointer"}}>Indicados ({p.indicados.length})</summary>
            <div className="small" style={{marginTop:6}}>{p.indicados.map((x,i)=><div key={i}>{x.nome} · cadastro {fmtDia(x.cadastro_em)} · {STATUS_ROTULO[x.status]||x.status}{x.assinou_em?` · assinou ${fmtDia(x.assinou_em)}`:""} · comissão: {x.comissao||"ainda não (não assinou)"}</div>)}</div></details>}
        </div>)}</div>}
      </div>
      <form className="card" onSubmit={async e=>{ e.preventDefault(); const r=await chamar("/admin/parceiro",novo); if(r) setNovo({nome:"",codigo:"",pix:"",whatsapp:"",email:""}); }}>
        <h3>Novo parceiro</h3>
        <div className="grid">
          <div><label>Nome *</label><input required value={novo.nome} onChange={e=>setNovo({...novo,nome:e.target.value})}/></div>
          <div><label>Nome do link *</label><input required value={novo.codigo} onChange={e=>setNovo({...novo,codigo:e.target.value})} placeholder="ex.: joao"/></div>
          <div><label>Chave PIX</label><input value={novo.pix} onChange={e=>setNovo({...novo,pix:e.target.value})}/></div>
          <div><label>WhatsApp</label><input value={novo.whatsapp} onChange={e=>setNovo({...novo,whatsapp:e.target.value})}/></div>
          <div><label>Email</label><input type="email" value={novo.email} onChange={e=>setNovo({...novo,email:e.target.value})}/></div>
        </div>
        <div style={{marginTop:14}}><button className="btn btn-primary">Criar parceiro</button></div>
      </form>
    </>}

    {aba==="valores" && <form className="card" onSubmit={e=>{ e.preventDefault(); chamar("/admin/config",cfg); }}>
      <h3>Valores da plataforma</h3>
      <div className="grid">
        <div><label>Mensalidade (R$)</label><input inputMode="decimal" value={cfg.preco_mensal} onChange={e=>setCfg({...cfg,preco_mensal:e.target.value})}/></div>
        <div><label>Dias de teste grátis</label><input type="number" min={0} max={60} value={cfg.dias_teste} onChange={e=>setCfg({...cfg,dias_teste:e.target.value})}/></div>
        <div><label>Dias até pausar (pagamento recusado)</label><input type="number" min={0} max={30} value={cfg.dias_tolerancia} onChange={e=>setCfg({...cfg,dias_tolerancia:e.target.value})}/></div>
        <div><label>PIX por adesão ao parceiro (R$)</label><input inputMode="decimal" value={cfg.comissao_adesao} onChange={e=>setCfg({...cfg,comissao_adesao:e.target.value})}/></div>
      </div>
      <p className="small muted">O preço novo vale para quem assinar daqui em diante; quem já assina continua com o valor da própria assinatura no Mercado Pago.</p>
      <button className="btn btn-primary">Salvar valores</button>
    </form>}
  </>;
}

// ======================================================================== app
function Painel({conta, setConta}){
  const [aba,setAba]=useState("inicio"); const [pend,setPend]=useState(0); const [capNovas,setCapNovas]=useState(0);
  useEffect(()=>{ sb.from("conversas").select("id",{count:"exact",head:true}).eq("precisa_corretor",true).then(r=>setPend(r.count||0));
    sb.from("captacoes").select("id",{count:"exact",head:true}).eq("status","nova").then(r=>setCapNovas(r.count||0)); },[aba]);
  const abas=[["inicio","Início"],["conversas","Conversas"],["agenda","Agenda"],["imoveis","Imóveis"],["captacoes","Captações"],["testar","Testar"],["ia","IA"],["whatsapp","WhatsApp"],["parceiro","Indique e ganhe"],["perfil","Perfil"]];
  return <>
    <div className="tabs">{abas.map(([k,n])=><button key={k} className={aba===k?"on":""} onClick={()=>setAba(k)}>{n}{k==="conversas"&&pend>0&&<span className="badge">{pend}</span>}{k==="captacoes"&&capNovas>0&&<span className="badge">{capNovas}</span>}</button>)}</div>
    {aba==="inicio" && <Inicio conta={conta} irPara={setAba}/>}
    {aba==="conversas" && <Conversas conta={conta} aoContar={setPend}/>}
    {aba==="agenda" && <><Visitas/><Horarios conta={conta}/><Bloqueios conta={conta}/></>}
    {aba==="imoveis" && <Imoveis conta={conta}/>}
    {aba==="captacoes" && <Captacoes conta={conta} aoContar={setCapNovas}/>}
    {aba==="testar" && <Simulador conta={conta}/>}
    {aba==="ia" && <IA conta={conta}/>}
    {aba==="whatsapp" && <WhatsApp conta={conta}/>}
    {aba==="parceiro" && <Parceiro conta={conta}/>}
    {aba==="perfil" && <Perfil conta={conta} salvo={setConta}/>}
  </>;
}

function App(){
  const [sessao,setSessao]=useState(undefined); const [conta,setConta]=useState(undefined); const [recuperando,setRecuperando]=useState(false);
  const [admin,setAdmin]=useState(false); const [verAdmin,setVerAdmin]=useState(location.hash==="#admin");
  useEffect(()=>{ const f=()=>setVerAdmin(location.hash==="#admin"); addEventListener("hashchange",f); return ()=>removeEventListener("hashchange",f); },[]);
  useEffect(()=>{ if(sessao) worker("/eu").then(r=>setAdmin(!!r.admin)).catch(()=>setAdmin(false)); else setAdmin(false); },[sessao?.user?.id]);
  useEffect(()=>{ if(!sb) return;
    sb.auth.getSession().then(({data})=>setSessao(data.session));
    const { data:{ subscription } } = sb.auth.onAuthStateChange((ev,s)=>{ setSessao(s); if(ev==="PASSWORD_RECOVERY") setRecuperando(true); });
    return ()=>subscription.unsubscribe(); },[]);
  useEffect(()=>{ if(!sessao) { setConta(sessao===null?null:undefined); return; }
    sb.from("contas").select("*").maybeSingle().then(({data})=>setConta(data||null)); },[sessao?.user?.id]);

  if(!configurado) return <div className="wrap"><div className="card"><h3>Falta configurar</h3><p>Preencha <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code> e <code>WORKER_URL</code> no topo deste arquivo.</p></div></div>;
  if(sessao===undefined) return <div className="wrap muted">Carregando…</div>;
  if(recuperando) return <NovaSenha fim={()=>setRecuperando(false)}/>;
  if(!sessao) return <Login/>;
  if(conta===undefined) return <div className="wrap muted">Carregando…</div>;
  const pronto = conta && conta.onboarding_etapa>=7;
  return (
    <div className="wrap">
      <div className="top"><div className="brand"><h1>{admin && verAdmin ? "Dri Imóveis · Administração" : `${conta?.nome_assistente||"Dri"} · ${conta?.nome||"Imóveis"}`}</h1><p>{admin && verAdmin ? "Corretores, cobrança e parceiros" : "Sua assistente de WhatsApp para imóveis"}</p></div>
        <div className="row">{admin && <a className="btn btn-ghost btn-sm" href={verAdmin?"#":"#admin"}>{verAdmin?"Meu painel":"Administração"}</a>}
          <button className="btn btn-ghost btn-sm" onClick={()=>sb.auth.signOut()}>Sair</button></div></div>
      {admin && verAdmin ? <Admin/> : <>
        {conta && <FaixaAssinatura/>}
        {pronto ? <Painel conta={conta} setConta={setConta}/> : <Onboarding conta={conta} setConta={setConta}/>}</>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
