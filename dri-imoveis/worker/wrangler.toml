name = "dri-imoveis"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "CONVERSA"
class_name = "Conversa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversa"]

# Autoteste das IAs todo dia às 8h (Brasília)
[triggers]
crons = ["0 11 * * *"]

[vars]
GRAPH_VERSION = "v23.0"
IA_ORDEM = "gemini,groq,cerebras"
PAINEL_URL = "https://dri-imoveis.pages.dev/app"
PAINEL_ORIGEM = "https://dri-imoveis.pages.dev"
ADMIN_EMAILS = "janan.almeida@gmail.com"   # área do administrador e avisos de cobrança
SITE_URL = "https://dri-imoveis.pages.dev" # base dos links de parceiro
# ALERTA_EMAIL = "voce@exemplo.com"   # recebe o aviso se uma IA cair ou trocar de modelo
