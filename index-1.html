// ─── SUPABASE HELPERS ──────────────────────────────────────────────────────────
async function sbReq(url, key, path, options = {}) {
  const res = await fetch(`${url}/rest/v1${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      apikey: key, Authorization: `Bearer ${key}`, Prefer: 'return=representation',
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}
const sbInsert = (u, k, table, data) => sbReq(u, k, `/${table}`, { method: 'POST', body: JSON.stringify(data) });
const sbSelect = (u, k, table, q = '') => sbReq(u, k, `/${table}?${q}`);

// ─── AI HELPER ─────────────────────────────────────────────────────────────────
async function callClaude(messages, system) {
  const WORKER_URL = 'https://notificaai-proxy.janan-almeida.workers.dev';

  // Convert to OpenAI format — skip leading assistant messages (Groq requires user first)
  const converted = messages.map(m => ({
    role: m.role === 'assistant' ? 'assistant' : 'user',
    content: m.content
  }));

  // Find first user message index
  const firstUser = converted.findIndex(m => m.role === 'user');
  const filtered = firstUser >= 0 ? converted.slice(firstUser) : converted;

  const msgs = [];
  if (system) msgs.push({ role: 'system', content: system });
  filtered.forEach(m => msgs.push(m));

  if (msgs.length === 0 || (msgs.length === 1 && msgs[0].role === 'system')) {
    return 'Olá! Como posso ajudá-lo?';
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: msgs }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || 'Erro ao processar. Tente novamente.';
  } catch(e) {
    console.error('Worker error:', e);
    return 'Erro ao processar. Tente novamente.';
  }
}

async function extractData(chatMessages) {
  const msgs = [...chatMessages, { role: 'user', content: 'Extraia os dados no formato JSON.' }];
  const text = await callClaude(msgs, EXTRACT_SYSTEM);
  try { return JSON.parse(text.replace(/```json|```/g, '').trim()); }
  catch { return null; }
}

// ─── STATS ─────────────────────────────────────────────────────────────────────
function computeStats(notifications) {
  const total = notifications.length;
  const sp = notifications.filter(n => n.notification_type === 'seguranca_paciente').length;
  const ccih = notifications.filter(n => n.notification_type === 'ccih').length;
  const adm = notifications.filter(n => n.notification_type === 'administrativa').length;

  const sectorMap = { 'UPG': 0, 'Ala A': 0, 'Centro Cirúrgico': 0, 'SEP': 0 };
  notifications.forEach(n => { if (n.sector in sectorMap) sectorMap[n.sector]++; });
  const sectorData = Object.entries(sectorMap).map(([k, v]) => ({
    setor: k === 'Centro Cirúrgico' ? 'CC' : k, eventos: v,
  }));

  const typeMap = {};
  notifications.forEach(n => {
    const t = n.event_subtype || n.occurrence_subtype || 'outros';
    const l = t.charAt(0).toUpperCase() + t.slice(1);
    typeMap[l] = (typeMap[l] || 0) + 1;
  });
  const typeColors = [C.red, C.yellow, C.purple, C.blue, C.green, C.muted];
  const typeData = Object.entries(typeMap).sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([name, value], i) => ({ name, value, color: typeColors[i] }));

  const heatmap = [
    { turno: 'Manhã', v: [0,0,0,0,0,0,0] },
    { turno: 'Tarde', v: [0,0,0,0,0,0,0] },
    { turno: 'Noite', v: [0,0,0,0,0,0,0] },
  ];
  notifications.forEach(n => {
    if (!n.event_date || !n.shift) return;
    const day = new Date(n.event_date + 'T12:00:00').getDay();
    const si = ['Manhã', 'Tarde', 'Noite'].indexOf(n.shift);
    if (si >= 0) heatmap[si].v[day]++;
  });

  // Monthly (last 5)
  const mMap = {};
  notifications.forEach(n => {
    const d = new Date(n.created_at);
    const k = d.toLocaleDateString('pt-BR', { month: 'short' });
    if (!mMap[k]) mMap[k] = { mes: k, sp: 0, adm: 0 };
    if (n.notification_type === 'seguranca_paciente') mMap[k].sp++;
    else mMap[k].adm++;
  });
  const monthly = Object.values(mMap).slice(-5);

  const critSector = sectorData.reduce((m, s) => s.eventos > m.eventos ? s : m, sectorData[0] || { setor: 'Ala A', eventos: 0 });
  return { total, sp, ccih, adm, sectorData, typeData, heatmap, monthly, critSector };
}

function formatTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 3600000) return `${Math.floor(diff / 60000)}min`;
  if (diff < 86400000) return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return 'ontem';
}
function getTag(n) {
  if (n.notification_type === 'seguranca_paciente') return { label: 'SP', color: C.red };
  if (n.notification_type === 'ccih') return { label: 'CCIH', color: C.yellow };
  return { label: 'ADM', color: C.purple };
}
function getTitle(n) {
  return n.event_subtype || n.occurrence_subtype || n.infection_topography || (n.description || '').slice(0, 28) || 'Notificação';
}
function md(t) {
  return t.replace(/\*\*(.*?)\*\*/g, `<strong style="color:${C.teal}">$1</strong>`).replace(/\n/g, '<br/>');
}

}

function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
  const bg = type === 'success' ? C.green : type === 'error' ? C.red : C.blue;
  return (
    <div style={{ position: 'fixed', top: 16, left: '50%', transform: 'translateX(-50%)', background: bg, color: '#fff', borderRadius: 12, padding: '12px 20px', fontSize: 13, fontWeight: 700, zIndex: 9999, maxWidth: 320, textAlign: 'center', boxShadow: `0 4px 24px ${bg}66`, whiteSpace: 'pre-wrap' }}>
      {msg}
    </div>
  );
}

// ─── NOTIFICAR VIEW ────────────────────────────────────────────────────────────
function NotificarView({ sbUrl, sbKey, webhookUrl, nspEmail, testMode, showToast }) {
  const [messages, setMessages] = useState([
    { role: 'assistant', content: 'Olá! Bem-vindo ao **NotificaAI** do HNSA.\n\nEstou aqui para registrar sua notificação com segurança e agilidade.\n\nVocê é **profissional de saúde**, **paciente** ou **familiar/acompanhante**?' }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

  const lastAi = messages.filter(m => m.role === 'assistant').slice(-1)[0]?.content || '';
  const showConfirm = !done && (
    lastAi.toLowerCase().includes('posso confirmar') ||
    lastAi.toLowerCase().includes('confirmar o envio') ||
    lastAi.toLowerCase().includes('enviar esta notificação')
  );

  const send = async (override) => {
    const msg = override || input;
    if (!msg.trim() || loading || saving) return;
    const next = [...messages, { role: 'user', content: msg }];
    setMessages(next);
    setInput('');
    setLoading(true);
    try {
      const reply = await callClaude(next.map(m => ({ role: m.role, content: m.content })), CHAT_SYSTEM);
      setMessages(p => [...p, { role: 'assistant', content: reply }]);
    } catch {
      setMessages(p => [...p, { role: 'assistant', content: 'Erro de conexão. Tente novamente.' }]);
    }
    setLoading(false);
  };

  const handleConfirm = async () => {
    setSaving(true);
    setMessages(p => [...p, { role: 'user', content: 'Sim, pode confirmar e enviar.' }]);
    try {
      const data = await extractData(messages.map(m => ({ role: m.role, content: m.content })));
      if (!data) throw new Error('Falha na extração');
      if (sbUrl && sbKey) {
        await sbInsert(sbUrl, sbKey, 'notifications', { ...data, chat_history: messages });
        showToast('✅ Notificação salva com sucesso!\nNSP será notificado por e-mail.', 'success');
      } else {
        showToast('✅ Notificação registrada!\nConfigure o Supabase para persistir os dados.', 'success');
      }
      setDone(true);
      setMessages(p => [...p, { role: 'assistant', content: '✅ **Notificação enviada com sucesso!**\n\nO NSP foi notificado. Obrigado por contribuir com a segurança do HNSA.\n\nPara nova notificação, acesse novamente pelo QR Code ou intranet.' }]);
    } catch {
      showToast('Erro ao salvar. Verifique a conexão e tente novamente.', 'error');
    }
    setSaving(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 64px)' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}`, background: C.surface }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.text }}>Registrar Notificação</div>
        <div style={{ fontSize: 11, color: C.muted }}>HNSA · NSP · Canal seguro</div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
            <div style={{ maxWidth: '84%', background: m.role === 'user' ? `linear-gradient(135deg, ${C.teal}, ${C.blue})` : C.card, border: m.role === 'assistant' ? `1px solid ${C.border}` : 'none', borderRadius: m.role === 'user' ? '16px 16px 4px 16px' : '16px 16px 16px 4px', padding: '11px 14px', fontSize: 14, color: C.text, lineHeight: 1.65 }}
              dangerouslySetInnerHTML={{ __html: md(m.content) }} />
          </div>
        ))}
        {(loading || saving) && (
          <div style={{ display: 'flex' }}>
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: '16px 16px 16px 4px', padding: '13px 16px' }}>
              <div style={{ display: 'flex', gap: 5 }}>
                {[0,1,2].map(i => <div key={i} style={{ width: 7, height: 7, borderRadius: '50%', background: saving ? C.green : C.teal, animation: `pulse 1.2s ${i*0.2}s ease-in-out infinite` }} />)}
              </div>
            </div>
          </div>
        )}
        {showConfirm && !loading && (
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button onClick={handleConfirm} disabled={saving} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 12, padding: '13px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
              {saving ? '⏳ Salvando…' : '✅ Confirmar e Enviar'}
            </button>
            <button onClick={() => send('Quero corrigir algumas informações antes de enviar.')} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: '13px', color: C.muted, fontWeight: 600, fontSize: 12, cursor: 'pointer' }}>
              ✏️ Corrigir
            </button>
          </div>
        )}
        <div ref={endRef} />
      </div>
      {!done && (
        <div style={{ padding: '10px 14px', borderTop: `1px solid ${C.border}`, background: C.surface, display: 'flex', gap: 10 }}>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()} placeholder="Escreva aqui…" style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 22, padding: '10px 16px', color: C.text, fontSize: 14, outline: 'none' }} />
          <button onClick={() => send()} disabled={loading || !input.trim()} style={{ width: 44, height: 44, borderRadius: '50%', border: 'none', background: input.trim() ? C.teal : C.border, cursor: input.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <IconSend size={17} color={input.trim() ? '#06101F' : C.muted} />
          </button>
        </div>
      )}
    </div>
  );
}

// ─── ANALYTICS VIEW ────────────────────────────────────────────────────────────
function AnalyticsView({ sbUrl, sbKey, showToast }) {

  useEffect(() => {
    if (!sbUrl || !sbKey) return;
    sbSelect(sbUrl, sbKey, 'notifications', 'select=*')
      .then(data => setStats(computeStats(data)))
      .catch(() => showToast('Erro ao carregar analytics', 'error'));

  const s = stats || { sectorData: MOCK_SECTORS, typeData: MOCK_TYPES, heatmap: MOCK_HEATMAP, monthly: MOCK_MONTHLY, total: 26, sp: 11, adm: 15 };

Mapa de calor: pico no turno noturno de quarta-feira

          </div>

// ─── ADMIN PANEL ──────────────────────────────────────────────────────────────
function AdminPanel({ sbUrl, sbKey, nspEmail, testMode, webhookUrl, onSaveEmail, onToggleTestMode, onSaveWebhook, showToast }) {
  const [email, setEmail] = useState(nspEmail);
  const [webhook, setWebhook] = useState(webhookUrl);
  const [notifications, setNotifications] = useState([]);
  const [loading, setLoading] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const [filterTest, setFilterTest] = useState('all');

  const loadNotifications = async () => {
    if (!sbUrl || !sbKey) return;
    setLoading(true);
    try {
      const data = await sbSelect(sbUrl, sbKey, 'notifications', 'select=*&order=created_at.desc');
      setNotifications(data);
    } catch { showToast('Erro ao carregar notificações', 'error'); }
    setLoading(false);
  };

  useEffect(() => { loadNotifications(); }, [sbUrl, sbKey]);

  const handleDelete = async (id) => {
    if (!confirm('Excluir esta notificação? Esta ação não pode ser desfeita.')) return;
    setDeleting(id);
    try {
      await sbReq(sbUrl, sbKey, `/notifications?id=eq.${id}`, { method: 'DELETE' });
      setNotifications(notifications.filter(n => n.id !== id));
      showToast('✅ Notificação excluída', 'success');
    } catch { showToast('Erro ao excluir', 'error'); }
    setDeleting(null);
  };

  const handleClearTests = async () => {
    if (!confirmClear) { setConfirmClear(true); setTimeout(() => setConfirmClear(false), 3000); return; }
    try {
      await sbReq(sbUrl, sbKey, `/notifications?is_test=eq.true`, { method: 'DELETE' });
      setNotifications(notifications.filter(n => !n.is_test));
      showToast('✅ Todas as notificações de teste foram excluídas', 'success');
      setConfirmClear(false);
    } catch { showToast('Erro ao limpar testes', 'error'); }
  };

  const filtered = notifications.filter(n => {
    if (filterTest === 'test') return n.is_test;
    if (filterTest === 'prod') return !n.is_test;
    return true;
  });

  const testCount = notifications.filter(n => n.is_test).length;

  const inp = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '11px 14px', color: C.text, fontSize: 13, outline: 'none', width: '100%' };
  const lbl = { fontSize: 11, color: C.muted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', display: 'block', marginBottom: 6 };

  return (
    <div style={{ padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div>
        <div style={{ fontSize: 17, fontWeight: 900, color: C.text }}>Administração NSP</div>
        <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>Painel exclusivo do gestor</div>
      </div>

      {/* MODO TESTE / PRODUÇÃO */}
      <div style={{ background: testMode ? C.yellow + '18' : C.green + '18', border: `1px solid ${testMode ? C.yellow + '55' : C.green + '55'}`, borderRadius: 14, padding: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 800, color: testMode ? C.yellow : C.green }}>
              {testMode ? '🧪 MODO TESTE ativado' : '✅ MODO PRODUÇÃO ativado'}
            </div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 3, lineHeight: 1.5 }}>
              {testMode 
                ? 'Notificações estão sendo marcadas como teste. Você pode excluí-las em lote depois.'
                : 'Notificações são tratadas como reais. E-mails serão enviados ao destino configurado.'}
            </div>
          </div>
          <button onClick={onToggleTestMode} style={{ background: testMode ? C.yellow : C.green, border: 'none', borderRadius: 999, padding: '8px 14px', color: '#06101F', fontWeight: 800, fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap' }}>
            {testMode ? 'Ativar Produção' : 'Ativar Teste'}
          </button>
        </div>
      </div>

      {/* E-MAIL DESTINO */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>📧 E-mail de destino</div>
        <div style={{ fontSize: 11, color: C.muted, marginBottom: 12 }}>Todas as notificações confirmadas serão enviadas para este e-mail.</div>
        <label style={lbl}>E-mail do NSP</label>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="hnsa.nsp@marinha.mil.br" style={{ ...inp, marginBottom: 10 }} />
        <button onClick={() => { onSaveEmail(email.trim()); showToast('✅ E-mail atualizado', 'success'); }} style={{ width: '100%', background: C.teal, border: 'none', borderRadius: 10, padding: '11px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
          Salvar e-mail
        </button>
      </div>

      {/* WEBHOOK */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>🔗 Webhook (n8n / Make)</div>
        <div style={{ fontSize: 11, color: C.muted, marginBottom: 12 }}>URL que receberá os dados da notificação para envio do e-mail.</div>
        <label style={lbl}>Webhook URL</label>
        <input value={webhook} onChange={e => setWebhook(e.target.value)} placeholder="https://seu-n8n.app/webhook/notificaai" style={{ ...inp, marginBottom: 10, fontFamily: 'monospace', fontSize: 11 }} />
        <button onClick={() => { onSaveWebhook(webhook.trim()); showToast('✅ Webhook atualizado', 'success'); }} style={{ width: '100%', background: C.teal, border: 'none', borderRadius: 10, padding: '11px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
          Salvar webhook
        </button>
      </div>

      {/* GERENCIAR NOTIFICAÇÕES */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>📋 Gerenciar notificações</div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{notifications.length} total · {testCount} de teste</div>
          </div>
          <button onClick={loadNotifications} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '5px 10px', color: C.teal, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>↻</button>
        </div>

        {/* Filtros */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {[['all','Todas',notifications.length],['test','Teste',testCount],['prod','Produção',notifications.length-testCount]].map(([id, label, count]) => (
            <button key={id} onClick={() => setFilterTest(id)} style={{ flex: 1, padding: '6px 8px', borderRadius: 8, border: 'none', background: filterTest === id ? C.teal : C.surface, color: filterTest === id ? '#06101F' : C.muted, fontSize: 10, fontWeight: 700, cursor: 'pointer' }}>
              {label} ({count})
            </button>
          ))}
        </div>

        {/* Botão Limpar Testes */}
        {testCount > 0 && (
          <button onClick={handleClearTests} style={{ width: '100%', background: confirmClear ? C.red : C.red + '22', border: `1px solid ${C.red}55`, borderRadius: 10, padding: '10px', color: confirmClear ? '#fff' : C.red, fontWeight: 700, fontSize: 12, cursor: 'pointer', marginBottom: 12 }}>
            {confirmClear ? '⚠️ CLIQUE NOVAMENTE para confirmar exclusão de todas as ' + testCount + ' notificações de teste' : `🗑️ Limpar todas as ${testCount} notificações de teste`}
          </button>
        )}

        {/* Lista */}
        {loading && <div style={{ textAlign: 'center', color: C.muted, fontSize: 12, padding: 20 }}>Carregando…</div>}
        {!loading && filtered.length === 0 && <div style={{ textAlign: 'center', color: C.muted, fontSize: 12, padding: 20 }}>Nenhuma notificação</div>}
        {filtered.map(n => {
          const tag = getTag(n); const title = getTitle(n);
          return (
            <div key={n.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 12px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ background: tag.color + '22', color: tag.color, borderRadius: 5, padding: '2px 6px', fontSize: 9, fontWeight: 700, minWidth: 38, textAlign: 'center' }}>{tag.label}</div>
              {n.is_test && <div style={{ background: C.yellow + '22', color: C.yellow, borderRadius: 5, padding: '2px 6px', fontSize: 9, fontWeight: 700 }}>TESTE</div>}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.text, textTransform: 'capitalize', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</div>
                <div style={{ fontSize: 10, color: C.muted }}>{n.sector} · {formatTime(n.created_at)}</div>
              </div>
              <button onClick={() => handleDelete(n.id)} disabled={deleting === n.id} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 6, display: 'flex' }}>
                <IconTrash size={14} color={deleting === n.id ? C.muted : C.red} />
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── PIN MODAL ─────────────────────────────────────────────────────────────────
function PinModal({ correctPin, onSuccess, onClose }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  const check = () => {
    if (pin === correctPin) { onSuccess(); }
    else { setError(true); setPin(''); setTimeout(() => setError(false), 1200); }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#000c', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div style={{ background: C.surface, borderRadius: 20, padding: '32px 24px', width: '100%', maxWidth: 320, border: `1px solid ${error ? C.red : C.border}`, transition: 'border-color 0.3s', textAlign: 'center' }}>
        <div style={{ fontSize: 36, marginBottom: 12 }}>🔐</div>
        <div style={{ fontSize: 16, fontWeight: 800, color: C.text, marginBottom: 6 }}>Painel NSP</div>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 24 }}>Área restrita · Digite o PIN de acesso</div>
        <input
          ref={inputRef}
          type="password"
          value={pin}
          onChange={e => setPin(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && check()}
          placeholder="••••"
          maxLength={8}
          style={{ width: '100%', background: C.card, border: `1px solid ${error ? C.red : C.border}`, borderRadius: 12, padding: '14px', color: C.text, fontSize: 24, textAlign: 'center', letterSpacing: '0.4em', outline: 'none', marginBottom: 8 }}
        />
        {error && <div style={{ fontSize: 12, color: C.red, marginBottom: 8 }}>PIN incorreto. Tente novamente.</div>}
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          <button onClick={onClose} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '12px', color: C.muted, fontWeight: 600, fontSize: 13, cursor: 'pointer' }}>Cancelar</button>
          <button onClick={check} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 10, padding: '12px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>Entrar</button>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT APP ──────────────────────────────────────────────────────────────────
function NotificaAI() {
  const [view, setView] = useState('notificar');
  const [sbUrl, setSbUrl] = useState('');
  const [sbKey, setSbKey] = useState('');
  const [webhookUrl, setWebhookUrl] = useState('');
  const [showConfig, setShowConfig] = useState(false);
  const [toast, setToast] = useState(null);
  const [nspMode, setNspMode] = useState(false);
  const [nspPin, setNspPin] = useState('');
  const [showPinModal, setShowPinModal] = useState(false);
  const [nspEmail, setNspEmail] = useState('');
  const [testMode, setTestMode] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get('notificai-sb');
        if (r?.value) { 
          const c = JSON.parse(r.value); 
          setSbUrl(c.url||''); 
          setSbKey(c.key||''); 
          setWebhookUrl(c.webhook||''); 
          setNspPin(c.pin||''); 
          setNspEmail(c.email||'');
          setTestMode(c.testMode !== undefined ? c.testMode : true);
        }
      } catch {}
    })();
  }, []);

  const handleSaveConfig = async (url, key, webhook, pin) => {
    setSbUrl(url); setSbKey(key); setWebhookUrl(webhook); setNspPin(pin);
    try { await window.storage.set('notificai-sb', JSON.stringify({ url, key, webhook, pin, email: nspEmail, testMode })); } catch {}
    setShowConfig(false);
    showToast('✅ Supabase configurado com sucesso!', 'success');
  };

  const saveAll = async (overrides = {}) => {
    const data = { url: sbUrl, key: sbKey, webhook: webhookUrl, pin: nspPin, email: nspEmail, testMode, ...overrides };
    try { await window.storage.set('notificai-sb', JSON.stringify(data)); } catch {}
  };

  const handleSaveEmail = (email) => { setNspEmail(email); saveAll({ email }); };
  const handleToggleTestMode = () => { 
    const nv = !testMode; 
    setTestMode(nv); 
    saveAll({ testMode: nv });
    showToast(nv ? '🧪 Modo TESTE ativado' : '✅ Modo PRODUÇÃO ativado', 'success');
  };
  const handleSaveWebhook = (webhook) => { setWebhookUrl(webhook); saveAll({ webhook }); };

  const showToast = (msg, type = 'success') => {
    setToast({ msg, type, id: Date.now() });
    setTimeout(() => setToast(null), 4500);
  };

  const publicTabs = [
    { id: 'notificar', label: 'Notificar', icon: IconMessageSquare },
    { id: 'central', label: 'Central', icon: IconBookOpen },
  ];
  const nspTabs = [
    { id: 'home', label: 'Painel', icon: IconHome },
    { id: 'analytics', label: 'Analytics', icon: IconBarChart2 },
    { id: 'admin', label: 'Admin', icon: IconShield },
    { id: 'central', label: 'Central', icon: IconBookOpen },
  ];
  const tabs = nspMode ? nspTabs : publicTabs;

  return (
    <>
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#06101F}
        @keyframes pulse{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-5px);opacity:1}}
        input::placeholder{color:#5A7AA0}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-thumb{background:#1A3060;border-radius:2px}
        button:active{opacity:.85}
      `}</style>
      <div style={{ background: C.bg, minHeight: '100vh', maxWidth: 480, margin: '0 auto', display: 'flex', flexDirection: 'column', color: C.text, fontFamily: 'system-ui,-apple-system,sans-serif' }}>
        {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
        {showPinModal && <PinModal correctPin={nspPin || '1234'} onSuccess={() => { setNspMode(true); setShowPinModal(false); setView('home'); }} onClose={() => setShowPinModal(false)} />}
        {showConfig && <ConfigPanel sbUrl={sbUrl} sbKey={sbKey} webhookUrl={webhookUrl} nspPin={nspPin} onSave={handleSaveConfig} onClose={() => setShowConfig(false)} />}
        <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 68 }}>
          {view === 'home'      && <HomeView      setView={setView} sbUrl={sbUrl} sbKey={sbKey} onConfig={() => setShowConfig(true)} showToast={showToast} nspMode={nspMode} testMode={testMode} />}
          {view === 'notificar' && <NotificarView sbUrl={sbUrl} sbKey={sbKey} webhookUrl={webhookUrl} nspEmail={nspEmail} testMode={testMode} showToast={showToast} />}
          {view === 'analytics' && <AnalyticsView sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} />}
          {view === 'admin'     && <AdminPanel sbUrl={sbUrl} sbKey={sbKey} nspEmail={nspEmail} testMode={testMode} webhookUrl={webhookUrl} onSaveEmail={handleSaveEmail} onToggleTestMode={handleToggleTestMode} onSaveWebhook={handleSaveWebhook} showToast={showToast} />}
          {view === 'central'   && <CentralView />}
        </div>
        <div style={{ position: 'fixed', bottom: 0, left: '50%', transform: 'translateX(-50%)', width: '100%', maxWidth: 480, background: C.surface, borderTop: `1px solid ${C.border}`, display: 'flex', paddingBottom: 8, paddingTop: 8, zIndex: 100 }}>
          {tabs.map(({ id, label, icon: Icon }) => {
            const active = view === id;
            return (
              <button key={id} onClick={() => setView(id)} style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: active ? C.teal : C.muted, padding: '4px 0' }}>
                <Icon size={22} strokeWidth={active ? 2.5 : 1.8} />
                <span style={{ fontSize: 10, fontWeight: active ? 700 : 400 }}>{label}</span>
              </button>
            );
          })}
          {!nspMode ? (
            <button onClick={() => setShowPinModal(true)} style={{ flex: 0, padding: '4px 12px', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: C.muted }}>
              <span style={{ fontSize: 18 }}>🔒</span>
              <span style={{ fontSize: 10 }}>NSP</span>
            </button>
          ) : (
            <button onClick={() => { setNspMode(false); setView('notificar'); }} style={{ flex: 0, padding: '4px 12px', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: C.teal }}>
              <span style={{ fontSize: 18 }}>🔓</span>
              <span style={{ fontSize: 10 }}>NSP</span>
            </button>
          )}
        </div>
      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NotificaAI />);
</script>
</body>
</html>
