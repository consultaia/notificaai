function TicketForm({ sbUrl, sbKey, hospital, showToast, onBack, publicMode }) {
  const [step, setStep] = useState('type'); // type | form | done
  const [type, setType] = useState(null);
  const [form, setForm] = useState({ sector: '', description: '', priority: 'normal', patient_name: '', destination: '', scheduled_at: '', requester_name: '' });
  const [saving, setSaving] = useState(false);
  const h = hospital || DEFAULT_HOSPITAL;

  const selectedType = TICKET_TYPES.find(t => t.id === type);

  const handleSubmit = async () => {
    if (!form.description.trim()) { showToast('Descreva o chamado', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        hospital_id: h.id,
        ticket_type: type,
        origin_sector: form.sector,
        description: form.description,
        priority: form.priority,
        patient_name: form.patient_name || null,
        requester_name: form.requester_name || null,
        destination_sector: selectedType?.dest || null,
        scheduled_at: form.scheduled_at || null,
        status: 'aberto',
        opened_at: new Date().toISOString(),
      };
      if (sbUrl && sbKey) {
        await sbInsert(sbUrl, sbKey, 'tickets', payload);
        showToast('✅ Chamado aberto! ' + (selectedType?.dest || '') + ' foi notificado.', 'success');
      } else {
        showToast('✅ Chamado registrado (sem banco configurado)', 'success');
      }
      setStep('done');
    } catch (e) {
      showToast('Erro ao abrir chamado: ' + e.message, 'error');
    }
    setSaving(false);
  };

  const inp = { background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '11px 14px', color: C.text, fontSize: 13, outline: 'none', width: '100%', marginBottom: 12 };
  const lbl = { fontSize: 11, color: C.muted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', display: 'block', marginBottom: 6 };

  if (step === 'done') return (
    <div style={{ padding: 32, textAlign: 'center' }}>
      <div style={{ fontSize: 56, marginBottom: 16 }}>✅</div>
      <div style={{ fontSize: 18, fontWeight: 900, color: C.text, marginBottom: 8 }}>Chamado aberto!</div>
      <div style={{ fontSize: 14, color: C.muted, marginBottom: 24 }}>{selectedType?.dest} foi notificado e receberá o chamado.</div>
      {onBack && <button onClick={onBack} style={{ background: C.teal, border: 'none', borderRadius: 12, padding: '12px 28px', color: '#06101F', fontWeight: 800, fontSize: 14, cursor: 'pointer' }}>Ver chamados</button>}
      {!onBack && <button onClick={() => setStep('type')} style={{ background: C.teal, border: 'none', borderRadius: 12, padding: '12px 28px', color: '#06101F', fontWeight: 800, fontSize: 14, cursor: 'pointer' }}>Novo chamado</button>}
    </div>
  );

  if (step === 'type') return (
    <div style={{ padding: '20px 16px' }}>
      {onBack && <button onClick={onBack} style={{ background: 'none', border: 'none', color: C.teal, cursor: 'pointer', fontSize: 22, marginBottom: 16 }}>←</button>}
      <div style={{ fontSize: 17, fontWeight: 900, color: C.text, marginBottom: 4 }}>Novo Chamado</div>
      <div style={{ fontSize: 12, color: C.muted, marginBottom: 20 }}>Qual o tipo de chamado?</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {TICKET_TYPES.map(t => (
          <button key={t.id} onClick={() => { setType(t.id); setStep('form'); }} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 14, cursor: 'pointer', textAlign: 'left' }}>
            <div style={{ width: 44, height: 44, borderRadius: 12, background: t.color + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22, flexShrink: 0 }}>{t.icon}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{t.label}</div>
              <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>→ {t.dest} · {t.desc}</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div style={{ padding: '20px 16px' }}>
      <button onClick={() => setStep('type')} style={{ background: 'none', border: 'none', color: C.teal, cursor: 'pointer', fontSize: 22, marginBottom: 8 }}>←</button>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <div style={{ width: 44, height: 44, borderRadius: 12, background: selectedType?.color + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22 }}>{selectedType?.icon}</div>
        <div>
          <div style={{ fontSize: 16, fontWeight: 800, color: C.text }}>{selectedType?.label}</div>
          <div style={{ fontSize: 11, color: C.muted }}>→ {selectedType?.dest}</div>
        </div>
      </div>

      <label style={lbl}>Setor de origem</label>
      <select value={form.sector} onChange={e => setForm({...form, sector: e.target.value})} style={{ ...inp, appearance: 'none' }}>
        <option value="">Selecione o setor</option>
        {h.sectors.map(s => <option key={s} value={s}>{SECTOR_LABELS[s] || s}</option>)}
      </select>

      <label style={lbl}>Solicitante (opcional)</label>
      <input value={form.requester_name} onChange={e => setForm({...form, requester_name: e.target.value})} placeholder="Nome de quem está solicitando" style={inp} />

      {type === 'ambulancia' && <>
        <label style={lbl}>Nome do paciente (opcional)</label>
        <input value={form.patient_name} onChange={e => setForm({...form, patient_name: e.target.value})} placeholder="Nome completo" style={inp} />
        <label style={lbl}>Destino / Unidade de referência</label>
        <input value={form.destination} onChange={e => setForm({...form, destination: e.target.value})} placeholder="Ex: Hospital Roberto Santos" style={inp} />
        <label style={lbl}>Horário previsto</label>
        <input type="datetime-local" value={form.scheduled_at} onChange={e => setForm({...form, scheduled_at: e.target.value})} style={inp} />
      </>}

      <label style={lbl}>Descrição do chamado</label>
      <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})} placeholder={type === 'manutencao' ? 'Ex: Ar-condicionado da UPG não funciona desde ontem...' : type === 'ambulancia' ? 'Ex: Paciente estável, necessita transferência para neurocirurgia...' : 'Descreva o chamado...'} style={{ ...inp, height: 90, resize: 'none', fontFamily: 'inherit' }} />

      <label style={lbl}>Prioridade</label>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        {[['normal','Normal','#5A7AA0'],['urgente','Urgente','#F59E0B'],['critico','Crítico','#EF4444']].map(([id, label, color]) => (
          <button key={id} onClick={() => setForm({...form, priority: id})} style={{ flex: 1, padding: '9px', borderRadius: 8, border: `1px solid ${form.priority === id ? color : C.border}`, background: form.priority === id ? color + '22' : C.card, color: form.priority === id ? color : C.muted, fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>{label}</button>
        ))}
      </div>

      <button onClick={handleSubmit} disabled={saving || !form.description.trim()} style={{ width: '100%', background: selectedType?.color || C.teal, border: 'none', borderRadius: 12, padding: '14px', color: '#06101F', fontWeight: 800, fontSize: 14, cursor: 'pointer', opacity: saving ? 0.7 : 1 }}>
        {saving ? '⏳ Enviando…' : `${selectedType?.icon} Abrir Chamado para ${selectedType?.dest}`}
      </button>
    </div>
  );
}

function TicketsList({ sbUrl, sbKey, hospital, showToast, profileMode }) {
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(false);
  const [filter, setFilter] = useState('todos');
  const [commenting, setCommenting] = useState(null);
  const [commentText, setCommentText] = useState('');
  const h = hospital || DEFAULT_HOSPITAL;
  const profile = PROFILES[profileMode] || null;
  const isNsp = profileMode === 'nsp';
  const isGestor = profileMode === 'gestor';
  const isDsg = profileMode === 'dsg';
  const isMotorista = profileMode === 'motorista';
  const isEnfermeiro = profileMode === 'enfermeiro';
  const canAct = isDsg || isMotorista || isNsp || isGestor;

  const load = async () => {
    if (!sbUrl || !sbKey) return;
    setLoading(true);
    try {
      let query = `select=*&hospital_id=eq.${h.id}&order=opened_at.desc`;
      const data = await sbSelect(sbUrl, sbKey, 'tickets', query);
      let result = data || [];
      // Filter by profile
      if (isDsg)               result = result.filter(t => t.ticket_type === 'manutencao');
      if (isMotorista)         result = result.filter(t => t.ticket_type === 'ambulancia');
      if (isEnfermeiro)        result = result.filter(t => t.ticket_type === 'ambulancia');
      setTickets(result);
    } catch { showToast('Erro ao carregar chamados', 'error'); }
    setLoading(false);
  };

  useEffect(() => { load(); }, [sbUrl, sbKey, profileMode]);

  // Auto-marcar como visualizado ao abrir o painel (DSG / Motorista)
  useEffect(() => {
    if (!sbUrl || !sbKey || (!isDsg && !isMotorista) || tickets.length === 0) return;
    const toMark = tickets.filter(t => t.status === 'aberto');
    toMark.forEach(async t => {
      try {
        await sbReq(sbUrl, sbKey, `/tickets?id=eq.${t.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: 'visualizado', viewed_at: new Date().toISOString(), viewed_by: profileMode }),
          headers: { 'Content-Type': 'application/json' }
        });
      } catch {}
    });
    if (toMark.length > 0) {
      setTickets(prev => prev.map(t => t.status === 'aberto' ? { ...t, status: 'visualizado', viewed_at: new Date().toISOString() } : t));
    }
  }, [tickets.length, isDsg, isMotorista]);

  const updateStatus = async (ticket, newStatus, notes) => {
    try {
      const patch = {
        status: newStatus,
        responded_at: new Date().toISOString(),
        ...(notes !== undefined ? { response_notes: notes } : {}),
        ...(newStatus === 'concluido' ? { closed_at: new Date().toISOString() } : {}),
      };
      await sbReq(sbUrl, sbKey, `/tickets?id=eq.${ticket.id}`, {
        method: 'PATCH', body: JSON.stringify(patch),
        headers: { 'Content-Type': 'application/json' }
      });
      setTickets(prev => prev.map(t => t.id === ticket.id ? { ...t, ...patch } : t));
      setCommenting(null); setCommentText('');
      const labels = { recebido: '📬 Pedido recebido!', em_andamento: '⏳ Em andamento!', concluido: '✅ Concluído!', pendente: '⚠ Pendente' };
      showToast(labels[newStatus] || 'Atualizado!', 'success');
    } catch { showToast('Erro ao atualizar chamado', 'error'); }
  };

  const filtered = filter === 'todos' ? tickets : tickets.filter(t => t.status === filter);
  const counts = {
    aberto: tickets.filter(t => t.status === 'aberto').length,
    em_andamento: tickets.filter(t => t.status === 'em_andamento').length,
    pendente: tickets.filter(t => ['pendente','visualizado','recebido'].includes(t.status)).length,
  };

  const getResponseTime = (t) => {
    if (!t.responded_at || !t.opened_at) return null;
    const diff = new Date(t.responded_at) - new Date(t.opened_at);
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${mins}min`;
    return `${Math.floor(mins/60)}h${mins%60>0?` ${mins%60}min`:''}`;
  };

  // Botões de ação por perfil
  const renderActions = (ticket) => {
    if (!canAct || ticket.status === 'concluido') return null;
    const isCommenting = commenting === ticket.id;
    const st = ticket.status;

    // DSG — fluxo completo com comentário
    if (isDsg || (isGestor && ticket.ticket_type === 'manutencao') || (isNsp && ticket.ticket_type === 'manutencao')) {
      return (
        <div style={{ marginTop: 8 }}>
          {isCommenting ? (
            <div>
              <textarea value={commentText} onChange={e => setCommentText(e.target.value)}
                placeholder="Comentário ou observação (opcional)…"
                style={{ width: '100%', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px', color: C.text, fontSize: 12, outline: 'none', resize: 'none', height: 70, fontFamily: 'inherit', marginBottom: 8 }} />
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={() => { setCommenting(null); setCommentText(''); }} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px', color: C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>Cancelar</button>
                <button onClick={() => updateStatus(ticket, ticket.status, commentText)} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 8, padding: '8px', color: '#06101F', fontSize: 11, fontWeight: 800, cursor: 'pointer' }}>💬 Salvar comentário</button>
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              <button onClick={() => setCommenting(ticket.id)} style={{ flex: 1, minWidth: 80, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px', color: C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>💬 Comentar</button>
              {(st === 'visualizado') && <button onClick={() => updateStatus(ticket, 'recebido')} style={{ flex: 1, minWidth: 80, background: '#1D6FE822', border: '1px solid #1D6FE844', borderRadius: 8, padding: '8px', color: C.blue, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>📬 Recebido</button>}
              {(st === 'recebido') && <button onClick={() => updateStatus(ticket, 'em_andamento')} style={{ flex: 1, minWidth: 80, background: '#00C9B122', border: '1px solid #00C9B144', borderRadius: 8, padding: '8px', color: C.teal, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>▶ Em andamento</button>}
              {(st === 'em_andamento' || st === 'recebido') && <button onClick={() => updateStatus(ticket, 'concluido')} style={{ flex: 1, minWidth: 80, background: '#10B98122', border: '1px solid #10B98144', borderRadius: 8, padding: '8px', color: C.green, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>✓ Concluído</button>}
            </div>
          )}
        </div>
      );
    }

    // Motorista — visualizado → recebido + comentário livre
    if (isMotorista || (isGestor && ticket.ticket_type === 'ambulancia') || (isNsp && ticket.ticket_type === 'ambulancia')) {
      return (
        <div style={{ marginTop: 8 }}>
          {isCommenting ? (
            <div>
              <textarea value={commentText} onChange={e => setCommentText(e.target.value)}
                placeholder="Ex: Saindo em 5 min, ambulância em manutenção…"
                style={{ width: '100%', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px', color: C.text, fontSize: 12, outline: 'none', resize: 'none', height: 70, fontFamily: 'inherit', marginBottom: 8 }} />
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={() => { setCommenting(null); setCommentText(''); }} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px', color: C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>Cancelar</button>
                <button onClick={() => updateStatus(ticket, st === 'visualizado' ? 'recebido' : st, commentText)} style={{ flex: 2, background: '#EF444422', border: '1px solid #EF444444', borderRadius: 8, padding: '8px', color: '#EF4444', fontSize: 11, fontWeight: 800, cursor: 'pointer' }}>🚑 Confirmar + Enviar</button>
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 6 }}>
              {st === 'visualizado' && <button onClick={() => updateStatus(ticket, 'recebido')} style={{ flex: 1, background: '#EF444422', border: '1px solid #EF444444', borderRadius: 8, padding: '8px', color: '#EF4444', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>🚑 Disponível / Recebido</button>}
              <button onClick={() => setCommenting(ticket.id)} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px', color: C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>💬 Comentar</button>
              {st === 'recebido' && <button onClick={() => updateStatus(ticket, 'concluido')} style={{ flex: 1, background: '#10B98122', border: '1px solid #10B98144', borderRadius: 8, padding: '8px', color: C.green, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>✓ Concluído</button>}
            </div>
          )}
        </div>
      );
    }

    // NSP/Gestor — outros tipos
    if (isNsp || isGestor) {
      return (
        <div style={{ marginTop: 8, display: 'flex', gap: 6 }}>
          <button onClick={() => updateStatus(ticket, 'em_andamento')} style={{ flex: 1, background: '#00C9B122', border: '1px solid #00C9B144', borderRadius: 8, padding: '8px', color: C.teal, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>▶ Em andamento</button>
          <button onClick={() => updateStatus(ticket, 'concluido')} style={{ flex: 1, background: '#10B98122', border: '1px solid #10B98144', borderRadius: 8, padding: '8px', color: C.green, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>✓ Concluído</button>
        </div>
      );
    }
    return null;
  };

  return (
    <div style={{ padding: '16px 16px 80px' }}>
      {/* Cabeçalho de perfil ativo */}
      {profile && (
        <div style={{ background: profile.color + '15', border: `1px solid ${profile.color}33`, borderRadius: 10, padding: '8px 12px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 16 }}>{profile.icon}</span>
          <span style={{ fontSize: 12, fontWeight: 700, color: profile.color }}>Painel {profile.label}</span>
          {profile.ticketFilter && <span style={{ fontSize: 11, color: C.muted }}>· apenas {profile.ticketFilter === 'manutencao' ? 'manutenção' : 'ambulância'}</span>}
          {isEnfermeiro && <span style={{ fontSize: 11, color: C.muted }}>· visualização</span>}
        </div>
      )}

      {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 16 }}>
        {[['aberto','Abertos',C.yellow],['em_andamento','Andamento',C.blue],['pendente','Pendentes/Vis.',C.red]].map(([id, label, color]) => (
          <div key={id} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 8px', textAlign: 'center' }}>
            <div style={{ fontSize: 22, fontWeight: 900, color }}>{counts[id] || 0}</div>
            <div style={{ fontSize: 9, color: C.muted, fontWeight: 700, textTransform: 'uppercase' }}>{label}</div>
          </div>
        ))}
      </div>

      {/* Filtros */}
      <div style={{ display: 'flex', gap: 6, overflowX: 'auto', marginBottom: 14, paddingBottom: 4 }}>
        {[['todos','Todos'],['aberto','Aberto'],['visualizado','Visualizado'],['recebido','Recebido'],['em_andamento','Andamento'],['concluido','Concluído']].map(([id, label]) => (
          <button key={id} onClick={() => setFilter(id)} style={{ flexShrink: 0, padding: '6px 12px', borderRadius: 16, border: 'none', background: filter === id ? C.teal : C.card, color: filter === id ? '#06101F' : C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>{label}</button>
        ))}
        <button onClick={load} style={{ flexShrink: 0, padding: '6px 12px', borderRadius: 16, border: `1px solid ${C.border}`, background: 'transparent', color: C.teal, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>↻</button>
      </div>

      {loading && <div style={{ textAlign: 'center', color: C.muted, padding: 32 }}>Carregando…</div>}
      {!loading && filtered.length === 0 && <div style={{ textAlign: 'center', color: C.muted, padding: 32 }}>Nenhum chamado{filter !== 'todos' ? ' com este filtro' : ''}.</div>}

      {filtered.map(ticket => {
        const tt = TICKET_TYPES.find(t => t.id === ticket.ticket_type) || TICKET_TYPES[5];
        const st = TICKET_STATUS[ticket.status] || TICKET_STATUS.aberto;
        const rt = getResponseTime(ticket);

        return (
          <div key={ticket.id} style={{ background: C.card, border: `1px solid ${ticket.status === 'aberto' ? '#F59E0B55' : C.border}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 8 }}>
              <div style={{ width: 40, height: 40, borderRadius: 10, background: tt.color + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{tt.icon}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{tt.label}</div>
                  <div style={{ background: st.bg, color: st.color, borderRadius: 6, padding: '2px 8px', fontSize: 10, fontWeight: 700, flexShrink: 0 }}>{st.label}</div>
                </div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{ticket.origin_sector} → {tt.dest} · {formatTime(ticket.opened_at)}</div>
                {ticket.requester_name && <div style={{ fontSize: 11, color: C.teal, marginTop: 2 }}>👤 {ticket.requester_name}</div>}
                {ticket.priority === 'critico' && <div style={{ display: 'inline-block', background: C.red + '22', color: C.red, borderRadius: 4, padding: '1px 6px', fontSize: 9, fontWeight: 700, marginTop: 3 }}>🔴 CRÍTICO</div>}
                {ticket.priority === 'urgente' && <div style={{ display: 'inline-block', background: C.yellow + '22', color: C.yellow, borderRadius: 4, padding: '1px 6px', fontSize: 9, fontWeight: 700, marginTop: 3 }}>🟡 URGENTE</div>}
              </div>
            </div>

            <div style={{ fontSize: 13, color: C.text, lineHeight: 1.5, marginBottom: 8 }}>{ticket.description}</div>

            {ticket.patient_name && <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>🧑‍⚕️ Paciente: {ticket.patient_name}</div>}
            {ticket.destination_sector && ticket.ticket_type === 'ambulancia' && <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>🏥 Destino: {ticket.destination_sector}</div>}
            {ticket.viewed_at && <div style={{ fontSize: 10, color: '#8B5CF6', marginBottom: 4 }}>👁 Visualizado {formatTime(ticket.viewed_at)}</div>}
            {rt && <div style={{ fontSize: 11, color: C.green, marginBottom: 4 }}>⏱ Tempo de resposta: {rt}</div>}

            {ticket.response_notes && (
              <div style={{ background: C.surface, borderRadius: 8, padding: '8px 10px', marginBottom: 8, borderLeft: `3px solid ${ticket.ticket_type === 'ambulancia' ? '#EF4444' : C.green}` }}>
                <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, marginBottom: 2 }}>{ticket.ticket_type === 'ambulancia' ? '🚑 MOTORISTA:' : '🔧 DSG:'}</div>
                <div style={{ fontSize: 12, color: C.text }}>{ticket.response_notes}</div>
              </div>
            )}

            {renderActions(ticket)}
          </div>
        );
      })}
    </div>
  );
}

// ─── ADMIN PANEL ──────────────────────────────────────────────────────────────
function AdminPanel({ sbUrl, sbKey, nspEmail, testMode, webhookUrl, onSaveEmail, onToggleTestMode, onSaveWebhook, showToast }) {
  const [email, setEmail] = useState(nspEmail);
  const [webhook, setWebhook] = useState(webhookUrl);
  const [notifications, setNotifications] = useState([]);
  const [loading, setLoading] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const [filterTest, setFilterTest] = useState('all');

  const loadNotifications = async () => {
    if (!sbUrl || !sbKey) return;
    setLoading(true);
    try {
      const data = await sbSelect(sbUrl, sbKey, 'notifications', 'select=*&order=created_at.desc');
      setNotifications(data);
    } catch { showToast('Erro ao carregar notificações', 'error'); }
    setLoading(false);
  };

  useEffect(() => { loadNotifications(); }, [sbUrl, sbKey]);

  const handleDelete = async (id) => {
    if (!confirm('Excluir esta notificação? Esta ação não pode ser desfeita.')) return;
    setDeleting(id);
    try {
      await sbReq(sbUrl, sbKey, `/notifications?id=eq.${id}`, { method: 'DELETE' });
      setNotifications(notifications.filter(n => n.id !== id));
      showToast('✅ Notificação excluída', 'success');
    } catch { showToast('Erro ao excluir', 'error'); }
    setDeleting(null);
  };

  const handleClearTests = async () => {
    if (!confirmClear) { setConfirmClear(true); setTimeout(() => setConfirmClear(false), 3000); return; }
    try {
      await sbReq(sbUrl, sbKey, `/notifications?is_test=eq.true`, { method: 'DELETE' });
      setNotifications(notifications.filter(n => !n.is_test));
      showToast('✅ Todas as notificações de teste foram excluídas', 'success');
      setConfirmClear(false);
    } catch { showToast('Erro ao limpar testes', 'error'); }
  };

  const filtered = notifications.filter(n => {
    if (filterTest === 'test') return n.is_test;
    if (filterTest === 'prod') return !n.is_test;
    return true;
  });

  const testCount = notifications.filter(n => n.is_test).length;

  const inp = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '11px 14px', color: C.text, fontSize: 13, outline: 'none', width: '100%' };
  const lbl = { fontSize: 11, color: C.muted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', display: 'block', marginBottom: 6 };

  return (
    <div style={{ padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div>
        <div style={{ fontSize: 17, fontWeight: 900, color: C.text }}>Administração NSP</div>
        <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>Painel exclusivo do gestor</div>
      </div>

      {/* MODO TESTE / PRODUÇÃO */}
      <div style={{ background: testMode ? C.yellow + '18' : C.green + '18', border: `1px solid ${testMode ? C.yellow + '55' : C.green + '55'}`, borderRadius: 14, padding: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 800, color: testMode ? C.yellow : C.green }}>
              {testMode ? '🧪 MODO TESTE ativado' : '✅ MODO PRODUÇÃO ativado'}
            </div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 3, lineHeight: 1.5 }}>
              {testMode 
                ? 'Notificações estão sendo marcadas como teste. Você pode excluí-las em lote depois.'
                : 'Notificações são tratadas como reais. E-mails serão enviados ao destino configurado.'}
            </div>
          </div>
          <button onClick={onToggleTestMode} style={{ background: testMode ? C.yellow : C.green, border: 'none', borderRadius: 999, padding: '8px 14px', color: '#06101F', fontWeight: 800, fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap' }}>
            {testMode ? 'Ativar Produção' : 'Ativar Teste'}
          </button>
        </div>
      </div>

      {/* E-MAIL DESTINO */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>📧 E-mail de destino</div>
        <div style={{ fontSize: 11, color: C.muted, marginBottom: 12 }}>Todas as notificações confirmadas serão enviadas para este e-mail.</div>
        <label style={lbl}>E-mail do NSP</label>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="hnsa.nsp@marinha.mil.br" style={{ ...inp, marginBottom: 10 }} />
        <button onClick={() => { onSaveEmail(email.trim()); showToast('✅ E-mail atualizado', 'success'); }} style={{ width: '100%', background: C.teal, border: 'none', borderRadius: 10, padding: '11px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
          Salvar e-mail
        </button>
      </div>

      {/* WEBHOOK */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>🔗 Webhook (n8n / Make)</div>
        <div style={{ fontSize: 11, color: C.muted, marginBottom: 12 }}>URL que receberá os dados da notificação para envio do e-mail.</div>
        <label style={lbl}>Webhook URL</label>
        <input value={webhook} onChange={e => setWebhook(e.target.value)} placeholder="https://seu-n8n.app/webhook/notificaai" style={{ ...inp, marginBottom: 10, fontFamily: 'monospace', fontSize: 11 }} />
        <button onClick={() => { onSaveWebhook(webhook.trim()); showToast('✅ Webhook atualizado', 'success'); }} style={{ width: '100%', background: C.teal, border: 'none', borderRadius: 10, padding: '11px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
          Salvar webhook
        </button>
      </div>

      {/* GERENCIAR NOTIFICAÇÕES */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>📋 Gerenciar notificações</div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{notifications.length} total · {testCount} de teste</div>
          </div>
          <button onClick={loadNotifications} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: '5px 10px', color: C.teal, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>↻</button>
        </div>

        {/* Filtros */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {[['all','Todas',notifications.length],['test','Teste',testCount],['prod','Produção',notifications.length-testCount]].map(([id, label, count]) => (
            <button key={id} onClick={() => setFilterTest(id)} style={{ flex: 1, padding: '6px 8px', borderRadius: 8, border: 'none', background: filterTest === id ? C.teal : C.surface, color: filterTest === id ? '#06101F' : C.muted, fontSize: 10, fontWeight: 700, cursor: 'pointer' }}>
              {label} ({count})
            </button>
          ))}
        </div>

        {/* Botão Limpar Testes */}
        {testCount > 0 && (
          <button onClick={handleClearTests} style={{ width: '100%', background: confirmClear ? C.red : C.red + '22', border: `1px solid ${C.red}55`, borderRadius: 10, padding: '10px', color: confirmClear ? '#fff' : C.red, fontWeight: 700, fontSize: 12, cursor: 'pointer', marginBottom: 12 }}>
            {confirmClear ? '⚠️ CLIQUE NOVAMENTE para confirmar exclusão de todas as ' + testCount + ' notificações de teste' : `🗑️ Limpar todas as ${testCount} notificações de teste`}
          </button>
        )}

        {/* Lista */}
        {loading && <div style={{ textAlign: 'center', color: C.muted, fontSize: 12, padding: 20 }}>Carregando…</div>}
        {!loading && filtered.length === 0 && <div style={{ textAlign: 'center', color: C.muted, fontSize: 12, padding: 20 }}>Nenhuma notificação</div>}
        {filtered.map(n => {
          const tag = getTag(n); const title = getTitle(n);
          return (
            <div key={n.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 12px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ background: tag.color + '22', color: tag.color, borderRadius: 5, padding: '2px 6px', fontSize: 9, fontWeight: 700, minWidth: 38, textAlign: 'center' }}>{tag.label}</div>
              {n.is_test && <div style={{ background: C.yellow + '22', color: C.yellow, borderRadius: 5, padding: '2px 6px', fontSize: 9, fontWeight: 700 }}>TESTE</div>}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.text, textTransform: 'capitalize', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{title}</div>
                <div style={{ fontSize: 10, color: C.muted }}>{n.sector} · {formatTime(n.created_at)}</div>
              </div>
              <button onClick={() => handleDelete(n.id)} disabled={deleting === n.id} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 6, display: 'flex' }}>
                <IconTrash size={14} color={deleting === n.id ? C.muted : C.red} />
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PinModal({ onSuccess, onClose }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  const check = () => {
    const matched = Object.entries(PROFILES).find(([, p]) => p.pin === pin);
    if (matched) {
      onSuccess(matched[0]); // passa a chave do perfil ex: 'dsg', 'nsp'
    } else {
      setError(true); setPin(''); setTimeout(() => setError(false), 1200);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: '#000c', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div style={{ background: C.surface, borderRadius: 20, padding: '32px 24px', width: '100%', maxWidth: 320, border: `1px solid ${error ? C.red : C.border}`, transition: 'border-color 0.3s', textAlign: 'center' }}>
        <div style={{ fontSize: 36, marginBottom: 12 }}>🔐</div>
        <div style={{ fontSize: 16, fontWeight: 800, color: C.text, marginBottom: 6 }}>Área Restrita</div>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 20 }}>NSP · DSG · Motorista · Enfermeiro · Gestor</div>
        {/* Hint dos perfis */}
        <div style={{ display: 'flex', gap: 6, justifyContent: 'center', flexWrap: 'wrap', marginBottom: 20 }}>
          {Object.entries(PROFILES).map(([key, p]) => (
            <div key={key} style={{ background: p.color + '15', border: `1px solid ${p.color}33`, borderRadius: 6, padding: '3px 8px', fontSize: 10, color: p.color, fontWeight: 700 }}>{p.icon} {p.label}</div>
          ))}
        </div>
        <input
          ref={inputRef}
          type="password"
          value={pin}
          onChange={e => setPin(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && check()}
          placeholder="••••"
          maxLength={8}
          style={{ width: '100%', background: C.card, border: `1px solid ${error ? C.red : C.border}`, borderRadius: 12, padding: '14px', color: C.text, fontSize: 24, textAlign: 'center', letterSpacing: '0.4em', outline: 'none', marginBottom: 8 }}
        />
        {error && <div style={{ fontSize: 12, color: C.red, marginBottom: 8 }}>PIN incorreto. Tente novamente.</div>}
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          <button onClick={onClose} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '12px', color: C.muted, fontWeight: 600, fontSize: 13, cursor: 'pointer' }}>Cancelar</button>
          <button onClick={check} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 10, padding: '12px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>Entrar</button>
        </div>
      </div>
    </div>
  );
}

function NotificaAI() {
  const [view, setView] = useState('notificar');
  const [splash, setSplash] = useState(true);
  const [splashLeaving, setSplashLeaving] = useState(false);
  const [sbUrl, setSbUrl] = useState('');
  const [sbKey, setSbKey] = useState('');
  const [webhookUrl, setWebhookUrl] = useState('');
  const [showConfig, setShowConfig] = useState(false);
  const [toast, setToast] = useState(null);
  const [nspMode, setNspMode] = useState(false);
  const [profileMode, setProfileMode] = useState(null); // null | 'nsp' | 'dsg' | 'motorista' | 'enfermeiro' | 'gestor'
  const [nspPin, setNspPin] = useState('');
  const [showPinModal, setShowPinModal] = useState(false);

  const [nspEmail, setNspEmail] = useState('');
  const [testMode, setTestMode] = useState(true);
  const [hospital, setHospital] = useState(DEFAULT_HOSPITAL);
  const hospitalId = getHospitalIdFromUrl();

  useEffect(() => {
    const splashTimer = setTimeout(() => {
      setSplashLeaving(true);
      setTimeout(() => setSplash(false), 420);
    }, 1500);

    (async () => {
      try {
        const r = await window.storage.get('notificai-sb');
        if (r?.value) { 
          const c = JSON.parse(r.value); 
          setSbUrl(c.url||''); 
          setSbKey(c.key||''); 
          setWebhookUrl(c.webhook||''); 
          setNspPin(c.pin||''); 
          setNspEmail(c.email||'');
          setTestMode(c.testMode !== undefined ? c.testMode : true);
          const hId = getHospitalIdFromUrl() || c.defaultHospital || 'hnsa';
          const h = await loadHospital(c.url||'', c.key||'', hId);
          setHospital(h);
        }
      } catch {}
    })();

    return () => clearTimeout(splashTimer);
  }, []);

  const handleSaveConfig = async (url, key, webhook, pin) => {
    setSbUrl(url); setSbKey(key); setWebhookUrl(webhook); setNspPin(pin);
    try { await window.storage.set('notificai-sb', JSON.stringify({ url, key, webhook, pin, email: nspEmail, testMode })); } catch {}
    setShowConfig(false);
    showToast('✅ Supabase configurado com sucesso!', 'success');
  };

  const saveAll = async (overrides = {}) => {
    const data = { url: sbUrl, key: sbKey, webhook: webhookUrl, pin: nspPin, email: nspEmail, testMode, ...overrides };
    try { await window.storage.set('notificai-sb', JSON.stringify(data)); } catch {}
  };

  const handleSaveEmail = (email) => { setNspEmail(email); saveAll({ email }); };
  const handleToggleTestMode = () => { 
    const nv = !testMode; 
    setTestMode(nv); 
    saveAll({ testMode: nv });
    showToast(nv ? '🧪 Modo TESTE ativado' : '✅ Modo PRODUÇÃO ativado', 'success');
  };
  const handleSaveWebhook = (webhook) => { setWebhookUrl(webhook); saveAll({ webhook }); };

  const showToast = (msg, type = 'success') => {
    setToast({ msg, type, id: Date.now() });
    setTimeout(() => setToast(null), 4500);
  };

  const publicTabs = [
    { id: 'notificar', label: 'Notificar', icon: IconMessageSquare },
    { id: 'chamados', label: 'Chamados', icon: IconTool },
    { id: 'central', label: 'Central', icon: IconBookOpen },
  ];
  const nspTabs = [
    { id: 'home', label: 'Painel', icon: IconHome },
    { id: 'chamados', label: 'Chamados', icon: IconTool },
    { id: 'analytics', label: 'Analytics', icon: IconBarChart2 },
    { id: 'admin', label: 'Admin', icon: IconShield },
    { id: 'central', label: 'Central', icon: IconBookOpen },
  ];
  const gestorTabs = [
    { id: 'home', label: 'Painel', icon: IconHome },
    { id: 'chamados', label: 'Chamados', icon: IconTool },
    { id: 'analytics', label: 'Analytics', icon: IconBarChart2 },
    { id: 'admin', label: 'Admin', icon: IconShield },
    { id: 'central', label: 'Central', icon: IconBookOpen },
  ];
  const tabs = profileMode === 'gestor' ? gestorTabs : nspMode ? nspTabs : publicTabs;

  return (
    <>
      {splash && <SplashScreen leaving={splashLeaving} />}
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#06101F}
        @keyframes pulse{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-5px);opacity:1}}
        input::placeholder{color:#5A7AA0}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-thumb{background:#1A3060;border-radius:2px}
        button:active{opacity:.85}
      `}</style>
      <div style={{ background: C.bg, minHeight: '100vh', maxWidth: 480, margin: '0 auto', display: 'flex', flexDirection: 'column', color: C.text, fontFamily: 'system-ui,-apple-system,sans-serif' }}>
        {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
        {showPinModal && <PinModal onSuccess={(role) => { setProfileMode(role); setNspMode(role === 'nsp' || role === 'gestor'); setShowPinModal(false); setView(role === 'dsg' || role === 'motorista' || role === 'enfermeiro' ? 'chamados' : 'home'); }} onClose={() => setShowPinModal(false)} />}
        {showConfig && <ConfigPanel sbUrl={sbUrl} sbKey={sbKey} webhookUrl={webhookUrl} nspPin={nspPin} onSave={handleSaveConfig} onClose={() => setShowConfig(false)} />}

        <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 68 }}>
          {view === 'home'      && <HomeView      setView={setView} sbUrl={sbUrl} sbKey={sbKey} onConfig={() => setShowConfig(true)} showToast={showToast} nspMode={nspMode} testMode={testMode} hospital={hospital} />}
          {view === 'notificar' && <NotificarView sbUrl={sbUrl} sbKey={sbKey} webhookUrl={webhookUrl} nspEmail={nspEmail} testMode={testMode} showToast={showToast} hospital={hospital} />}
          {view === 'chamados'  && <TicketsView sbUrl={sbUrl} sbKey={sbKey} hospital={hospital} showToast={showToast} profileMode={profileMode} />}
          {view === 'analytics' && <AnalyticsView sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} profileMode={profileMode} hospital={hospital} />}
          {view === 'admin'     && <AdminPanel sbUrl={sbUrl} sbKey={sbKey} nspEmail={nspEmail} testMode={testMode} webhookUrl={webhookUrl} onSaveEmail={handleSaveEmail} onToggleTestMode={handleToggleTestMode} onSaveWebhook={handleSaveWebhook} showToast={showToast} />}
          {view === 'central'   && <CentralView sbUrl={sbUrl} sbKey={sbKey} hospital={hospital} profileMode={profileMode} />}
        </div>
        <div style={{ position: 'fixed', bottom: 0, left: '50%', transform: 'translateX(-50%)', width: '100%', maxWidth: 480, background: C.surface, borderTop: `1px solid ${C.border}`, display: 'flex', paddingBottom: 8, paddingTop: 8, zIndex: 100 }}>
          {tabs.map(({ id, label, icon: Icon }) => {
            const active = view === id;
            return (
              <button key={id} onClick={() => setView(id)} style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: active ? C.teal : C.muted, padding: '4px 0' }}>
                <Icon size={22} strokeWidth={active ? 2.5 : 1.8} />
                <span style={{ fontSize: 10, fontWeight: active ? 700 : 400 }}>{label}</span>
              </button>
            );
          })}
          {!profileMode ? (
            <button onClick={() => setShowPinModal(true)} style={{ flex: 0, padding: '4px 10px', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: C.muted }}>
              <span style={{ fontSize: 18 }}>🔒</span>
              <span style={{ fontSize: 10 }}>Login</span>
            </button>
          ) : (
            <button onClick={() => { setProfileMode(null); setNspMode(false); setView('notificar'); }} style={{ flex: 0, padding: '4px 10px', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, color: PROFILES[profileMode]?.color || C.teal }}>
              <span style={{ fontSize: 18 }}>{PROFILES[profileMode]?.icon || '🔓'}</span>
              <span style={{ fontSize: 10, fontWeight: 700 }}>{PROFILES[profileMode]?.label || 'Sair'}</span>
            </button>
          )}

        </div>
      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NotificaAI />);
</script>
</body>
</html>
