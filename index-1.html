- Uma pergunta por vez.
- NUNCA deduza informação não declarada. Registre as palavras exatas do usuário.

// ─── SUPABASE HELPERS ──────────────────────────────────────────────────────────
async function sbReq(url, key, path, options = {}) {
  const res = await fetch(`${url}/rest/v1${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      apikey: key, Authorization: `Bearer ${key}`, Prefer: 'return=representation',
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}
const sbInsert = (u, k, table, data) => sbReq(u, k, `/${table}`, { method: 'POST', body: JSON.stringify(data) });
const sbSelect = (u, k, table, q = '') => sbReq(u, k, `/${table}?${q}`);

// ─── AI HELPER ─────────────────────────────────────────────────────────────────
async function callClaude(messages, system) {
  const WORKER_URL = 'https://notificaai-proxy.janan-almeida.workers.dev';

  // Convert to OpenAI format — skip leading assistant messages (Groq requires user first)
  const converted = messages.map(m => ({
    role: m.role === 'assistant' ? 'assistant' : 'user',
    content: m.content
  }));

  // Find first user message index
  const firstUser = converted.findIndex(m => m.role === 'user');
  const filtered = firstUser >= 0 ? converted.slice(firstUser) : converted;

  const msgs = [];
  if (system) msgs.push({ role: 'system', content: system });
  filtered.forEach(m => msgs.push(m));

  if (msgs.length === 0 || (msgs.length === 1 && msgs[0].role === 'system')) {
    return 'Olá! Como posso ajudá-lo?';
  }

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: msgs }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.choices?.[0]?.message?.content || 'Erro ao processar. Tente novamente.';
  } catch(e) {
    console.error('Worker error:', e);
    return 'Erro ao processar. Tente novamente.';
  }
}

async function extractData(chatMessages, hospital) {
  const msgs = [...chatMessages, { role: 'user', content: 'Extraia os dados no formato JSON.' }];
  const text = await callClaude(msgs, EXTRACT_SYSTEM);
  try { 
    const parsed = JSON.parse(text.replace(/```json|```/g, '').trim()); 
    if (hospital) parsed.hospital_id = hospital.id;
    return parsed;
  }
  catch { return null; }
}

function computeStats(notifications) {
  const now = new Date();
  const thisMonth = now.getMonth();
  const thisYear = now.getFullYear();
  const prevMonth = thisMonth === 0 ? 11 : thisMonth - 1;
  const prevYear = thisMonth === 0 ? thisYear - 1 : thisYear;

  const isThisMonth = n => { const d = new Date(n.created_at); return d.getMonth() === thisMonth && d.getFullYear() === thisYear; };
  const isPrevMonth = n => { const d = new Date(n.created_at); return d.getMonth() === prevMonth && d.getFullYear() === prevYear; };

  const thisM = notifications.filter(isThisMonth);
  const prevM = notifications.filter(isPrevMonth);

  const total = thisM.length;
  const totalAll = notifications.length;
  const totalPrev = prevM.length;
  const sp = thisM.filter(n => n.notification_type === 'seguranca_paciente').length;
  const ccih = thisM.filter(n => n.notification_type === 'ccih').length;
  const adm = thisM.filter(n => n.notification_type === 'administrativa').length;
  const spPrev = prevM.filter(n => n.notification_type === 'seguranca_paciente').length;
  const admPrev = prevM.filter(n => n.notification_type === 'administrativa').length;

  const sectorMap = {};
  notifications.forEach(n => { if (n.sector) sectorMap[n.sector] = (sectorMap[n.sector] || 0) + 1; });
  const sectorData = Object.entries(sectorMap).sort((a,b) => b[1]-a[1]).slice(0,6)
    .map(([k, v]) => ({ setor: k === 'Centro Cirúrgico' ? 'CC' : k, eventos: v }));

  const typeMap = {};
  notifications.forEach(n => {
    const t = n.event_subtype || n.occurrence_subtype || 'outros';
    const l = t.charAt(0).toUpperCase() + t.slice(1);
    typeMap[l] = (typeMap[l] || 0) + 1;
  });
  const typeColors = [C.red, C.yellow, C.purple, C.blue, C.green, C.muted];
  const typeData = Object.entries(typeMap).sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([name, value], i) => ({ name, value, color: typeColors[i] }));

  const TURNOS = ['Manhã', 'Tarde', 'Noite'];
  const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const heatmap = TURNOS.map(turno => ({ turno, v: [0,0,0,0,0,0,0] }));
  notifications.forEach(n => {
    if (!n.event_date || !n.shift) return;
    const day = new Date(n.event_date + 'T12:00:00').getDay();
    const si = TURNOS.indexOf(n.shift);
    if (si >= 0) heatmap[si].v[day]++;
  });

  // Calcular pico real do heatmap
  let peakVal = 0, peakTurno = '', peakDia = '';
  heatmap.forEach(row => {
    row.v.forEach((val, di) => {
      if (val > peakVal) { peakVal = val; peakTurno = row.turno; peakDia = DIAS[di]; }
    });
  });
  const heatmapPeak = peakVal > 0
    ? { turno: peakTurno, dia: peakDia, val: peakVal }
    : null;

  const mMap = {};
  notifications.forEach(n => {
    const d = new Date(n.created_at);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('pt-BR', { month: 'short' });
    if (!mMap[k]) mMap[k] = { mes: label, sp: 0, adm: 0, ccih: 0 };
    if (n.notification_type === 'seguranca_paciente') mMap[k].sp++;
    else if (n.notification_type === 'ccih') mMap[k].ccih++;
    else mMap[k].adm++;
  });
  const monthly = Object.entries(mMap).sort(([a],[b]) => a.localeCompare(b)).slice(-6).map(([,v]) => v);

  const critSector = sectorData.reduce((m, s) => s.eventos > m.eventos ? s : m, sectorData[0] || { setor: 'Ala A', eventos: 0 });
  return { total, totalAll, totalPrev, sp, ccih, adm, spPrev, admPrev, sectorData, typeData, heatmap, heatmapPeak, monthly, critSector };
}

function formatTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 3600000) return `${Math.floor(diff / 60000)}min`;
  if (diff < 86400000) return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return 'ontem';
}
function getTag(n) {
  if (n.notification_type === 'seguranca_paciente') return { label: 'SP', color: C.red };
  if (n.notification_type === 'ccih') return { label: 'CCIH', color: C.yellow };
  return { label: 'ADM', color: C.purple };
}
function getTitle(n) {
  return n.event_subtype || n.occurrence_subtype || n.infection_topography || (n.description || '').slice(0, 28) || 'Notificação';
}
function md(t) {
  return t.replace(/\*\*(.*?)\*\*/g, `<strong style="color:${C.teal}">$1</strong>`).replace(/\n/g, '<br/>');
}

// ─── NOTIFICAR VIEW ────────────────────────────────────────────────────────────
function NotificarView({ sbUrl, sbKey, webhookUrl, nspEmail, testMode, showToast, hospital }) {
  const [notifierType, setNotifierType] = useState(null);
  const [messages, setMessages] = useState([
    { role: 'assistant', content: 'Olá! Pode me contar o que aconteceu?', quickReplies: ['Sou profissional de saúde', 'Sou paciente', 'Sou familiar / acompanhante'] }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);
  const [quickReplies, setQuickReplies] = useState([]);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, loading]);

  const lastAi = messages.filter(m => m.role === 'assistant').slice(-1)[0]?.content || '';
  const showConfirm = !done && (
    lastAi.toLowerCase().includes('posso confirmar') ||
    lastAi.toLowerCase().includes('confirmar o envio') ||
    lastAi.toLowerCase().includes('enviar esta notificação')
  );

  const send = async (override) => {
    const msg = override || input;
    if (!msg.trim() || loading || saving) return;

    // Detect notifier type from first user message
    let currentType = notifierType;
    if (!currentType) {
      const lower = msg.toLowerCase();
      if (lower.includes('profissional') || lower.includes('saúde') || lower.includes('enfermeiro') || lower.includes('médico') || lower.includes('técnico')) {
        currentType = 'profissional';
      } else if (lower.includes('paciente')) {
        currentType = 'paciente';
      } else if (lower.includes('familiar') || lower.includes('acompanhante')) {
        currentType = 'familiar';
      }
      if (currentType) setNotifierType(currentType);
    }

    const next = [...messages, { role: 'user', content: msg }];
    setMessages(next);
    setInput('');
    setQuickReplies([]);
    setLoading(true);
    try {
      const cleanMsgs = next.map(m => ({ role: m.role, content: m.content }));
      const reply = await callClaude(cleanMsgs, buildChatSystem(hospital, currentType));

      // Parse quick replies from reply if it contains options
      const qr = parseQuickReplies(reply, next.length, hospital, currentType);
      const cleanReply = reply.replace(/\[opcoes:.*?\]/g, '').trim();
      setMessages(p => [...p, { role: 'assistant', content: cleanReply }]);
      setQuickReplies(qr);
    } catch {
      setMessages(p => [...p, { role: 'assistant', content: 'Erro de conexão. Tente novamente.' }]);
    }
    setLoading(false);
  };

  function parseQuickReplies(reply, msgCount, hospital, notifierType) {
    const r = reply.toLowerCase();
    const h = hospital || DEFAULT_HOSPITAL;
    // Setor
    if (r.includes('setor') || r.includes('ala') || r.includes('upg') || r.includes('unidade')) {
      return h.sectors.map(s => SECTOR_LABELS[s] || s);
    }
    // Turno
    if (r.includes('turno') && !r.includes('noite') && !r.includes('manhã')) {
      return ['Manhã (07h–13h)', 'Tarde (13h–19h)', 'Noite (19h–07h)'];
    }
    // Tipo de evento SP
    if ((r.includes('tipo') || r.includes('evento') || r.includes('ocorr')) && notifierType === 'profissional') {
      if (r.includes('segurança') || r.includes('sp') || r.includes('paciente')) {
        return ['Queda', 'Erro de medicação', 'Identificação incorreta', 'Evento cirúrgico', 'Lesão por pressão', 'Outro'];
      }
      if (r.includes('ccih') || r.includes('infecção')) {
        return ['ITU (sonda vesical)', 'IPCS (cateter)', 'PAV (ventilação)', 'ISC (cirurgia)', 'Outro'];
      }
    }
    // Desfecho
    if (r.includes('desfecho') || r.includes('resultado') || r.includes('como ficou')) {
      return ['Sem dano', 'Dano leve', 'Dano moderado', 'Dano grave', 'Óbito'];
    }
    // Evitável
    if (r.includes('evitável') || r.includes('evitado') || r.includes('prevenível')) {
      return ['Sim, era evitável', 'Não era evitável', 'Não sei avaliar'];
    }
    // Confirmação
    if (r.includes('confirmar') || r.includes('envio') || r.includes('registrar')) {
      return [];
    }
    return [];
  }

  const handleConfirm = async () => {
    setSaving(true);
    setMessages(p => [...p, { role: 'user', content: 'Sim, pode confirmar e enviar.' }]);
    try {
      const data = await extractData(messages.map(m => ({ role: m.role, content: m.content })), hospital);
      if (!data) throw new Error('Falha na extração');
      let protocolo = '';
      if (sbUrl && sbKey) {
        const res = await sbInsert(sbUrl, sbKey, 'notifications', { ...data, chat_history: messages });
        protocolo = res?.[0]?.id ? res[0].id.slice(0,8).toUpperCase() : Math.random().toString(36).slice(2,10).toUpperCase();
        showToast('✅ Notificação salva! NSP será notificado.', 'success');
      } else {
        protocolo = Math.random().toString(36).slice(2,10).toUpperCase();
        showToast('✅ Notificação registrada! Configure o Supabase para persistir.', 'success');
      }
      setDone(true);
      setMessages(p => [...p, { role: 'assistant', content: `✅ **Notificação enviada com sucesso!**\n\n📋 **Protocolo: ${protocolo}**\n\nGuarde este número caso precise referenciar este registro. O NSP foi notificado.\n\nObrigado por contribuir com a segurança do HNSA.` }]);
    } catch {
      showToast('Erro ao salvar. Verifique a conexão e tente novamente.', 'error');
    }
    setSaving(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 64px)' }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}`, background: C.surface }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.text }}>Registrar Notificação</div>
        <div style={{ fontSize: 11, color: C.muted }}>HNSA · NSP · Canal seguro</div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
            <div style={{ maxWidth: '84%', background: m.role === 'user' ? `linear-gradient(135deg, ${C.teal}, ${C.blue})` : C.card, border: m.role === 'assistant' ? `1px solid ${C.border}` : 'none', borderRadius: m.role === 'user' ? '16px 16px 4px 16px' : '16px 16px 16px 4px', padding: '11px 14px', fontSize: 14, color: C.text, lineHeight: 1.65 }}
              dangerouslySetInnerHTML={{ __html: md(m.content) }} />
          </div>
        ))}
        {(loading || saving) && (
          <div style={{ display: 'flex' }}>
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: '16px 16px 16px 4px', padding: '13px 16px' }}>
              <div style={{ display: 'flex', gap: 5 }}>
                {[0,1,2].map(i => <div key={i} style={{ width: 7, height: 7, borderRadius: '50%', background: saving ? C.green : C.teal, animation: `pulse 1.2s ${i*0.2}s ease-in-out infinite` }} />)}
              </div>
            </div>
          </div>
        )}
        {showConfirm && !loading && (
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button onClick={handleConfirm} disabled={saving} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 12, padding: '13px', color: '#06101F', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
              {saving ? '⏳ Salvando…' : '✅ Confirmar e Enviar'}
            </button>
            <button onClick={() => send('Quero corrigir algumas informações antes de enviar.')} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: '13px', color: C.muted, fontWeight: 600, fontSize: 12, cursor: 'pointer' }}>
              ✏️ Corrigir
            </button>
          </div>
        )}
        <div ref={endRef} />
      </div>
      {!done && (
        <div style={{ borderTop: `1px solid ${C.border}`, background: C.surface }}>
          {/* Quick reply chips */}
          {quickReplies.length > 0 && !loading && (
            <div style={{ padding: '10px 14px 4px', display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {quickReplies.map((r, i) => (
                <button key={i} onClick={() => { send(r); }} style={{ background: C.card, border: `1px solid ${C.teal}55`, borderRadius: 20, padding: '7px 14px', color: C.teal, fontSize: 13, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
                  {r}
                </button>
              ))}
            </div>
          )}
          <div style={{ padding: '8px 14px 12px', display: 'flex', gap: 10 }}>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()} placeholder={quickReplies.length > 0 ? 'Ou escreva…' : 'Escreva aqui…'} style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 22, padding: '10px 16px', color: C.text, fontSize: 14, outline: 'none' }} />
            <button onClick={() => send()} disabled={loading || !input.trim()} style={{ width: 44, height: 44, borderRadius: '50%', border: 'none', background: input.trim() ? C.teal : C.border, cursor: input.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <IconSend size={17} color={input.trim() ? '#06101F' : C.muted} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

              <div style={{ fontSize: 11, color: C.muted, marginBottom: 10, fontStyle: 'italic' }}>Gerado por IA — revisar antes de publicação oficial</div>
              <div style={{ fontSize: 13, color: C.text, lineHeight: 1.85, whiteSpace: 'pre-wrap' }}>{narrative}</div>
            </div>
          )}
        </div>
      )}

      {tab === 'relatorio' && (() => {
        const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        const anos = [...new Set(rawData.map(n => new Date(n.created_at).getFullYear()))].sort((a,b) => b-a);
        if (!anos.includes(filterYear) && anos.length > 0) anos.unshift(filterYear);

        // Totais por mês do ano selecionado
        const byMonth = Array.from({length:12}, (_,i) => {
          const items = rawData.filter(n => {
            const d = new Date(n.created_at);
            return d.getFullYear() === filterYear && d.getMonth() === i;
          });
          return { mes: MESES[i], total: items.length, sp: items.filter(n=>n.notification_type==='seguranca_paciente').length, ccih: items.filter(n=>n.notification_type==='ccih').length, adm: items.filter(n=>n.notification_type==='administrativa').length };
        });
        const totalAno = byMonth.reduce((acc,m) => acc + m.total, 0);

        // Dados filtrados para a listagem
        const filtered = rawData.filter(n => {
          const d = new Date(n.created_at);
          if (d.getFullYear() !== filterYear) return false;
          if (filterMonth !== 0 && d.getMonth() !== filterMonth - 1) return false;
          return true;
        });

        // Exportar CSV
        const exportCSV = () => {
          const header = ['ID','Data','Hora','Tipo','Subtipo','Setor','Turno','Descrição','Medidas','Desfecho','Prevenível','Resumo IA'];
          const rows = filtered.map(n => [
            n.id?.slice(0,8) || '',
            n.event_date || new Date(n.created_at).toLocaleDateString('pt-BR'),
            n.event_time || '',
            n.notification_type || '',
            n.event_subtype || '',
            n.sector || '',
            n.shift || '',
            (n.description || '').replace(/"/g,'""'),
            (n.measures_taken || '').replace(/"/g,'""'),
            n.patient_outcome || '',
            n.was_preventable || '',
            (n.ai_summary || '').replace(/"/g,'""'),
          ]);
          const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
          const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `notificacoes_hnsa_${filterYear}${filterMonth>0?'_'+String(filterMonth).padStart(2,'0'):''}.csv`;
          a.click(); URL.revokeObjectURL(url);
        };

        const TYPE_LABEL = { seguranca_paciente:'Seg. Paciente', ccih:'CCIH', administrativa:'Administrativa' };
        const TYPE_COLOR = { seguranca_paciente: C.red, ccih: C.purple, administrativa: C.blue };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

            {/* Filtros */}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <select value={filterYear} onChange={e => { setFilterYear(Number(e.target.value)); setFilterMonth(0); }}
                style={{ flex: 1, minWidth: 80, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 10px', color: C.text, fontSize: 12, outline: 'none' }}>
                {(anos.length ? anos : [new Date().getFullYear()]).map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <select value={filterMonth} onChange={e => setFilterMonth(Number(e.target.value))}
                style={{ flex: 2, background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: '8px 10px', color: C.text, fontSize: 12, outline: 'none' }}>
                <option value={0}>Todos os meses</option>
                {MESES.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
              </select>
              <button onClick={exportCSV} disabled={filtered.length === 0}
                style={{ flexShrink: 0, background: C.green, border: 'none', borderRadius: 8, padding: '8px 14px', color: '#06101F', fontSize: 12, fontWeight: 800, cursor: filtered.length>0?'pointer':'default', opacity: filtered.length>0?1:0.5 }}>
                ↓ CSV
              </button>
            </div>

            {/* Totais do ano */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 12 }}>Total {filterYear} — {totalAno} notificações</div>
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                  <thead>
                    <tr>
                      {['Mês','Total','SP','CCIH','Adm'].map(h => (
                        <th key={h} style={{ padding: '6px 8px', textAlign: 'center', color: C.muted, fontWeight: 700, borderBottom: `1px solid ${C.border}`, whiteSpace: 'nowrap' }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {byMonth.map((m, i) => (
                      <tr key={i} onClick={() => setFilterMonth(filterMonth === i+1 ? 0 : i+1)}
                        style={{ cursor: 'pointer', background: filterMonth === i+1 ? C.teal + '15' : 'transparent', transition: 'background 0.2s' }}>
                        <td style={{ padding: '6px 8px', color: C.text, fontWeight: 600, borderBottom: `1px solid ${C.border}22` }}>{m.mes}</td>
                        <td style={{ padding: '6px 8px', textAlign: 'center', fontWeight: 900, color: m.total > 0 ? C.text : C.muted, borderBottom: `1px solid ${C.border}22` }}>{m.total || '—'}</td>
                        <td style={{ padding: '6px 8px', textAlign: 'center', color: m.sp > 0 ? C.red : C.muted, borderBottom: `1px solid ${C.border}22` }}>{m.sp || '—'}</td>
                        <td style={{ padding: '6px 8px', textAlign: 'center', color: m.ccih > 0 ? C.purple : C.muted, borderBottom: `1px solid ${C.border}22` }}>{m.ccih || '—'}</td>
                        <td style={{ padding: '6px 8px', textAlign: 'center', color: m.adm > 0 ? C.blue : C.muted, borderBottom: `1px solid ${C.border}22` }}>{m.adm || '—'}</td>
                      </tr>
                    ))}
                    <tr style={{ background: C.surface }}>
                      <td style={{ padding: '8px 8px', color: C.teal, fontWeight: 900, fontSize: 12 }}>Total</td>
                      <td style={{ padding: '8px 8px', textAlign: 'center', fontWeight: 900, color: C.teal, fontSize: 12 }}>{totalAno}</td>
                      <td style={{ padding: '8px 8px', textAlign: 'center', fontWeight: 700, color: C.red, fontSize: 11 }}>{byMonth.reduce((a,m)=>a+m.sp,0)}</td>
                      <td style={{ padding: '8px 8px', textAlign: 'center', fontWeight: 700, color: C.purple, fontSize: 11 }}>{byMonth.reduce((a,m)=>a+m.ccih,0)}</td>
                      <td style={{ padding: '8px 8px', textAlign: 'center', fontWeight: 700, color: C.blue, fontSize: 11 }}>{byMonth.reduce((a,m)=>a+m.adm,0)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div style={{ fontSize: 10, color: C.muted, marginTop: 8 }}>Toque em um mês para filtrar a listagem abaixo</div>
            </div>

            {/* Listagem */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>
                  {filtered.length} notificação{filtered.length !== 1 ? 'ões' : ''} {filterMonth > 0 ? `— ${MESES[filterMonth-1]}/${filterYear}` : `— ${filterYear}`}
                </div>
              </div>
              {filtered.length === 0 && <div style={{ textAlign: 'center', color: C.muted, padding: 24, fontSize: 13 }}>Nenhuma notificação neste período.</div>}
              {filtered.map((n, i) => {
                const typeColor = TYPE_COLOR[n.notification_type] || C.muted;
                const typeLabel = TYPE_LABEL[n.notification_type] || n.notification_type || '—';
                return (
                  <div key={n.id || i} style={{ borderBottom: `1px solid ${C.border}22`, paddingBottom: 12, marginBottom: 12 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8, marginBottom: 4 }}>
                      <div style={{ background: typeColor + '22', color: typeColor, borderRadius: 6, padding: '2px 8px', fontSize: 10, fontWeight: 700, flexShrink: 0 }}>{typeLabel}</div>
                      <div style={{ fontSize: 10, color: C.muted }}>{n.event_date || new Date(n.created_at).toLocaleDateString('pt-BR')} {n.event_time || ''}</div>
                    </div>
                    <div style={{ fontSize: 12, color: C.text, lineHeight: 1.5, marginBottom: 3 }}>{n.description || '—'}</div>
                    <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                      {n.sector && <span style={{ fontSize: 10, color: C.muted }}>📍 {n.sector}</span>}
                      {n.shift && <span style={{ fontSize: 10, color: C.muted }}>⏱ {n.shift}</span>}
                      {n.event_subtype && <span style={{ fontSize: 10, color: C.muted }}>🏷 {n.event_subtype}</span>}
                      {n.is_test && <span style={{ fontSize: 10, color: C.yellow }}>⚙ Teste</span>}
                    </div>
                    {n.ai_summary && <div style={{ marginTop: 6, background: C.surface, borderRadius: 6, padding: '6px 10px', fontSize: 11, color: C.muted, lineHeight: 1.5, borderLeft: `2px solid ${C.teal}` }}>🤖 {n.ai_summary}</div>}
                  </div>
                );
              })}
            </div>

          </div>
        );
      })()}

      {tab === 'operacional' && isGestor && (() => {
        // Métricas DSG
        const dsg = tickets.filter(t => t.ticket_type === 'manutencao');
        const amb = tickets.filter(t => t.ticket_type === 'ambulancia');

        const calcMetrics = (list) => {
          const total = list.length;
          const abertos = list.filter(t => t.status === 'aberto').length;
          const visualizados = list.filter(t => t.status === 'visualizado').length;
          const recebidos = list.filter(t => t.status === 'recebido').length;
          const andamento = list.filter(t => t.status === 'em_andamento').length;
          const concluidos = list.filter(t => t.status === 'concluido').length;
          const pendentes = abertos + visualizados + recebidos + andamento;
          const criticos = list.filter(t => t.priority === 'critico' && t.status !== 'concluido').length;
          const urgentes = list.filter(t => t.priority === 'urgente' && t.status !== 'concluido').length;

          // Tempo médio de resposta (aberto → responded_at)
          const comResposta = list.filter(t => t.responded_at && t.opened_at);
          const tempoMedio = comResposta.length > 0
            ? comResposta.reduce((acc, t) => acc + (new Date(t.responded_at) - new Date(t.opened_at)), 0) / comResposta.length / 60000
            : null;

          // Chamados vencidos por prioridade: crítico=30min, urgente=60min, normal=120min
          const agora = Date.now();
          const vencidos = list.filter(t => {
            if (t.status === 'concluido') return false;
            const abertoHa = (agora - new Date(t.opened_at)) / 60000;
            if (t.responded_at) return false;
            const threshold = t.priority === 'critico' ? 30 : t.priority === 'urgente' ? 60 : 120;
            return abertoHa > threshold;
          });

          return { total, abertos, visualizados, recebidos, andamento, concluidos, pendentes, criticos, urgentes, tempoMedio, vencidos };
        };

        const dsgM = calcMetrics(dsg);
        const ambM = calcMetrics(amb);

        const fmtTempo = (mins) => {
          if (mins === null) return '—';
          if (mins < 60) return `${Math.round(mins)}min`;
          return `${Math.floor(mins/60)}h${Math.round(mins%60)>0?` ${Math.round(mins%60)}min`:''}`;
        };

        const generateOpNarrative = async () => {
          setLoadingOp(true); setOpNarrative('');
          try {
            const text = await callClaude([{ role: 'user', content:
              `Analise o desempenho operacional do hospital com base nos dados abaixo e gere uma interpretação de gestão em 3 parágrafos curtos, em português, tom de relatório gerencial:

DSG/Manutenção: ${dsgM.total} chamados total | ${dsgM.pendentes} pendentes | ${dsgM.concluidos} concluídos | ${dsgM.criticos} críticos abertos | tempo médio resposta: ${fmtTempo(dsgM.tempoMedio)} | ${dsgM.vencidos.length} sem resposta há mais de 2h

Ambulância: ${ambM.total} chamados total | ${ambM.pendentes} pendentes | ${ambM.concluidos} concluídos | ${ambM.criticos} críticos abertos | tempo médio resposta: ${fmtTempo(ambM.tempoMedio)} | ${ambM.vencidos.length} sem resposta há mais de 2h

Inclua: pontos críticos, padrões de atraso, recomendações de gestão prioritárias.`
            }], 'Você é o analista de gestão hospitalar. Responda em português, tom gerencial objetivo.');
            setOpNarrative(text);
          } catch { showToast('Erro ao gerar análise', 'error'); }
          setLoadingOp(false);
        };

        const MetricCard = ({ label, value, color, sub }) => (
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 8px', textAlign: 'center' }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: color || C.text }}>{value}</div>
            <div style={{ fontSize: 9, color: C.muted, fontWeight: 700, textTransform: 'uppercase', marginTop: 2 }}>{label}</div>
            {sub && <div style={{ fontSize: 9, color: color, marginTop: 1 }}>{sub}</div>}
          </div>
        );

        const SectionBlock = ({ title, icon, color, m, list }) => (
          <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
              <span style={{ fontSize: 20 }}>{icon}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 800, color: C.text }}>{title}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{m.total} chamados registrados</div>
              </div>
            </div>

            {/* KPIs */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 14 }}>
              <MetricCard label="Pendentes" value={m.pendentes} color={m.pendentes > 0 ? C.yellow : C.green} />
              <MetricCard label="Concluídos" value={m.concluidos} color={C.green} />
              <MetricCard label="T. Médio" value={fmtTempo(m.tempoMedio)} color={C.blue} />
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: m.vencidos.length > 0 ? 14 : 0 }}>
              <MetricCard label="Críticos" value={m.criticos} color={m.criticos > 0 ? C.red : C.muted} />
              <MetricCard label="Urgentes" value={m.urgentes} color={m.urgentes > 0 ? C.yellow : C.muted} />
              <MetricCard label="Fora do prazo" value={m.vencidos.length} color={m.vencidos.length > 0 ? C.red : C.muted} sub={m.vencidos.length > 0 ? 'crítico>30m / urgente>1h / normal>2h' : ''} />
            </div>

            {/* Vencidos */}
            {m.vencidos.length > 0 && (
              <div style={{ background: C.red + '12', border: `1px solid ${C.red}33`, borderRadius: 10, padding: '10px 12px', marginBottom: 0 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: C.red, marginBottom: 8 }}>⚠️ Sem resposta há mais de 2h</div>
                {m.vencidos.map((t, i) => (
                  <div key={i} style={{ fontSize: 11, color: C.text, marginBottom: 4, paddingBottom: 4, borderBottom: i < m.vencidos.length-1 ? `1px solid ${C.red}22` : 'none' }}>
                    <span style={{ color: C.muted }}>{new Date(t.opened_at).toLocaleDateString('pt-BR')} {new Date(t.opened_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · {t.origin_sector || '—'}</span><br/>
                    {t.description?.slice(0, 80)}{t.description?.length > 80 ? '…' : ''}
                    {t.requester_name && <span style={{ color: C.teal }}> · {t.requester_name}</span>}
                  </div>
                ))}
              </div>
            )}

            {/* Status bar */}
            {m.total > 0 && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 10, color: C.muted, marginBottom: 6 }}>Distribuição de status</div>
                <div style={{ display: 'flex', height: 8, borderRadius: 4, overflow: 'hidden', gap: 1 }}>
                  {[
                    { v: m.abertos, c: C.yellow },
                    { v: m.visualizados, c: '#8B5CF6' },
                    { v: m.recebidos, c: C.blue },
                    { v: m.andamento, c: C.teal },
                    { v: m.concluidos, c: C.green },
                  ].filter(s => s.v > 0).map((s, i) => (
                    <div key={i} style={{ flex: s.v, background: s.c, minWidth: 3 }} />
                  ))}
                </div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 6 }}>
                  {[['Aberto',m.abertos,C.yellow],['Visualizado',m.visualizados,'#8B5CF6'],['Recebido',m.recebidos,C.blue],['Andamento',m.andamento,C.teal],['Concluído',m.concluidos,C.green]]
                    .filter(([,v]) => v > 0).map(([l,v,c]) => (
                    <div key={l} style={{ display:'flex', alignItems:'center', gap:3, fontSize:9 }}>
                      <div style={{ width:8, height:8, borderRadius:2, background:c }}/>
                      <span style={{ color:C.muted }}>{l}: {v}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );

        const exportTicketsCSV = (list, label) => {
          const header = ['ID','Tipo','Abertura','Solicitante','Setor Origem','Prioridade','Status','Descrição','Resposta','Tempo Resposta'];
          const rows = list.map(t => [
            t.id?.slice(0,8)||'', t.ticket_type||'',
            t.opened_at ? new Date(t.opened_at).toLocaleString('pt-BR') : '',
            t.requester_name||'', t.origin_sector||'', t.priority||'', t.status||'',
            (t.description||'').replace(/"/g,'""'), (t.response_notes||'').replace(/"/g,'""'),
            t.responded_at&&t.opened_at ? `${Math.round((new Date(t.responded_at)-new Date(t.opened_at))/60000)}min` : '',
          ]);
          const csv = [header,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
          const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href=url; a.download=`chamados_${label}_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;
          a.click(); URL.revokeObjectURL(url);
        };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>

            {/* Botões de export */}
            <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
              <button onClick={() => exportTicketsCSV(dsg, 'dsg')} disabled={dsg.length===0}
                style={{ flex: 1, background: C.yellow+'22', border:`1px solid ${C.yellow}44`, borderRadius:8, padding:'8px', color:C.yellow, fontSize:11, fontWeight:700, cursor:'pointer', opacity:dsg.length>0?1:0.5 }}>
                ↓ CSV DSG ({dsg.length})
              </button>
              <button onClick={() => exportTicketsCSV(amb, 'ambulancia')} disabled={amb.length===0}
                style={{ flex: 1, background: C.red+'22', border:`1px solid ${C.red}44`, borderRadius:8, padding:'8px', color:C.red, fontSize:11, fontWeight:700, cursor:'pointer', opacity:amb.length>0?1:0.5 }}>
                ↓ CSV Ambulância ({amb.length})
              </button>
            </div>

            <SectionBlock title="DSG / Manutenção" icon="🔧" color={C.yellow} m={dsgM} list={dsg} />
            <SectionBlock title="Ambulância / Garagem" icon="🚑" color={C.red} m={ambM} list={amb} />

            {/* Análise de gestão por IA */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 6 }}>Interpretação Gerencial por IA</div>
              <div style={{ fontSize: 12, color: C.muted, marginBottom: 14, lineHeight: 1.6 }}>Análise do desempenho operacional com pontos críticos e recomendações prioritárias.</div>
              <button onClick={generateOpNarrative} disabled={loadingOp || tickets.length === 0}
                style={{ width: '100%', background: loadingOp ? C.border : '#8B5CF6', border: 'none', borderRadius: 10, padding: '13px', color: loadingOp ? C.muted : '#fff', fontWeight: 800, fontSize: 13, cursor: loadingOp ? 'default' : 'pointer' }}>
                {loadingOp ? '⏳ Gerando análise…' : tickets.length === 0 ? 'Nenhum dado disponível' : '✨ Gerar Análise Gerencial'}
              </button>
              {opNarrative && (
                <div style={{ marginTop: 14, background: C.surface, borderRadius: 10, padding: '14px', borderLeft: `3px solid #8B5CF6` }}>
                  <div style={{ fontSize: 11, color: C.muted, marginBottom: 8, fontStyle: 'italic' }}>Gerado por IA — revisar antes de publicação oficial</div>
                  <div style={{ fontSize: 13, color: C.text, lineHeight: 1.85, whiteSpace: 'pre-wrap' }}>{opNarrative}</div>
                </div>
              )}
            </div>

          </div>
        );
      })()}
    </div>
  );
}

// ─── CENTRAL VIEW ──────────────────────────────────────────────────────────────
function CentralView({ sbUrl, sbKey, hospital, profileMode }) {
  const [selected, setSelected] = useState(null);
  const [items, setItems] = useState(knowledge); // começa com conteúdo estático
  const [loading, setLoading] = useState(false);
  const [gestorMode, setGestorMode] = useState(false); // edição de conteúdo
  const [showAddForm, setShowAddForm] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ title: '', desc: '', icon: '📄', color: '#00C9B1', type: 'video', url: '' });
  const h = hospital || DEFAULT_HOSPITAL;
  const isGestor = profileMode === 'gestor' || profileMode === 'nsp';

  // Carrega conteúdo dinâmico do Supabase (sobrepõe o estático se houver)
  const loadDynamic = async () => {
    if (!sbUrl || !sbKey) return;
    setLoading(true);
    try {
      const data = await sbSelect(sbUrl, sbKey, 'knowledge_items', `select=*&hospital_id=eq.${h.id}&order=created_at.asc`);
      if (data && data.length > 0) setItems([...knowledge, ...data.map(d => ({ ...d, dynamic: true }))]);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { loadDynamic(); }, [sbUrl, sbKey]);

  const handleAdd = async () => {
    if (!form.title.trim() || !form.url.trim()) return;
    setSaving(true);
    try {
      const payload = { hospital_id: h.id, title: form.title, description: form.desc, icon: form.icon, color: form.color, type: form.type, url: form.url };
      const res = await sbInsert(sbUrl, sbKey, 'knowledge_items', payload);
      setItems(prev => [...prev, { ...payload, id: res?.[0]?.id || Date.now(), dynamic: true }]);
      setForm({ title: '', desc: '', icon: '📄', color: '#00C9B1', type: 'video', url: '' });
      setShowAddForm(false);
    } catch (e) { alert('Erro ao salvar: ' + e.message); }
    setSaving(false);
  };

  const handleDelete = async (item) => {
    if (!item.dynamic) return; // não apaga conteúdo estático
    setDeleting(item.id);
    try {
      await sbReq(sbUrl, sbKey, `/knowledge_items?id=eq.${item.id}`, { method: 'DELETE' });
      setItems(prev => prev.filter(i => i.id !== item.id));
    } catch {}
    setDeleting(null);
  };

  // Extrai ID do YouTube de vários formatos de URL
  const getYouTubeId = (url) => {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  };

  // Tela de detalhe do item
  const item = items.find(k => k.id === selected);
  if (selected && item) {
    const ytId = item.type === 'video' ? getYouTubeId(item.url || '') : null;
    return (
      <div>
        <div style={{ padding: '14px 16px', borderBottom: `1px solid ${C.border}`, background: C.surface, display: 'flex', alignItems: 'center', gap: 12 }}>
          <button onClick={() => setSelected(null)} style={{ background: 'none', border: 'none', color: C.teal, cursor: 'pointer', fontSize: 22 }}>←</button>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.text }}>{item.icon} {item.title}</div>
            <div style={{ fontSize: 11, color: C.muted }}>{item.desc || item.description}</div>
          </div>
        </div>
        <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {/* Player YouTube */}
          {item.type === 'video' && ytId && (
            <div style={{ borderRadius: 12, overflow: 'hidden', background: '#000', aspectRatio: '16/9' }}>
              <iframe
                width="100%" height="100%"
                src={`https://www.youtube.com/embed/${ytId}`}
                frameBorder="0" allowFullScreen
                style={{ display: 'block', aspectRatio: '16/9' }}
              />
            </div>
          )}
          {/* Link externo para PDF/Drive ou vídeo sem ID válido */}
          {item.type === 'video' && !ytId && item.url && (
            <a href={item.url} target="_blank" rel="noreferrer" style={{ display: 'block', background: '#EF444422', border: '1px solid #EF444444', borderRadius: 12, padding: 16, textAlign: 'center', color: '#EF4444', fontWeight: 700, fontSize: 14, textDecoration: 'none' }}>
              ▶ Abrir vídeo
            </a>
          )}
          {item.type === 'pdf' && item.url && (
            <a href={item.url} target="_blank" rel="noreferrer" style={{ display: 'block', background: C.teal + '22', border: `1px solid ${C.teal}44`, borderRadius: 12, padding: 16, textAlign: 'center', color: C.teal, fontWeight: 700, fontSize: 14, textDecoration: 'none' }}>
              📄 Abrir documento
            </a>
          )}
          {/* Conteúdo estático existente */}
          {item.type === 'edu_tabs' && (() => {
            const [activeTab, setActiveTab] = React.useState(item.tabs[0].id);
            const tab = item.tabs.find(t => t.id === activeTab);
            return (
              <div>
                <div style={{ display: 'flex', background: C.surface, borderRadius: 10, padding: 4, gap: 4, marginBottom: 14 }}>
                  {item.tabs.map(t => (
                    <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ flex: 1, padding: '8px 4px', borderRadius: 7, border: 'none', background: activeTab === t.id ? item.color : 'transparent', color: activeTab === t.id ? '#06101F' : C.muted, fontSize: 10, fontWeight: 700, cursor: 'pointer' }}>{t.label}</button>
                  ))}
                </div>
                {tab.items.map((c, i) => (
                  <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderLeft: `3px solid ${item.color}`, borderRadius: 12, padding: 14, marginBottom: 10 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 6 }}>{c.title}</div>
                    <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{c.text}</div>
                  </div>
                ))}
              </div>
            );
          })()}
          {item.type === 'cards' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderLeft: `3px solid ${item.color}`, borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 6 }}>{c.title}</div>
              <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{c.text}</div>
            </div>
          ))}
          {item.type === 'download' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ background: item.color + '22', color: item.color, borderRadius: 6, padding: '3px 8px', fontSize: 10, fontWeight: 700 }}>{c.badge}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{c.title}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{c.size}</div>
              </div>
              <button style={{ background: C.teal + '22', border: 'none', borderRadius: 8, padding: '6px 12px', color: C.teal, fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>↓</button>
            </div>
          ))}
          {item.type === 'steps' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, display: 'flex', gap: 14 }}>
              <div style={{ fontSize: 26, fontWeight: 900, color: item.color, minWidth: 32 }}>{c.step}</div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>{c.title}</div>
                <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{c.text}</div>
              </div>
            </div>
          ))}
          {item.type === 'metas' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, display: 'flex', gap: 14 }}>
              <div style={{ minWidth: 36, height: 36, borderRadius: 18, background: item.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 900, color: '#06101F' }}>{c.num}</div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 4 }}>{c.title}</div>
                <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{c.text}</div>
              </div>
            </div>
          ))}
          {item.type === '5w2h' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, display: 'flex', gap: 12 }}>
              <div style={{ background: item.color + '22', color: item.color, borderRadius: 6, padding: '3px 8px', fontSize: 10, fontWeight: 700, height: 'fit-content', whiteSpace: 'nowrap' }}>{c.tag}</div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{c.label}</div>
                <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>{c.text}</div>
              </div>
            </div>
          ))}
          {item.type === 'media' && item.items?.map((c, i) => (
            <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ width: 44, height: 44, borderRadius: 12, background: item.color + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, flexShrink: 0 }}>{c.tipo === 'Vídeo' ? '▶️' : '📊'}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{c.title}</div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{c.tipo} · {c.duracao}</div>
              </div>
              <button style={{ background: item.color + '22', border: 'none', borderRadius: 8, padding: '6px 12px', color: item.color, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>
                {c.tipo === 'Vídeo' ? '▶' : '↓'}
              </button>
            </div>
          ))}
        </div>
      </div>
    );
  }

  const inp = { background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '11px 14px', color: C.text, fontSize: 13, outline: 'none', width: '100%', marginBottom: 10 };
  const lbl = { fontSize: 11, color: C.muted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', display: 'block', marginBottom: 5 };
  const ICONS = ['📄','▶️','🎥','📊','📋','📚','🧠','🏥','⚕️','🩺','💊','🛡️','📢','🔬'];
  const COLORS = ['#00C9B1','#1D6FE8','#EF4444','#F59E0B','#10B981','#8B5CF6','#EC4899'];

  return (
    <div style={{ padding: '20px 16px 80px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 17, fontWeight: 900, color: C.text, marginBottom: 4 }}>Central de Conhecimento</div>
          <div style={{ fontSize: 12, color: C.muted }}>Materiais de apoio, treinamentos e educação em saúde</div>
        </div>
        {isGestor && (
          <button onClick={() => setGestorMode(!gestorMode)} style={{ background: gestorMode ? C.teal : C.card, border: `1px solid ${gestorMode ? C.teal : C.border}`, borderRadius: 8, padding: '6px 12px', color: gestorMode ? '#06101F' : C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>
            {gestorMode ? '✓ Editar' : '✏️ Editar'}
          </button>
        )}
      </div>

      {/* Formulário de adição */}
      {gestorMode && showAddForm && (
        <div style={{ background: C.card, border: `1px solid ${C.teal}44`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 12 }}>Novo item</div>

          <label style={lbl}>Tipo</label>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            {[['video','▶️ Vídeo'],['pdf','📄 PDF/Doc']].map(([id, label]) => (
              <button key={id} onClick={() => setForm({...form, type: id})} style={{ flex: 1, padding: '8px', borderRadius: 8, border: `1px solid ${form.type === id ? C.teal : C.border}`, background: form.type === id ? C.teal + '22' : C.surface, color: form.type === id ? C.teal : C.muted, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>{label}</button>
            ))}
          </div>

          <label style={lbl}>Título</label>
          <input value={form.title} onChange={e => setForm({...form, title: e.target.value})} placeholder="Ex: Higienização das Mãos" style={inp} />

          <label style={lbl}>Descrição curta</label>
          <input value={form.desc} onChange={e => setForm({...form, desc: e.target.value})} placeholder="Ex: Técnica correta e momentos da higienização" style={inp} />

          <label style={lbl}>Link {form.type === 'video' ? '(YouTube)' : '(Google Drive / URL)'}</label>
          <input value={form.url} onChange={e => setForm({...form, url: e.target.value})} placeholder={form.type === 'video' ? 'https://youtube.com/watch?v=...' : 'https://drive.google.com/...'} style={inp} />

          <label style={lbl}>Ícone</label>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
            {ICONS.map(ic => (
              <button key={ic} onClick={() => setForm({...form, icon: ic})} style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${form.icon === ic ? C.teal : C.border}`, background: form.icon === ic ? C.teal + '22' : C.surface, fontSize: 18, cursor: 'pointer' }}>{ic}</button>
            ))}
          </div>

          <label style={lbl}>Cor</label>
          <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
            {COLORS.map(cor => (
              <button key={cor} onClick={() => setForm({...form, color: cor})} style={{ width: 28, height: 28, borderRadius: '50%', background: cor, border: `2px solid ${form.color === cor ? '#fff' : 'transparent'}`, cursor: 'pointer' }} />
            ))}
          </div>

          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={() => setShowAddForm(false)} style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px', color: C.muted, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>Cancelar</button>
            <button onClick={handleAdd} disabled={saving || !form.title.trim() || !form.url.trim()} style={{ flex: 2, background: C.teal, border: 'none', borderRadius: 10, padding: '10px', color: '#06101F', fontSize: 12, fontWeight: 800, cursor: 'pointer', opacity: saving ? 0.7 : 1 }}>
              {saving ? '⏳ Salvando…' : '✓ Adicionar'}
            </button>
          </div>
        </div>
      )}

      {gestorMode && !showAddForm && (
        <button onClick={() => setShowAddForm(true)} style={{ width: '100%', background: C.teal + '15', border: `1px dashed ${C.teal}`, borderRadius: 12, padding: '12px', color: C.teal, fontSize: 13, fontWeight: 700, cursor: 'pointer', marginBottom: 16 }}>
          + Adicionar vídeo ou documento
        </button>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {items.map(item => (
          <div key={item.id} style={{ position: 'relative' }}>
            <button onClick={() => !gestorMode && setSelected(item.id)} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 14, cursor: gestorMode ? 'default' : 'pointer', textAlign: 'left', width: '100%', opacity: gestorMode && !item.dynamic ? 0.5 : 1 }}>
              <div style={{ width: 48, height: 48, borderRadius: 14, background: (item.color || C.teal) + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, flexShrink: 0 }}>{item.icon}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{item.title}</div>
                <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{item.desc || item.description}</div>
                {item.dynamic && <div style={{ fontSize: 10, color: C.teal, marginTop: 2 }}>{item.type === 'video' ? '▶ Vídeo' : '📄 Documento'}</div>}
              </div>
              {!gestorMode && <IconChevronRight size={16} color={C.muted} />}
            </button>
            {gestorMode && item.dynamic && (
              <button onClick={() => handleDelete(item)} disabled={deleting === item.id} style={{ position: 'absolute', top: 10, right: 10, background: '#EF444422', border: '1px solid #EF444444', borderRadius: 8, padding: '4px 10px', color: '#EF4444', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>
                {deleting === item.id ? '…' : '🗑 Remover'}
              </button>
            )}
            {gestorMode && !item.dynamic && (
              <div style={{ position: 'absolute', top: 10, right: 10, background: C.surface, borderRadius: 6, padding: '3px 8px', fontSize: 9, color: C.muted, fontWeight: 700 }}>FIXO</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}




// ─── SESAB PANEL ──────────────────────────────────────────────────────────────
function SesabPanel({ sbUrl, sbKey, showToast, onClose }) {
  const [hospitals, setHospitals] = useState([]);
  const [allNotifs, setAllNotifs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selHospital, setSelHospital] = useState('all');

  useEffect(() => {
    if (!sbUrl || !sbKey) return;
    setLoading(true);
    Promise.all([
      sbSelect(sbUrl, sbKey, 'hospitals', 'select=*&order=name.asc'),
      sbSelect(sbUrl, sbKey, 'notifications', 'select=*&order=created_at.desc&limit=500'),
    ]).then(([hosp, notifs]) => {
      setHospitals(hosp || []);
      setAllNotifs(notifs || []);
    }).catch(() => showToast('Erro ao carregar dados SESAB', 'error'))
    .finally(() => setLoading(false));
  }, [sbUrl, sbKey]);

  const filtered = selHospital === 'all' ? allNotifs : allNotifs.filter(n => n.hospital_id === selHospital);
  const prodNotifs = filtered.filter(n => !n.is_test);

  // Stats by hospital
  const byHospital = hospitals.map(h => {
    const hn = prodNotifs.filter(n => n.hospital_id === h.id);
    return {
      ...h,
      total: hn.length,
      sp: hn.filter(n => n.notification_type === 'seguranca_paciente').length,
      ccih: hn.filter(n => n.notification_type === 'ccih').length,
      adm: hn.filter(n => n.notification_type === 'administrativa').length,
    };
  }).sort((a, b) => b.total - a.total);

  const totalGeral = prodNotifs.length;
  const spGeral = prodNotifs.filter(n => n.notification_type === 'seguranca_paciente').length;
  const ccihGeral = prodNotifs.filter(n => n.notification_type === 'ccih').length;

  return (
    <div style={{ position: 'fixed', inset: 0, background: C.bg, zIndex: 400, display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
      {/* Header */}
      <div style={{ background: `linear-gradient(135deg, ${C.navy||'#06101F'}, ${C.blue})`, padding: '20px 16px 16px', position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.6)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' }}>SESAB · Painel Estadual</div>
            <div style={{ fontSize: 20, fontWeight: 900, color: '#fff' }}>NotificaAI — Bahia</div>
          </div>
          <button onClick={onClose} style={{ background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: 10, padding: '8px 14px', color: '#fff', fontWeight: 700, cursor: 'pointer', fontSize: 12 }}>✕ Fechar</button>
        </div>
      </div>

      <div style={{ padding: '16px 16px 80px', display: 'flex', flexDirection: 'column', gap: 16 }}>
        {loading && <div style={{ textAlign: 'center', color: C.muted, padding: 40 }}>Carregando dados estaduais…</div>}

        {!loading && (
          <>
            {/* Totalizadores estaduais */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
              {[
                { label: 'Total', value: totalGeral, color: C.teal, icon: '🔔' },
                { label: 'Seg. Paciente', value: spGeral, color: C.red, icon: '🏥' },
                { label: 'CCIH', value: ccihGeral, color: C.yellow, icon: '🦠' },
              ].map(s => (
                <div key={s.label} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 12, padding: '12px 10px', textAlign: 'center' }}>
                  <div style={{ fontSize: 16 }}>{s.icon}</div>
                  <div style={{ fontSize: 22, fontWeight: 900, color: s.color }}>{s.value}</div>
                  <div style={{ fontSize: 9, color: C.muted, fontWeight: 700, textTransform: 'uppercase' }}>{s.label}</div>
                </div>
              ))}
            </div>

            {/* Filtro por hospital */}
            <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 4 }}>
              <button onClick={() => setSelHospital('all')} style={{ flexShrink: 0, padding: '6px 14px', borderRadius: 20, border: 'none', background: selHospital === 'all' ? C.teal : C.card, color: selHospital === 'all' ? '#06101F' : C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>
                Todos ({hospitals.length})
              </button>
              {hospitals.map(h => (
                <button key={h.id} onClick={() => setSelHospital(h.id)} style={{ flexShrink: 0, padding: '6px 14px', borderRadius: 20, border: 'none', background: selHospital === h.id ? C.blue : C.card, color: selHospital === h.id ? '#fff' : C.muted, fontSize: 11, fontWeight: 700, cursor: 'pointer' }}>
                  {h.short_name || h.name}
                </button>
              ))}
            </div>

            {/* Ranking de hospitais */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 12 }}>🏆 Ranking — Notificações por Unidade</div>
              {byHospital.length === 0 && <div style={{ color: C.muted, fontSize: 12, textAlign: 'center', padding: 20 }}>Nenhuma unidade cadastrada ainda.</div>}
              {byHospital.map((h, i) => {
                const pct = totalGeral > 0 ? Math.round(h.total / totalGeral * 100) : 0;
                return (
                  <div key={h.id} style={{ marginBottom: 12 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{ width: 22, height: 22, borderRadius: 6, background: i === 0 ? C.yellow : C.border, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 900, color: i === 0 ? '#06101F' : C.muted }}>{i+1}</div>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{h.short_name || h.name}</div>
                          <div style={{ fontSize: 10, color: C.muted }}>{h.sesab_code || h.id} · {h.sp} SP · {h.ccih} CCIH · {h.adm} Adm</div>
                        </div>
                      </div>
                      <div style={{ fontSize: 18, fontWeight: 900, color: C.teal }}>{h.total}</div>
                    </div>
                    <div style={{ height: 6, background: C.surface, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ width: `${pct}%`, height: '100%', background: `linear-gradient(90deg, ${C.teal}, ${C.blue})`, borderRadius: 3, transition: 'width 0.5s' }} />
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Notificações recentes do estado */}
            <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 12 }}>📋 Últimas notificações {selHospital !== 'all' ? `— ${hospitals.find(h=>h.id===selHospital)?.short_name||selHospital}` : 'do estado'}</div>
              {filtered.slice(0, 10).map((n, i) => {
                const tag = getTag(n);
                const hosp = hospitals.find(h => h.id === n.hospital_id);
                return (
                  <div key={n.id || i} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 12px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ background: tag.color + '22', color: tag.color, borderRadius: 5, padding: '2px 6px', fontSize: 9, fontWeight: 700, minWidth: 38, textAlign: 'center' }}>{tag.label}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: C.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textTransform: 'capitalize' }}>{getTitle(n)}</div>
                      <div style={{ fontSize: 10, color: C.muted }}>{hosp?.short_name || n.hospital_id || 'HNSA'} · {n.sector} · {formatTime(n.created_at)}</div>
                    </div>
                  </div>
                );
              })}
              {filtered.length === 0 && <div style={{ color: C.muted, fontSize: 12, textAlign: 'center', padding: 16 }}>Nenhuma notificação.</div>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}
