              ['Protocolos atualizados (4+)',checks.protocolos_ok,dados.protocolos.filter(p=>p.proxima_revisao>=new Date().toISOString().slice(0,10)).length+' protocolos validos'],
              ['Treinamento em todos os subnucleos',checks.treinamentos_ok,SUBNUCLEOS_HNSA.filter(s=>dados.porSubnucleo[s.id].treinamentos===0).map(s=>s.label).join(', ')||'Todos realizaram'],
              ['Notificacoes enviadas ao Notivisa',checks.notivisa_ok,`${dados.nots.filter(n=>n.notivisa_enviado).length} notificacoes enviadas`],
              ['Indicadores monitorados',checks.indicadores_ok,`${dados.total} eventos registrados no periodo`],
            ].map(([l,ok,obs],i)=>(
              <div key={i} style={{background:C.card,border:'1px solid '+(ok?C.green:C.red)+'44',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>

          {!checks.reunioes_ok&&<div style={{background:C.red+'15',border:'1px solid '+C.red+'33',borderRadius:10,padding:'10px 14px',marginTop:12,fontSize:11,color:C.red,fontWeight:700}}>

          </div>}
          {!checks.notivisa_ok&&<div style={{background:C.red+'15',border:'1px solid '+C.red+'33',borderRadius:10,padding:'10px 14px',marginTop:8,fontSize:11,color:C.red,fontWeight:700}}>
            ATENCAO: Nenhuma notificacao enviada ao Notivisa. O indicador 18 tambem e requisito minimo. Em 2023 o HNSA notificou apenas em fevereiro e marco, resultando em baixa conformidade.
          </div>}
        </div>);
      })()}
    </div>}
  </div>);
}

// --- PERFIL MEMBRO NSP --------------------------------------------------------
function MembroNSPView({sbUrl,sbKey,showToast,hospital,profileMode}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [stats,setStats]=useState(null);
  const [notifications,setNotifications]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filtroSub,setFiltroSub]=useState('todos');
  const [mesSel,setMesSel]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});
  const [notsMes,setNotsMes]=useState([]);
  const [loadingMes,setLoadingMes]=useState(false);
  // Form de registro rápido de treinamento por subnúcleo
  const [showFormTrein,setShowFormTrein]=useState(null); // sub.id
  const [formTrein,setFormTrein]=useState({tipo:'treinamento',qtd:1,participantes:'',protocolo:'',data:new Date().toISOString().slice(0,10)});
  const [savingTrein,setSavingTrein]=useState(false);

  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const carregar=()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    Promise.all([
      sbSelect(sbUrl,sbKey,'notifications','select=*&is_test=neq.true&order=created_at.desc&limit=2000'),
      sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&select=*&order=data.desc`).catch(()=>[]),
    ]).then(([nots,treins])=>{
      setNotifications(nots||[]);
      setStats({...computeStats(nots||[]),treins:treins||[]});
    }).catch(()=>showToast('Erro ao carregar','error')).finally(()=>setLoading(false));
  };

  useEffect(()=>{carregar();},[sbUrl,sbKey]);

  // Carregar notificações do mês selecionado
  useEffect(()=>{
    if(!sbUrl||!sbKey) return;
    setLoadingMes(true);
    const [ano,mes]=mesSel.split('-').map(Number);
    const inicio=new Date(ano,mes-1,1).toISOString().slice(0,10);
    const fim=new Date(ano,mes,0).toISOString().slice(0,10);
    sbSelect(sbUrl,sbKey,'notifications',
      `event_date=gte.${inicio}&event_date=lte.${fim}&is_test=neq.true&order=event_date.asc&limit=200`
    ).then(d=>setNotsMes(d||[])).catch(()=>[]).finally(()=>setLoadingMes(false));
  },[mesSel,sbUrl,sbKey]);

  const navMes=(dir)=>{
    let [ano,mes]=mesSel.split('-').map(Number);
    mes+=dir; if(mes>12){mes=1;ano++;} if(mes<1){mes=12;ano--;}
    setMesSel(`${ano}-${String(mes).padStart(2,'0')}`);
  };

  const salvarTrein=async(subId)=>{
    if(!formTrein.participantes) return showToast('Informe o numero de participantes','error');
    setSavingTrein(true);
    try{
      await sbInsert(sbUrl,sbKey,'treinamentos_nsp',{
        hospital_id:h.id,
        tipo:formTrein.tipo,
        subnucleo:subId,
        protocolo:formTrein.protocolo||null,
        data:formTrein.data||null,
        participantes:Number(formTrein.participantes)||0,
        descricao:formTrein.protocolo||null,
        responsavel:profileMode||'membro_nsp',
      });
      showToast('Registro salvo!','success');
      setShowFormTrein(null);
      setFormTrein({tipo:'treinamento',qtd:1,participantes:'',protocolo:'',data:new Date().toISOString().slice(0,10)});
      carregar();
    }catch{showToast('Erro ao salvar','error');}
    setSavingTrein(false);
  };

  if(loading) return(<div style={{display:'flex',justifyContent:'center',padding:60}}><Dots/></div>);

  const s=stats||{total:0,sp:0,ccih:0,adm:0,sentinela:0,culturaScore:0,sectorData:[],diasSemSentinela:null,treins:[]};

  // Panorama do mês
  const spMes=notsMes.filter(n=>n.notification_type==='seguranca_paciente'||n.notification_type==='ccih').length;
  const admMes=notsMes.filter(n=>n.notification_type==='administrativa').length;
  const tiposMes=[
    {label:'Quedas',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('queda')||n.description?.toLowerCase().includes('queda')).length,cor:'#F59E0B'},
    {label:'Perda AVP',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('avp')||n.event_subtype?.toLowerCase().includes('acesso')).length,cor:'#3B82F6'},
    {label:'LPP',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('press')||n.event_subtype?.toLowerCase().includes('lpp')).length,cor:'#EF4444'},
    {label:'Infecção (CCIH)',count:notsMes.filter(n=>n.notification_type==='ccih'||n.event_subtype?.startsWith('CCIH')).length,cor:'#7C3AED'},
    {label:'Medicação',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('medic')||n.description?.toLowerCase().includes('medic')).length,cor:'#EC4899'},
    {label:'Identificação',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('identif')).length,cor:'#0D9488'},
  ].filter(t=>t.count>0).sort((a,b)=>b.count-a.count);

  const maxTipo=tiposMes[0]?.count||1;

  const setoresMes=[...new Set(notsMes.map(n=>n.sector).filter(Boolean))].map(setor=>({
    setor,count:notsMes.filter(n=>n.sector===setor).length
  })).sort((a,b)=>b.count-a.count).slice(0,5);
  const maxSetor=setoresMes[0]?.count||1;

  return(<div style={{padding:'20px 16px 80px'}}>
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:2}}>Painel Membro NSP</div>
    <div style={{fontSize:11,color:C.muted,marginBottom:16}}>HNSA · Nucleo de Seguranca do Paciente</div>

    {/* Métricas totais */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
      <StatCard icon={String.fromCodePoint(128202)} label="Total notificacoes" value={s.total} color={C.teal}/>
      <StatCard icon={String.fromCodePoint(127973)} label="Seg. Paciente" value={s.sp} color={C.red}/>
      <StatCard icon={String.fromCodePoint(128203)} label="Administrativas" value={s.adm} color={C.purple}/>
      {s.ccih>0&&<div style={{gridColumn:'span 3',background:'#7C3AED10',border:'1px solid #7C3AED33',borderRadius:10,padding:'6px 12px',display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:14}}>{String.fromCodePoint(129440)}</span>
        <span style={{fontSize:11,color:'#7C3AED',fontWeight:700}}>CCIH / Infecções: {s.ccih} notificações</span>
      </div>}
    </div>

    {/* Dias sem sentinela */}
    {sf.diasSemSentinela!==null&&<div style={{background:sf.diasSemSentinela>=30?C.green+'18':C.yellow+'18',border:'1px solid '+(sf.diasSemSentinela>=30?C.green:C.yellow)+'44',borderRadius:14,padding:'12px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:12}}>
      <div style={{fontSize:36,fontWeight:900,color:sf.diasSemSentinela>=30?C.green:C.yellow,lineHeight:1}}>{sf.diasSemSentinela}</div>
      <div><div style={{fontSize:13,fontWeight:700,color:sf.diasSemSentinela>=30?C.green:C.yellow}}>dias sem evento sentinela</div>
      <div style={{fontSize:11,color:C.muted}}>Meta ONA: 90 dias</div></div>
    </div>}

    {/* PANORAMA DO MES */}
    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text}}>Panorama do Mes</div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <button onClick={()=>navMes(-1)} style={{background:'none',border:'none',color:C.teal,fontSize:18,cursor:'pointer',padding:'0 2px'}}>{String.fromCodePoint(8249)}</button>
          <span style={{fontSize:12,fontWeight:700,color:C.text,minWidth:64,textAlign:'center'}}>
            {MESES[Number(mesSel.split('-')[1])-1]}/{mesSel.split('-')[0]}
          </span>
          <button onClick={()=>navMes(1)} style={{background:'none',border:'none',color:C.teal,fontSize:18,cursor:'pointer',padding:'0 2px'}}>{String.fromCodePoint(8250)}</button>
        </div>
      </div>

      {loadingMes&&<div style={{textAlign:'center',padding:16}}><Dots/></div>}

      {!loadingMes&&(<div>
        {/* Totais do mês */}
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.red+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.red}}>{spMes}</div>
            <div style={{fontSize:10,color:C.muted}}>SP + CCIH</div>
          </div>
          <div style={{flex:1,background:C.muted+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.muted}}>{admMes}</div>
            <div style={{fontSize:10,color:C.muted}}>Administrativas</div>
          </div>
          <div style={{flex:1,background:C.teal+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.teal}}>{notsMes.length}</div>
            <div style={{fontSize:10,color:C.muted}}>Total</div>
          </div>
        </div>

        {/* Tipos mais frequentes */}
        {tiposMes.length>0&&<div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Tipos mais frequentes</div>
          {tiposMes.map((t,i)=>(
            <div key={i} style={{marginBottom:5}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
                <span style={{color:C.text}}>{t.label}</span>
                <span style={{color:t.cor,fontWeight:700}}>{t.count}</span>
              </div>
              <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}>
                <div style={{width:(t.count/maxTipo)*100+'%',height:'100%',background:t.cor,borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>}

        {/* Setores */}
        {setoresMes.length>0&&<div>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Por setor</div>
          {setoresMes.map((d,i)=>(
            <div key={i} style={{marginBottom:5}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
                <span style={{color:C.text}}>{d.setor}</span>
                <span style={{color:C.teal,fontWeight:700}}>{d.count}</span>
              </div>
              <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}>
                <div style={{width:(d.count/maxSetor)*100+'%',height:'100%',background:C.teal,borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>}

        {notsMes.length===0&&<div style={{textAlign:'center',padding:'12px 0',fontSize:12,color:C.muted}}>Nenhuma notificacao neste mes</div>}
      </div>)}
    </div>

    {/* SUBNUCLEOS - REGISTRO DE TREINAMENTOS */}
    <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Subnucleos - Treinamentos</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <button onClick={()=>setFiltroSub('todos')} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub==='todos'?C.teal:'transparent',color:filtroSub==='todos'?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Todos</button>
      {SUBNUCLEOS_HNSA.map(sub=>(
        <button key={sub.id} onClick={()=>setFiltroSub(sub.id)} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub===sub.id?sub.color:'transparent',color:filtroSub===sub.id?'#fff':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>
          <span style={{fontSize:13}}>{sub.icon}</span> {sub.label.split(' ')[0]}
        </button>
      ))}
    </div>

    {SUBNUCLEOS_HNSA.filter(sub=>filtroSub==='todos'||filtroSub===sub.id).map(sub=>{
      const regs=s.treins.filter(t=>t.subnucleo===sub.id);
      const treins=regs.filter(t=>t.tipo==='treinamento');
      const reunioes=regs.filter(t=>t.tipo==='reuniao');
      const totalPart=regs.reduce((acc,r)=>acc+(r.participantes||0),0);
      return(<div key={sub.id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px',marginBottom:8}}>
        {/* Header do subnúcleo */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
          <span style={{fontSize:20}}>{sub.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{sub.label}</div>
            <div style={{fontSize:10,color:C.muted}}>
              {treins.length} treinamento(s) · {reunioes.length} reuniao(oes) · {totalPart} participantes
            </div>
          </div>
          <button onClick={()=>setShowFormTrein(showFormTrein===sub.id?null:sub.id)}
            style={{background:sub.color+'22',border:'1px solid '+sub.color+'44',borderRadius:8,padding:'4px 10px',color:sub.color,fontSize:11,fontWeight:700,cursor:'pointer',flexShrink:0}}>
            {showFormTrein===sub.id?'Cancelar':'+ Registrar'}
          </button>
        </div>

        {/* Barrinhas rápidas */}
        {regs.length>0&&<div style={{display:'flex',gap:8,marginBottom:showFormTrein===sub.id?8:0}}>
          <div style={{flex:1,background:sub.color+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:sub.color}}>{treins.length}</div>
            <div style={{fontSize:9,color:C.muted}}>Treinamentos</div>
          </div>
          <div style={{flex:1,background:C.teal+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:C.teal}}>{reunioes.length}</div>
            <div style={{fontSize:9,color:C.muted}}>Reunioes</div>
          </div>
          <div style={{flex:1,background:C.blue+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:C.blue}}>{totalPart}</div>
            <div style={{fontSize:9,color:C.muted}}>Participantes</div>
          </div>
        </div>}

        {/* Form de registro */}
        {showFormTrein===sub.id&&(<div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:10,padding:'12px',marginTop:8}}>
          <div style={{fontSize:11,fontWeight:700,color:C.text,marginBottom:8}}>Novo registro - {sub.label}</div>
          {/* Tipo */}
          <div style={{display:'flex',gap:6,marginBottom:8}}>
            {['treinamento','reuniao'].map(t=>(
              <button key={t} onClick={()=>setFormTrein(f=>({...f,tipo:t}))}
                style={{flex:1,padding:'6px',borderRadius:8,border:'1px solid '+(formTrein.tipo===t?sub.color:C.border),background:formTrein.tipo===t?sub.color+'22':'transparent',color:formTrein.tipo===t?sub.color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer',textTransform:'capitalize'}}>
                {t==='treinamento'?'Treinamento':'Reuniao NSP'}
              </button>
            ))}
          </div>
          {/* Data */}
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Data</div>
            <input type="date" value={formTrein.data} onChange={e=>setFormTrein(f=>({...f,data:e.target.value}))}
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          {/* Participantes */}
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Numero de participantes *</div>
            <input type="number" min="1" value={formTrein.participantes} onChange={e=>setFormTrein(f=>({...f,participantes:e.target.value}))}
              placeholder="Ex: 12"
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          {/* Protocolo/tema */}
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Tema / Protocolo abordado</div>
            <input type="text" value={formTrein.protocolo} onChange={e=>setFormTrein(f=>({...f,protocolo:e.target.value}))}
              placeholder="Ex: Higienizacao das maos, Protocolo de queda..."
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          <button onClick={()=>salvarTrein(sub.id)} disabled={savingTrein}
            style={{width:'100%',background:sub.color,border:'none',borderRadius:10,padding:'10px',color:'#fff',fontWeight:800,fontSize:13,cursor:'pointer'}}>
            {savingTrein?'Salvando...':'Salvar registro'}
          </button>
        </div>)}

        {/* Últimos registros */}
        {regs.length===0&&showFormTrein!==sub.id&&<div style={{background:C.yellow+'15',color:C.yellow,borderRadius:6,padding:'3px 8px',fontSize:10,fontWeight:700,display:'inline-block'}}>Sem registro</div>}
        {regs.slice(0,2).map((r,i)=>(
          <div key={i} style={{borderLeft:'2px solid '+sub.color+'44',paddingLeft:8,marginTop:6}}>
            <div style={{fontSize:11,color:C.text}}>{r.protocolo||r.descricao||r.tipo||'-'}</div>
            <div style={{fontSize:10,color:C.muted}}>
              {r.data?new Date(r.data+'T12:00:00').toLocaleDateString('pt-BR'):'-'} · {r.participantes||0} participantes
            </div>
          </div>
        ))}
      </div>);
    })}
  </div>);
}

      <StatCard icon={String.fromCodePoint(128203)} label="Administrativas" value={loading?'...':s.adm} sub={s.total?`${Math.round(s.adm/Math.max(s.total,1)*100)}% do mês`:'-'} color={C.purple}/>

      <div style={{fontSize:32,fontWeight:900,color:s.diasSemSentinela>=30?C.green:C.yellow,lineHeight:1}}>{s.diasSemSentinela}</div>
      <div><div style={{fontSize:13,fontWeight:700,color:s.diasSemSentinela>=30?C.green:C.yellow}}>dias sem evento sentinela</div><div style={{fontSize:11,color:C.muted}}>Meta ONA: 90 dias</div></div>
    </div>}

    {/* Botão notificar */}
    <button onClick={()=>setView('notificar')} style={{background:'linear-gradient(135deg,'+C.teal+'22,'+C.blue+'33)',border:'1px solid '+C.teal+'55',borderRadius:16,padding:'18px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',width:'100%'}}>
      <div style={{textAlign:'left'}}><div style={{fontSize:16,fontWeight:800,color:C.teal}}>+ Nova Notificação</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>Registre um evento agora</div></div>
      <IconMsg size={26} color={C.teal}/>
    </button>

    {/* Notificações recentes (NSP) */}
    {gestorMode&&recent.length>0&&<div>
      <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:600,marginBottom:10}}>Notificações recentes</div>
      {recent.map((n,i)=>{
        const tag=getTag(n);const title=getTitle(n);
        const isSentinela=n.gravidade==='Evento sentinela';
        return(<div key={n.id||i} style={{background:C.card,border:'1px solid '+(isSentinela?C.red:C.border),borderRadius:12,padding:'12px 14px',marginBottom:8}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
            <div style={{background:tag.color+'22',color:tag.color,borderRadius:6,padding:'3px 8px',fontSize:10,fontWeight:700,minWidth:38,textAlign:'center'}}>{tag.label}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600,color:C.text,textTransform:'capitalize'}}>{title}</div>
              <div style={{fontSize:11,color:C.muted}}>{n.sector} · {formatTime(n.created_at)}</div>
            </div>
            {isSentinela&&<div style={{background:C.red+'22',color:C.red,borderRadius:6,padding:'2px 7px',fontSize:10,fontWeight:700}}>Atencao SENTINELA</div>}
          </div>
          {/* Badges + botões RCA / Notivisa */}
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            <span style={{fontSize:10,background:n.rca_gerado?C.green+'20':C.yellow+'20',color:n.rca_gerado?C.green:C.yellow,borderRadius:4,padding:'2px 7px',fontWeight:700}}>{n.rca_gerado?String.fromCodePoint(9989)+' Causa Raiz':String.fromCodePoint(9888)+' Sem Análise'}</span>
            <span style={{fontSize:10,background:n.notivisa_enviado?C.green+'20':C.muted+'20',color:n.notivisa_enviado?C.green:C.muted,borderRadius:4,padding:'2px 7px',fontWeight:700}}>{n.notivisa_enviado?String.fromCodePoint(9989)+' Notivisa':'- Notivisa'}</span>
            {!n.rca_gerado&&(n.notification_type==='seguranca_paciente'||n.notification_type==='ccih')&&
              <button onClick={()=>setRcaTarget(n)} style={{fontSize:10,background:C.blue+'20',color:C.blue,border:'1px solid '+C.blue+'44',borderRadius:4,padding:'2px 7px',fontWeight:700,cursor:'pointer'}}> Gerar RCA</button>}
            {!n.notivisa_enviado&&(n.notification_type==='seguranca_paciente'||n.notification_type==='ccih')&&
              <button onClick={()=>setNotiVisaTarget(n)} style={{fontSize:10,background:C.purple+'20',color:C.purple,border:'1px solid '+C.purple+'44',borderRadius:4,padding:'2px 7px',fontWeight:700,cursor:'pointer'}}>List Notivisa</button>}
            <button onClick={()=>setRiscoTarget(n)} style={{fontSize:10,background:n.risco_classificacao?({'BAIXO':C.green,'MÉDIO':C.yellow,'ALTO':C.red,'EXTREMO':'#7C0000'}[n.risco_classificacao]||C.muted)+'20':C.muted+'20',color:n.risco_classificacao?({'BAIXO':C.green,'MÉDIO':C.yellow,'ALTO':C.red,'EXTREMO':'#7C0000'}[n.risco_classificacao]||C.muted):C.muted,border:'1px solid transparent',borderRadius:4,padding:'2px 7px',fontWeight:700,cursor:'pointer'}}>
              {n.risco_classificacao?`Atencao ${n.risco_classificacao}`:'ATENCAO Risco'}
            </button>
            <button onClick={()=>setPlanoTarget(n)} style={{fontSize:10,background:C.orange+'20',color:C.orange,border:'1px solid '+C.orange+'44',borderRadius:4,padding:'2px 7px',fontWeight:700,cursor:'pointer'}}>List Plano</button>
          </div>
        </div>);
      })}
    </div>}
  {gestorMode&&<ListaMensal sbUrl={sbUrl} sbKey={sbKey} onSelect={()=>{}}/>}
  </div>);
}

// --- NOTIFICAR VIEW ----------------------------------------------------------
function NotificarView({sbUrl,sbKey,webhookUrl,testMode,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;

  // -- STEPS -------------------------------------------------------------
  // SP:  perfil > tipo > subtipo > [avp_motivo] > setor > data > relato > medidas > nip > idade > sexo > desfecho > preventivel > resumo > done
  // ADM: perfil > tipo > subtipo_adm > setor > data > relato > medidas > resumo > done
  // PAC/FAM: perfil > subtipo > [avp_motivo] > setor > data > relato > medidas > nip > idade > sexo > desfecho > preventivel > resumo > done

  const [step,setStep]=useState('perfil');
  const [dados,setDados]=useState({});
  const [messages,setMessages]=useState([]);
  const [historico,setHistorico]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,step,loading]);

  const hojeISO=new Date().toISOString().slice(0,10);
  const ontemISO=new Date(Date.now()-86400000).toISOString().slice(0,10);
  const horaNum=new Date().getHours();
  const turnoAtual=horaNum>=7&&horaNum<13?'Manhã':horaNum>=13&&horaNum<19?'Tarde':'Noite';

  const addMsg=(role,txt)=>setMessages(p=>[...p,{role,content:txt}]);

  // -- AVANÇAR PASSO ------------------------------------------------------
  const avancar=(novosDados,proximoStep,pergunta)=>{
    setHistorico(h=>[...h,{step,dados:{...dados},msgCount:messages.length}]);
    setDados(novosDados);
    if(pergunta) addMsg('assistant',pergunta);
    setStep(proximoStep);
  };

  const voltar=()=>{
    if(historico.length===0) return;
    const prev=historico[historico.length-1];
    setHistorico(h=>h.slice(0,-1));
    setStep(prev.step);
    setDados(prev.dados);
    setMessages(m=>m.slice(0,prev.msgCount));
    setInput('');
  };

  const isSP=(d)=>['seguranca_paciente','ccih'].includes(d.notification_type||dados.notification_type||'seguranca_paciente');
  const isADM=(d)=>(d.notification_type||dados.notification_type)==='administrativa';
  const isCCIH=(d)=>(d.notification_type||dados.notification_type)==='ccih';

  // -- LÓGICA PRINCIPAL DE RESPOSTA ---------------------------------------
  const responder=(valor,label)=>{
    const txt=label||valor;
    addMsg('user',txt);
    const d={...dados};

    switch(step){

      case 'perfil':{
        d.notifier_type=valor;
        const isPacFam=valor==='paciente'||valor==='familiar'||valor==='anonimo';
        if(isPacFam){
          d.notification_type='seguranca_paciente';
          avancar(d,'subtipo','Lamentamos o ocorrido. O que aconteceu?');
        } else {
          avancar(d,'tipo','O evento está relacionado ao **paciente**, é uma **ocorrência administrativa** ou **infecção hospitalar (CCIH)**?');
        }
        break;
      }

      case 'tipo':{
        d.notification_type=valor;
        if(valor==='seguranca_paciente'){
          avancar(d,'subtipo','Qual foi o tipo de evento de segurança do paciente?');
        } else {
          avancar(d,'subtipo_adm','Qual o tipo de ocorrência administrativa?');
        }
        break;
      }

      case 'subtipo':{
        d.event_subtype=valor;
        if(valor==='Perda de AVP'){
          avancar(d,'avp_motivo','Qual foi o motivo da perda do acesso venoso periférico?');
        } else {
          avancar(d,'setor','Em qual setor ocorreu?');
        }
        break;
      }

      case 'subtipo_adm':{
        d.event_subtype=valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'avp_motivo':{
        d.event_subtype='Perda de AVP - '+valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'setor':{
        d.sector=valor;
        avancar(d,'data','Quando ocorreu o evento?');
        break;
      }

      case 'data':{
        let date=hojeISO,turno=turnoAtual;
        if(txt.includes('Manhã de hoje')){date=hojeISO;turno='Manhã';}
        else if(txt.includes('Tarde de hoje')){date=hojeISO;turno='Tarde';}
        else if(txt.includes('Noite de hoje')||txt.includes('Noite/madrugada')){date=hojeISO;turno='Noite';}
        else if(txt.includes('Manhã de ontem')){date=ontemISO;turno='Manhã';}
        else if(txt.includes('Tarde de ontem')){date=ontemISO;turno='Tarde';}
        else if(txt.includes('Noite de ontem')){date=ontemISO;turno='Noite';}
        else if(txt.toLowerCase().includes('hoje')){date=hojeISO;}
        else if(txt.toLowerCase().includes('ontem')){date=ontemISO;}
        d.event_date=date;d.shift=turno;
        avancar(d,'relato','Descreva o que aconteceu com o máximo de detalhes:');
        break;
      }

      case 'relato':{
        d.description=valor;
        avancar(d,'medidas','Quais medidas foram tomadas imediatamente após o evento?');
        break;
      }

      case 'medidas':{
        d.measures_taken=valor;
        if(isSP(d)){
          avancar(d,'nip','**NIP do paciente** (número de identificação):\n\nO NIP permite ao NSP rastrear os dados completos no prontuário. Se não souber, clique em "Não sei / Anônimo".');
        } else {
          gerarResumo(d);
        }
        break;
      }

      case 'nip':{
        if(valor!=='nao_informar') d.patient_nip=valor;
        avancar(d,'nome_pac','Nome completo do paciente (ou deixe em branco):');
        break;
      }

      case 'nome_pac':{
        if(valor&&valor.toLowerCase()!=='não informar'&&valor.toLowerCase()!=='nao informar') d.patient_name=valor;
        avancar(d,'idade','Idade do paciente (em anos):');
        break;
      }

      case 'idade':{
        if(valor&&valor!=='nao_informar'&&valor!=='Não informar') d.patient_age=parseInt(valor)||valor;
        avancar(d,'sexo','Sexo do paciente:');
        break;
      }

      case 'sexo':{
        if(valor!=='nao_informar') d.patient_sex=valor;
        avancar(d,'data_admissao','Data de admissao do paciente (ou "nao informar"):');
        break;
      }

      case 'data_admissao':{
        if(valor&&valor!=='nao informar'&&valor!=='nao_informar') d.patient_admission=valor;
        avancar(d,'desfecho','Qual foi o desfecho para o paciente?');
        break;
      }

      case 'desfecho':{
        d.patient_outcome=valor;
        avancar(d,'preventivel','O evento era evitável?');
        break;
      }

      case 'preventivel':{
        d.was_preventable=valor==='Sim'||txt.toLowerCase().includes('sim');
        gerarResumo(d);
        break;
      }

      default: break;
    }
  };

  // -- PULAR CAMPO OPCIONAL -----------------------------------------------
  const pular=()=>{
    const pulos={
      nip:'idade',
      idade:'sexo',
      sexo:'desfecho',
    };
    const proximo=pulos[step];
    if(!proximo) return;
    const perguntas={
      idade:'Idade aproximada do paciente:',
      sexo:'Sexo do paciente:',
      desfecho:'Qual foi o desfecho para o paciente?',
    };
    addMsg('user','Não informado');
    avancar({...dados},proximo,perguntas[proximo]);
  };

  // -- RESUMO COM IA ------------------------------------------------------
  const gerarResumo=async(d)=>{
    setDados(d);setStep('resumo');setLoading(true);
    const ctx=[
      `Tipo: ${d.notification_type}`,
      d.event_subtype?`Evento: ${d.event_subtype}`:'',
      d.sector?`Setor: ${d.sector}`:'',
      d.event_date?`Data: ${new Date(d.event_date+'T12:00:00').toLocaleDateString('pt-BR')} (${d.shift||''})` :'',
      d.description?`Descrição: ${d.description}`:'',
      d.measures_taken?`Medidas: ${d.measures_taken}`:'',
      d.patient_nip?`NIP: ${d.patient_nip}`:'',
d.patient_name?`Paciente: ${d.patient_name}`:'',
d.patient_age?`Idade: ${d.patient_age} anos`:'',
      d.patient_age_range?`Idade: ${d.patient_age_range}`:'',
      d.patient_sex?`Sexo: ${d.patient_sex}`:'',
      d.patient_outcome?`Desfecho: ${d.patient_outcome}`:'',
      d.was_preventable!==undefined?`Evitável: ${d.was_preventable?'Sim':'Não'}` :'',
    ].filter(Boolean).join(', ');
    try{
      const resumo=await callWorker(
        [{role:'user',content:`Faça um resumo técnico objetivo em 3-4 linhas desta notificação hospitalar, em português. Inclua os dados mais relevantes: ${ctx}`}],
        'Você é assistente do NSP. Resuma de forma objetiva e técnica. Máximo 4 linhas. Não faça perguntas.'
      );
      addMsg('assistant',`**Resumo da notificação:**\n\n${resumo}\n\nAs informações estão corretas?`);
      setDados({...d,ai_summary:resumo});
    }catch{
      addMsg('assistant',`**Resumo:** ${ctx}\n\nAs informações estão corretas?`);
    }
    setLoading(false);
  };

  // -- CONFIRMAR E SALVAR -------------------------------------------------
  const confirmar=async()=>{
    setSaving(true);addMsg('user','Sim, confirmar e enviar.');
    try{
      const payload={
        notification_type:dados.notification_type||'seguranca_paciente',
        notifier_type:dados.notifier_type||'profissional',
        sector:dados.sector||null,
        event_date:dados.event_date||null,
        shift:dados.shift||null,
        event_subtype:dados.event_subtype||null,
        description:dados.description||null,
        measures_taken:dados.measures_taken||null,
        patient_outcome:dados.patient_outcome||null,
        was_preventable:dados.was_preventable===true?true:dados.was_preventable===false?false:null,
        occurrence_subtype:dados.notification_type!=='seguranca_paciente'?(dados.event_subtype||null):null,
        patient_age:dados.patient_age||null,
        patient_admission:dados.patient_admission||null,
        admission_reason:[dados.patient_nip?'NIP: '+dados.patient_nip:'', dados.patient_name?dados.patient_name:'', dados.patient_age?dados.patient_age+' anos':'', dados.patient_sex||''].filter(Boolean).join(' | ')||null,
        avp_motivo:dados.event_subtype==='Perda de AVP'?(dados.avp_motivo||null):null,
        ai_summary:dados.ai_summary||null,
        is_test:testMode||false,
        hospital_id:h.id,
        chat_history:messages,
      };
      let protocolo='';
      if(sbUrl&&sbKey){
        const res=await sbInsert(sbUrl,sbKey,'notifications',payload);
        protocolo=res?.[0]?.id?res[0].id.slice(0,8).toUpperCase():Math.random().toString(36).slice(2,10).toUpperCase();
        if(webhookUrl){try{await fetch(webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,protocolo,hospital_name:h.name})});}catch{}}
        showToast('Notificação salva! Gestor será notificado.','success');
      } else {
        protocolo=Math.random().toString(36).slice(2,10).toUpperCase();
        showToast('Notificação registrada!','success');
      }
      addMsg('assistant','Notificação enviada com sucesso!\n\nProtocolo: '+protocolo+'\n\nGuarde este número. O Gestor foi notificado.\n\nObrigado por contribuir com a segurança do HNSA.');
      setStep('done');
    }catch{showToast('Erro ao salvar. Tente novamente.','error');}
    setSaving(false);
  };

  const corrigir=()=>{
    addMsg('user','Quero corrigir.');
    addMsg('assistant','Certo. Descreva novamente o que aconteceu:');
    setStep('relato');
  };

  // -- CHIPS POR STEP -----------------------------------------------------
  const CHIPS_MAP={
    perfil:[
      {v:'profissional',l:'Enfermeiro(a)'},
      {v:'profissional',l:'Médico(a)'},
      {v:'profissional',l:'Técnico(a) de Enfermagem'},
      {v:'profissional',l:'Fisioterapeuta'},
      {v:'profissional',l:'Farmacêutico(a)'},
      {v:'profissional',l:'Outro profissional de saúde'},
      {v:'paciente',l:'Sou paciente'},
      {v:'familiar',l:'Sou familiar / acompanhante'},
      {v:'anonimo',l:'Notificação anônima'},
    ],
    tipo:[
      {v:'seguranca_paciente',l:'Relacionado ao paciente'},
      {v:'administrativa',l:'Ocorrência administrativa'},
    ],
    subtipo_sp:[
      {v:'Queda',l:'Queda'},
      {v:'Lesão por pressão',l:'Lesão por pressão'},
      {v:'Perda de AVP',l:'Perda de acesso venoso (AVP)'},
      {v:'Erro de medicação',l:'Erro de medicação / prescrição'},
      {v:'Falha na identificação',l:'Falha na identificação do paciente'},
      {v:'Cirurgia segura',l:'Evento relacionado à cirurgia'},
      {v:'Perda de SNE',l:'Perda de SNE / SNG'},
      {v:'Near miss',l:'Near miss (quase erro)'},
      {v:'Evento sentinela',l:'Evento sentinela'},
      {v:'Outro',l:'Outro evento'},
    ],
    subtipo_ccih:[
      {v:'ITU',l:'ITU - Infecção do Trato Urinário'},
      {v:'PAV',l:'PAV - Pneumonia por VM'},
      {v:'ISC',l:'ISC - Infecção de Sítio Cirúrgico'},
      {v:'IPCS',l:'IPCS - Corrente Sanguínea'},
      {v:'Outro foco',l:'Outro foco de infecção'},
    ],
    subtipo_adm:[
      {v:'Segurança orgânica',l:'Segurança orgânica'},
      {v:'Laboratório',l:'Laboratório'},
      {v:'Hotelaria / limpeza',l:'Hotelaria / limpeza'},
      {v:'Nutrição / dieta',l:'Nutrição / dieta'},
      {v:'Vestimenta / adornos',l:'Vestimenta inadequada / adornos'},
      {v:'Farmácia',l:'Farmácia'},
      {v:'Infraestrutura / manutenção',l:'Infraestrutura / manutenção'},
      {v:'Comunicação / documentação',l:'Comunicação / documentação'},
      {v:'Outro',l:'Outro'},
    ],
    avp_motivo:[
      {v:'Flebite',l:'Flebite'},
      {v:'Infiltração',l:'Infiltração'},
      {v:'Extravasamento',l:'Extravasamento'},
      {v:'Paciente removeu',l:'Paciente removeu / arrancou'},
      {v:'Saída acidental',l:'Saída acidental durante procedimento'},
      {v:'Obstrução / coagulação',l:'Obstrução / coagulação'},
      {v:'Fixação inadequada',l:'Fixação inadequada'},
      {v:'Não identificado',l:'Não identificado'},
    ],
    setor: h.sectors.map(s=>({v:s,l:s})),
    data:[
      {v:'Manhã de hoje',l:'Manhã de hoje (07h-13h)'},
      {v:'Tarde de hoje',l:'Tarde de hoje (13h-19h)'},
      {v:'Noite de hoje',l:'Noite/madrugada de hoje (19h-07h)'},
      {v:'Manhã de ontem',l:'Manhã de ontem'},
      {v:'Tarde de ontem',l:'Tarde de ontem'},
      {v:'Noite de ontem',l:'Noite de ontem'},
    ],
    idade:[
      {v:'nao_informar',l:'Não informar'},
    ],
    sexo:[
      {v:'Masculino',l:'Masculino'},
      {v:'Feminino',l:'Feminino'},
      {v:'nao_informar',l:'Prefiro não informar'},
    ],
    desfecho:[
      {v:'Sem dano',l:'Sem dano'},
      {v:'Dano leve',l:'Dano leve - recuperação completa'},
      {v:'Dano moderado',l:'Dano moderado - requer tratamento adicional'},
      {v:'Dano grave',l:'Dano grave - permanente ou longa internação'},
      {v:'Óbito',l:'Óbito'},
      {v:'Near miss - sem dano',l:'Near miss - não atingiu o paciente'},
    ],
    preventivel:[
      {v:'Sim',l:'Sim, era evitável'},
      {v:'Não',l:'Não era evitável'},
      {v:'Não sei',l:'Não sei avaliar'},
    ],
  };

  const chipsAtivos=()=>{
    if(step==='subtipo') return CHIPS_MAP.subtipo_sp;
    return CHIPS_MAP[step]||[];
  };

  // -- PROGRESSO ---------------------------------------------------------
  const ORDEM_SP=['perfil','tipo','subtipo','avp_motivo','setor','data','relato','medidas','nip','nome_pac','idade','sexo','data_admissao','desfecho','preventivel','resumo'];
  const ORDEM_ADM=['perfil','tipo','subtipo_adm','setor','data','relato','medidas','resumo'];
  const ORDEM_PACFAM=['perfil','subtipo','avp_motivo','setor','data','relato','medidas','nip','nome_pac','idade','sexo','data_admissao','desfecho','preventivel','resumo'];

  const getOrdem=()=>{
    const t=dados.notification_type;
    if(t==='administrativa') return ORDEM_ADM;
    if(dados.notifier_type==='paciente'||dados.notifier_type==='familiar'||dados.notifier_type==='anonimo') return ORDEM_PACFAM;
    return ORDEM_SP;
  };

  const getProgresso=()=>{
    const ordem=getOrdem().filter(s=>dados.event_subtype==='Perda de AVP'?true:s!=='avp_motivo');
    const idx=ordem.indexOf(step);
    return{atual:Math.max(idx,0)+1,total:ordem.length};
  };

  const LABELS_STEP={
    perfil:'Identificação',
    tipo:'Tipo de evento',
    subtipo:'O que aconteceu?',
    subtipo_adm:'Tipo de ocorrência',
    avp_motivo:'Motivo da perda do AVP',
    setor:'Setor',
    data:'Quando?',
    relato:'Descrição do evento',
    medidas:'Medidas tomadas',
    nip:'Identificação do paciente',
nome_pac:'Nome do paciente',
idade:'Idade do paciente',
    idade:'Idade do paciente',
    sexo:'Sexo do paciente',
    desfecho:'Desfecho',
    preventivel:'Evitabilidade',
        data_admissao:'Data de admissao',
    resumo:'Confirmação',
    done:'Concluído',
  };

  const chips=chipsAtivos();
  const prog=step!=='done'?getProgresso():{atual:1,total:1};
  const inputSteps=['relato','medidas','nip','nome_pac','idade','setor','data','data_admissao'];
  const showInput=inputSteps.includes(step)&&!loading&&!saving;
  const showPular=['nip','nome_pac','idade','sexo'].includes(step)&&!loading&&!saving;
  const showConfirm=step==='resumo'&&!loading&&!saving;

  // -- MENSAGEM INICIAL ---------------------------------------------------
  useEffect(()=>{
    setMessages([{role:'assistant',content:'Olá! Vamos registrar a notificação passo a passo.\n\n**Quem é você?**\n\nVocê pode notificar anonimamente se preferir - nenhum dado pessoal é obrigatório.'}]);
  },[]);

  // -- RENDER -------------------------------------------------------------
  return(<div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 64px)'}}>

    {/* Header com barra de progresso */}
    <div style={{padding:'12px 16px',borderBottom:'1px solid '+C.border,background:C.surface}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:step!=='done'?6:0}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text}}>Registrar Notificação</div>
        {step!=='done'&&<div style={{display:'flex',alignItems:'center',gap:8}}>{historico.length>0&&<button onClick={voltar} style={{background:'none',border:'none',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer',padding:'2px 6px',borderRadius:6,border:'1px solid '+C.teal+'44'}}>Voltar</button>}<div style={{fontSize:11,color:C.muted,fontWeight:600}}>Passo {prog.atual}/{prog.total}</div></div>}
      </div>
      {step!=='done'&&<div>
        <div style={{height:3,background:C.border,borderRadius:2,overflow:'hidden',marginBottom:4}}>

        </div>
        <div style={{fontSize:10,color:C.teal,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>{LABELS_STEP[step]||''}</div>
      </div>}
    </div>

    {/* Área de mensagens */}
    <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:10}}>
      {messages.map((m,i)=>(
        <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
          <div style={{maxWidth:'88%',background:m.role==='user'?'linear-gradient(135deg,'+C.teal+','+C.blue+')':C.card,border:m.role==='assistant'?'1px solid '+C.border:'none',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'11px 14px',fontSize:14,color:m.role==='user'?'#fff':C.text,lineHeight:1.65}}
            dangerouslySetInnerHTML={{__html:md(m.content)}}/>
        </div>
      ))}
      {(loading||saving)&&<div style={{display:'flex',alignItems:'center',gap:8}}>
        <Dots/>
        {saving&&<span style={{fontSize:12,color:C.green}}>Salvando...</span>}
      </div>}
      <div ref={endRef}/>
    </div>

    {/* Área de entrada */}
    {step!=='done'&&(
      <div style={{borderTop:'1px solid '+C.border,background:C.surface}}>

        {/* Chips clicáveis */}
        {chips.length>0&&!loading&&!saving&&(
          <div style={{padding:'10px 14px 6px',display:'flex',flexWrap:'wrap',gap:7,maxHeight:200,overflowY:'auto'}}>
            {chips.map((c,i)=>(
              <button key={i} onClick={()=>responder(c.v,c.l)}
                style={{background:C.card,border:'1px solid '+C.teal+'55',borderRadius:20,padding:'7px 14px',color:C.teal,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                {c.l}
              </button>
            ))}
          </div>
        )}

        {/* Botão pular (campos opcionais) */}
        {showPular&&(
          <div style={{padding:'4px 14px 0',display:'flex',justifyContent:'flex-end'}}>
            <button onClick={pular} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>
              Pular (não informar)
            </button>
          </div>
        )}

        {/* Botões confirmar / corrigir */}
        {showConfirm&&(
          <div style={{padding:'8px 14px 6px',display:'flex',gap:8}}>
            <button onClick={confirmar} style={{flex:2,background:C.teal,border:'none',borderRadius:12,padding:'13px',color:'#06101F',fontWeight:800,fontSize:13,cursor:'pointer'}}>
              Confirmar e Enviar
            </button>
            <button onClick={corrigir} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'13px',color:C.muted,fontWeight:600,fontSize:12,cursor:'pointer'}}>
              Corrigir
            </button>
          </div>
        )}

        {/* Campo texto livre */}
        {showInput&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input type={(step==='data'||step==='data_admissao')?'date':'text'} value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder={
                step==='nip'?'Digite o NIP do paciente...' :
                step==='relato'?'Descreva o que aconteceu...' :
                step==='medidas'?'Descreva as medidas tomadas...' :
                chips.length>0?'Ou escreva livremente...' :
                'Escreva aqui...'
              }
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}

        {/* NIP - só texto (sem chips) */}
        {step==='nip'&&!loading&&!saving&&chips.length===0&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input type={(step==='data'||step==='data_admissao')?'date':'text'} value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder="Digite o NIP do paciente..."
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}
      </div>
    )}
  </div>);
}

  visualizado:{label:'Visualizado',color:'#8B5CF6',bg:'#8B5CF622'},

function TicketForm({sbUrl,sbKey,hospital,showToast,onBack}) {
  const [step,setStep]=useState('type');
  const [type,setType]=useState(null);
  const [form,setForm]=useState({sector:'',responsavel:'',description:'',priority:'normal',patient_name:'',destination:'',scheduled_at:'',requester_name:''});
  const [saving,setSaving]=useState(false);
  const h=hospital||DEFAULT_HOSPITAL;
  const tt=TICKET_TYPES.find(t=>t.id===type)||TICKET_TYPES[0];

  const submit=async()=>{
    if(!form.description.trim()){showToast('Descreva o chamado','error');return;}
    setSaving(true);
    try {
      const payload={hospital_id:h.id,ticket_type:type,responsavel:form.responsavel||null,origin_sector:form.sector,description:form.description,priority:form.priority,patient_name:form.patient_name||null,requester_name:form.requester_name||null,destination_sector:tt?.dest||null,scheduled_at:form.scheduled_at||null,status:'aberto',opened_at:new Date().toISOString()};
      if(sbUrl&&sbKey) await sbInsert(sbUrl,sbKey,'tickets',payload);
      showToast('OK Chamado aberto! '+tt?.dest+' foi notificado.','success');
      setStep('done');
    } catch(e) { showToast('Erro: '+e.message,'error'); }
    setSaving(false);
  };

  const inp={background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'11px 14px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:12};
  const lbl={fontSize:11,color:C.muted,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:6};

  if(step==='done') return(<div style={{padding:32,textAlign:'center'}}>
    <div style={{fontSize:52,marginBottom:14}}>OK</div>
    <div style={{fontSize:18,fontWeight:900,color:C.text,marginBottom:8}}>Chamado aberto!</div>
    <div style={{fontSize:14,color:C.muted,marginBottom:24}}>{tt?.dest} foi notificado.</div>
    <button onClick={onBack} style={{background:C.teal,border:'none',borderRadius:12,padding:'12px 28px',color:'#06101F',fontWeight:800,fontSize:14,cursor:'pointer'}}>Ver chamados</button>
  </div>);

  if(step==='type') return(<div style={{padding:'20px 16px'}}>
    {onBack&&<button onClick={onBack} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:16}}>←</button>}
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:4}}>Novo Chamado</div>
    <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Qual o tipo de chamado?</div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {TICKET_TYPES.map(t=>(
        <button key={t.id} onClick={()=>{setType(t.id);setStep('form');}} style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:14,cursor:'pointer',textAlign:'left'}}>
          <div style={{width:44,height:44,borderRadius:12,background:t.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{ticketEmoji(t.icon)}</div>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:C.text}}>{t.label}</div><div style={{fontSize:11,color:C.muted}}> {t.dest} · {t.desc}</div></div>
        </button>
      ))}
    </div>
  </div>);

  return(<div style={{padding:'20px 16px'}}>
    <button onClick={()=>setStep('type')} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:8}}>←</button>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <div style={{width:44,height:44,borderRadius:12,background:tt?.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>{tt?.icon}</div>
      <div><div style={{fontSize:16,fontWeight:800,color:C.text}}>{tt?.label}</div><div style={{fontSize:11,color:C.muted}}>-> {tt?.dest}</div></div>
    </div>
    <label style={lbl}>Setor de origem</label>
    <select value={form.sector} onChange={e=>setForm({...form,sector:e.target.value})} style={{...inp,appearance:'none'}}>
      <option value="">Selecione o setor</option>
      {h.sectors.map(s=><option key={s} value={s}>{s}</option>)}
    </select>
    <label style={lbl}>Solicitante (opcional)</label>
    <input value={form.requester_name} onChange={e=>setForm({...form,requester_name:e.target.value})} placeholder="Nome" style={inp}/>
    {type==='transporte'&&<>
      <label style={lbl}>Nome do paciente</label>
      <input value={form.patient_name} onChange={e=>setForm({...form,patient_name:e.target.value})} placeholder="Nome completo (opcional)" style={inp}/>
      <label style={lbl}>Destino / Unidade de referência</label>
      <input value={form.destination} onChange={e=>setForm({...form,destination:e.target.value})} placeholder="Ex: Hospital Roberto Santos" style={inp}/>
      <label style={lbl}>Horário previsto</label>
      <input type="datetime-local" value={form.scheduled_at} onChange={e=>setForm({...form,scheduled_at:e.target.value})} style={inp}/>
    </>}
    <label style={lbl}>Responsável (opcional)</label>
      <input value={form.responsavel} onChange={e=>setForm({...form,responsavel:e.target.value})} placeholder="Ex: 1T Almeida, Enf. Costa..." style={{...inp,marginBottom:16}}/>
      <label style={lbl}>Descrição *</label>
    <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Descreva o chamado..." style={{...inp,height:90,resize:'none',fontFamily:'inherit'}}/>
    <label style={lbl}>Prioridade</label>
    <div style={{display:'flex',gap:8,marginBottom:16}}>
      {[['normal','Normal','#5A7AA0'],['urgente','Urgente','#F59E0B'],['critico','Crítico','#EF4444']].map(([id,label,color])=>(
        <button key={id} onClick={()=>setForm({...form,priority:id})} style={{flex:1,padding:'9px',borderRadius:8,border:'1px solid '+(form.priority===id?color:C.border),background:form.priority===id?color+'22':C.card,color:form.priority===id?color:C.muted,fontWeight:700,fontSize:12,cursor:'pointer'}}>{label}</button>
      ))}
    </div>
    <button onClick={submit} disabled={saving||!form.description.trim()} style={{width:'100%',background:tt?.color||C.teal,border:'none',borderRadius:12,padding:'14px',color:'#06101F',fontWeight:800,fontSize:14,cursor:'pointer',opacity:saving?0.7:1}}>
      {saving?'Aguarde Enviando...':`${tt?.icon} Abrir para ${tt?.dest}`}
    </button>
  </div>);
}

function TicketsList({sbUrl,sbKey,hospital,showToast,profileMode}) {
  const [tickets,setTickets]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filter,setFilter]=useState('todos');
  const [commenting,setCommenting]=useState(null);
  const [commentText,setCommentText]=useState('');
  const h=hospital||DEFAULT_HOSPITAL;
  const isDsg=profileMode==='dsg';
  const isMotorista=profileMode==='motorista';
  const isGestor=profileMode==='gestor';
  const canAct=isDsg||isMotorista||isGestor;

  const load=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try {
      let data=await sbSelect(sbUrl,sbKey,'tickets',`select=*&hospital_id=eq.${h.id}&order=opened_at.desc`);
      let r=data||[];
      if(isDsg) r=r.filter(t=>t.ticket_type==='manutencao');
      if(isMotorista) r=r.filter(t=>t.ticket_type==='ambulancia');
      setTickets(r);
    } catch { showToast('Erro ao carregar chamados','error'); }
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey,profileMode]);
  useEffect(()=>{
    if(!sbUrl||!sbKey||(!isDsg&&!isMotorista)||tickets.length===0) return;
    const toMark=tickets.filter(t=>t.status==='aberto');
    toMark.forEach(async t=>{try{await sbPatch(sbUrl,sbKey,'tickets',`id=eq.${t.id}`,{status:'visualizado',viewed_at:new Date().toISOString(),viewed_by:profileMode});}catch{}});
    if(toMark.length>0) setTickets(prev=>prev.map(t=>t.status==='aberto'?{...t,status:'visualizado'}:t));
  },[tickets.length,isDsg,isMotorista]);

  const updateStatus=async(ticket,newStatus,notes)=>{
    try {
      const patch={status:newStatus,responded_at:new Date().toISOString(),...(notes!==undefined?{response_notes:notes}:{}),...(newStatus==='concluido'?{closed_at:new Date().toISOString()}:{})};
      await sbPatch(sbUrl,sbKey,'tickets',`id=eq.${ticket.id}`,patch);
      setTickets(prev=>prev.map(t=>t.id===ticket.id?{...t,...patch}:t));
      setCommenting(null);setCommentText('');
      showToast({recebido:'? Recebido!',em_andamento:'Aguarde Em andamento!',concluido:'OK Concluído!',pendente:'ATENCAO Pendente'}[newStatus]||'Atualizado!','success');
    } catch { showToast('Erro ao atualizar','error'); }
  };

  const filtered=filter==='todos'?tickets:tickets.filter(t=>t.status===filter);
  const counts={aberto:tickets.filter(t=>t.status==='aberto').length,em_andamento:tickets.filter(t=>t.status==='em_andamento').length,pendente:tickets.filter(t=>['pendente','visualizado','recebido'].includes(t.status)).length};

  const renderActions=(ticket)=>{
    if(!canAct||ticket.status==='concluido') return null;
    const st=ticket.status;
    const isComm=commenting===ticket.id;
    if(isComm) return(<div style={{marginTop:8}}>
      <textarea value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="Comentário ou observação..." style={{width:'100%',background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'10px',color:C.text,fontSize:12,outline:'none',resize:'none',height:70,fontFamily:'inherit',marginBottom:8}}/>
      <div style={{display:'flex',gap:6}}>
        <button onClick={()=>{setCommenting(null);setCommentText('');}} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'8px',color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Cancelar</button>
        <button onClick={()=>updateStatus(ticket,st,commentText)} style={{flex:2,background:C.teal,border:'none',borderRadius:8,padding:'8px',color:'#06101F',fontSize:11,fontWeight:800,cursor:'pointer'}}>Chat Salvar</button>
      </div>
    </div>);
    return(<div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
      <button onClick={()=>setCommenting(ticket.id)} style={{flex:1,minWidth:80,background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'8px',color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Chat Comentar</button>
      {st==='visualizado'&&<button onClick={()=>updateStatus(ticket,'recebido')} style={{flex:1,minWidth:80,background:C.blue+'22',border:'1px solid '+C.blue+'44',borderRadius:8,padding:'8px',color:C.blue,fontSize:11,fontWeight:700,cursor:'pointer'}}> Recebido</button>}
      {st==='recebido'&&<button onClick={()=>updateStatus(ticket,'em_andamento')} style={{flex:1,minWidth:80,background:C.teal+'22',border:'1px solid '+C.teal+'44',borderRadius:8,padding:'8px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}> Andamento</button>}

    </div>);
  };

  if(!profileMode) return(<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'calc(100vh - 64px)',padding:32,textAlign:'center'}}>

    <div style={{fontSize:17,fontWeight:800,color:C.text,marginBottom:8}}>Acesso restrito</div>
    <div style={{fontSize:13,color:C.muted,maxWidth:260}}>Faça login para abrir ou visualizar chamados operacionais.</div>
  </div>);

  return(<div style={{padding:'0 0 80px',maxWidth:900,margin:'0 auto'}}>
    {/* Modal de edicao */}
    <BackHeader title='Chamados' subtitle={filtered.length+' chamado(s)'} right={<button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'16px'}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
      {[['aberto','Abertos',C.yellow],['em_andamento','Andamento',C.blue],['pendente','Pendentes',C.red]].map(([id,label,color])=>(
        <div key={id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 8px',textAlign:'center'}}>
          <div style={{fontSize:22,fontWeight:900,color}}>{counts[id]||0}</div>
          <div style={{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase'}}>{label}</div>
        </div>
      ))}
    </div>
    <div style={{display:'flex',gap:6,overflowX:'auto',marginBottom:14,paddingBottom:4}}>
      {[['todos','Todos'],['aberto','Aberto'],['visualizado','Visualizado'],['recebido','Recebido'],['em_andamento','Andamento'],['concluido','Concluído']].map(([id,label])=>(
        <button key={id} onClick={()=>setFilter(id)} style={{flexShrink:0,padding:'6px 12px',borderRadius:16,border:'none',background:filter===id?C.teal:C.card,color:filter===id?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>{label}</button>
      ))}
      <button onClick={load} style={{flexShrink:0,padding:'6px 12px',borderRadius:16,border:'1px solid '+C.border,background:'transparent',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}></button>
    </div>
    {loading&&<div style={{textAlign:'center',color:C.muted,padding:32}}>Carregando...</div>}
    {!loading&&filtered.length===0&&<div style={{textAlign:'center',color:C.muted,padding:32}}>Nenhum chamado{filter!=='todos'?' com este filtro':''}.</div>}
    {filtered.map(ticket=>{
      const tt=TICKET_TYPES.find(t=>t.id===ticket.ticket_type)||{id:'outro',label:ticket.ticket_type||'Chamado',icon:String.fromCodePoint(128203),color:'#5A7AA0',dest:'Gestao',desc:''};
      const st=TICKET_STATUS[ticket.status]||TICKET_STATUS.aberto;
      return(<div key={ticket.id} style={{background:C.card,border:'1px solid '+(ticket.status==='aberto'?'#F59E0B55':C.border),borderRadius:14,padding:14,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:8}}>
          <div style={{width:40,height:40,borderRadius:10,background:tt.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{ticketEmoji(tt.icon)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{tt.label}</div>
              <div style={{background:st.bg,color:st.color,borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:700,flexShrink:0}}>{st.label}</div>
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{ticket.origin_sector} -> {tt.dest} · {formatTime(ticket.opened_at)}</div>
            {ticket.requester_name&&<div style={{fontSize:11,color:C.teal,marginTop:2}}> {ticket.requester_name}</div>}
            {ticket.priority==='critico'&&<div style={{display:'inline-block',background:C.red+'22',color:C.red,borderRadius:4,padding:'1px 6px',fontSize:9,fontWeight:700,marginTop:3}}> CRÍTICO</div>}
            {ticket.priority==='urgente'&&<div style={{display:'inline-block',background:C.yellow+'22',color:C.yellow,borderRadius:4,padding:'1px 6px',fontSize:9,fontWeight:700,marginTop:3}}> URGENTE</div>}
          </div>
        </div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.5,marginBottom:8}}>{ticket.description}</div>
        {ticket.response_notes&&<div style={{background:C.surface,borderRadius:8,padding:'8px 10px',marginBottom:8,borderLeft:'3px solid '+(tt.color)}}>
          <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:2}}>{tt.dest}:</div>
          <div style={{fontSize:12,color:C.text}}>{ticket.response_notes}</div>
        </div>}
        {renderActions(ticket)}
      </div>);
    })}
  </div>
  </div>);
}

function ListaMensal({sbUrl,sbKey,onSelect}) {
  const hoje=new Date();
  const [mes,setMes]=React.useState(hoje.getMonth()+1);
  const [ano,setAno]=React.useState(hoje.getFullYear());
  const [nots,setNots]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [aberta,setAberta]=React.useState(false);
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const carregar=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{
      const mesStr=String(mes).padStart(2,'0');
      const inicio=`${ano}-${mesStr}-01`;
      const ultimoDia=new Date(ano,mes,0).getDate();
      const fim=`${ano}-${mesStr}-${ultimoDia}`;
      const data=await sbSelect(sbUrl,sbKey,'notifications',
        `event_date=gte.${inicio}&event_date=lte.${fim}&is_test=neq.true&order=event_date.asc&limit=200`);
      setNots(data||[]);
    }catch(e){setNots([]);}
    setLoading(false);
  };

  React.useEffect(()=>{if(aberta)carregar();},[mes,ano,aberta,sbUrl,sbKey]);

  const getTag=(n)=>{
    if(n.notification_type==='seguranca_paciente') return{l:'SP',c:C.red};
    if(n.notification_type==='ccih'||n.event_subtype?.startsWith('CCIH')) return{l:'CCIH',c:'#7C3AED'};
    return{l:'ADM',c:C.muted};
  };

  const navMes=(dir)=>{
    let m=mes+dir, a=ano;
    if(m>12){m=1;a++;}
    if(m<1){m=12;a--;}
    setMes(m);setAno(a);
  };

  const spCount=nots.filter(n=>n.notification_type==='seguranca_paciente'||n.notification_type==='ccih').length;
  const admCount=nots.filter(n=>n.notification_type==='administrativa').length;

  return(<div style={{marginBottom:12}}>
    {/* Header clicável */}
    <button onClick={()=>setAberta(a=>{if(!a)setTimeout(carregar,50);return!a;})}
      style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}>
      <div style={{fontSize:12,fontWeight:700,color:C.text}}>
        {String.fromCodePoint(128197)} Notificações do mês
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {!aberta&&nots.length>0&&<span style={{fontSize:11,color:C.muted}}>{nots.length} registros</span>}
        <span style={{fontSize:14,color:C.muted}}>{aberta?String.fromCodePoint(9650):String.fromCodePoint(9660)}</span>
      </div>
    </button>

    {aberta&&(<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:'0 0 12px 12px',borderTop:'none',overflow:'hidden'}}>
      {/* Navegação de mês */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 14px',borderBottom:'1px solid '+C.border}}>
        <button onClick={()=>navMes(-1)} style={{background:'none',border:'none',color:C.teal,fontSize:18,cursor:'pointer',padding:'0 4px'}}>{String.fromCodePoint(8249)}</button>
        <div style={{fontSize:13,fontWeight:700,color:C.text}}>{MESES[mes-1]}/{ano}</div>
        <button onClick={()=>navMes(1)} style={{background:'none',border:'none',color:mes===hoje.getMonth()+1&&ano===hoje.getFullYear()?C.muted:C.teal,fontSize:18,cursor:'pointer',padding:'0 4px'}}
          disabled={mes===hoje.getMonth()+1&&ano===hoje.getFullYear()}>{String.fromCodePoint(8250)}</button>
      </div>

      {/* Resumo rápido */}
      {nots.length>0&&<div style={{display:'flex',gap:8,padding:'8px 14px',borderBottom:'1px solid '+C.border}}>
        <span style={{fontSize:11,background:C.red+'15',color:C.red,borderRadius:6,padding:'2px 8px',fontWeight:700}}>SP+CCIH: {spCount}</span>
        <span style={{fontSize:11,background:C.muted+'15',color:C.muted,borderRadius:6,padding:'2px 8px',fontWeight:700}}>Adm: {admCount}</span>
        <span style={{fontSize:11,background:C.teal+'15',color:C.teal,borderRadius:6,padding:'2px 8px',fontWeight:700}}>Total: {nots.length}</span>
      </div>}

      {/* Tabela */}
      {loading&&<div style={{textAlign:'center',padding:16,color:C.muted,fontSize:12}}><Dots/></div>}
      {!loading&&nots.length===0&&<div style={{textAlign:'center',padding:16,color:C.muted,fontSize:12}}>Nenhuma notificação neste mês</div>}
      {!loading&&nots.map((n,i)=>{
        const tag=getTag(n);
        const data=n.event_date?new Date(n.event_date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'--';
        const titulo=(n.event_subtype||n.description||'Notificação').slice(0,45);
        const pacInfo=n.admission_reason?n.admission_reason.split('|')[0].trim():'';
        return(<div key={n.id||i} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 14px',borderBottom:i<nots.length-1?'1px solid '+C.border+'55':'none',cursor:'pointer'}}
          onClick={()=>onSelect&&onSelect(n)}>
          <span style={{fontSize:10,background:tag.c+'20',color:tag.c,borderRadius:4,padding:'2px 5px',fontWeight:700,flexShrink:0,minWidth:34,textAlign:'center'}}>{tag.l}</span>
          <span style={{fontSize:11,color:C.muted,flexShrink:0,fontFamily:'monospace',width:36}}>{data}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,color:C.text,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{titulo}</div>
            {pacInfo&&<div style={{fontSize:10,color:C.muted,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{pacInfo}</div>}
          </div>
          <span style={{fontSize:10,color:C.muted,flexShrink:0}}>{n.sector||''}</span>
        </div>);
      })}
    </div>)}
  </div>);
}

      {t:'Ser tratado com dignidade',d:'Você tem direito a atendimento respeitoso, sem discriminação, com privacidade e sigilo das suas informações.'},

        {String.fromCodePoint(127973)}
      </div>
      <div style={{fontSize:11,color:'#0D9488',fontWeight:700,letterSpacing:'0.1em',marginBottom:4}}>HOSPITAL NAVAL DE SALVADOR</div>

          {e:String.fromCodePoint(128196),t:'Seus direitos'},

    {/* Páginas de conteúdo */}
    {!isFirst&&pg.items&&(<div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <div style={{width:36,height:36,borderRadius:10,background:cor+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{pg.icone}</div>
        <div style={{fontSize:14,fontWeight:800,color:C.text}}>{pg.titulo}</div>

      {pg.items.map((item,i)=>(

          <div>
            <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:3}}>{item.t}</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>{item.d}</div>
          </div>
        </div>
      ))}
    </div>)}

    {/* Navegação */}
    <div style={{display:'flex',gap:8,marginTop:16}}>
      {!isFirst&&<button onClick={()=>setPag(p=>p-1)} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'11px',color:C.muted,fontSize:13,fontWeight:700,cursor:'pointer'}}>
        {String.fromCodePoint(8592)+' Anterior'}
      </button>}
      {!isLast
        ?<button onClick={()=>setPag(p=>p+1)} style={{flex:isFirst?1:2,background:cor,border:'none',borderRadius:12,padding:'11px',color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer'}}>
          {isFirst?'Começar '+String.fromCodePoint(8594):'Próximo '+String.fromCodePoint(8594)}
        </button>
        :<div style={{flex:2,background:C.teal+'22',border:'1px solid '+C.teal,borderRadius:12,padding:'11px',color:C.teal,fontSize:12,fontWeight:700,textAlign:'center'}}>
          {String.fromCodePoint(9989)+' Cartilha concluída!'}
        </div>
      }
    </div>
  </div>);
}

function AdminPanel({sbUrl,sbKey,nspEmail,testMode,webhookUrl,onSaveEmail,onToggleTestMode,onSaveWebhook,showToast}) {
  const [email,setEmail]=useState(nspEmail);
  const [webhook,setWebhook]=useState(webhookUrl);
  const [notifications,setNotifications]=useState([]);
  const [loading,setLoading]=useState(false);
  const [deleting,setDeleting]=useState(null);
  const [confirmClear,setConfirmClear]=useState(false);
  const [filterTest,setFilterTest]=useState('all');
  const [showImport,setShowImport]=useState(false);
  const [showRelatorio,setShowRelatorio]=useState(false);

  const loadNots=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{const d=await sbSelect(sbUrl,sbKey,'notifications','select=*&order=created_at.desc&limit=1000');setNotifications(d);}
    catch{showToast('Erro ao carregar','error');}
    setLoading(false);
  };
  useEffect(()=>{loadNots();},[sbUrl,sbKey]);

  const del=async(id)=>{
    if(!confirm('Excluir esta notificação? Ação irreversível.')) return;
    setDeleting(id);
    try{await sbDelete(sbUrl,sbKey,'notifications',`id=eq.${id}`);setNotifications(notifications.filter(n=>n.id!==id));showToast('OK Excluída','success');}
    catch{showToast('Erro','error');}
    setDeleting(null);
  };
  const clearTests=async()=>{
    if(!confirmClear){setConfirmClear(true);setTimeout(()=>setConfirmClear(false),2000);return;}
    try{await sbDelete(sbUrl,sbKey,'notifications','is_test=eq.true');setNotifications(notifications.filter(n=>n.is_test!==true));showToast('OK Testes limpos','success');setConfirmClear(false);}
    catch{showToast('Erro','error');}
  };

  const filtered=notifications.filter(n=>filterTest==='test'?n.is_test:filterTest==='prod'?n.is_test!==true:true);
  const testCount=notifications.filter(n=>n.is_test).length;
  const inp={background:C.surface,border:'1px solid '+C.border,borderRadius:10,padding:'11px 14px',color:C.text,fontSize:13,outline:'none',width:'100%'};

  if(showImport) return(<div style={{padding:'20px 16px'}}>
    <button onClick={()=>setShowImport(false)} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:16}}>←</button>
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:4}}>Importar histórico CSV</div>
    <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Carregue planilhas de períodos anteriores do Google Sheets</div>
    <CSVImporter sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onDone={()=>setShowImport(false)}/>
  </div>);

  return(<div style={{padding:'20px 16px',display:'flex',flexDirection:'column',gap:16}}>
    <div><div style={{fontSize:17,fontWeight:900,color:C.text}}>Administração</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>Painel exclusivo do gestor</div></div>

    <div style={{background:testMode?C.yellow+'18':C.green+'18',border:'1px solid '+(testMode?C.yellow+'55':C.green+'55'),borderRadius:14,padding:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:testMode?C.yellow:C.green}}>{testMode?'teste MODO TESTE':'OK MODO PRODUÇÃO'}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:3,lineHeight:1.5,maxWidth:220}}>{testMode?'Notificações marcadas como teste. Exclua em lote depois.':'Notificações tratadas como reais. E-mails serão enviados.'}</div>
        </div>
        <button onClick={onToggleTestMode} style={{background:testMode?C.yellow:C.green,border:'none',borderRadius:999,padding:'8px 14px',color:'#06101F',fontWeight:800,fontSize:11,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
          {testMode?'Ativar Produção':'Ativar Teste'}
        </button>
      </div>
    </div>

    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}> E-mail de destino</div>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="hnsa.nsp@marinha.mil.br" style={{...inp,marginBottom:10}}/>
      <button onClick={()=>{onSaveEmail(email.trim());showToast('OK E-mail atualizado','success');}} style={{width:'100%',background:C.teal,border:'none',borderRadius:10,padding:'11px',color:'#06101F',fontWeight:800,fontSize:13,cursor:'pointer'}}>Salvar e-mail</button>
    </div>

    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}> Webhook (n8n / Make)</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:10}}>URL que receberá os dados para envio automático de e-mail.</div>
      <input value={webhook} onChange={e=>setWebhook(e.target.value)} placeholder="https://seu-n8n.app/webhook/notificaai" style={{...inp,marginBottom:10,fontFamily:'monospace',fontSize:11}}/>
      <button onClick={()=>{onSaveWebhook(webhook.trim());showToast('OK Webhook atualizado','success');}} style={{width:'100%',background:C.teal,border:'none',borderRadius:10,padding:'11px',color:'#06101F',fontWeight:800,fontSize:13,cursor:'pointer'}}>Salvar webhook</button>
    </div>

    {showRelatorio&&<RelatorioMensalPanel sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} hospital={{short_name:'HNSA',name:'Hospital Naval de Salvador'}} onClose={()=>setShowRelatorio(false)}/>}
    <button onClick={()=>setShowImport(true)} style={{background:C.purple+'18',border:'1px solid '+C.purple+'44',borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',textAlign:'left',width:'100%'}}>
      <span style={{fontSize:22}}>Past</span>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.purple}}>Importar histórico CSV</div><div style={{fontSize:11,color:C.muted}}>Carregue planilhas do Google Sheets</div></div>
      <IconChev size={16} color={C.purple}/>
    </button>
    <button onClick={()=>setShowRelatorio(true)} style={{background:C.blue+'18',border:'1px solid '+C.blue+'44',borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',textAlign:'left',width:'100%'}}>
      <span style={{fontSize:22}}>Doc</span>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.blue}}>Relatório Mensal NSP</div><div style={{fontSize:11,color:C.muted}}>Gerar relatório PDF para a diretoria</div></div>
      <IconChev size={16} color={C.blue}/>
    </button>

    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <div><div style={{fontSize:13,fontWeight:700,color:C.text}}>List Notificações</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{notifications.length} total · {testCount} teste</div></div>
        <button onClick={loadNots} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'5px 10px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}></button>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['all','Todas',notifications.length],['test','Teste',testCount],['prod','Prod',notifications.length-testCount]].map(([id,label,count])=>(
          <button key={id} onClick={()=>setFilterTest(id)} style={{flex:1,padding:'6px 8px',borderRadius:8,border:'none',background:filterTest===id?C.teal:C.surface,color:filterTest===id?'#06101F':C.muted,fontSize:10,fontWeight:700,cursor:'pointer'}}>{label} ({count})</button>
        ))}
      </div>
      {testCount>0&&<button onClick={clearTests} style={{width:'100%',background:confirmClear?C.red:C.red+'22',border:'1px solid '+C.red+'55',borderRadius:10,padding:'10px',color:confirmClear?'#fff':C.red,fontWeight:700,fontSize:12,cursor:'pointer',marginBottom:12}}>
        {confirmClear?`Atencao CLIQUE NOVAMENTE para excluir ${testCount} testes`:` Limpar ${testCount} notificações de teste`}
      </button>}
      {loading&&<div style={{textAlign:'center',color:C.muted,fontSize:12,padding:20}}>Carregando...</div>}
      {!loading&&filtered.length===0&&<div style={{textAlign:'center',color:C.muted,fontSize:12,padding:20}}>Nenhuma notificação</div>}
      {filtered.slice(0,20).map(n=>{const tag=getTag(n);const title=getTitle(n);return(
        <div key={n.id} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:10,padding:'10px 12px',marginBottom:6,display:'flex',alignItems:'center',gap:10}}>
          <div style={{background:tag.color+'22',color:tag.color,borderRadius:5,padding:'2px 6px',fontSize:9,fontWeight:700,minWidth:38,textAlign:'center'}}>{tag.label}</div>
          {n.is_test&&<div style={{background:C.yellow+'22',color:C.yellow,borderRadius:5,padding:'2px 6px',fontSize:9,fontWeight:700}}>TESTE</div>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:600,color:C.text,textTransform:'capitalize',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{title}</div>
            <div style={{fontSize:10,color:C.muted}}>{n.sector} · {formatTime(n.created_at)}</div>
          </div>
          <button onClick={()=>del(n.id)} disabled={deleting===n.id} style={{background:'none',border:'none',cursor:'pointer',padding:6,display:'flex'}}>
            <IconTrash size={14} color={deleting===n.id?C.muted:C.red}/>
          </button>
        </div>
      );})}
    </div>

    <PinManager sbUrl={sbUrl} sbKey={sbKey} showToast={showToast}/>
  </div>);
}
