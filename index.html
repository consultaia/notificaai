const SUBNUCLEOS_HNSA=[
  {id:'comunicacao',label:'Comunicacao Efetiva',icon:'chat',color:'#1D6FE8'},
  {id:'medicamentos',label:'Seguranca na Administracao de Medicamentos',icon:'remedios',color:'#8B5CF6'},
  {id:'identificacao',label:'Identificacao Correta',icon:'identificacao',color:'#00C9B8'},
  {id:'queda',label:'Queda',icon:'escudo',color:'#F59E0B'},
  {id:'lpp',label:'LPP - Lesao por Pressao',icon:'curativo',color:'#EF4444'},
  {id:'cirurgia',label:'Cirurgia Segura',icon:'hospital',color:'#10B981'},
];

function TreinamentosView({sbUrl,sbKey,showToast,hospital,profileMode}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [registros,setRegistros]=useState([]);
  const [loading,setLoading]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [subnucleoAtivo,setSubnucleoAtivo]=useState('todos');
  const [form,setForm]=useState({tipo:'treinamento',subnucleo:'comunicacao',protocolo:'',data:'',participantes:'',descricao:'',responsavel:'',link_gdrive:''});

  const canEdit=profileMode==='gestor'||profileMode==='membro_nsp';

  const load=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{
      const data=await sbSelect(sbUrl,sbKey,'treinamentos_nsp','select=*&hospital_id=eq.'+h.id+'&order=data.desc');
      setRegistros(data||[]);
    }catch{setRegistros([]);}
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey]);

  const salvar=async()=>{
    if(!form.data||!form.subnucleo||!form.participantes){showToast('Preencha data, subnucleo e participantes','error');return;}
    setSaving(true);
    try{
      await sbInsert(sbUrl,sbKey,'treinamentos_nsp',{hospital_id:h.id,...form,participantes:Number(form.participantes),created_at:new Date().toISOString()});
      await load();setShowForm(false);
      setForm({tipo:'treinamento',subnucleo:'comunicacao',protocolo:'',data:'',participantes:'',descricao:'',responsavel:'',link_gdrive:''});
      showToast('Registro salvo!','success');
    }catch{showToast('Erro ao salvar. Execute o SQL de criacao da tabela.','error');}
    setSaving(false);
  };

  const filtered=subnucleoAtivo==='todos'?registros:registros.filter(r=>r.subnucleo===subnucleoAtivo);

  // Calculo de totais por subnucleo
  const totaisPorSub={};
  SUBNUCLEOS_HNSA.forEach(s=>{
    const recs=registros.filter(r=>r.subnucleo===s.id);
    totaisPorSub[s.id]={
      treinamentos:recs.filter(r=>r.tipo==='treinamento').length,
      reunioes:recs.filter(r=>r.tipo==='reuniao').length,
      participantes:recs.filter(r=>r.tipo==='treinamento').reduce((acc,r)=>acc+(r.participantes||0),0),
    };
  });

  const inp={background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:10};

  return(<div style={{padding:'0 0 80px'}}>
    <BackHeader title='Notificacoes' subtitle={filtered.length+' resultado(s) de '+notifications.length+' total'} right={<button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'16px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
      <div>
        <div style={{fontSize:17,fontWeight:900,color:C.text}}>Treinamentos e Reunioes</div>
        <div style={{fontSize:11,color:C.muted}}>NSP - HNSA - Subnucleos</div>
      </div>
      {canEdit&&<button onClick={()=>setShowForm(!showForm)} style={{background:C.teal,border:'none',borderRadius:10,padding:'8px 14px',color:'#06101F',fontWeight:800,fontSize:12,cursor:'pointer'}}>+ Novo</button>}
    </div>

    {/* Cards por subnucleo */}
    <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
      {SUBNUCLEOS_HNSA.map(s=>{
        const t=totaisPorSub[s.id]||{treinamentos:0,reunioes:0,participantes:0};
        const ativo=subnucleoAtivo===s.id;
        return(<button key={s.id} onClick={()=>setSubnucleoAtivo(ativo?'todos':s.id)}
          style={{background:ativo?s.color+'22':C.card,border:'1px solid '+(ativo?s.color:C.border),borderRadius:12,padding:'12px 14px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',textAlign:'left',width:'100%'}}>
          <span style={{fontSize:22}}>{s.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{s.label}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>{t.treinamentos} treinamento(s) · {t.reunioes} reuniao(oes) · {t.participantes} participantes</div>
          </div>
          {(t.treinamentos===0&&t.reunioes===0)&&<div style={{background:C.red+'22',color:C.red,borderRadius:6,padding:'2px 8px',fontSize:9,fontWeight:700}}>Sem registro</div>}
        </button>);
      })}
    </div>

    {/* Formulario */}
    {showForm&&canEdit&&<div style={{background:C.card,border:'1px solid '+C.teal+'44',borderRadius:14,padding:16,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Novo registro</div>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        {[['treinamento','Treinamento'],['reuniao','Reuniao']].map(([v,l])=>(
          <button key={v} onClick={()=>setForm({...form,tipo:v})} style={{flex:1,padding:'8px',borderRadius:8,border:'1px solid '+(form.tipo===v?C.teal:C.border),background:form.tipo===v?C.teal+'22':C.surface,color:form.tipo===v?C.teal:C.muted,fontWeight:700,fontSize:12,cursor:'pointer'}}>{l}</button>
        ))}
      </div>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Subnucleo *</label>
      <select value={form.subnucleo} onChange={e=>setForm({...form,subnucleo:e.target.value})} style={{...inp,appearance:'none'}}>
        {SUBNUCLEOS_HNSA.map(s=><option key={s.id} value={s.id}>{s.icon} {s.label}</option>)}
      </select>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Protocolo / Tema</label>
      <input value={form.protocolo} onChange={e=>setForm({...form,protocolo:e.target.value})} placeholder="Ex: Higienizacao das Maos, Prevencao de Quedas" style={inp}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Data *</label>
          <input type="date" value={form.data} onChange={e=>setForm({...form,data:e.target.value})} style={inp}/>
        </div>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>N. de participantes *</label>
          <input type="number" value={form.participantes} onChange={e=>setForm({...form,participantes:e.target.value})} placeholder="Ex: 45" style={inp}/>
        </div>
      </div>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Responsavel</label>
      <input value={form.responsavel} onChange={e=>setForm({...form,responsavel:e.target.value})} placeholder="Nome ou cargo" style={inp}/>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Descricao / Pauta</label>
      <textarea value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} rows={2} placeholder="Resumo do conteudo abordado" style={{...inp,resize:'none',fontFamily:'inherit'}}/>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Link Google Drive (lista de presenca, ata)</label>
      <input value={form.link_gdrive} onChange={e=>setForm({...form,link_gdrive:e.target.value})} placeholder="https://drive.google.com/..." style={inp}/>
      <div style={{background:C.yellow+'10',border:'1px solid '+C.yellow+'33',borderRadius:8,padding:'8px 12px',marginBottom:10,fontSize:10,color:C.muted}}>
        Execute no Supabase SQL Editor: <span style={{fontFamily:'monospace',color:'#9ECFFF'}}>CREATE TABLE IF NOT EXISTS treinamentos_nsp (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, created_at TIMESTAMPTZ DEFAULT NOW(), hospital_id TEXT, tipo TEXT, subnucleo TEXT, protocolo TEXT, data DATE, participantes INT, descricao TEXT, responsavel TEXT, link_gdrive TEXT); ALTER TABLE treinamentos_nsp ENABLE ROW LEVEL SECURITY; CREATE POLICY "allow_all_treinamentos" ON treinamentos_nsp FOR ALL USING (true) WITH CHECK (true);</span>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>setShowForm(false)} style={{flex:1,background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px',color:C.muted,fontSize:12,fontWeight:700,cursor:'pointer'}}>Cancelar</button>
        <button onClick={salvar} disabled={saving} style={{flex:2,background:C.teal,border:'none',borderRadius:8,padding:'9px',color:'#06101F',fontSize:12,fontWeight:800,cursor:'pointer'}}>{saving?'Salvando...':'Salvar registro'}</button>
      </div>
    </div>}

    {/* Lista de registros */}
    {loading&&<div style={{textAlign:'center',color:C.muted,padding:20}}><Dots/></div>}
    {!loading&&filtered.length===0&&<div style={{textAlign:'center',color:C.muted,padding:20,fontSize:12}}>Nenhum registro{subnucleoAtivo!=='todos'?' para este subnucleo':''}.</div>}
    {filtered.map(r=>{
      const sub=SUBNUCLEOS_HNSA.find(s=>s.id===r.subnucleo)||{icon:'lista',color:C.muted,label:r.subnucleo};
      return(<div key={r.id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:4}}>
          <span style={{fontSize:18}}>{sub.icon}</span>
          <div style={{flex:1}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,fontWeight:700,color:C.text}}>{r.protocolo||sub.label}</div>
              <div style={{background:r.tipo==='treinamento'?C.blue+'22':C.green+'22',color:r.tipo==='treinamento'?C.blue:C.green,borderRadius:6,padding:'2px 8px',fontSize:9,fontWeight:700}}>{r.tipo==='treinamento'?'Treinamento':'Reuniao'}</div>
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>
              {r.data&&new Date(r.data+'T12:00:00').toLocaleDateString('pt-BR')}
              {r.participantes&&<span> · {r.participantes} participante(s)</span>}
              {r.responsavel&&<span> · {r.responsavel}</span>}
            </div>
          </div>
        </div>
        {r.descricao&&<div style={{fontSize:11,color:C.muted,marginBottom:4,borderLeft:'2px solid '+sub.color+'44',paddingLeft:8}}>{r.descricao}</div>}
        {r.link_gdrive&&<a href={r.link_gdrive} target="_blank" rel="noreferrer" style={{fontSize:11,color:C.teal,fontWeight:600}}>Abrir documento</a>}
      </div>);
    })}
  </div>);
}

// --- RELATÓRIO DSM + AVALIAÇÃO ANVISA ----------------------------------------
function RelatorioDSMView({sbUrl,sbKey,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [tab,setTab]=useState('dsm');
  const [semestre,setSemestre]=useState(()=>{const d=new Date();return d.getMonth()<6?`${d.getFullYear()}-1`:`${d.getFullYear()}-2`;});
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(false);
  const [gestor,setGestor]=useState('');

  const getSemestreDatas=()=>{
    const [ano,sem]=semestre.split('-').map(Number);
    if(sem===1) return{inicio:`${ano}-01-01`,fim:`${ano}-06-30`,label:`1 semestre de ${ano}`,meses:['Jan','Fev','Mar','Abr','Mai','Jun'],nums:[1,2,3,4,5,6]};
    return{inicio:`${ano}-07-01`,fim:`${ano}-12-31`,label:`2 semestre de ${ano}`,meses:['Jul','Ago','Set','Out','Nov','Dez'],nums:[7,8,9,10,11,12]};
  };

  const gerar=async()=>{
    if(!sbUrl||!sbKey){showToast('Supabase necessario','error');return;}
    setLoading(true);
    try{
      const {inicio,fim,nums}=getSemestreDatas();
      const [nots,treinamentos,protocolos]=await Promise.all([
        sbSelect(sbUrl,sbKey,'notifications',`event_date=gte.${inicio}&event_date=lte.${fim}&is_test=eq.false&select=*`),
        sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&data=gte.${inicio}&data=lte.${fim}&select=*`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&select=*`).catch(()=>[]),
      ]);

      // Notificacoes por mes
      const porMes=nums.map(m=>{
        const mes=nots.filter(n=>{const d=new Date(n.event_date+'T12:00:00');return d.getMonth()+1===m;});
        return{m,total:mes.length,sp:mes.filter(n=>n.notification_type==='seguranca_paciente').length,ccih:mes.filter(n=>n.notification_type==='ccih').length,quedas:mes.filter(n=>n.event_subtype?.toLowerCase().includes('queda')).length,lpp:mes.filter(n=>n.event_subtype?.toLowerCase().includes('press')).length};
      });

      // Reunioes NSP
      const reunioes=treinamentos.filter(t=>t.tipo==='reuniao');
      const treinsTodos=treinamentos.filter(t=>t.tipo==='treinamento');

      // Treinamentos por subnucleo
      const porSubnucleo={};
      SUBNUCLEOS_HNSA.forEach(s=>{
        const regs=treinamentos.filter(t=>t.subnucleo===s.id);
        const treins=regs.filter(t=>t.tipo==='treinamento');
        porSubnucleo[s.id]={label:s.label,icon:s.icon,color:s.color,
          treinamentos:treins.length,
          reunioes:regs.filter(t=>t.tipo==='reuniao').length,
          participantes:treins.reduce((acc,t)=>acc+(t.participantes||0),0),
          porMes:nums.map(m=>treins.filter(t=>new Date(t.data+'T12:00:00').getMonth()+1===m).reduce((acc,t)=>acc+(t.participantes||0),0)),
          links:regs.filter(t=>t.link_gdrive).map(t=>({data:t.data,link:t.link_gdrive,desc:t.protocolo||t.descricao})),
        };
      });

      // Protocolos
      const getProtocolo=(nome)=>protocolos.find(p=>p.nome?.toLowerCase().includes(nome.toLowerCase()))||null;

      setDados({porMes,reunioes,treinsTodos,porSubnucleo,nots,protocolos,total:nots.length,sp:nots.filter(n=>n.notification_type==='seguranca_paciente').length,ccih:nots.filter(n=>n.notification_type==='ccih').length,sentinela:nots.filter(n=>n.gravidade==='Evento sentinela').length,getProtocolo});
    }catch(e){showToast('Erro: '+e.message,'error');}
    setLoading(false);
  };

  const imprimir=()=>{
    const el=document.getElementById('relatorio-dsm-pdf');
    if(!el) return;
    const w=window.open('','_blank');
    w.document.write("<html><head><title>Relatorio DSM - HNSA</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#222;font-size:11px}h1{font-size:16px;color:#c8102e;border-bottom:2px solid #c8102e;padding-bottom:6px}h2{font-size:13px;margin:16px 0 6px;color:#333}table{width:100%;border-collapse:collapse;margin-bottom:12px}th,td{border:1px solid #ccc;padding:5px 8px}th{background:#f0f0f0}.ok{color:green}.nok{color:red}@media print{button{display:none}}</style></head><body>"+doc.innerHTML+"<br/><small style=\"color:#999\">Gerado por NotificaAI - "+new Date().toLocaleDateString('pt-BR')+"</small></body></html>")
    w.document.close();w.print();
  };

  const {label,meses,nums}=getSemestreDatas();
  const tb=(id,l)=><button onClick={()=>setTab(id)} style={{flex:1,padding:'8px 4px',borderRadius:7,border:'none',background:tab===id?C.teal:'transparent',color:tab===id?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>{l}</button>;

  return(<div style={{padding:'0 0 80px'}}>
    <BackHeader title='Notificacoes' subtitle={filtered.length+' resultado(s) de '+notifications.length+' total'} right={<button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'16px'}}>
    <BackHeader title='Relatorio DSM / ANVISA' subtitle='Circular 18/2024 - Indicadores NSP'/>

    <div style={{display:'flex',background:C.surface,borderRadius:10,padding:4,gap:3,marginBottom:14}}>
      {tb('dsm','Relatorio DSM')}{tb('anvisa','Avaliacao ANVISA')}{tb('config','Configurar')}
    </div>

    {tab==='config'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Parametros do relatorio</div>
        <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Semestre de referencia</label>
        <select value={semestre} onChange={e=>setSemestre(e.target.value)} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:10,appearance:'none'}}>
          {[2024,2025,2026].flatMap(a=>[`${a}-1`,`${a}-2`]).map(s=>{const[a,sem]=s.split('-');return(<option key={s} value={s}>{sem}o semestre de {a}</option>);})}
        </select>
        <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Gestor NSP / Responsavel</label>
        <input value={gestor} onChange={e=>setGestor(e.target.value)} placeholder="Ex: Cap Ten Janan Almeida" style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:12}}/>
        <button onClick={gerar} disabled={loading} style={{width:'100%',background:loading?C.border:C.teal,border:'none',borderRadius:12,padding:'13px',color:loading?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:loading?'default':'pointer'}}>
          {loading?'Gerando...':'Gerar Relatorio'}
        </button>
      </div>
      <div style={{background:C.yellow+'10',border:'1px solid '+C.yellow+'33',borderRadius:12,padding:'12px 14px',fontSize:11,color:C.muted,lineHeight:1.7}}>
        Para o relatorio completo, certifique-se de que os modulos de Treinamentos, Protocolos e Indicadores estao preenchidos com os dados do semestre.
      </div>
    </div>}

    {(tab==='dsm'||tab==='anvisa')&&!dados&&<div style={{textAlign:'center',padding:40,color:C.muted}}>
      <div style={{fontSize:32,marginBottom:12}}>Doc</div>
      <div style={{fontSize:13,marginBottom:16}}>Configure o semestre e gere o relatorio</div>
      <button onClick={()=>setTab('config')} style={{background:C.teal,border:'none',borderRadius:10,padding:'10px 20px',color:'#06101F',fontWeight:800,fontSize:13,cursor:'pointer'}}>Configurar</button>
    </div>}

    {tab==='dsm'&&dados&&<div>
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button onClick={imprimir} style={{flex:1,background:C.blue,border:'none',borderRadius:10,padding:'11px',color:'#fff',fontWeight:800,fontSize:13,cursor:'pointer'}}>Imprimir / PDF</button>
        <button onClick={()=>setDados(null)} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'11px',color:C.muted,fontWeight:700,fontSize:12,cursor:'pointer'}}>Novo relatorio</button>
      </div>

      <div id="relatorio-dsm-pdf" style={{background:'white',color:'#1a1a1a',borderRadius:10,overflow:'hidden',fontSize:11}}>
        {/* Cabecalho */}
        <div style={{background:'#003087',color:'white',padding:'16px 20px'}}>
          <div style={{fontSize:10,opacity:.8}}>MARINHA DO BRASIL - DIRETORIA DE SAUDE DA MARINHA</div>
          <div style={{fontSize:16,fontWeight:700,marginTop:4}}>HOSPITAL NAVAL DE SALVADOR</div>
          <div style={{fontSize:13,marginTop:2}}>Indicadores de Monitoramento - Nucleo de Seguranca do Paciente</div>
          <div style={{fontSize:11,opacity:.8,marginTop:4}}>{label} | Gerado em {new Date().toLocaleDateString('pt-BR')}</div>
        </div>
        <div style={{padding:'16px 20px'}}>
          {/* 1. Notificacoes no periodo */}
          <h2>1. Notificacoes no Periodo</h2>
          <table>
            <thead><tr><th>Mes</th><th>Total</th><th>Seg. Paciente</th><th>CCIH</th><th>Quedas</th><th>LPP</th></tr></thead>
            <tbody>
              {dados.porMes.map((m,i)=>(
                <tr key={i}><td>{meses[i]}</td><td style={{textAlign:'center',fontWeight:700}}>{m.total||'-'}</td><td style={{textAlign:'center'}}>{m.sp||'-'}</td><td style={{textAlign:'center'}}>{m.ccih||'-'}</td><td style={{textAlign:'center'}}>{m.quedas||'-'}</td><td style={{textAlign:'center'}}>{m.lpp||'-'}</td></tr>
              ))}
              <tr style={{background:'#f5f5f5',fontWeight:700}}>
                <td>TOTAL</td>
                <td style={{textAlign:'center'}}>{dados.total}</td>
                <td style={{textAlign:'center'}}>{dados.sp}</td>
                <td style={{textAlign:'center'}}>{dados.ccih}</td>
                <td style={{textAlign:'center'}}>{dados.porMes.reduce((a,m)=>a+m.quedas,0)}</td>
                <td style={{textAlign:'center'}}>{dados.porMes.reduce((a,m)=>a+m.lpp,0)}</td>
              </tr>
            </tbody>
          </table>

          {/* 2. Reunioes NSP */}
          <h2>2. Reunioes do NSP</h2>
          <div style={{marginBottom:8,fontSize:11}}>
            <strong>Total de reunioes no semestre: {dados.reunioes.length}</strong>
            {dados.reunioes.length>=2?<span style={{color:'#059669',fontWeight:700}}> (Conforme - minimo 2 por semestre)</span>:<span style={{color:'#dc2626',fontWeight:700}}> (Abaixo do minimo - requer 2 por semestre)</span>}
          </div>
          <table>
            <thead><tr><th>Data</th><th>Tipo</th><th>Pauta / Descricao</th><th>Participantes</th><th>Comprovante</th></tr></thead>
            <tbody>
              {dados.reunioes.length>0?dados.reunioes.map((r,i)=>(
                <tr key={i}>
                  <td>{r.data?new Date(r.data+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</td>
                  <td>{SUBNUCLEOS_HNSA.find(s=>s.id===r.subnucleo)?.label||r.subnucleo||'-'}</td>
                  <td>{r.descricao||r.protocolo||'-'}</td>
                  <td style={{textAlign:'center'}}>{r.participantes||'-'}</td>
                  <td>{r.link_gdrive?<a href={r.link_gdrive} style={{color:'#003087'}}>Ver ata</a>:'Pendente'}</td>
                </tr>
              )):<tr><td colSpan={5} style={{textAlign:'center',color:'#999'}}>Nenhuma reuniao registrada no periodo</td></tr>}
            </tbody>
          </table>

          {/* 3. Treinamentos por subnucleo */}
          <h2>3. Treinamentos por Subnucleo e Protocolo</h2>
          {SUBNUCLEOS_HNSA.map(s=>{
            const sub=dados.porSubnucleo[s.id];
            return(<div key={s.id} style={{marginBottom:16}}>
              <h3>{s.icon} {s.label}</h3>
              <div style={{marginBottom:4,fontSize:11}}>
                {sub.treinamentos} treinamento(s) | {sub.participantes} participantes no semestre
                {sub.porMes.some(v=>v>0)&&<span> | Por mes: {meses.map((m,i)=>sub.porMes[i]>0?`${m}: ${sub.porMes[i]}`:null).filter(Boolean).join(', ')}</span>}
              </div>
              {sub.links.length>0&&<div style={{fontSize:10,color:'#666'}}>Comprovantes: {sub.links.map((l,i)=><span key={i}><a href={l.link} style={{color:'#003087'}}>{l.desc||new Date(l.data+'T12:00:00').toLocaleDateString('pt-BR')}</a>{i<sub.links.length-1?', ':''}</span>)}</div>}
              {sub.treinamentos===0&&<div style={{color:'#dc2626',fontSize:10,fontWeight:700}}>Sem treinamentos registrados no periodo</div>}
            </div>);
          })}

          {/* 4. Eventos sentinela */}
          <h2>4. Eventos Sentinela e Near Miss</h2>
          <table>
            <thead><tr><th>Indicador</th><th>Quantidade</th><th>Observacao</th></tr></thead>
            <tbody>
              <tr><td>Eventos sentinela</td><td style={{textAlign:'center',fontWeight:700,color:dados.sentinela>0?'#dc2626':'#059669'}}>{dados.sentinela}</td><td>{dados.sentinela===0?'Nenhum evento sentinela no periodo':'RCA obrigatorio para cada evento'}</td></tr>
              <tr><td>Near miss notificados</td><td style={{textAlign:'center',fontWeight:700}}>{dados.nots.filter(n=>n.gravidade==='Near miss').length}</td><td>Indicador de cultura proativa de notificacao</td></tr>
              <tr><td>Notificacoes com RCA concluido</td><td style={{textAlign:'center',fontWeight:700}}>{dados.nots.filter(n=>n.rca_gerado).length}</td><td>-</td></tr>
              <tr><td>Notificacoes enviadas ao Notivisa</td><td style={{textAlign:'center',fontWeight:700}}>{dados.nots.filter(n=>n.notivisa_enviado).length}</td><td>Minimo: notificar em 10 meses/ano (ANVISA)</td></tr>
            </tbody>
          </table>

          {/* 5. Protocolos */}
          <h2>5. Status dos Protocolos</h2>
          <table>
            <thead><tr><th>Protocolo</th><th>Data aprovacao</th><th>Proxima revisao</th><th>Status</th></tr></thead>
            <tbody>
              {dados.protocolos.length>0?dados.protocolos.map((p,i)=>{
                const vencido=p.proxima_revisao&&p.proxima_revisao<new Date().toISOString().slice(0,10);
                return(<tr key={i}>
                  <td>{p.nome}</td>
                  <td>{p.aprovado_em?new Date(p.aprovado_em+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</td>
                  <td style={{color:vencido?'#dc2626':'#059669'}}>{p.proxima_revisao?new Date(p.proxima_revisao+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</td>
                  <td style={{color:vencido?'#dc2626':'#059669',fontWeight:700}}>{vencido?'VENCIDO':'Valido'}</td>
                </tr>);
              }):<tr><td colSpan={4} style={{textAlign:'center',color:'#999'}}>Nenhum protocolo cadastrado. Use o modulo Protocolos.</td></tr>}
            </tbody>
          </table>

          {/* Assinatura */}
          <div style={{marginTop:32,display:'flex',gap:60}}>
            <div style={{flex:1,borderTop:'1px solid #999',paddingTop:6,textAlign:'center'}}>
              <div style={{fontSize:11,color:'#666'}}>{gestor||'Coordenador NSP'}</div>
              <div style={{fontSize:10,color:'#999'}}>Nucleo de Seguranca do Paciente - HNSA</div>
            </div>
            <div style={{flex:1,borderTop:'1px solid #999',paddingTop:6,textAlign:'center'}}>
              <div style={{fontSize:11,color:'#666'}}>Diretor-Geral HNSA</div>
              <div style={{fontSize:10,color:'#999'}}>Hospital Naval de Salvador</div>
            </div>
          </div>
        </div>
      </div>
    </div>}

    {tab==='anvisa'&&dados&&<div>
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button onClick={imprimir} style={{flex:1,background:C.blue,border:'none',borderRadius:10,padding:'11px',color:'#fff',fontWeight:800,fontSize:13,cursor:'pointer'}}>Imprimir / PDF</button>
        <button onClick={()=>setDados(null)} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'11px',color:C.muted,fontWeight:700,fontSize:12,cursor:'pointer'}}>Novo relatorio</button>
      </div>

      {/* Score ANVISA */}
      {(()=>{
        const checks={
          nsp_instituido:true,
          reunioes_ok:dados.reunioes.length>=2,
          protocolos_ok:dados.protocolos.filter(p=>p.proxima_revisao>=new Date().toISOString().slice(0,10)).length>=4,
          treinamentos_ok:SUBNUCLEOS_HNSA.every(s=>dados.porSubnucleo[s.id].treinamentos>0),
          notivisa_ok:dados.nots.filter(n=>n.notivisa_enviado).length>0,
          indicadores_ok:dados.total>0,
        };
        const score=Object.values(checks).filter(Boolean).length;
        const pct=Math.round(score/Object.keys(checks).length*100);
        const nivel=pct>=67?{label:'ALTA CONFORMIDADE',color:C.green}:pct>=34?{label:'MEDIA CONFORMIDADE',color:C.yellow}:{label:'BAIXA CONFORMIDADE',color:C.red};

        return(<div>
          <div style={{background:nivel.color+'18',border:'1px solid '+nivel.color+'44',borderRadius:14,padding:16,marginBottom:14,textAlign:'center'}}>
            <div style={{fontSize:28,fontWeight:900,color:nivel.color,lineHeight:1}}>{pct}%</div>
            <div style={{fontSize:14,fontWeight:800,color:nivel.color,marginTop:4}}>{nivel.label}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:4}}>{score} de {Object.keys(checks).length} indicadores conformes</div>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {[
              ['NSP instituido com portaria',checks.nsp_instituido,'Portaria vigente no sistema'],
              ['Minimo 2 reunioes no semestre',checks.reunioes_ok,`${dados.reunioes.length} reunioes registradas`],
              ['Protocolos atualizados (4+)',checks.protocolos_ok,dados.protocolos.filter(p=>p.proxima_revisao>=new Date().toISOString().slice(0,10)).length+' protocolos validos'],
              ['Treinamento em todos os subnucleos',checks.treinamentos_ok,SUBNUCLEOS_HNSA.filter(s=>dados.porSubnucleo[s.id].treinamentos===0).map(s=>s.label).join(', ')||'Todos realizaram'],
              ['Notificacoes enviadas ao Notivisa',checks.notivisa_ok,`${dados.nots.filter(n=>n.notivisa_enviado).length} notificacoes enviadas`],
              ['Indicadores monitorados',checks.indicadores_ok,`${dados.total} eventos registrados no periodo`],
            ].map(([l,ok,obs],i)=>(
              <div key={i} style={{background:C.card,border:'1px solid '+(ok?C.green:C.red)+'44',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
                <div style={{fontSize:18,flexShrink:0}}>{ok?'OK':'X'}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.text}}>{l}</div>
                  <div style={{fontSize:11,color:ok?C.green:C.red,marginTop:2}}>{obs}</div>
                </div>
              </div>
            ))}
          </div>

          {!checks.reunioes_ok&&<div style={{background:C.red+'15',border:'1px solid '+C.red+'33',borderRadius:10,padding:'10px 14px',marginTop:12,fontSize:11,color:C.red,fontWeight:700}}>
            ATENCAO: Reunioes insuficientes. O indicador 1 (NSP com 2 reunioes) e requisito minimo - sem ele o HNSA e classificado automaticamente como BAIXA CONFORMIDADE.
          </div>}
          {!checks.notivisa_ok&&<div style={{background:C.red+'15',border:'1px solid '+C.red+'33',borderRadius:10,padding:'10px 14px',marginTop:8,fontSize:11,color:C.red,fontWeight:700}}>
            ATENCAO: Nenhuma notificacao enviada ao Notivisa. O indicador 18 tambem e requisito minimo. Em 2023 o HNSA notificou apenas em fevereiro e marco, resultando em baixa conformidade.
          </div>}
        </div>);
      })()}
    </div>}
  </div>);
}

// --- PERFIL MEMBRO NSP --------------------------------------------------------
function MembroNSPView({sbUrl,sbKey,showToast,hospital,profileMode}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [stats,setStats]=useState(null);
  const [notifications,setNotifications]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filtroSub,setFiltroSub]=useState('todos');

  useEffect(()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    Promise.all([
      sbSelect(sbUrl,sbKey,'notifications','select=*&is_test=eq.false&order=created_at.desc&limit=200'),
      sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&select=*&order=data.desc`).catch(()=>[]),
    ]).then(([nots,treins])=>{
      setNotifications(nots||[]);
      setStats({...computeStats(nots||[]),treins:treins||[]});
    }).catch(()=>showToast('Erro ao carregar','error')).finally(()=>setLoading(false));
  },[sbUrl,sbKey]);

  if(loading) return(<div style={{display:'flex',justifyContent:'center',padding:60}}><Dots/></div>);

  const s=stats||{total:0,sp:0,ccih:0,adm:0,sentinela:0,culturaScore:0,sectorData:[],diasSemSentinela:null,treins:[]};

  // Meu subnucleo (simplificado - gestor pode configurar depois)
  const subNomes={comunicacao:'Comunicacao Efetiva',medicamentos:'Medicamentos',identificacao:'Identificacao Correta',queda:'Queda',lpp:'LPP',cirurgia:'Cirurgia Segura'};

  return(<div style={{padding:'20px 16px 80px'}}>
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:2}}>Painel Membro NSP</div>
    <div style={{fontSize:11,color:C.muted,marginBottom:16}}>Visualizacao - HNSA</div>

    {/* Metricas principais */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
      <StatCard icon="" label="Total notificacoes" value={s.total} color={C.teal}/>
      <StatCard icon="Hosp" label="Seg. Paciente" value={s.sp} color={C.red}/>
      <StatCard icon="" label="CCIH" value={s.ccih} color={C.yellow}/>
      <StatCard icon="Config" label="Administrativas" value={s.adm} color={C.purple}/>
    </div>

    {/* Dias sem sentinela */}
    {s.diasSemSentinela!==null&&<div style={{background:s.diasSemSentinela>=30?C.green+'18':C.yellow+'18',border:'1px solid '+(s.diasSemSentinela>=30?C.green:C.yellow)+'44',borderRadius:12,padding:'14px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:12}}>
      <div style={{fontSize:36,fontWeight:900,color:s.diasSemSentinela>=30?C.green:C.yellow,lineHeight:1}}>{s.diasSemSentinela}</div>
      <div><div style={{fontSize:13,fontWeight:700,color:s.diasSemSentinela>=30?C.green:C.yellow}}>dias sem evento sentinela</div><div style={{fontSize:11,color:C.muted}}>Meta ONA: 90 dias</div></div>
    </div>}

    {/* Indice de maturidade */}
    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text}}>Indice de Maturidade</div>
        <div style={{fontSize:22,fontWeight:900,color:s.culturaScore>=70?C.green:s.culturaScore>=40?C.yellow:C.red}}>{s.culturaScore}</div>
      </div>
      <div style={{height:6,background:C.border,borderRadius:3,overflow:'hidden'}}>
        <div style={{width:s.culturaScore+'%',height:'100%',background:'linear-gradient(90deg,'+(s.culturaScore>=70?C.green:s.culturaScore>=40?C.yellow:C.red)+','+C.teal+')',borderRadius:3}}/>
      </div>
      <div style={{fontSize:11,color:C.muted,marginTop:6}}>{s.culturaScore>=70?'Maturidade avancada':s.culturaScore>=40?'Em desenvolvimento':'Estagio inicial'}</div>
    </div>

    {/* Distribuicao por setor */}
    {s.sectorData.length>0&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Notificacoes por Setor</div>
      {s.sectorData.map((d,i)=>{
        const max=s.sectorData[0].eventos||1;
        return(<div key={i} style={{marginBottom:8}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}>
            <span style={{color:C.text}}>{d.setor}</span>
            <span style={{color:C.teal,fontWeight:700}}>{d.eventos}</span>
          </div>
          <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}>
            <div style={{width:(d.eventos/max)*100+'%',height:'100%',background:C.teal,borderRadius:2}}/>
          </div>
        </div>);
      })}
    </div>}

    {/* Subnucleo - treinamentos */}
    <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Atividades dos Subnucleos</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <button onClick={()=>setFiltroSub('todos')} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub==='todos'?C.teal:C.card,color:filtroSub==='todos'?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Todos</button>
      {SUBNUCLEOS_HNSA.map(sub=>(
        <button key={sub.id} onClick={()=>setFiltroSub(sub.id)} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub===sub.id?sub.color:C.card,color:filtroSub===sub.id?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>{sub.icon}</button>
      ))}
    </div>
    {SUBNUCLEOS_HNSA.filter(sub=>filtroSub==='todos'||filtroSub===sub.id).map(sub=>{
      const regs=s.treins.filter(t=>t.subnucleo===sub.id);
      const treins=regs.filter(t=>t.tipo==='treinamento');
      const reunioes=regs.filter(t=>t.tipo==='reuniao');
      return(<div key={sub.id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:regs.length>0?8:0}}>
          <span style={{fontSize:20}}>{sub.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{sub.label}</div>
            <div style={{fontSize:10,color:C.muted}}>{treins.length} treinamento(s) | {reunioes.length} reuniao(oes) | {treins.reduce((a,t)=>a+(t.participantes||0),0)} participantes</div>
          </div>
          {regs.length===0&&<div style={{background:C.yellow+'22',color:C.yellow,borderRadius:6,padding:'2px 8px',fontSize:9,fontWeight:700}}>Sem registro</div>}
        </div>
        {regs.slice(0,2).map((r,i)=>(
          <div key={i} style={{borderLeft:'2px solid '+sub.color+'44',paddingLeft:8,marginBottom:4}}>
            <div style={{fontSize:11,color:C.text}}>{r.protocolo||r.descricao||'-'}</div>
            <div style={{fontSize:10,color:C.muted}}>{r.data?new Date(r.data+'T12:00:00').toLocaleDateString('pt-BR'):'-'} · {r.participantes||0} participantes</div>
          </div>
        ))}
      </div>);
    })}

    {/* Lista de notificacoes (somente leitura) */}
    <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10,marginTop:6}}>Notificacoes Recentes</div>
    {notifications.slice(0,10).map((n,i)=>{
      const tag=getTag(n);
      return(<div key={n.id||i} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 12px',marginBottom:6}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{background:tag.color+'22',color:tag.color,borderRadius:5,padding:'2px 7px',fontSize:9,fontWeight:700}}>{tag.label}</div>
          <div style={{flex:1,fontSize:12,color:C.text,fontWeight:600}}>{getTitle(n)}</div>
          <div style={{fontSize:10,color:C.muted}}>{n.sector}</div>
        </div>
        <div style={{fontSize:10,color:C.muted,marginTop:3}}>{n.event_date?new Date(n.event_date+'T12:00:00').toLocaleDateString('pt-BR'):formatTime(n.created_at)}</div>
      </div>);
    })}
  </div>);
}



// --- HOME VIEW --------------------------------------------------------------
function HomeView({setView,sbUrl,sbKey,onConfig,showToast,gestorMode,testMode,hospital}) {
  const [stats,setStats]=useState(null);
  const [recent,setRecent]=useState(MOCK_RECENT);
  const [loading,setLoading]=useState(false);
  const [rcaTarget,setRcaTarget]=useState(null);
  const [notiVisaTarget,setNotiVisaTarget]=useState(null);
  const [riscoTarget,setRiscoTarget]=useState(null);
  const [planoTarget,setPlanoTarget]=useState(null);
  const configured=!!(sbUrl&&sbKey);

  useEffect(()=>{
    if(!configured) return;
    setLoading(true);
    sbSelect(sbUrl,sbKey,'notifications','select=*&order=created_at.desc&limit=300')
      .then(data=>{setStats(computeStats(data));setRecent(data.slice(0,6));})
      .catch(()=>showToast('Erro ao carregar dados','error'))
      .finally(()=>setLoading(false));
  },[sbUrl,sbKey]);

  const s=stats||{total:0,totalPrev:0,sp:0,ccih:0,adm:0,sentinela:0,semRCA:0,culturaScore:0,diasSemSentinela:null};
  const diff=s.total-(s.totalPrev||0);
  const diffLabel=diff>0?`+${diff} vs mês anterior`:diff<0?`${diff} vs mês anterior`:'= igual ao mês anterior';
  const diffColor=diff>0?C.red:diff<0?C.green:C.muted;
  const mesAtual=new Date().toLocaleDateString('pt-BR',{month:'long'});

  return(<div style={{padding:'24px 16px 16px',display:'flex',flexDirection:'column',gap:16}}>
    {rcaTarget&&<RCAPanel notification={rcaTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setRcaTarget(null)}/>}
    {notiVisaTarget&&<NotiVisaPanel notification={notiVisaTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setNotiVisaTarget(null)}/>}
    {riscoTarget&&<MatrizRisco notification={riscoTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setRiscoTarget(null)} onSaved={(n)=>setRecent(prev=>prev.map(r=>r.id===n.id?n:r))}/>}

// --- NOTIFICAR VIEW ----------------------------------------------------------
function NotificarView({sbUrl,sbKey,webhookUrl,testMode,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;

  // -- STEPS -------------------------------------------------------------
  // SP:  perfil > tipo > subtipo > [avp_motivo] > setor > data > relato > medidas > nip > idade > sexo > desfecho > preventivel > resumo > done
  // ADM: perfil > tipo > subtipo_adm > setor > data > relato > medidas > resumo > done
  // PAC/FAM: perfil > subtipo > [avp_motivo] > setor > data > relato > medidas > nip > idade > sexo > desfecho > preventivel > resumo > done

  const [step,setStep]=useState('perfil');
  const [dados,setDados]=useState({});
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,step,loading]);

  const hojeISO=new Date().toISOString().slice(0,10);
  const ontemISO=new Date(Date.now()-86400000).toISOString().slice(0,10);
  const horaNum=new Date().getHours();
  const turnoAtual=horaNum>=7&&horaNum<13?'Manhã':horaNum>=13&&horaNum<19?'Tarde':'Noite';

  const addMsg=(role,txt)=>setMessages(p=>[...p,{role,content:txt}]);

  // -- AVANÇAR PASSO ------------------------------------------------------
  const avancar=(novosDados,proximoStep,pergunta)=>{
    setDados(novosDados);
    if(pergunta) addMsg('assistant',pergunta);
    setStep(proximoStep);
  };

  const isSP=(d)=>(d.notification_type||dados.notification_type)==='seguranca_paciente';
  const isADM=(d)=>(d.notification_type||dados.notification_type)==='administrativa';
  const isCCIH=(d)=>(d.notification_type||dados.notification_type)==='ccih';

  // -- LÓGICA PRINCIPAL DE RESPOSTA ---------------------------------------
  const responder=(valor,label)=>{
    const txt=label||valor;
    addMsg('user',txt);
    const d={...dados};

    switch(step){

      case 'perfil':{
        d.notifier_type=valor;
        const isPacFam=valor==='paciente'||valor==='familiar'||valor==='anonimo';
        if(isPacFam){
          d.notification_type='seguranca_paciente';
          avancar(d,'subtipo','Lamentamos o ocorrido. O que aconteceu?');
        } else {
          avancar(d,'tipo','O evento está relacionado ao **paciente**, é uma **ocorrência administrativa** ou **infecção hospitalar (CCIH)**?');
        }
        break;
      }

      case 'tipo':{
        d.notification_type=valor;
        if(valor==='seguranca_paciente'){
          avancar(d,'subtipo','Qual foi o tipo de evento?');
        } else if(valor==='ccih'){
          avancar(d,'subtipo','Qual o foco da infecção?');
        } else {
          avancar(d,'subtipo_adm','Qual o tipo de ocorrência administrativa?');
        }
        break;
      }

      case 'subtipo':{
        d.event_subtype=valor;
        if(valor==='Perda de AVP'){
          avancar(d,'avp_motivo','Qual foi o motivo da perda do acesso venoso periférico?');
        } else {
          avancar(d,'setor','Em qual setor ocorreu?');
        }
        break;
      }

      case 'subtipo_adm':{
        d.event_subtype=valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'avp_motivo':{
        d.event_subtype='Perda de AVP - '+valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'setor':{
        d.sector=valor;
        avancar(d,'data','Quando ocorreu o evento?');
        break;
      }

      case 'data':{
        let date=hojeISO,turno=turnoAtual;
        if(txt.includes('Manhã de hoje')){date=hojeISO;turno='Manhã';}
        else if(txt.includes('Tarde de hoje')){date=hojeISO;turno='Tarde';}
        else if(txt.includes('Noite de hoje')||txt.includes('Noite/madrugada')){date=hojeISO;turno='Noite';}
        else if(txt.includes('Manhã de ontem')){date=ontemISO;turno='Manhã';}
        else if(txt.includes('Tarde de ontem')){date=ontemISO;turno='Tarde';}
        else if(txt.includes('Noite de ontem')){date=ontemISO;turno='Noite';}
        else if(txt.toLowerCase().includes('hoje')){date=hojeISO;}
        else if(txt.toLowerCase().includes('ontem')){date=ontemISO;}
        d.event_date=date;d.shift=turno;
        avancar(d,'relato','Descreva o que aconteceu com o máximo de detalhes:');
        break;
      }

      case 'relato':{
        d.description=valor;
        avancar(d,'medidas','Quais medidas foram tomadas imediatamente após o evento?');
        break;
      }

      case 'medidas':{
        d.measures_taken=valor;
        if(isSP(d)){
          avancar(d,'nip','**NIP do paciente** (número de identificação):\n\nO NIP permite ao NSP rastrear os dados completos no prontuário. Se não souber, clique em "Não sei / Anônimo".');
        } else {
          gerarResumo(d);
        }
        break;
      }

      case 'nip':{
        if(valor!=='nao_informar') d.patient_nip=valor;
        avancar(d,'idade','Idade aproximada do paciente:');
        break;
      }

      case 'idade':{
        if(valor!=='nao_informar') d.patient_age_range=valor;
        avancar(d,'sexo','Sexo do paciente:');
        break;
      }

      case 'sexo':{
        if(valor!=='nao_informar') d.patient_sex=valor;
        avancar(d,'desfecho','Qual foi o desfecho para o paciente?');
        break;
      }

      case 'desfecho':{
        d.patient_outcome=valor;
        avancar(d,'preventivel','O evento era evitável?');
        break;
      }

      case 'preventivel':{
        d.was_preventable=valor==='Sim'||txt.toLowerCase().includes('sim');
        gerarResumo(d);
        break;
      }

      default: break;
    }
  };

  // -- PULAR CAMPO OPCIONAL -----------------------------------------------
  const pular=()=>{
    const pulos={
      nip:'idade',
      idade:'sexo',
      sexo:'desfecho',
    };
    const proximo=pulos[step];
    if(!proximo) return;
    const perguntas={
      idade:'Idade aproximada do paciente:',
      sexo:'Sexo do paciente:',
      desfecho:'Qual foi o desfecho para o paciente?',
    };
    addMsg('user','Não informado');
    avancar({...dados},proximo,perguntas[proximo]);
  };

  // -- RESUMO COM IA ------------------------------------------------------
  const gerarResumo=async(d)=>{
    setDados(d);setStep('resumo');setLoading(true);
    const ctx=[
      `Tipo: ${d.notification_type}`,
      d.event_subtype?`Evento: ${d.event_subtype}`:'',
      d.sector?`Setor: ${d.sector}`:'',
      d.event_date?`Data: ${new Date(d.event_date+'T12:00:00').toLocaleDateString('pt-BR')} (${d.shift||''})` :'',
      d.description?`Descrição: ${d.description}`:'',
      d.measures_taken?`Medidas: ${d.measures_taken}`:'',
      d.patient_nip?`NIP: ${d.patient_nip}`:'',
      d.patient_age_range?`Idade: ${d.patient_age_range}`:'',
      d.patient_sex?`Sexo: ${d.patient_sex}`:'',
      d.patient_outcome?`Desfecho: ${d.patient_outcome}`:'',
      d.was_preventable!==undefined?`Evitável: ${d.was_preventable?'Sim':'Não'}` :'',
    ].filter(Boolean).join(', ');
    try{
      const resumo=await callWorker(
        [{role:'user',content:`Faça um resumo técnico objetivo em 3-4 linhas desta notificação hospitalar, em português. Inclua os dados mais relevantes: ${ctx}`}],
        'Você é assistente do NSP. Resuma de forma objetiva e técnica. Máximo 4 linhas. Não faça perguntas.'
      );
      addMsg('assistant',`**Resumo da notificação:**\n\n${resumo}\n\nAs informações estão corretas?`);
      setDados({...d,ai_summary:resumo});
    }catch{
      addMsg('assistant',`**Resumo:** ${ctx}\n\nAs informações estão corretas?`);
    }
    setLoading(false);
  };

  // -- CONFIRMAR E SALVAR -------------------------------------------------
  const confirmar=async()=>{
    setSaving(true);addMsg('user','Sim, confirmar e enviar.');
    try{
      const payload={
        notification_type:dados.notification_type||'seguranca_paciente',
        notifier_type:dados.notifier_type||'profissional',
        sector:dados.sector||null,
        event_date:dados.event_date||null,
        shift:dados.shift||null,
        event_subtype:dados.event_subtype||null,
        description:dados.description||null,
        measures_taken:dados.measures_taken||null,
        patient_outcome:dados.patient_outcome||null,
        was_preventable:dados.was_preventable===true?true:dados.was_preventable===false?false:null,
        occurrence_subtype:dados.notification_type!=='seguranca_paciente'?(dados.event_subtype||null):null,
        patient_age:null,
        admission_reason:[dados.patient_nip?'NIP: '+dados.patient_nip:'', dados.patient_age_range||'', dados.patient_sex||''].filter(Boolean).join(' | ')||null,
        ai_summary:dados.ai_summary||null,
        is_test:testMode||false,
        hospital_id:h.id,
        chat_history:messages,
      };
      let protocolo='';
      if(sbUrl&&sbKey){
        const res=await sbInsert(sbUrl,sbKey,'notifications',payload);
        protocolo=res?.[0]?.id?res[0].id.slice(0,8).toUpperCase():Math.random().toString(36).slice(2,10).toUpperCase();
        if(webhookUrl){try{await fetch(webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,protocolo,hospital_name:h.name})});}catch{}}
        showToast('Notificação salva! Gestor será notificado.','success');
      } else {
        protocolo=Math.random().toString(36).slice(2,10).toUpperCase();
        showToast('Notificação registrada!','success');
      }
      addMsg('assistant','Notificação enviada com sucesso!\n\nProtocolo: '+protocolo+'\n\nGuarde este número. O Gestor foi notificado.\n\nObrigado por contribuir com a segurança do HNSA.');
      setStep('done');
    }catch{showToast('Erro ao salvar. Tente novamente.','error');}
    setSaving(false);
  };

  const corrigir=()=>{
    addMsg('user','Quero corrigir.');
    addMsg('assistant','Certo. Descreva novamente o que aconteceu:');
    setStep('relato');
  };

  // -- CHIPS POR STEP -----------------------------------------------------
  const CHIPS_MAP={
    perfil:[
      {v:'profissional',l:'Enfermeiro(a)'},
      {v:'profissional',l:'Médico(a)'},
      {v:'profissional',l:'Técnico(a) de Enfermagem'},
      {v:'profissional',l:'Fisioterapeuta'},
      {v:'profissional',l:'Farmacêutico(a)'},
      {v:'profissional',l:'Outro profissional de saúde'},
      {v:'paciente',l:'Sou paciente'},
      {v:'familiar',l:'Sou familiar / acompanhante'},
      {v:'anonimo',l:'Notificação anônima'},
    ],
    tipo:[
      {v:'seguranca_paciente',l:'Relacionado ao paciente'},
      {v:'administrativa',l:'Ocorrência administrativa'},
      {v:'ccih',l:'Infecção hospitalar (CCIH)'},
    ],
    subtipo_sp:[
      {v:'Queda',l:'Queda'},
      {v:'Lesão por pressão',l:'Lesão por pressão'},
      {v:'Perda de AVP',l:'Perda de acesso venoso (AVP)'},
      {v:'Erro de medicação',l:'Erro de medicação / prescrição'},
      {v:'Falha na identificação',l:'Falha na identificação do paciente'},
      {v:'Cirurgia segura',l:'Evento relacionado à cirurgia'},
      {v:'Perda de SNE',l:'Perda de SNE / SNG'},
      {v:'Near miss',l:'Near miss (quase erro)'},
      {v:'Evento sentinela',l:'Evento sentinela'},
      {v:'Outro',l:'Outro evento'},
    ],
    subtipo_ccih:[
      {v:'ITU',l:'ITU - Infecção do Trato Urinário'},
      {v:'PAV',l:'PAV - Pneumonia por VM'},
      {v:'ISC',l:'ISC - Infecção de Sítio Cirúrgico'},
      {v:'IPCS',l:'IPCS - Corrente Sanguínea'},
      {v:'Outro foco',l:'Outro foco de infecção'},
    ],
    subtipo_adm:[
      {v:'Segurança orgânica',l:'Segurança orgânica'},
      {v:'Laboratório',l:'Laboratório'},
      {v:'Hotelaria / limpeza',l:'Hotelaria / limpeza'},
      {v:'Nutrição / dieta',l:'Nutrição / dieta'},
      {v:'Vestimenta / adornos',l:'Vestimenta inadequada / adornos'},
      {v:'Farmácia',l:'Farmácia'},
      {v:'Infraestrutura / manutenção',l:'Infraestrutura / manutenção'},
      {v:'Comunicação / documentação',l:'Comunicação / documentação'},
      {v:'Outro',l:'Outro'},
    ],
    avp_motivo:[
      {v:'Flebite',l:'Flebite'},
      {v:'Infiltração',l:'Infiltração'},
      {v:'Extravasamento',l:'Extravasamento'},
      {v:'Paciente removeu',l:'Paciente removeu / arrancou'},
      {v:'Saída acidental',l:'Saída acidental durante procedimento'},
      {v:'Obstrução / coagulação',l:'Obstrução / coagulação'},
      {v:'Fixação inadequada',l:'Fixação inadequada'},
      {v:'Não identificado',l:'Não identificado'},
    ],
    setor: h.sectors.map(s=>({v:s,l:s})),
    data:[
      {v:'Manhã de hoje',l:'Manhã de hoje (07h-13h)'},
      {v:'Tarde de hoje',l:'Tarde de hoje (13h-19h)'},
      {v:'Noite de hoje',l:'Noite/madrugada de hoje (19h-07h)'},
      {v:'Manhã de ontem',l:'Manhã de ontem'},
      {v:'Tarde de ontem',l:'Tarde de ontem'},
      {v:'Noite de ontem',l:'Noite de ontem'},
    ],
    idade:[
      {v:'Menor de 18 anos',l:'Menor de 18 anos'},
      {v:'18 a 60 anos',l:'18 a 60 anos'},
      {v:'Maior de 60 anos',l:'Maior de 60 anos'},
      {v:'nao_informar',l:'Não informar'},
    ],
    sexo:[
      {v:'Masculino',l:'Masculino'},
      {v:'Feminino',l:'Feminino'},
      {v:'nao_informar',l:'Prefiro não informar'},
    ],
    desfecho:[
      {v:'Sem dano',l:'Sem dano'},
      {v:'Dano leve',l:'Dano leve - recuperação completa'},
      {v:'Dano moderado',l:'Dano moderado - requer tratamento adicional'},
      {v:'Dano grave',l:'Dano grave - permanente ou longa internação'},
      {v:'Óbito',l:'Óbito'},
      {v:'Near miss - sem dano',l:'Near miss - não atingiu o paciente'},
    ],
    preventivel:[
      {v:'Sim',l:'Sim, era evitável'},
      {v:'Não',l:'Não era evitável'},
      {v:'Não sei',l:'Não sei avaliar'},
    ],
  };

  const chipsAtivos=()=>{
    if(step==='subtipo'){
      const t=dados.notification_type;
      if(t==='ccih') return CHIPS_MAP.subtipo_ccih;
      return CHIPS_MAP.subtipo_sp;
    }
    return CHIPS_MAP[step]||[];
  };

  // -- PROGRESSO ---------------------------------------------------------
  const ORDEM_SP=['perfil','tipo','subtipo','avp_motivo','setor','data','relato','medidas','nip','idade','sexo','desfecho','preventivel','resumo'];
  const ORDEM_ADM=['perfil','tipo','subtipo_adm','setor','data','relato','medidas','resumo'];
  const ORDEM_PACFAM=['perfil','subtipo','avp_motivo','setor','data','relato','medidas','nip','idade','sexo','desfecho','preventivel','resumo'];

  const getOrdem=()=>{
    const t=dados.notification_type;
    if(t==='administrativa') return ORDEM_ADM;
    if(dados.notifier_type==='paciente'||dados.notifier_type==='familiar'||dados.notifier_type==='anonimo') return ORDEM_PACFAM;
    return ORDEM_SP;
  };

  const getProgresso=()=>{
    const ordem=getOrdem().filter(s=>dados.event_subtype==='Perda de AVP'?true:s!=='avp_motivo');
    const idx=ordem.indexOf(step);
    return{atual:Math.max(idx,0)+1,total:ordem.length};
  };

  const LABELS_STEP={
    perfil:'Identificação',
    tipo:'Tipo de evento',
    subtipo:'O que aconteceu?',
    subtipo_adm:'Tipo de ocorrência',
    avp_motivo:'Motivo da perda do AVP',
    setor:'Setor',
    data:'Quando?',
    relato:'Descrição do evento',
    medidas:'Medidas tomadas',
    nip:'Identificação do paciente',
    idade:'Idade do paciente',
    sexo:'Sexo do paciente',
    desfecho:'Desfecho',
    preventivel:'Evitabilidade',
    resumo:'Confirmação',
    done:'Concluído',
  };

  const chips=chipsAtivos();
  const prog=step!=='done'?getProgresso():{atual:1,total:1};
  const inputSteps=['relato','medidas','nip','setor','data'];
  const showInput=inputSteps.includes(step)&&!loading&&!saving;
  const showPular=['nip','idade','sexo'].includes(step)&&!loading&&!saving;
  const showConfirm=step==='resumo'&&!loading&&!saving;

  // -- MENSAGEM INICIAL ---------------------------------------------------
  useEffect(()=>{
    setMessages([{role:'assistant',content:'Olá! Vamos registrar a notificação passo a passo.\n\n**Quem é você?**\n\nVocê pode notificar anonimamente se preferir - nenhum dado pessoal é obrigatório.'}]);
  },[]);

  // -- RENDER -------------------------------------------------------------
  return(<div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 64px)'}}>

    {/* Header com barra de progresso */}
    <div style={{padding:'12px 16px',borderBottom:'1px solid '+C.border,background:C.surface}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:step!=='done'?6:0}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text}}>Registrar Notificação</div>
        {step!=='done'&&<div style={{fontSize:11,color:C.muted,fontWeight:600}}>Passo {prog.atual}/{prog.total}</div>}
      </div>
      {step!=='done'&&<div>
        <div style={{height:3,background:C.border,borderRadius:2,overflow:'hidden',marginBottom:4}}>
          <div style={{width:(prog.atual/prog.total)*100+'%',height:'100%',background:'linear-gradient(90deg,'+C.teal+','+C.blue+')',borderRadius:2,transition:'width .4s'}}/>
        </div>
        <div style={{fontSize:10,color:C.teal,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>{LABELS_STEP[step]||''}</div>
      </div>}
    </div>

    {/* Área de mensagens */}
    <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:10}}>
      {messages.map((m,i)=>(
        <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
          <div style={{maxWidth:'88%',background:m.role==='user'?'linear-gradient(135deg,'+C.teal+','+C.blue+')':C.card,border:m.role==='assistant'?'1px solid '+C.border:'none',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'11px 14px',fontSize:14,color:m.role==='user'?'#fff':C.text,lineHeight:1.65}}
            dangerouslySetInnerHTML={{__html:md(m.content)}}/>
        </div>
      ))}
      {(loading||saving)&&<div style={{display:'flex',alignItems:'center',gap:8}}>
        <Dots/>
        {saving&&<span style={{fontSize:12,color:C.green}}>Salvando...</span>}
      </div>}
      <div ref={endRef}/>
    </div>

    {/* Área de entrada */}
    {step!=='done'&&(
      <div style={{borderTop:'1px solid '+C.border,background:C.surface}}>

        {/* Chips clicáveis */}
        {chips.length>0&&!loading&&!saving&&(
          <div style={{padding:'10px 14px 6px',display:'flex',flexWrap:'wrap',gap:7,maxHeight:200,overflowY:'auto'}}>
            {chips.map((c,i)=>(
              <button key={i} onClick={()=>responder(c.v,c.l)}
                style={{background:C.card,border:'1px solid '+C.teal+'55',borderRadius:20,padding:'7px 14px',color:C.teal,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                {c.l}
              </button>
            ))}
          </div>
        )}

        {/* Botão pular (campos opcionais) */}
        {showPular&&(
          <div style={{padding:'4px 14px 0',display:'flex',justifyContent:'flex-end'}}>
            <button onClick={pular} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>
              Pular (não informar)
            </button>
          </div>
        )}

        {/* Botões confirmar / corrigir */}
        {showConfirm&&(
          <div style={{padding:'8px 14px 6px',display:'flex',gap:8}}>
            <button onClick={confirmar} style={{flex:2,background:C.teal,border:'none',borderRadius:12,padding:'13px',color:'#06101F',fontWeight:800,fontSize:13,cursor:'pointer'}}>
              Confirmar e Enviar
            </button>
            <button onClick={corrigir} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'13px',color:C.muted,fontWeight:600,fontSize:12,cursor:'pointer'}}>
              Corrigir
            </button>
          </div>
        )}

        {/* Campo texto livre */}
        {showInput&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder={
                step==='nip'?'Digite o NIP do paciente...' :
                step==='relato'?'Descreva o que aconteceu...' :
                step==='medidas'?'Descreva as medidas tomadas...' :
                chips.length>0?'Ou escreva livremente...' :
                'Escreva aqui...'
              }
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}

        {/* NIP - só texto (sem chips) */}
        {step==='nip'&&!loading&&!saving&&chips.length===0&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder="Digite o NIP do paciente..."
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}
      </div>
    )}
  </div>);
}


// --- ANALYTICS VIEW ----------------------------------------------------------
function AnalyticsView({sbUrl,sbKey,showToast,profileMode,hospital}) {
  const [tab,setTab]=useState('graficos');
  const [narrative,setNarrative]=useState('');
  const [loadingNarr,setLoadingNarr]=useState(false);
  const [stats,setStats]=useState(null);
  const [rawData,setRawData]=useState([]);
  const [filterYear,setFilterYear]=useState(new Date().getFullYear());
  const [filterMonth,setFilterMonth]=useState(0);

  useEffect(()=>{
    if(!sbUrl||!sbKey) return;
    sbSelect(sbUrl,sbKey,'notifications','select=*&order=created_at.desc&limit=500')
      .then(data=>{setStats(computeStats(data));setRawData(data||[]);})
      .catch(()=>showToast('Erro ao carregar analytics','error'));
  },[sbUrl,sbKey]);

  const s=stats||{sectorData:MOCK_SECTORS,typeData:MOCK_TYPES,heatmap:MOCK_HEATMAP,monthly:MOCK_MONTHLY,total:0,heatmapPeak:null,culturaScore:0,ratioNM:0,txC:0,nSets:0,diasSemSentinela:null};
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const anos=[...new Set(rawData.map(n=>new Date(n.created_at).getFullYear()))].sort((a,b)=>b-a);
  if(!anos.includes(filterYear)) anos.unshift(filterYear);

  const byMonth=Array.from({length:12},(_,i)=>{
    const items=rawData.filter(n=>{const d=new Date(n.created_at);return d.getFullYear()===filterYear&&d.getMonth()===i;});
    return{mes:MESES[i],total:items.length,sp:items.filter(n=>n.notification_type==='seguranca_paciente').length,ccih:items.filter(n=>n.notification_type==='ccih').length,adm:items.filter(n=>n.notification_type==='administrativa').length};
  });
  const totalAno=byMonth.reduce((acc,m)=>acc+m.total,0);
  const filtered=rawData.filter(n=>{const d=new Date(n.created_at);if(d.getFullYear()!==filterYear)return false;if(filterMonth!==0&&d.getMonth()!==filterMonth-1)return false;return true;});

  const exportCSV=()=>{
    const header=['ID','Data','Hora','Tipo','Subtipo','Setor','Turno','Descrição','Medidas','Desfecho','RCA','Notivisa'];
    const rows=filtered.map(n=>[n.id?.slice(0,8)||'',n.event_date||new Date(n.created_at).toLocaleDateString('pt-BR'),n.event_time||'',n.notification_type||'',n.event_subtype||'',n.sector||'',n.shift||'',(n.description||'').replace(/"/g,'""'),(n.measures_taken||'').replace(/"/g,'""'),n.patient_outcome||'',n.rca_gerado?'Sim':'Não',n.notivisa_enviado?'Sim':'Não']);
    const csv=[header,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
    a.download=`notificacoes_hnsa_${filterYear}${filterMonth>0?'_'+String(filterMonth).padStart(2,'0'):''}.csv`;
    a.click();URL.revokeObjectURL(url);
    setTimeout(()=>window.open('https://sheets.new','_blank'),600);
  };

  const genNarrative=async()=>{
    setLoadingNarr(true);setNarrative('');
    try {
      const text=await callWorker([{role:'user',content:`Você é o analista do NSP do Hospital Naval de Salvador (HNSA). Gere uma interpretação técnica em 4 parágrafos curtos, em português, tom de ata institucional.

DADOS DO PERÍODO:
- Total de notificações: ${s.total} (${s.sp} Segurança do Paciente, ${s.ccih} CCIH/Infecções, ${s.adm} Administrativas)
- Setores: ${s.sectorData.map(d=>`${d.setorNome||d.setor} com ${d.eventos} notificação(ões)`).join('; ')}
- Tipos mais frequentes: ${s.typeData.slice(0,4).map(d=>`${d.name} (${d.value})`).join(', ')}
- Índice de maturidade de notificação: ${s.culturaScore}/100
- Dias sem evento sentinela: ${s.diasSemSentinela??'não disponível'}

ESTRUTURA DOS 4 PARÁGRAFOS:
1) Panorama geral do período
2) Análise por setor e tipo de evento mais frequente
3) Pontos de atenção e padrões identificados
4) Recomendações prioritárias para o NSP

Use os nomes completos dos setores. Não use siglas sem explicação.`}],'Você é analista gestor hospitalar. Responda em português, tom institucional.');
      setNarrative(text);
    } catch { showToast('Erro ao gerar interpretação','error'); }
    setLoadingNarr(false);
  };

  const tb=(id,l)=><button onClick={()=>setTab(id)} style={{flex:1,padding:'8px 2px',borderRadius:7,border:'none',background:tab===id?C.teal:'transparent',color:tab===id?'#06101F':C.muted,fontSize:10,fontWeight:700,cursor:'pointer'}}>{l}</button>;

  return(<div style={{padding:'20px 16px',display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',alignItems:'baseline',gap:10}}>
      <div style={{fontSize:17,fontWeight:900,color:C.text}}>Analytics</div>
      <div style={{fontSize:11,color:stats?C.green:sbUrl?C.muted:C.muted}}>{stats?'? Dados reais':sbUrl?'? Carregando...':'? Dados de exemplo'}</div>
    </div>
    <div style={{display:'flex',background:C.surface,borderRadius:10,padding:4,gap:3}}>
      {tb('graficos','Gráficos')}{tb('calor','Calor')}{tb('cultura','Maturidade')}{tb('ia','IA')}{tb('relatorio','Relatório')}
    </div>

    {tab==='graficos'&&<div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'16px 12px'}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}>Evolução Mensal</div>
        <div style={{display:'flex',gap:14,marginBottom:10}}>
          {[['SP',C.teal],['Adm',C.purple]].map(([l,c])=><div key={l} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:C.muted}}><div style={{width:10,height:10,borderRadius:2,background:c}}/>{l}</div>)}
        </div>
        <LineChart data={s.monthly?.length?s.monthly:MOCK_MONTHLY} lines={[{key:'sp',color:C.teal},{key:'adm',color:C.purple}]} height={150}/>
      </div>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'16px 12px'}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Eventos por Setor</div>
        <BarChart data={s.sectorData} xKey="setor" yKey="eventos" color={C.blue} height={150}/>
      </div>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'16px 12px'}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Distribuição por Tipo</div>
        <PieChart data={s.typeData} size={180}/>
      </div>
    </div>}

    {tab==='calor'&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Mapa de Calor</div>
      <div style={{fontSize:11,color:C.muted,marginBottom:16}}>Eventos por turno × dia da semana</div>
      <div style={{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',gap:3,marginBottom:4}}>
        <div/>{DIAS.map(d=><div key={d} style={{textAlign:'center',fontSize:10,color:C.muted,fontWeight:700}}>{d}</div>)}
      </div>
      {s.heatmap.map(row=>(
        <div key={row.turno} style={{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',gap:3,marginBottom:3}}>
          <div style={{fontSize:10,color:C.muted,fontWeight:700,display:'flex',alignItems:'center'}}>{row.turno}</div>

        <span style={{fontSize:10,color:C.muted}}>Menos</span>
        {[C.surface,'#0E3D5B','#0369A1','#0891B2',C.teal].map((c,i)=><div key={i} style={{width:18,height:18,borderRadius:4,background:c,border:'1px solid '+C.border}}/>)}

      </div>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Total {filterYear} - {totalAno} notificações</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
            <thead><tr>{['Mês','Total','SP','CCIH','Adm'].map(h=><th key={h} style={{padding:'6px 8px',textAlign:'center',color:C.muted,fontWeight:700,borderBottom:'1px solid '+C.border}}>{h}</th>)}</tr></thead>
            <tbody>

                <tr key={i} onClick={()=>setFilterMonth(filterMonth===i+1?0:i+1)} style={{cursor:'pointer',background:filterMonth===i+1?C.teal+'15':'transparent'}}>

                  <td style={{padding:'6px 8px',textAlign:'center',fontWeight:900,color:m.total>0?C.text:C.muted,borderBottom:'1px solid '+C.border+'22'}}>{m.total||'-'}</td>
                  <td style={{padding:'6px 8px',textAlign:'center',color:m.sp>0?C.red:C.muted,borderBottom:'1px solid '+C.border+'22'}}>{m.sp||'-'}</td>

                <span style={{fontSize:9,background:n.notivisa_enviado?C.green+'20':C.muted+'20',color:n.notivisa_enviado?C.green:C.muted,borderRadius:3,padding:'1px 5px',fontWeight:700}}>{n.notivisa_enviado?'OkNTV':'-NTV'}</span>

  </div>);

const TICKET_TYPES=[
  {id:'manutencao',label:'Manutenção / DSG',icon:'ferramenta',color:'#F59E0B',dest:'DSG',desc:'Equipamento, infraestrutura, elétrica'},
  {id:'ambulancia',label:'Saída por Ambulância',icon:'ambulancia',color:'#EF4444',dest:'Garagem',desc:'Transporte de paciente para outra unidade'},
  {id:'leito',label:'Solicitação de Leito',icon:'?',color:'#1D6FE8',dest:'Enfermagem',desc:'Transferência interna entre setores'},
  {id:'material',label:'Solicitação de Material',icon:'?',color:'#10B981',dest:'Almoxarifado',desc:'Equipamentos, insumos, materiais médicos'},
  {id:'dieta',label:'Dieta Especial',icon:'?',color:'#8B5CF6',dest:'Nutrição',desc:'Mudança ou solicitação de dieta'},
  {id:'outro',label:'Outro Chamado',icon:'lista',color:'#5A7AA0',dest:'Gestão',desc:'Outros chamados administrativos'},
];
const TICKET_STATUS={
  aberto:{label:'Aberto',color:'#F59E0B',bg:'#F59E0B22'},
  visualizado:{label:'Visualizado',color:'#8B5CF6',bg:'#8B5CF622'},
  recebido:{label:'Recebido',color:'#1D6FE8',bg:'#1D6FE822'},
  em_andamento:{label:'Em andamento',color:'#00C9B8',bg:'#00C9B822'},
  concluido:{label:'Concluído',color:'#10B981',bg:'#10B98122'},
  pendente:{label:'Pendente',color:'#EF4444',bg:'#EF444422'},
};

function TicketForm({sbUrl,sbKey,hospital,showToast,onBack}) {
  const [step,setStep]=useState('type');
  const [type,setType]=useState(null);
  const [form,setForm]=useState({sector:'',description:'',priority:'normal',patient_name:'',destination:'',scheduled_at:'',requester_name:''});
  const [saving,setSaving]=useState(false);
  const h=hospital||DEFAULT_HOSPITAL;
  const tt=TICKET_TYPES.find(t=>t.id===type);

  const submit=async()=>{
    if(!form.description.trim()){showToast('Descreva o chamado','error');return;}
    setSaving(true);
    try {
      const payload={hospital_id:h.id,ticket_type:type,origin_sector:form.sector,description:form.description,priority:form.priority,patient_name:form.patient_name||null,requester_name:form.requester_name||null,destination_sector:tt?.dest||null,scheduled_at:form.scheduled_at||null,status:'aberto',opened_at:new Date().toISOString()};
      if(sbUrl&&sbKey) await sbInsert(sbUrl,sbKey,'tickets',payload);
      showToast('OK Chamado aberto! '+tt?.dest+' foi notificado.','success');
      setStep('done');
    } catch(e) { showToast('Erro: '+e.message,'error'); }
    setSaving(false);
  };

  const inp={background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'11px 14px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:12};
  const lbl={fontSize:11,color:C.muted,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:6};

  if(step==='done') return(<div style={{padding:32,textAlign:'center'}}>
    <div style={{fontSize:52,marginBottom:14}}>OK</div>
    <div style={{fontSize:18,fontWeight:900,color:C.text,marginBottom:8}}>Chamado aberto!</div>
    <div style={{fontSize:14,color:C.muted,marginBottom:24}}>{tt?.dest} foi notificado.</div>
    <button onClick={onBack} style={{background:C.teal,border:'none',borderRadius:12,padding:'12px 28px',color:'#06101F',fontWeight:800,fontSize:14,cursor:'pointer'}}>Ver chamados</button>
  </div>);

  if(step==='type') return(<div style={{padding:'20px 16px'}}>
    {onBack&&<button onClick={onBack} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:16}}}><-</button>}
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:4}}>Novo Chamado</div>

          <div style={{width:44,height:44,borderRadius:12,background:t.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{t.icon}</div>

        </button>
      ))}
    </div>
  </div>);

  return(<div style={{padding:'20px 16px'}}>
    <button onClick={()=>setStep('type')} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:8}}}><-</button>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <div style={{width:44,height:44,borderRadius:12,background:tt?.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>{tt?.icon}</div>
      <div><div style={{fontSize:16,fontWeight:800,color:C.text}}>{tt?.label}</div><div style={{fontSize:11,color:C.muted}}>-> {tt?.dest}</div></div>

      {h.sectors.map(s=><option key={s} value={s}>{s}</option>)}
    </select>
    <label style={lbl}>Solicitante (opcional)</label>
    <input value={form.requester_name} onChange={e=>setForm({...form,requester_name:e.target.value})} placeholder="Nome" style={inp}/>
    {type==='ambulancia'&&<>
      <label style={lbl}>Nome do paciente</label>
      <input value={form.patient_name} onChange={e=>setForm({...form,patient_name:e.target.value})} placeholder="Nome completo (opcional)" style={inp}/>
      <label style={lbl}>Destino / Unidade de referência</label>

    <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Descreva o chamado..." style={{...inp,height:90,resize:'none',fontFamily:'inherit'}}/>

        <button key={id} onClick={()=>setForm({...form,priority:id})} style={{flex:1,padding:'9px',borderRadius:8,border:'1px solid '+(form.priority===id?color:C.border),background:form.priority===id?color+'22':C.card,color:form.priority===id?color:C.muted,fontWeight:700,fontSize:12,cursor:'pointer'}}>{label}</button>
