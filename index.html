<script type="text/babel">
// --- APP COMPONENTE PRINCIPAL ----------------------------------------------
function App() {
  const [step, setStep] = React.useState(2);
  const [hospital, setHospital] = React.useState(DEFAULT_HOSPITAL);

  const processFile = (file) => {
    if (!window.Papa) return;
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        console.log("CSV Processado com sucesso:", results.data);
        setStep(3);
      }
    });
  };

  return (
    <div style={{ padding: 16, background: C.bg, minHeight: '100vh', color: C.text }}>
      
      {step === 2 && (
        <div style={{ maxWidth: 480, margin: '0 auto', background: C.surface, padding: 20, borderRadius: 16, border: '1px solid ' + C.border }}>
          <h3 style={{ marginBottom: 12, fontSize: 16, fontWeight: 700 }}>Importação de dados do {hospital.short_name}</h3>
          
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
            <button 
              onClick={() => setStep(1)} 
              style={{
                flex: 1,
                background: C.card,
                border: '1px solid ' + C.border,
                borderRadius: 8,
                padding: '9px',
                color: C.muted,
                fontSize: 12,
                fontWeight: 700,
                cursor: 'pointer'
              }}
            >
              {"\u2190 Voltar"}
            </button>

            <button 
              onClick={() => setStep(3)} 
              style={{
                flex: 2,
                background: C.teal,
                border: 'none',
                borderRadius: 8,
                padding: '9px',
                color: '#06101F',
                fontSize: 12,
                fontWeight: 800,
                cursor: 'pointer'
              }}
            >
              {"Revisar \u2192"}
            </button>
          </div>

          <div 
            style={{ fontSize: 12, color: C.muted, marginTop: 12, cursor: 'pointer', textAlign: 'center', background: C.card, padding: 10, borderRadius: 8, border: '1px solid ' + C.border }}
            onClick={() => document.getElementById('csvInput').click()}
          >
            Exportado do Google Sheets ou outro sistema
          </div>

          <input 
            id="csvInput" 
            type="file" 
            accept=".csv" 
            style={{ display: 'none' }} 
            onChange={e => {
              if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);
            }}
          />
        </div>
      )}

      {step === 3 && (
        <div style={{ maxWidth: 480, margin: '0 auto', textAlign: 'center' }}>
          <h3 style={{ marginBottom: 12 }}>Dados Carregados para Revisão</h3>
          <button 
            onClick={() => setStep(2)} 
            style={{ marginTop: 12, padding: '8px 16px', background: C.teal, border: 'none', borderRadius: 6, color: '#06101F', fontWeight: 700, cursor: 'pointer' }}
          >
            Voltar para Tela Principal
          </button>
        </div>
      )}

    </div>
  );
}

// --- RENDERIZADOR CORRIGIDO ------------------------------------------------
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
