<script type="text/babel">
// --- APP COMPONENTE PRINCIPAL ----------------------------------------------
function App() {
  const [step, setStep] = React.useState(2);
  
  // Proteção: Caso DEFAULT_HOSPITAL não exista ou falhe, ele não quebra a tela
  const [hospital, setHospital] = React.useState(() => {
    return typeof DEFAULT_HOSPITAL !== 'undefined' ? DEFAULT_HOSPITAL : { short_name: 'Hospital' };
  });

  const processFile = (file) => {
    if (!window.Papa) return;
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        console.log("CSV Processado com sucesso:", results.data);
        setStep(3);
      }
    });
  };

  return (
    <div style={{ padding: 16, background: typeof C !== 'undefined' ? C.bg : '#0b132b', minHeight: '100vh', color: typeof C !== 'undefined' ? C.text : '#ffffff', fontFamily: 'sans-serif' }}>
      
      {step === 2 && (
        <div style={{ maxWidth: 480, margin: '0 auto', background: typeof C !== 'undefined' ? C.surface : '#1c2541', padding: 20, borderRadius: 16, border: '1px solid ' + (typeof C !== 'undefined' ? C.border : '#3a506b') }}>
          <h3 style={{ marginBottom: 12, fontSize: 16, fontWeight: 700 }}>
            Importação de dados do {hospital?.short_name || 'Hospital'}
          </h3>
          
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
            <button 
              onClick={() => setStep(1)} 
              style={{
                flex: 1,
                background: typeof C !== 'undefined' ? C.card : '#3a506b',
                border: '1px solid ' + (typeof C !== 'undefined' ? C.border : '#5bc0be'),
                borderRadius: 8,
                padding: '9px',
                color: typeof C !== 'undefined' ? C.muted : '#ffffff',
                fontSize: 12,
                fontWeight: 700,
                cursor: 'pointer'
              }}
            >
              {"\u2190 Voltar"}
            </button>

            <button 
              onClick={() => setStep(3)} 
              style={{
                flex: 2,
                background: typeof C !== 'undefined' ? C.teal : '#5bc0be',
                border: 'none',
                borderRadius: 8,
                padding: '9px',
                color: '#06101F',
                fontSize: 12,
                fontWeight: 800,
                cursor: 'pointer'
              }}
            >
              {"Revisar \u2192"}
            </button>
          </div>

          <div 
            style={{ fontSize: 12, color: typeof C !== 'undefined' ? C.muted : '#ffffff', marginTop: 12, cursor: 'pointer', textAlign: 'center', background: typeof C !== 'undefined' ? C.card : '#3a506b', padding: 10, borderRadius: 8, border: '1px solid ' + (typeof C !== 'undefined' ? C.border : '#5bc0be') }}
            onClick={() => {
              const input = document.getElementById('csvInput');
              if (input) input.click();
            }}
          >
            Exportado do Google Sheets ou outro sistema
          </div>

          <input 
            id="csvInput" 
            type="file" 
            accept=".csv" 
            style={{ display: 'none' }} 
            onChange={e => {
              if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);
            }}
          />
        </div>
      )}

      {step === 3 && (
        <div style={{ maxWidth: 480, margin: '0 auto', textAlign: 'center' }}>
          <h3 style={{ marginBottom: 12 }}>Dados Carregados para Revisão</h3>
          <button 
            onClick={() => setStep(2)} 
            style={{ marginTop: 12, padding: '8px 16px', background: typeof C !== 'undefined' ? C.teal : '#5bc0be', border: 'none', borderRadius: 6, color: '#06101F', fontWeight: 700, cursor: 'pointer' }}
          >
            Voltar para Tela Principal
          </button>
        </div>
      )}

    </div>
  );
}

// --- RENDERIZADOR ----------------------------------------------------------
const container = document.getElementById('root');
if (container) {
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
}
</script>
