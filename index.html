function AuditarView({sbUrl,sbKey,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [periodo,setPeriodo]=useState('tudo');
  const [customDe,setCustomDe]=useState('');
  const [customAte,setCustomAte]=useState('');
  const [loading,setLoading]=useState(true);
  const [dados,setDados]=useState(null);
  const [gerandoPPT,setGerandoPPT]=useState(false);
  const [gerandoPDF,setGerandoPDF]=useState(false);
  const [gerandoZip,setGerandoZip]=useState(false);

  const range=(()=>{
    const hoje=new Date().toISOString().slice(0,10);
    if(periodo==='ano'){const ano=new Date().getFullYear();return{de:`${ano}-01-01`,ate:hoje,label:`Ano ${ano}`};}
    if(periodo==='12m'){const d=new Date();d.setMonth(d.getMonth()-12);return{de:d.toISOString().slice(0,10),ate:hoje,label:'Ultimos 12 meses'};}
    if(periodo==='custom')return{de:customDe,ate:customAte,label:customDe&&customAte?'Periodo personalizado':'Selecione as datas'};
    return{de:null,ate:null,label:'Todo o historico'};
  })();

  const carregar=async()=>{
    if(!sbUrl||!sbKey)return;
    setLoading(true);
    try{
      const fd=range.de&&range.ate?`&event_date=gte.${range.de}&event_date=lte.${range.ate}`:'';
      const [nots,protocolos,treinsRaw,planos,saq,auditLog,cfgArr]=await Promise.all([
        sbSelect(sbUrl,sbKey,'notifications',`hospital_id=eq.${h.id}${fd}&is_test=neq.true&order=event_date.desc`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&order=nome.asc`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&order=data.desc`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'plano_acoes',`hospital_id=eq.${h.id}&order=created_at.desc`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'saq_respostas',`hospital_id=eq.${h.id}`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'audit_log',`hospital_id=eq.${h.id}&order=created_at.desc&limit=500`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'config_dsm',`hospital_id=eq.${h.id}`).catch(()=>[]),
      ]);
      const treins=range.de&&range.ate?(treinsRaw||[]).filter(t=>t.data&&t.data>=range.de&&t.data<=range.ate):(treinsRaw||[]);
      setDados({nots:nots||[],protocolos:protocolos||[],treins,planos:planos||[],saq:saq||[],auditLog:auditLog||[],cfg:(cfgArr&&cfgArr[0])||{}});
    }catch(e){showToast('Erro ao carregar: '+e.message,'error');}
    setLoading(false);
  };
  useEffect(()=>{carregar();},[sbUrl,sbKey,periodo,customDe,customAte]);

  if(loading||!dados) return(<div style={{padding:'0 0 80px'}}><BackHeader title='Auditar' subtitle='Evidencias consolidadas para auditoria e acreditacao'/><div style={{display:'flex',justifyContent:'center',padding:60}}><Dots/></div></div>);

  const hojeStr=new Date().toISOString().slice(0,10);
  const {nots,protocolos,treins,planos,saq,auditLog,cfg}=dados;
  const sentinela=nots.filter(n=>n.gravidade==='Evento sentinela').length;
  const graves=nots.filter(n=>n.gravidade==='Evento sentinela'||n.gravidade==='Evento adverso grave');
  const gravesRCA=graves.filter(n=>n.rca_gerado).length;
  const protVigentes=protocolos.filter(p=>p.proxima_revisao&&p.proxima_revisao>=hojeStr).length;
  const protVencidos=protocolos.filter(p=>p.proxima_revisao&&p.proxima_revisao<hojeStr).length;
  const participantes=treins.reduce((a,t)=>a+(Number(t.participantes)||0),0);
  const planosAbertos=planos.filter(p=>p.status!=='concluido').length;
  const planosConcluidos=planos.filter(p=>p.status==='concluido').length;
  const planosEfetiv=planos.filter(p=>p.status==='concluido'&&p.efetividade_verificada).length;
  const temPortNSP=!!(cfg.numero_portaria_nsp||cfg.data_portaria_nsp);
  const pspVig=cfg.data_atualizacao_psp&&(()=>{const d=new Date(cfg.data_atualizacao_psp);d.setFullYear(d.getFullYear()+3);return d.toISOString().slice(0,10)>=hojeStr;})();

  const KPI=({label,val,color,sub})=>(<div style={{background:C.card,border:'1px solid '+color+'33',borderLeft:'3px solid '+color,borderRadius:10,padding:'10px 12px'}}>
    <div style={{fontSize:22,fontWeight:900,color}}>{val}</div>
    <div style={{fontSize:10,fontWeight:700,color:C.text,marginTop:2}}>{label}</div>
    {sub&&<div style={{fontSize:9,color:C.muted}}>{sub}</div>}
  </div>);

  const gerarPPTAuditoria=async()=>{
    if(!window.PptxGenJS){showToast('PptxGenJS carregando, tente em 3s','error');return;}
    setGerandoPPT(true);
    try{
      const P={navy:'0B1F3A',teal:'00C9B8',green:'10B981',red:'EF4444',yellow:'F59E0B',gray:'64748B',white:'FFFFFF'};
      const pres=new window.PptxGenJS();
      pres.defineLayout({name:'W',width:10,height:5.63});pres.layout='W';
      const header=(sl,t)=>{sl.background={color:'F8FAFC'};sl.addShape(pres.shapes.RECTANGLE,{x:0,y:0,w:10,h:0.7,fill:{color:P.navy}});sl.addShape(pres.shapes.RECTANGLE,{x:0,y:0.7,w:10,h:0.06,fill:{color:P.teal}});sl.addText(t,{x:0.4,y:0,w:7,h:0.7,fontSize:16,bold:true,color:P.white,valign:'middle',margin:0});sl.addText(range.label,{x:7.4,y:0,w:2.2,h:0.7,fontSize:11,color:P.teal,valign:'middle',align:'right',margin:0});};
      const rowFill=i=>({color:i%2===0?'FFFFFF':'F1F5F9'});
      const kpiBox=(x,val,lab,cor)=>{pres._sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x,y:1.0,w:2.15,h:1.15,fill:{color:P.white},rectRadius:0.08,line:{color:cor,width:1.2}});pres._sl.addText(String(val),{x,y:1.08,w:2.15,h:0.6,fontSize:26,bold:true,color:cor,align:'center',margin:0});pres._sl.addText(lab,{x,y:1.68,w:2.15,h:0.4,fontSize:9,color:P.gray,align:'center',margin:0});};

      let sl=pres.addSlide();sl.background={color:P.navy};
      sl.addShape(pres.shapes.RECTANGLE,{x:0,y:3.9,w:10,h:0.08,fill:{color:P.teal}});
      sl.addText('Dossie de Auditoria',{x:0.6,y:1.5,w:8.8,h:0.9,fontSize:34,bold:true,color:P.white,margin:0});
      sl.addText('Acreditacao e Seguranca do Paciente — '+(h.name||h.short_name||''),{x:0.6,y:2.4,w:8.8,h:0.5,fontSize:15,color:P.teal,margin:0});
      sl.addText(range.label,{x:0.6,y:2.95,w:8.8,h:0.4,fontSize:13,color:'C8D8E8',margin:0});
      sl.addText('Gerado em '+new Date().toLocaleDateString('pt-BR')+(cfg.gestor_nsp?' · Responsavel: '+cfg.gestor_nsp:'')+' · NotificaAI',{x:0.6,y:4.2,w:8.8,h:0.4,fontSize:10,color:'8FA5C0',margin:0});

      sl=pres.addSlide();header(sl,'Documentos Institucionais');pres._sl=sl;
      const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-';
      const stCell=ok=>({text:ok===null?'N/D':ok?'OK':'ATENCAO',options:{fontSize:9,bold:true,align:'center',color:ok===null?P.gray:ok?P.green:P.red}});
      const docRows=[[{text:'Documento',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:10}},{text:'Detalhe',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:10}},{text:'Status',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:10,align:'center'}}]];
      [['Portaria de criacao do NSP',(cfg.numero_portaria_nsp?'N '+cfg.numero_portaria_nsp+' · ':'')+fmtD(cfg.data_portaria_nsp),temPortNSP],
       ['Portaria da CCIH',(cfg.numero_portaria_ccih?'N '+cfg.numero_portaria_ccih+' · ':'')+fmtD(cfg.data_portaria_ccih),!!(cfg.numero_portaria_ccih||cfg.data_portaria_ccih)],
       ['Plano de Seguranca do Paciente (PSP)',cfg.data_atualizacao_psp?'Atualizado '+fmtD(cfg.data_atualizacao_psp):'-',cfg.data_atualizacao_psp?pspVig:null],
      ].forEach(([lab,det,ok],i)=>docRows.push([{text:lab,options:{fontSize:10,fill:rowFill(i)}},{text:det,options:{fontSize:10,fill:rowFill(i)}},{...stCell(ok),options:{...stCell(ok).options,fill:rowFill(i)}}]));
      sl.addTable(docRows,{x:0.4,y:1.0,w:9.2,colW:[3.9,3.6,1.7],border:{pt:0.5,color:'E2E8F0'},rowH:0.42,fontFace:'Calibri',valign:'middle',color:'1E293B'});

      sl=pres.addSlide();header(sl,'Protocolos Institucionais');pres._sl=sl;
      kpiBox(0.4,protocolos.length,'Protocolos cadastrados',P.navy);
      kpiBox(2.75,protVigentes,'Vigentes',P.green);
      kpiBox(5.1,protVencidos,'Com revisao vencida',protVencidos===0?P.green:P.red);
      kpiBox(7.45,protocolos.filter(p=>p.link).length,'Com documento anexado',P.teal);
      if(protVencidos>0){
        const pRows=[[{text:'Protocolo',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5}},{text:'Venceu em',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5,align:'center'}}]];
        protocolos.filter(p=>p.proxima_revisao&&p.proxima_revisao<hojeStr).slice(0,10).forEach((p,i)=>pRows.push([{text:p.nome,options:{fontSize:9.5,fill:rowFill(i)}},{text:fmtD(p.proxima_revisao),options:{fontSize:9.5,align:'center',color:P.red,bold:true,fill:rowFill(i)}}]));
        sl.addTable(pRows,{x:0.4,y:2.45,w:9.2,colW:[6.6,2.6],border:{pt:0.5,color:'E2E8F0'},rowH:0.32,fontFace:'Calibri',valign:'middle',color:'1E293B'});
      }

      sl=pres.addSlide();header(sl,'Notificacoes e Gestao de Risco');pres._sl=sl;
      kpiBox(0.4,nots.length,'Notificacoes no periodo',P.navy);
      kpiBox(2.75,sentinela,'Eventos sentinela',sentinela===0?P.green:P.red);
      kpiBox(5.1,graves.length?Math.round(gravesRCA/graves.length*100)+'%':'N/A','Graves com RCA concluida',graves.length===0||gravesRCA===graves.length?P.green:P.yellow);
      kpiBox(7.45,nots.filter(n=>n.notivisa_enviado).length,'Fichas Notivisa enviadas',P.teal);
      const porSetor={};nots.forEach(n=>{const st=n.sector||'Nao informado';porSetor[st]=(porSetor[st]||0)+1;});
      const topSet=Object.entries(porSetor).sort((a,b)=>b[1]-a[1]).slice(0,6);
      sl.addText('Setores com mais notificacoes',{x:0.4,y:2.45,w:9.2,h:0.3,fontSize:11,bold:true,color:'1E293B',margin:0});
      const setRows=[[{text:'Setor',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5}},{text:'Notificacoes',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5,align:'center'}}]];
      topSet.forEach(([st,n2],i)=>setRows.push([{text:st,options:{fontSize:9.5,fill:rowFill(i)}},{text:String(n2),options:{fontSize:9.5,bold:true,align:'center',fill:rowFill(i),color:P.navy}}]));
      sl.addTable(setRows,{x:0.4,y:2.8,w:6.0,colW:[4.4,1.6],border:{pt:0.5,color:'E2E8F0'},rowH:0.32,fontFace:'Calibri',valign:'middle',color:'1E293B'});

      sl=pres.addSlide();header(sl,'Educacao Permanente');pres._sl=sl;
      kpiBox(0.4,treins.length,'Treinamentos/reunioes',P.navy);
      kpiBox(2.75,participantes,'Participantes capacitados',P.teal);
      const trRows=[[{text:'Subnucleo',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5}},{text:'Registros',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5,align:'center'}},{text:'Participantes',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5,align:'center'}},{text:'Com anexo',options:{bold:true,color:P.white,fill:{color:P.navy},fontSize:9.5,align:'center'}}]];
      SUBNUCLEOS_HNSA.forEach((sn,i)=>{
        const regs=treins.filter(t=>t.subnucleo===sn.id);
        const part=regs.reduce((a,t)=>a+(Number(t.participantes)||0),0);
        const comAnexo=regs.filter(t=>t.link_gdrive).length;
        trRows.push([{text:sn.label,options:{fontSize:9,fill:rowFill(i)}},{text:String(regs.length),options:{fontSize:9,bold:true,align:'center',fill:rowFill(i),color:regs.length>0?P.navy:P.gray}},{text:String(part),options:{fontSize:9,align:'center',fill:rowFill(i),color:P.gray}},{text:regs.length>0?comAnexo+'/'+regs.length:'-',options:{fontSize:9,align:'center',fill:rowFill(i),color:comAnexo<regs.length?P.yellow:P.green}}]);
      });
      sl.addTable(trRows,{x:0.4,y:2.0,w:9.2,colW:[4.4,1.6,1.6,1.6],border:{pt:0.5,color:'E2E8F0'},rowH:0.32,fontFace:'Calibri',valign:'middle',color:'1E293B'});

      sl=pres.addSlide();header(sl,'Planos de Acao e Cultura de Seguranca');pres._sl=sl;
      kpiBox(0.4,planos.length,'Acoes no total',P.navy);
      kpiBox(2.75,planosConcluidos,'Concluidas',P.green);
      kpiBox(5.1,planosConcluidos>0?planosEfetiv:0,'Com efetividade verificada',planosConcluidos===0||planosEfetiv===planosConcluidos?P.green:P.yellow);
      kpiBox(7.45,planosAbertos,'Em aberto',planosAbertos===0?P.green:P.yellow);
      sl.addText('Pesquisa de Cultura de Seguranca (HSOPSC): '+saq.length+' resposta(s) no periodo analisado.',{x:0.4,y:2.6,w:9.2,h:0.35,fontSize:11,color:'1E293B',margin:0});
      sl.addText('Trilha de auditoria completa ('+auditLog.length+' registros), notificacoes, RCAs e protocolos disponiveis no Pacote de Evidencias (ZIP) e no sistema em notificaai.ia.br.',{x:0.4,y:3.05,w:9.2,h:0.6,fontSize:10,color:P.gray,margin:0});

      await pres.writeFile({fileName:'Dossie_Auditoria_'+(h.short_name||'NSP')+'_'+hojeStr+'.pptx'});
      showToast('PPT de Auditoria gerado!','success');
    }catch(e){showToast('Erro ao gerar PPT: '+e.message,'error');}
    setGerandoPPT(false);
  };

  const gerarPDFConsolidado=()=>{
    setGerandoPDF(true);
    try{
      const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-';
      const sec=(titulo,rows)=>`<h2>${titulo}</h2><table>${rows.map(([l,v])=>`<tr><th>${l}</th><td>${v}</td></tr>`).join('')}</table>`;
      const porSetor={};nots.forEach(n=>{const st=n.sector||'Nao informado';porSetor[st]=(porSetor[st]||0)+1;});
      const topSet=Object.entries(porSetor).sort((a,b)=>b[1]-a[1]).slice(0,8);
      const html=`<html><head><meta charset="utf-8"><title>Dossie de Auditoria - ${h.name||h.short_name}</title>
        <style>body{font-family:Arial,sans-serif;padding:24px;color:#1a1a1a;font-size:12px}
        h1{font-size:20px;color:#0B1F3A;border-bottom:3px solid #00C9B8;padding-bottom:8px}
        h2{font-size:14px;color:#0B1F3A;border-bottom:1px solid #ddd;padding-bottom:4px;margin:22px 0 8px}
        table{width:100%;border-collapse:collapse;margin-bottom:8px}
        th{background:#F1F5F9;text-align:left;padding:6px 10px;width:38%;font-weight:700}
        td{padding:6px 10px;border-bottom:1px solid #eee}
        .ok{color:#10B981;font-weight:700}.nok{color:#EF4444;font-weight:700}
        .cabecalho{color:#64748B;font-size:11px;margin-bottom:16px}
        @media print{button{display:none}}</style></head><body>
        <h1>Dossie de Auditoria — ${h.name||h.short_name||''}</h1>
        <div class="cabecalho">${range.label} · Gerado em ${new Date().toLocaleString('pt-BR')}${cfg.gestor_nsp?' · Responsavel: '+cfg.gestor_nsp:''}</div>
        ${sec('Documentos Institucionais',[
          ['Portaria do NSP',temPortNSP?`<span class="ok">Cadastrada</span> — N ${cfg.numero_portaria_nsp||'-'} de ${fmtD(cfg.data_portaria_nsp)}`:'<span class="nok">Nao cadastrada</span>'],
          ['Portaria da CCIH',(cfg.numero_portaria_ccih||cfg.data_portaria_ccih)?`N ${cfg.numero_portaria_ccih||'-'} de ${fmtD(cfg.data_portaria_ccih)}`:'<span class="nok">Nao cadastrada</span>'],
          ['Plano de Seguranca do Paciente',cfg.data_atualizacao_psp?(pspVig?'<span class="ok">Vigente</span>':'<span class="nok">Vencido</span>')+' — atualizado em '+fmtD(cfg.data_atualizacao_psp):'<span class="nok">Nao cadastrado</span>'],
        ])}
        ${sec('Protocolos Institucionais',[
          ['Total cadastrados',protocolos.length],
          ['Vigentes',`<span class="ok">${protVigentes}</span>`],
          ['Com revisao vencida',protVencidos>0?`<span class="nok">${protVencidos}</span>`:'0'],
          ['Sem documento anexado',protocolos.filter(p=>!p.link).length],
        ])}
        ${sec('Notificacoes e Gestao de Risco',[
          ['Total no periodo',nots.length],
          ['Eventos sentinela',sentinela>0?`<span class="nok">${sentinela}</span>`:'0'],
          ['Eventos graves com RCA concluida',graves.length?`${gravesRCA} de ${graves.length}`:'N/A'],
          ['Fichas Notivisa enviadas',nots.filter(n=>n.notivisa_enviado).length],
        ])}
        <h2>Setores com mais notificacoes</h2>
        <table>${topSet.map(([st,n2])=>`<tr><th>${st}</th><td>${n2}</td></tr>`).join('')}</table>
        ${sec('Educacao Permanente',[
          ['Treinamentos e reunioes registrados',treins.length],
          ['Participantes capacitados',participantes],
          ['Registros sem lista de presenca anexada',treins.filter(t=>t.tipo==='treinamento'&&!t.link_gdrive).length],
        ])}
        ${sec('Planos de Acao e Cultura de Seguranca',[
          ['Acoes no total',planos.length],
          ['Concluidas',planosConcluidos],
          ['Com efetividade verificada',planosConcluidos?`${planosEfetiv} de ${planosConcluidos}`:'N/A'],
          ['Em aberto',planosAbertos>0?`<span class="nok">${planosAbertos}</span>`:'0'],
          ['Respostas da pesquisa HSOPSC',saq.length],
        ])}
        <div class="cabecalho" style="margin-top:24px">Trilha de auditoria: ${auditLog.length} registro(s) disponiveis no Pacote de Evidencias (ZIP). Documento gerado pelo NotificaAI, nao substitui laudos ou certificacoes oficiais.</div>
        </body></html>`;
      const w=window.open('','_blank');
      w.document.write(html);w.document.close();w.print();
      showToast('PDF pronto para impressao/salvar!','success');
    }catch(e){showToast('Erro ao gerar PDF: '+e.message,'error');}
    setGerandoPDF(false);
  };

  const gerarZipEvidencias=async()=>{
    if(!window.XLSX){showToast('Biblioteca de Excel carregando, tente em 3s','error');return;}
    setGerandoZip(true);
    try{
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(wb,buildResumoSheet('Resumo',[
        ['Hospital',h.name||h.short_name||''],
        ['Periodo',range.label],
        ['Gerado em',new Date().toLocaleString('pt-BR')],
        ['Portaria NSP',cfg.numero_portaria_nsp||'NAO CADASTRADA'],
        ['PSP atualizado em',cfg.data_atualizacao_psp||'NAO CADASTRADO'],
        ['Notificacoes',nots.length],
        ['Eventos sentinela',sentinela],
        ['Protocolos vigentes',protVigentes+' de '+protocolos.length],
        ['Treinamentos',treins.length+' ('+participantes+' participantes)'],
        ['Planos de acao',planos.length+' ('+planosAbertos+' em aberto)'],
        ['Respostas HSOPSC',saq.length],
      ]),'Resumo');

      if(nots.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(nots,['id','created_at','event_date','sector','notification_type','event_subtype','gravidade','status','rca_gerado','rca_autor','rca_concluido_em','notivisa_enviado','notivisa_enviado_em','patient_outcome','description'],
          ['ID','Criado em','Data do evento','Setor','Tipo','Subtipo','Gravidade','Status','RCA gerado','RCA autor','RCA concluido em','Notivisa enviado','Notivisa enviado em','Desfecho','Descricao']),'Notificacoes');

      if(auditLog.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(auditLog,['created_at','notification_id','acao','campo','valor_anterior','valor_novo','usuario','perfil'],
          ['Data/Hora','Notificacao ID','Acao','Campo','Valor anterior','Valor novo','Usuario','Perfil']),'Auditoria');

      if(treins.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(treins,['data','tipo','subnucleo','protocolo','participantes','responsavel','link_gdrive'],
          ['Data','Tipo','Subnucleo','Protocolo/Tema','Participantes','Responsavel','Lista de presenca']),'Treinamentos');

      if(protocolos.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(protocolos,['nome','aprovado_em','proxima_revisao','link'],
          ['Nome','Aprovado em','Proxima revisao','Link do documento']),'Protocolos');

      if(planos.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(planos,['created_at','acao','responsavel','prazo','prioridade','status','concluido_em','efetividade_verificada','efetividade_em'],
          ['Criado em','Acao','Responsavel','Prazo','Prioridade','Status','Concluido em','Efetividade verificada','Efetividade em']),'Planos de Acao');

      if(saq.length) XLSX.utils.book_append_sheet(wb,
        buildStyledSheet(saq,Object.keys(saq[0]||{})),'Pesquisa HSOPSC');

      XLSX.writeFile(wb,'Evidencias-Auditoria-'+(h.short_name||'NSP')+'-'+hojeStr+'.xlsx');
      showToast('Pacote de evidencias gerado!','success');
    }catch(e){showToast('Erro ao gerar Excel: '+e.message,'error');}
    setGerandoZip(false);
  };

  return(<div style={{padding:'0 0 80px'}}>
    <BackHeader title='Auditar' subtitle='Evidencias consolidadas para auditoria e acreditacao (ONA e correlatos)' right={<button onClick={carregar} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'0 16px'}}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
        {[['tudo','Todo o historico'],['ano','Ano atual'],['12m','Ultimos 12 meses'],['custom','Personalizado']].map(([id,lb])=>(
          <button key={id} onClick={()=>setPeriodo(id)} style={{padding:'6px 12px',borderRadius:8,border:'1px solid '+(periodo===id?C.teal:C.border),background:periodo===id?C.teal+'22':'transparent',color:periodo===id?C.teal:C.muted,fontSize:11,fontWeight:periodo===id?700:500,cursor:'pointer'}}>{lb}</button>
        ))}
      </div>
      {periodo==='custom'&&<div style={{display:'flex',gap:8,marginBottom:14}}>
        <input type='date' value={customDe} onChange={e=>setCustomDe(e.target.value)} style={{flex:1,background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'6px 8px',color:C.text,fontSize:11,outline:'none'}}/>
        <input type='date' value={customAte} onChange={e=>setCustomAte(e.target.value)} style={{flex:1,background:C.surface,border:'1px solid '+C.border,borderRadius:6,padding:'6px 8px',color:C.text,fontSize:11,outline:'none'}}/>
      </div>}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8,marginBottom:16}}>
        <KPI label='Notificacoes' val={nots.length} color={C.teal} sub={range.label}/>
        <KPI label='Eventos sentinela' val={sentinela} color={sentinela===0?C.green:C.red}/>
        <KPI label='Protocolos vigentes' val={protVigentes+'/'+protocolos.length} color={protVencidos===0?C.green:C.yellow}/>
        <KPI label='Treinamentos' val={treins.length} color={C.blue} sub={participantes+' participantes'}/>
        <KPI label='Planos em aberto' val={planosAbertos} color={planosAbertos===0?C.green:C.yellow}/>
        <KPI label='Respostas HSOPSC' val={saq.length} color='#8B5CF6'/>
      </div>

      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:800,color:C.text,marginBottom:8}}>Documentos Institucionais</div>
        {[['Portaria do NSP',temPortNSP],['Portaria da CCIH',!!(cfg.numero_portaria_ccih||cfg.data_portaria_ccih)],['Plano de Seguranca do Paciente (PSP)',cfg.data_atualizacao_psp?pspVig:null]].map(([lab,ok],i)=>(
          <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:i<2?'1px solid '+C.border:'none'}}>
            <span style={{fontSize:12,color:C.text}}>{lab}</span>
            <span style={{fontSize:10,fontWeight:800,color:ok===null?C.muted:ok?C.green:C.red}}>{ok===null?'N/D':ok?'OK':'ATENCAO'}</span>
          </div>
        ))}
        <div style={{fontSize:10,color:C.muted,marginTop:8}}>Editaveis na aba DSM/ANVISA - Documentos.</div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <button onClick={gerarPPTAuditoria} disabled={gerandoPPT} style={{background:gerandoPPT?C.border:C.teal,border:'none',borderRadius:10,padding:'13px',color:gerandoPPT?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:gerandoPPT?'default':'pointer'}}>{gerandoPPT?'Gerando...':'PPT - Dossie Executivo (apresentacao)'}</button>
        <button onClick={gerarPDFConsolidado} disabled={gerandoPDF} style={{background:gerandoPDF?C.border:C.blue,border:'none',borderRadius:10,padding:'13px',color:gerandoPDF?C.muted:'#fff',fontWeight:800,fontSize:13,cursor:gerandoPDF?'default':'pointer'}}>{gerandoPDF?'Gerando...':'PDF - Dossie Consolidado (imprimir/salvar)'}</button>
        <button onClick={gerarZipEvidencias} disabled={gerandoZip} style={{background:gerandoZip?C.border:'#7C3AED',border:'none',borderRadius:10,padding:'13px',color:gerandoZip?C.muted:'#fff',fontWeight:800,fontSize:13,cursor:gerandoZip?'default':'pointer'}}>{gerandoZip?'Gerando...':'Excel - Pacote de Evidencias (varias abas)'}</button>
      </div>
      <div style={{fontSize:10,color:C.muted,marginTop:10,lineHeight:1.5}}>Para a resposta oficial da Circular 24/2023 (DSM/Marinha), use o Excel especifico na aba DSM/ANVISA — este dossie cobre auditorias e acreditacoes em geral (ONA e correlatos), com evidencias de todos os subnucleos.</div>
    </div>
  </div>);
}

function MembroNSPView({sbUrl,sbKey,showToast,hospital,profileMode,userSubnucleo:userSubnucleoApp}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [userSubnucleo,setUserSubnucleo]=useState(userSubnucleoApp||null);

  if(!userSubnucleo) return(<div style={{padding:'24px 16px',maxWidth:480,margin:'0 auto'}}>
    <div style={{textAlign:'center',marginBottom:28}}>
      <div style={{fontSize:28,marginBottom:8}}>{String.fromCodePoint(127973)}</div>
      <div style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:4}}>Bem-vindo ao NSP</div>
      <div style={{fontSize:13,color:C.muted}}>Selecione seu subnucleo para continuar</div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {SUBNUCLEOS_HNSA.map(s=>(<button key={s.id} onClick={()=>setUserSubnucleo(s.id)}
        style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',background:C.card,border:'1px solid '+s.color+'55',borderRadius:14,cursor:'pointer',borderLeft:'4px solid '+s.color,textAlign:'left',width:'100%'}}>
        <span style={{fontSize:22,lineHeight:1}}>{s.icon}</span>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:C.text}}>{s.label}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>
            {s.id==='comunicacao'&&'SBAR, passagem de plantao, prescricoes verbais'}
            {s.id==='lpp'&&'Escala de Braden, avaliacao diaria, medidas preventivas'}
            {s.id==='queda'&&'Escala de Morse, protocolos de prevencao'}
            {s.id==='medicamentos'&&'Prescricao, dispensacao, administracao, MPP'}
            {s.id==='identificacao'&&'Pulseiras de identificacao, dois identificadores'}
            {s.id==='cirurgia'&&'LVCS, antibioticoprofilaxia, Time Out, ISC'}
            {s.id==='ccih'&&'IRAS, PAV, IPCS, ITU/CVD, alcool gel, clorexidina'}
          </div>
        </div>
        <span style={{marginLeft:'auto',fontSize:18,color:s.color}}>{String.fromCodePoint(8250)}</span>
      </button>))}
    </div>
  </div>);

  return <MembroNSPPainel sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} hospital={hospital}
    profileMode={profileMode} userSubnucleo={userSubnucleo} onBack={()=>setUserSubnucleo(null)}/>;
}

function MembroNSPPainel({sbUrl,sbKey,showToast,hospital,profileMode,userSubnucleo,onBack}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [stats,setStats]=useState(null);
  const [notifications,setNotifications]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filtroSub,setFiltroSub]=useState(userSubnucleo||'todos');
  useEffect(()=>{if(userSubnucleo)setFiltroSub(userSubnucleo);},[userSubnucleo]);
  const [mesSel,setMesSel]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});
  const [notsMes,setNotsMes]=useState([]);
  const [loadingMes,setLoadingMes]=useState(false);
  const [showFormTrein,setShowFormTrein]=useState(null);
  const [formTrein,setFormTrein]=useState({tipo:'treinamento',qtd:1,participantes:'',protocolo:'',data:new Date().toISOString().slice(0,10),link_gdrive:''});
  const [savingTrein,setSavingTrein]=useState(false);
  const [rcaMembro,setRcaMembro]=useState(null);
  const [notiVisaMembro,setNotiVisaMembro]=useState(null);

  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const carregar=()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    Promise.all([
      sbSelect(sbUrl,sbKey,'notifications',`hospital_id=eq.${h.id}&is_test=neq.true&order=created_at.desc&limit=2000&select=*`),
      sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&select=*&order=data.desc`).catch(()=>[]),
    ]).then(([nots,treins])=>{
      setNotifications(nots||[]);
      setStats({...computeStats(nots||[]),treins:treins||[]});
    }).catch(()=>showToast('Erro ao carregar','error')).finally(()=>setLoading(false));
  };

  useEffect(()=>{carregar();},[sbUrl,sbKey]);

  useEffect(()=>{
    if(!sbUrl||!sbKey) return;
    setLoadingMes(true);
    const [ano,mes]=mesSel.split('-').map(Number);
    const inicio=new Date(ano,mes-1,1).toISOString().slice(0,10);
    const fim=new Date(ano,mes,0).toISOString().slice(0,10);
    sbSelect(sbUrl,sbKey,'notifications',
      `hospital_id=eq.${h.id}&event_date=gte.${inicio}&event_date=lte.${fim}&is_test=neq.true&order=event_date.asc&limit=200`
    ).then(d=>setNotsMes(d||[])).catch(()=>[]).finally(()=>setLoadingMes(false));
  },[mesSel,sbUrl,sbKey]);

  const navMes=(dir)=>{
    let [ano,mes]=mesSel.split('-').map(Number);
    mes+=dir; if(mes>12){mes=1;ano++;} if(mes<1){mes=12;ano--;}
    setMesSel(`${ano}-${String(mes).padStart(2,'0')}`);
  };

  const salvarTrein=async(subId)=>{
    if(!formTrein.participantes) return showToast('Informe o numero de participantes','error');
    setSavingTrein(true);
    try{
      await sbInsert(sbUrl,sbKey,'treinamentos_nsp',{
        hospital_id:h.id,tipo:formTrein.tipo,
        subnucleo:subId||userSubnucleo||'nsp_pleno',
        protocolo:formTrein.protocolo||null,data:formTrein.data||null,
        participantes:Number(formTrein.participantes)||0,
        descricao:formTrein.protocolo||null,responsavel:profileMode||'membro_nsp',
        link_gdrive:formTrein.link_gdrive||null,
      });
      showToast('Registro salvo!'+(formTrein.link_gdrive?'':' Lembre-se de anexar a lista de presenca.'),'success');
      setShowFormTrein(null);
      setFormTrein({tipo:'treinamento',qtd:1,participantes:'',protocolo:'',data:new Date().toISOString().slice(0,10),link_gdrive:''});
      carregar();
    }catch{showToast('Erro ao salvar','error');}
    setSavingTrein(false);
  };

  if(loading) return(<div style={{display:'flex',justifyContent:'center',padding:60}}><Dots/></div>);

  const s=stats||{total:0,sp:0,ccih:0,adm:0,sentinela:0,culturaScore:0,sectorData:[],diasSemSentinela:null,treins:[]};

  const spMes=notsMes.filter(n=>n.notification_type==='seguranca_paciente'||n.notification_type==='ccih').length;
  const admMes=notsMes.filter(n=>n.notification_type==='administrativa').length;
  const tiposMes=[
    {label:'Quedas',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('queda')||n.description?.toLowerCase().includes('queda')).length,cor:'#F59E0B'},
    {label:'Perda AVP',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('avp')||n.event_subtype?.toLowerCase().includes('acesso')).length,cor:'#3B82F6'},
    {label:'LPP',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('press')||n.event_subtype?.toLowerCase().includes('lpp')).length,cor:'#EF4444'},
    {label:'Medicacao',count:notsMes.filter(n=>n.event_subtype?.toLowerCase().includes('medic')||n.description?.toLowerCase().includes('medic')).length,cor:'#EC4899'},
    {label:'Identificacao',count:notsMes.filter(n=>{const st=n.event_subtype?.toLowerCase()||'';return st.includes('identif')&&!st.startsWith('perda de');}).length,cor:'#0D9488'},
  ].filter(t=>t.count>0).sort((a,b)=>b.count-a.count);

  const maxTipo=tiposMes[0]?.count||1;

  const setoresMes=[...new Set(notsMes.map(n=>n.sector).filter(Boolean))].map(setor=>({
    setor,count:notsMes.filter(n=>n.sector===setor).length
  })).sort((a,b)=>b.count-a.count).slice(0,5);
  const maxSetor=setoresMes[0]?.count||1;

  const sub=SUBNUCLEOS_HNSA.find(s=>s.id===userSubnucleo);

  return(<div style={{padding:'0 16px 80px'}}>
    <BackHeader
      title={sub?sub.icon+' '+sub.label:'Painel Membro NSP'}
      subtitle='HNSA - Nucleo de Seguranca do Paciente'
      onBack={onBack}
    />

    <div style={{padding:'16px 0'}}>
    {rcaMembro&&<RCAPanel notification={rcaMembro} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setRcaMembro(null)} onSaved={()=>{setRcaMembro(null);carregar();}}/>}
    {notiVisaMembro&&<NotiVisaPanel notification={notiVisaMembro} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setNotiVisaMembro(null)}/>}

    {/* Metricas totais */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
      <StatCard icon={String.fromCodePoint(128202)} label='Total notificacoes' value={s.total} color={C.teal}/>
      <StatCard icon={String.fromCodePoint(127973)} label='Seg. Paciente' value={s.sp} color={C.red}/>
      <StatCard icon={String.fromCodePoint(128203)} label='Administrativas' value={s.adm} color={C.purple}/>
    </div>

    {/* Dias sem sentinela */}
    {s.diasSemSentinela!==null&&<div style={{background:s.diasSemSentinela>=30?C.green+'18':C.yellow+'18',border:'1px solid '+(s.diasSemSentinela>=30?C.green:C.yellow)+'44',borderRadius:12,padding:'12px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:12}}>
      <div style={{fontSize:32,fontWeight:900,color:s.diasSemSentinela>=30?C.green:C.yellow,lineHeight:1}}>{s.diasSemSentinela}</div>
      <div><div style={{fontSize:13,fontWeight:700,color:s.diasSemSentinela>=30?C.green:C.yellow}}>dias sem evento sentinela</div>
      <div style={{fontSize:11,color:C.muted}}>Meta ONA: 90 dias</div></div>
    </div>}

    {/* Panorama do mes */}
    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text}}>Panorama do Mes</div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <button onClick={()=>navMes(-1)} style={{background:'none',border:'none',color:C.teal,fontSize:18,cursor:'pointer',padding:'0 2px'}}>{String.fromCodePoint(8249)}</button>
          <span style={{fontSize:12,fontWeight:700,color:C.text,minWidth:64,textAlign:'center'}}>{MESES[Number(mesSel.split('-')[1])-1]}/{mesSel.split('-')[0]}</span>
          <button onClick={()=>navMes(1)} style={{background:'none',border:'none',color:C.teal,fontSize:18,cursor:'pointer',padding:'0 2px'}}>{String.fromCodePoint(8250)}</button>
        </div>
      </div>
      {loadingMes&&<div style={{textAlign:'center',padding:16}}><Dots/></div>}
      {!loadingMes&&(<div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.red+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.red}}>{spMes}</div>
            <div style={{fontSize:10,color:C.muted}}>Seg. Paciente</div>
          </div>
          <div style={{flex:1,background:C.muted+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.muted}}>{admMes}</div>
            <div style={{fontSize:10,color:C.muted}}>Administrativas</div>
          </div>
          <div style={{flex:1,background:C.teal+'10',borderRadius:10,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:C.teal}}>{notsMes.length}</div>
            <div style={{fontSize:10,color:C.muted}}>Total</div>
          </div>
        </div>
        {tiposMes.length>0&&<div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Tipos mais frequentes</div>
          {tiposMes.map((t,i)=>(
            <div key={i} style={{marginBottom:5}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
                <span style={{color:C.text}}>{t.label}</span>
                <span style={{color:t.cor,fontWeight:700}}>{t.count}</span>
              </div>
              <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}>
                <div style={{width:(t.count/maxTipo)*100+'%',height:'100%',background:t.cor,borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>}
        {setoresMes.length>0&&<div>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.06em'}}>Por setor</div>
          {setoresMes.map((d,i)=>(
            <div key={i} style={{marginBottom:5}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
                <span style={{color:C.text}}>{d.setor}</span>
                <span style={{color:C.teal,fontWeight:700}}>{d.count}</span>
              </div>
              <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}>
                <div style={{width:(d.count/maxSetor)*100+'%',height:'100%',background:C.teal,borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>}
        {notsMes.length===0&&<div style={{textAlign:'center',padding:'12px 0',fontSize:12,color:C.muted}}>Nenhuma notificacao neste mes</div>}
      </div>)}
    </div>

    {/* Treinamentos do subnucleo */}
    <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Subnucleos - Treinamentos</div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <button onClick={()=>setFiltroSub('todos')} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub==='todos'?C.teal:'transparent',color:filtroSub==='todos'?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Todos</button>
      {SUBNUCLEOS_HNSA.map(sub=>(
        <button key={sub.id} onClick={()=>setFiltroSub(sub.id)} style={{padding:'5px 12px',borderRadius:16,border:'none',background:filtroSub===sub.id?sub.color:'transparent',color:filtroSub===sub.id?'#fff':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>
          <span style={{fontSize:13}}>{sub.icon}</span> {sub.label.split(' ')[0]}
        </button>
      ))}
    </div>

    {SUBNUCLEOS_HNSA.filter(sub=>filtroSub==='todos'||filtroSub===sub.id).map(sub=>{
      const regs=s.treins.filter(t=>t.subnucleo===sub.id);
      const treins=regs.filter(t=>t.tipo==='treinamento');
      const totalPart=regs.reduce((acc,r)=>acc+(r.participantes||0),0);
      return(<div key={sub.id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
          <span style={{fontSize:20}}>{sub.icon}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{sub.label}</div>
            <div style={{fontSize:10,color:C.muted}}>{treins.length} treinamento(s) · {totalPart} participantes</div>
          </div>
          <button onClick={()=>{const abrindoOutro=showFormTrein!==sub.id;setShowFormTrein(abrindoOutro?sub.id:null);if(abrindoOutro)setFormTrein({tipo:'treinamento',qtd:1,participantes:'',protocolo:'',data:new Date().toISOString().slice(0,10),link_gdrive:''});}}
            style={{background:sub.color+'22',border:'1px solid '+sub.color+'44',borderRadius:8,padding:'4px 10px',color:sub.color,fontSize:11,fontWeight:700,cursor:'pointer',flexShrink:0}}>
            {showFormTrein===sub.id?'Cancelar':'+ Registrar'}
          </button>
        </div>
        {regs.length>0&&<div style={{display:'flex',gap:8,marginBottom:showFormTrein===sub.id?8:0}}>
          <div style={{flex:1,background:sub.color+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:sub.color}}>{treins.length}</div>
            <div style={{fontSize:9,color:C.muted}}>Treinamentos</div>
          </div>
          <div style={{flex:1,background:C.teal+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:C.teal}}>{regs.filter(t=>t.tipo==='reuniao').length}</div>
            <div style={{fontSize:9,color:C.muted}}>Reunioes</div>
          </div>
          <div style={{flex:1,background:C.blue+'15',borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:18,fontWeight:800,color:C.blue}}>{totalPart}</div>
            <div style={{fontSize:9,color:C.muted}}>Participantes</div>
          </div>
        </div>}
        {showFormTrein===sub.id&&(<div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:10,padding:'12px',marginTop:8}}>
          <div style={{display:'flex',gap:6,marginBottom:8}}>
            {['treinamento','reuniao'].map(t=>(
              <button key={t} onClick={()=>setFormTrein(f=>({...f,tipo:t}))}
                style={{flex:1,padding:'6px',borderRadius:8,border:'1px solid '+(formTrein.tipo===t?sub.color:C.border),background:formTrein.tipo===t?sub.color+'22':'transparent',color:formTrein.tipo===t?sub.color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer',textTransform:'capitalize'}}>
                {t==='treinamento'?'Treinamento':'Reuniao NSP'}
              </button>
            ))}
          </div>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Data</div>
            <input type='date' value={formTrein.data} onChange={e=>setFormTrein(f=>({...f,data:e.target.value}))}
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Numero de participantes *</div>
            <input type='number' min='1' value={formTrein.participantes} onChange={e=>setFormTrein(f=>({...f,participantes:e.target.value}))}
              placeholder='Ex: 12'
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Tema / Protocolo abordado</div>
            <input type='text' value={formTrein.protocolo} onChange={e=>setFormTrein(f=>({...f,protocolo:e.target.value}))}
              placeholder='Ex: Higienizacao das maos...'
              style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none'}}/>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Lista de presenca (assinaturas)</div>
            {formTrein.link_gdrive
              ? <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:11,color:C.green,fontWeight:700}}>{String.fromCodePoint(9989)} Anexada</span>
                  <a href={formTrein.link_gdrive} target='_blank' rel='noreferrer' style={{fontSize:11,color:C.teal}}>Ver</a>
                  <button onClick={()=>setFormTrein(f=>({...f,link_gdrive:''}))} style={{fontSize:10,color:C.muted,background:'none',border:'none',cursor:'pointer'}}>Trocar</button>
                </div>
              : <StorageUploadBtn tipo='treinamento' sbUrl={sbUrl} sbKey={sbKey} label='Anexar lista de presenca'
                  meta={{subnucleo:sub.id,data:formTrein.data||new Date().toISOString().slice(0,10),participantes:formTrein.participantes||'',
                    ano:String(new Date((formTrein.data||new Date().toISOString().slice(0,10))+'T12:00:00').getFullYear()),
                    semestre:new Date((formTrein.data||new Date().toISOString().slice(0,10))+'T12:00:00').getMonth()<6?'1':'2'}}
                  onUploaded={link=>setFormTrein(f=>({...f,link_gdrive:link}))}/>}
            <div style={{fontSize:9,color:C.muted,marginTop:4,lineHeight:1.4}}>Foto ou PDF da folha de assinaturas. Sem isso o registro nao aparece na Biblioteca de Documentos do gestor.</div>
          </div>
          <button onClick={()=>salvarTrein(sub.id)} disabled={savingTrein}
            style={{width:'100%',background:sub.color,border:'none',borderRadius:10,padding:'10px',color:'#fff',fontWeight:800,fontSize:13,cursor:'pointer'}}>
            {savingTrein?'Salvando...':'Salvar registro'}
          </button>
        </div>)}
        {regs.slice(0,2).map((r,i)=>(
          <div key={i} style={{borderLeft:'2px solid '+sub.color+'44',paddingLeft:8,marginTop:6}}>
            <div style={{fontSize:11,color:C.text}}>{r.protocolo||r.descricao||r.tipo||'-'}</div>

        </select>
      </div>
      {(()=>{
        const visiveis=notifications.filter(n=>{
          if(n.is_test) return false;
          if(filtroSub==='todos') return true;
          const subtype=(n.event_subtype||n.occurrence_subtype||'').toLowerCase();
          if(filtroSub==='queda') return subtype.startsWith('queda');
          if(filtroSub==='lpp') return subtype.includes('press')||subtype.includes('lpp');
          if(filtroSub==='medicamentos') return subtype.includes('medic')||subtype.includes('farmac');
          if(filtroSub==='identificacao') return subtype.startsWith('falha na identif')||subtype.startsWith('falha de identif');
          if(filtroSub==='comunicacao') return subtype.includes('comuni')||subtype.includes('sbar');
          if(filtroSub==='cirurgia') return subtype.includes('cirurg');
          return true;
        }).slice(0,30);
        if(visiveis.length===0) return <div style={{textAlign:'center',color:C.muted,padding:20,fontSize:12}}>Nenhuma notificacao encontrada</div>;
        return visiveis.map((n,i)=>{
          const tag=getTag(n);
          const titulo=getTitle(n);
          const data=n.event_date?new Date(n.event_date+'T12:00:00').toLocaleDateString('pt-BR'):new Date(n.created_at).toLocaleDateString('pt-BR');
          return(<div key={n.id} style={{background:C.surface,borderRadius:10,padding:'10px 12px',marginBottom:6}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
              <div style={{background:tag.color+'22',color:tag.color,borderRadius:5,padding:'2px 6px',fontSize:9,fontWeight:700,flexShrink:0,marginTop:1}}>{tag.label}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:2}}>{titulo}</div>
                <div style={{fontSize:10,color:C.muted}}>{n.sector||'-'} - {data}</div>
                {n.description&&<div style={{fontSize:11,color:C.muted,marginTop:3,lineHeight:1.4}}>{n.description.slice(0,120)}{n.description.length>120?'...':''}</div>}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
                {!n.rca_gerado&&n.notification_type==='seguranca_paciente'&&<button onClick={()=>setRcaMembro(n)} style={{fontSize:9,background:C.yellow,color:'#000',borderRadius:4,padding:'3px 7px',fontWeight:800,border:'none',cursor:'pointer'}}>Analisar</button>}
                {n.notification_type==='seguranca_paciente'&&<button onClick={()=>setNotiVisaMembro(n)} style={{fontSize:9,background:C.blue,color:'#fff',borderRadius:4,padding:'3px 7px',fontWeight:800,border:'none',cursor:'pointer'}}>Ficha Notivisa</button>}
                {n.gravidade==='Evento sentinela'&&<div style={{fontSize:9,background:C.red+'22',color:C.red,borderRadius:4,padding:'2px 5px',fontWeight:700}}>SENTINELA</div>}
              </div>
            </div>
          </div>);
        });
      })()}
    </div>

    <ProtocoloSubnucleoWidget sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} hospital={h} userSubnucleo={filtroSub==='todos'?userSubnucleo:filtroSub}/>
    <IndicadoresSubnucleoWidget sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} hospital={h} userSubnucleo={filtroSub==='todos'?userSubnucleo:filtroSub}/>
  </div>
  </div>);
}

function NotificarView({sbUrl,sbKey,webhookUrl,testMode,showToast,hospital,nspEmail}) {
  const h=hospital||DEFAULT_HOSPITAL;

  const [step,setStep]=useState('perfil');
  const [dados,setDados]=useState({});
  const [messages,setMessages]=useState([]);
  const [historico,setHistorico]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,step,loading]);

  const hojeISO=new Date().toISOString().slice(0,10);
  const ontemISO=new Date(Date.now()-86400000).toISOString().slice(0,10);
  const horaNum=new Date().getHours();
  const turnoAtual=horaNum>=7&&horaNum<19?'Dia':'Noite';

  const addMsg=(role,txt)=>setMessages(p=>[...p,{role,content:txt}]);

  const avancar=(novosDados,proximoStep,pergunta)=>{
    setHistorico(h=>[...h,{step,dados:{...dados},msgCount:messages.length}]);
    setDados(novosDados);
    if(pergunta) addMsg('assistant',pergunta);
    setStep(proximoStep);
  };

  const voltar=()=>{
    if(historico.length===0) return;
    const prev=historico[historico.length-1];
    setHistorico(h=>h.slice(0,-1));
    setStep(prev.step);
    setDados(prev.dados);
    setMessages(m=>m.slice(0,prev.msgCount));
    setInput('');
  };

  const isSP=(d)=>['seguranca_paciente','ccih'].includes(d.notification_type||dados.notification_type||'seguranca_paciente');
  const isADM=(d)=>(d.notification_type||dados.notification_type)==='administrativa';
  const isCCIH=(d)=>(d.notification_type||dados.notification_type)==='ccih';

  const responder=(valor,label)=>{
    const txt=label||valor;
    addMsg('user',txt);
    const d={...dados};

    switch(step){

      case 'perfil':{
        d.notifier_type=valor;
        const isPacFam=valor==='paciente'||valor==='familiar'||valor==='anonimo';
        if(isPacFam){
          d.notification_type='seguranca_paciente';
          avancar(d,'subtipo','Lamentamos o ocorrido. O que aconteceu?');
        } else {
          avancar(d,'tipo','O evento está relacionado ao **paciente** ou é uma **ocorrência administrativa**?');
        }
        break;
      }

      case 'tipo':{
        d.notification_type=valor;
        if(valor==='seguranca_paciente'){
          avancar(d,'subtipo','Qual foi o tipo de evento de segurança do paciente?');
        } else {
          avancar(d,'subtipo_adm','Qual o tipo de ocorrência administrativa?');
        }
        break;
      }

      case 'subtipo':{
        d.event_subtype=valor;
        if(valor==='Perda de AVP'){
          avancar(d,'avp_motivo','Qual foi o motivo da perda do acesso venoso periférico?');
        } else {
          avancar(d,'setor','Em qual setor ocorreu?');
        }
        break;
      }

      case 'subtipo_adm':{
        d.event_subtype=valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'avp_motivo':{
        d.event_subtype='Perda de AVP - '+valor;
        avancar(d,'setor','Em qual setor ocorreu?');
        break;
      }

      case 'setor':{
        d.sector=valor;
        avancar(d,'data','Quando ocorreu o evento?');
        break;
      }

      case 'data':{
        let date=hojeISO,turno=turnoAtual;
        if(txt.includes('Hoje durante o dia')){date=hojeISO;turno='Dia';}
        else if(txt.includes('Hoje durante a noite')){date=hojeISO;turno='Noite';}
        else if(txt.includes('Ontem durante o dia')){date=ontemISO;turno='Dia';}
        else if(txt.includes('Ontem durante a noite')){date=ontemISO;turno='Noite';}
        else if(txt.toLowerCase().includes('hoje')){date=hojeISO;}
        else if(txt.toLowerCase().includes('ontem')){date=ontemISO;}
        d.event_date=date;d.shift=turno;
        avancar(d,'relato','Descreva o que aconteceu com o máximo de detalhes:');
        break;
      }

      case 'relato':{
        d.description=valor;
        avancar(d,'medidas','Quais medidas foram tomadas imediatamente após o evento?');
        break;
      }

      case 'medidas':{
        d.measures_taken=valor;
        if(isSP(d)){
          avancar(d,'nip','**NIP do paciente** (número de identificação):\n\nO NIP permite ao NSP rastrear os dados completos no prontuário. Se não souber, clique em "Não sei / Anônimo".');
        } else {
          gerarResumo(d);
        }
        break;
      }

      case 'nip':{
        if(valor!=='nao_informar') d.patient_nip=valor;
        avancar(d,'nome_pac','Nome completo do paciente (ou deixe em branco):');
        break;
      }

      case 'nome_pac':{
        if(valor&&valor.toLowerCase()!=='não informar'&&valor.toLowerCase()!=='nao informar') d.patient_name=valor;
        avancar(d,'idade','Idade do paciente (em anos):');
        break;
      }

      case 'idade':{
        if(valor&&valor!=='nao_informar'&&valor!=='Não informar') d.patient_age=parseInt(valor)||valor;
        avancar(d,'sexo','Sexo do paciente:');
        break;
      }

      case 'sexo':{
        if(valor!=='nao_informar') d.patient_sex=valor;
        avancar(d,'data_admissao','Data de admissao do paciente (ou "nao informar"):');
        break;
      }

      case 'data_admissao':{
        if(valor&&valor!=='nao informar'&&valor!=='nao_informar') d.patient_admission=valor;
        avancar(d,'motivo_internacao','Qual o motivo da internacao do paciente? (ou "nao informar")');
        break;
      }

      case 'motivo_internacao':{
        if(valor&&valor!=='nao informar'&&valor!=='nao_informar') d.motivo_internacao=valor;
        avancar(d,'desfecho','Qual foi o desfecho para o paciente?');
        break;
      }

      case 'desfecho':{
        d.patient_outcome=valor;
        avancar(d,'preventivel','O evento era evitável?');
        break;
      }

      case 'preventivel':{
        d.was_preventable=valor==='Sim'||txt.toLowerCase().includes('sim');
        gerarResumo(d);
        break;
      }

      default: break;
    }
  };

  const pular=()=>{
    const pulos={
      nip:'idade',
      idade:'sexo',
      sexo:'desfecho',
      data_admissao:'motivo_internacao',
      motivo_internacao:'desfecho',
    };
    const proximo=pulos[step];
    if(!proximo) return;
    const perguntas={
      idade:'Idade aproximada do paciente:',
      sexo:'Sexo do paciente:',
      motivo_internacao:'Qual o motivo da internacao do paciente?',
      desfecho:'Qual foi o desfecho para o paciente?',
    };
    addMsg('user','Não informado');
    avancar({...dados},proximo,perguntas[proximo]);
  };

  const gerarResumo=async(d)=>{
    setDados(d);setStep('resumo');setLoading(true);
    const ctx=[
      `Tipo: ${d.notification_type}`,
      d.event_subtype?`Evento: ${d.event_subtype}`:'',
      d.sector?`Setor: ${d.sector}`:'',
      d.event_date?`Data: ${new Date(d.event_date+'T12:00:00').toLocaleDateString('pt-BR')} (${d.shift||''})` :'',
      d.description?`Descrição: ${d.description}`:'',
      d.measures_taken?`Medidas: ${d.measures_taken}`:'',
      d.patient_nip?`NIP: ${d.patient_nip}`:'',
d.patient_name?`Paciente: ${d.patient_name}`:'',
d.patient_age?`Idade: ${d.patient_age} anos`:'',
      d.patient_age_range?`Idade: ${d.patient_age_range}`:'',
      d.patient_sex?`Sexo: ${d.patient_sex}`:'',
      d.motivo_internacao?`Motivo internacao: ${d.motivo_internacao}`:'',
      d.patient_outcome?`Desfecho: ${d.patient_outcome}`:'',
      d.was_preventable!==undefined?`Evitável: ${d.was_preventable?'Sim':'Não'}` :'',
    ].filter(Boolean).join(', ');
    try{
      const resumo=await callWorker(
        [{role:'user',content:`Faça um resumo técnico objetivo em 3-4 linhas desta notificação hospitalar, em português. Inclua os dados mais relevantes: ${ctx}`}],
        'Você é assistente do NSP. Resuma de forma objetiva e técnica. Máximo 4 linhas. Não faça perguntas.'
      );
      addMsg('assistant',`**Resumo da notificação:**\n\n${resumo}\n\nAs informações estão corretas?`);
      setDados({...d,ai_summary:resumo});
    }catch{
      addMsg('assistant',`**Resumo:** ${ctx}\n\nAs informações estão corretas?`);
    }
    setLoading(false);
  };

  const confirmar=async()=>{
    if(saving) return;
    setSaving(true);
    try{
      const payload={
        notification_type:dados.notification_type||'seguranca_paciente',
        sector:dados.sector||null,
        event_date:dados.event_date||null,
        shift:dados.shift||null,
        event_subtype:dados.event_subtype||null,
        description:dados.description||null,
        measures_taken:dados.measures_taken||null,
        patient_outcome:dados.patient_outcome||null,
        was_preventable:dados.was_preventable===true?true:dados.was_preventable===false?false:null,
        occurrence_subtype:dados.notification_type!=='seguranca_paciente'?(dados.event_subtype||null):null,
        patient_age:typeof dados.patient_age==='number'?dados.patient_age:(parseInt(dados.patient_age)||null),
        admission_reason:[
          dados.patient_nip?'NIP: '+dados.patient_nip:'',
          dados.patient_name?'Nome: '+dados.patient_name:'',
          dados.patient_age?dados.patient_age+' anos':'',
          dados.patient_sex?dados.patient_sex:'',
          dados.patient_admission?'Adm: '+dados.patient_admission:'',
          dados.motivo_internacao?'Motivo: '+dados.motivo_internacao:'',
          dados.avp_motivo?'AVP: '+dados.avp_motivo:'',
          dados.notifier_type?'Notificador: '+dados.notifier_type:'',
        ].filter(Boolean).join(' | ')||null,
        ai_summary:dados.ai_summary||null,
        gravidade:dados.event_subtype==='Evento sentinela'?'Evento sentinela':dados.event_subtype==='Near miss'?'Near miss':dados.event_subtype==='Circunstancia de risco'?'Circunstancia de risco':null,
        is_test:testMode||false,
        hospital_id:h.id,
        chat_history:messages.slice(-10),
      };
      let protocolo='';
      if(sbUrl&&sbKey){
        const res=await sbInsert(sbUrl,sbKey,'notifications',payload);
        protocolo=res?.[0]?.id?res[0].id.slice(0,8).toUpperCase():Math.random().toString(36).slice(2,10).toUpperCase();
        if(webhookUrl&&!testMode){
          try{
            // Buscar e-mail dedicado do setor/tipo da notificacao (se configurado)
            let setorEmail=null;
            try{
              const chaveSetor=payload.sector||payload.event_subtype;
              if(chaveSetor){
                const se=await sbSelect(sbUrl,sbKey,'setor_emails',`hospital_id=eq.${h.id}&setor=eq.${encodeURIComponent(chaveSetor)}&select=email&limit=1`);
                if(se&&se[0]&&se[0].email) setorEmail=se[0].email;
              }
            }catch(e){/* tabela setor_emails pode nao existir ainda - segue sem cc extra */}
            // Tentar rota /email do Worker (substitui n8n)
            const emailUrl=WORKER_URL.replace(/\/+$/,'')+'/email';
            const whResp=await fetch(emailUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,protocolo,hospital_name:h.name,nsp_email:nspEmail,nsp_email_cc:'janan.almeida@gmail.com',setor_email:setorEmail,is_test:false})});
            if(!whResp.ok){
              // Fallback: tentar o webhook original (n8n) se configurado
              if(webhookUrl&&!webhookUrl.includes(WORKER_URL)){
                await fetch(webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,protocolo,hospital_name:h.name,nsp_email:nspEmail,nsp_email_cc:'janan.almeida@gmail.com',setor_email:setorEmail,is_test:false})}).catch(()=>{});
              }
              showToast('Aviso: e-mail pode nao ter sido enviado ('+whResp.status+')','error');
            }
          }catch(whErr){
            console.error('[email]',whErr);
            showToast('Aviso: falha ao enviar e-mail ('+whErr.message+')','error');
          }
        }
        showToast('Notificação salva! Gestor será notificado.','success');
      } else {
        protocolo=Math.random().toString(36).slice(2,10).toUpperCase();
        showToast('Notificação registrada!','success');
      }
      addMsg('user','Sim, confirmar e enviar.');
      addMsg('assistant','Notificação enviada com sucesso!\n\nProtocolo: '+protocolo+'\n\nGuarde este número. O Gestor do NSP foi notificado por e-mail e irá analisar o incidente.\n\n O NSP retornará com as ações tomadas. Em caso de evento sentinela ou adverso grave, a análise ocorrerá em até 72 horas.\n\nObrigado por contribuir com a segurança do HNSA. Sua notificação é confidencial e protegida pela Lei 13.709/2018 (LGPD).');
      setStep('done');
    }catch(err){
      console.error('Erro ao salvar notificacao:',err);
      showToast('Erro ao salvar: '+(err?.message||'verifique a conexão e tente novamente.'),'error');
    }
    setSaving(false);
  };

  const CHIPS_MAP={

  };

  const chipsAtivos=()=>{
    if(step==='subtipo') return CHIPS_MAP.subtipo_sp;
    return CHIPS_MAP[step]||[];
  };

  const ORDEM_SP=['perfil','tipo','subtipo','avp_motivo','setor','data','relato','medidas','nip','nome_pac','idade','sexo','data_admissao','motivo_internacao','desfecho','preventivel','resumo'];
  const ORDEM_ADM=['perfil','tipo','subtipo_adm','setor','data','relato','medidas','resumo'];
  const ORDEM_PACFAM=['perfil','subtipo','avp_motivo','setor','data','relato','medidas','nip','nome_pac','idade','sexo','data_admissao','motivo_internacao','desfecho','preventivel','resumo'];

  const getOrdem=()=>{
    const t=dados.notification_type;
    if(t==='administrativa') return ORDEM_ADM;
    if(dados.notifier_type==='paciente'||dados.notifier_type==='familiar'||dados.notifier_type==='anonimo') return ORDEM_PACFAM;
    return ORDEM_SP;
  };

  const getProgresso=()=>{
    const ordem=getOrdem().filter(s=>dados.event_subtype==='Perda de AVP'?true:s!=='avp_motivo');
    const idx=ordem.indexOf(step);
    return{atual:Math.max(idx,0)+1,total:ordem.length};
  };

  const LABELS_STEP={

    tipo:'Tipo de evento',
    subtipo:'O que aconteceu?',
    subtipo_adm:'Tipo de ocorrência',
    avp_motivo:'Motivo da perda do AVP',
    setor:'Setor',
    data:'Quando?',
    relato:'Descrição do evento',
    medidas:'Medidas tomadas',
    nip:'Identificação do paciente',
nome_pac:'Nome do paciente',
idade:'Idade do paciente',
    idade:'Idade do paciente',
    sexo:'Sexo do paciente',
    desfecho:'Desfecho',
    preventivel:'Evitabilidade',
        data_admissao:'Data de admissao',
    motivo_internacao:'Motivo da internacao',
    resumo:'Confirmação',
    done:'Concluído',
  };

  const chips=chipsAtivos();
  const prog=step!=='done'?getProgresso():{atual:1,total:1};
  const inputSteps=['relato','medidas','nip','nome_pac','idade','setor','data','data_admissao','motivo_internacao'];
  const showInput=inputSteps.includes(step)&&!loading&&!saving;
  const showPular=['nip','nome_pac','idade','sexo','data_admissao','motivo_internacao'].includes(step)&&!loading&&!saving;
  const showConfirm=step==='resumo'&&!loading&&!saving;

  useEffect(()=>{
    setMessages([{role:'assistant',content:'Olá! Vamos registrar a notificação passo a passo.\n\n**Quem é você?**\n\nVocê pode notificar anonimamente se preferir - nenhum dado pessoal é obrigatório.'}]);

  return(<div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 64px)'}}>

    <div style={{padding:'12px 16px',borderBottom:'1px solid '+C.border,background:C.surface}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:step!=='done'?6:0}}>
        <div style={{fontSize:14,fontWeight:700,color:C.text}}>Registrar Notificação</div>

      </div>}

      {messages.map((m,i)=>(
        <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
          <div style={{maxWidth:'88%',background:m.role==='user'?'linear-gradient(135deg,'+C.teal+','+C.blue+')':C.card,border:m.role==='assistant'?'1px solid '+C.border:'none',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'11px 14px',fontSize:14,color:m.role==='user'?'#fff':C.text,lineHeight:1.65}}
            dangerouslySetInnerHTML={{__html:md(m.content)}}/>
        </div>
      ))}
      {(loading||saving)&&<div style={{display:'flex',alignItems:'center',gap:8}}>
        <Dots/>
        {saving&&<span style={{fontSize:12,color:C.green}}>Salvando...</span>}
      </div>}
      <div ref={endRef}/>
    </div>

    {/* Área de entrada */}
    {step!=='done'&&(
      <div style={{borderTop:'1px solid '+C.border,background:C.surface}}>

        {/* Chips clicáveis */}
        {chips.length>0&&!loading&&!saving&&(
          <div style={{padding:'10px 14px 6px',display:'flex',flexWrap:'wrap',gap:7,maxHeight:200,overflowY:'auto'}}>
            {chips.map((c,i)=>(
              <button key={i} onClick={()=>responder(c.v,c.l)}
                style={{background:C.card,border:'1px solid '+C.teal+'55',borderRadius:20,padding:'7px 14px',color:C.teal,fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                {c.l}
              </button>
            ))}
          </div>
        )}

        {/* Botão pular (campos opcionais) */}
        {showPular&&(
          <div style={{padding:'4px 14px 0',display:'flex',justifyContent:'flex-end'}}>
            <button onClick={pular} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>
              Pular (não informar)
            </button>
          </div>
        )}

        {/* Botões confirmar / corrigir */}
        {showConfirm&&(
          <div style={{padding:'8px 14px 6px',display:'flex',gap:8}}>
            <button onClick={confirmar} disabled={saving} style={{flex:2,background:saving?C.border:C.teal,border:'none',borderRadius:12,padding:'13px',color:saving?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:saving?'default':'pointer',opacity:saving?0.7:1}}>
              {saving?'Salvando...':'Confirmar e Enviar'}
            </button>
            <button onClick={corrigir} disabled={saving} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'13px',color:C.muted,fontWeight:600,fontSize:12,cursor:saving?'default':'pointer'}}>
              Corrigir
            </button>
          </div>
        )}

        {/* Campo texto livre */}
        {showInput&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input type={(step==='data'||step==='data_admissao')?'date':'text'} value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder={
                step==='nip'?'Digite o NIP do paciente...' :
                step==='relato'?'Descreva o que aconteceu...' :
                step==='medidas'?'Descreva as medidas tomadas...' :
                chips.length>0?'Ou escreva livremente...' :
                'Escreva aqui...'
              }
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}

        {/* NIP - só texto (sem chips) */}
        {step==='nip'&&!loading&&!saving&&chips.length===0&&(
          <div style={{padding:'8px 14px 12px',display:'flex',gap:10}}>
            <input type={(step==='data'||step==='data_admissao')?'date':'text'} value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&input.trim()&&(responder(input.trim(),input.trim()),setInput(''))}
              placeholder="Digite o NIP do paciente..."
              style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:22,padding:'10px 16px',color:C.text,fontSize:14,outline:'none'}}/>
            <button onClick={()=>{if(input.trim()){responder(input.trim(),input.trim());setInput('');}}}
              disabled={!input.trim()}
              style={{width:44,height:44,borderRadius:'50%',border:'none',background:input.trim()?C.teal:C.border,cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IconSend size={17} color={input.trim()?'#06101F':C.muted}/>
            </button>
          </div>
        )}
      </div>
    )}
  </div>);
}
