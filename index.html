<style>
  :root{
    --bg:#0d1618; --panel:#12211f; --panel2:#16302b; --line:#1f3d37;
    --ink:#e8f2ee; --muted:#7fa49a; --acc:#3ddc97; --acc2:#5ec8ff;
    --warn:#f2c94c; --bad:#ff6b6b; --gold:#e6b450; --radius:14px;
    --glow:#12332c; --inputbg:#0a1512; --bar:#0a1512;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  html[data-tema="claro"]{
    --bg:#f4f7f6; --panel:#ffffff; --panel2:#eef4f2; --line:#d5e2dd;
    --ink:#12211f; --muted:#5c7a72; --acc:#0f9d6b; --acc2:#1f7fbf;
    --warn:#b7860b; --bad:#c0392b; --gold:#a97b18;
    --glow:#dcece6; --inputbg:#ffffff; --bar:#e3ece9;

  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,var(--glow) 0%,var(--bg) 55%);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #root{max-width:1080px;margin:0 auto;padding:22px 18px 90px}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .btn{background:var(--acc);color:#04120c;font-weight:700;padding:11px 16px;border-radius:10px;font-size:14px}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--acc)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 24px}
  .nav button{background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid transparent}
  .nav button.on{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  .grid{display:grid;gap:14px}
  .muted{color:var(--muted)}
  .bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px}
  .alt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:10px;margin-top:9px;font-size:15px;transition:.12s}

  .alt.correct{border-color:var(--acc);background:#123528}
  .alt.wrong{border-color:var(--bad);background:#331819}
  .alt.dim{opacity:.55}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
  input,textarea,select{width:100%;background:var(--inputbg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:14px}
  textarea{min-height:70px;resize:vertical}
  label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .kpi{font-size:34px;font-weight:800;letter-spacing:-.03em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .sem{width:11px;height:11px;border-radius:99px;display:inline-block}
  .comment{background:color-mix(in srgb, var(--acc) 12%, var(--panel));border-left:3px solid var(--acc);color:var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;margin-top:14px;font-size:14px;line-height:1.55}
  .block{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.55}
  .b-nucleo{background:color-mix(in srgb, var(--acc) 12%, var(--panel));border-left:3px solid var(--acc);color:var(--ink)}
  .b-pega{background:color-mix(in srgb, var(--warn) 14%, var(--panel));border-left:3px solid var(--warn);color:var(--ink)}
  .b-mne{background:color-mix(in srgb, var(--acc2) 12%, var(--panel));border-left:3px solid var(--acc2);color:var(--ink)}
  .b-sus{background:color-mix(in srgb, #b98cff 14%, var(--panel));border-left:3px solid #b98cff;color:var(--ink)}
  .b-metodo{background:var(--panel2);border:1px dashed var(--line);color:var(--ink)}
  .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 18%,var(--panel)),var(--panel));border:1px solid var(--acc);color:var(--ink);border-radius:16px;padding:20px}

  .rate button{width:38px;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:700}
  .rate button.on{background:var(--acc);color:#04120c;border-color:var(--acc)}
  .topico{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
  .topico>.head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;background:var(--panel2)}
  .topico>.body{padding:0 15px 15px}
  .yield{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
  .lock{background:color-mix(in srgb,#b98cff 12%,var(--panel));border:1px solid color-mix(in srgb,#b98cff 40%,var(--line));color:var(--ink);border-radius:12px;padding:16px;text-align:center}
  .center{min-height:80vh;display:flex;align-items:center;justify-content:center}
  .auth{max-width:380px;width:100%}
  .link{color:var(--acc);cursor:pointer;font-weight:600}
</style>

  {id:"cm-acidobase",area:"CM",nome:"Distúrbios ácido-base",yield:3,
   aula:["O sangue tem que ficar num pH bem estreito, entre 7,35 e 7,45. É pouca margem porque as enzimas do corpo só funcionam bem nessa faixa. Quando o pH cai abaixo de 7,35, o sangue está mais ácido — isso é acidose. Quando sobe acima de 7,45, está mais básico — alcalose. Todo o resto do assunto é descobrir POR QUE o pH saiu do lugar e o que o corpo está fazendo pra tentar consertar.",
     "Duas coisas controlam o pH: o gás carbônico (CO2), que é regulado pelos PULMÕES, e o bicarbonato (HCO3), regulado pelos RINS. Pense assim: o CO2 é um ácido (quanto mais CO2, mais ácido o sangue); o HCO3 é uma base (quanto mais bicarbonato, mais básico). Se o problema começa no pulmão (CO2), chamamos de distúrbio RESPIRATÓRIO. Se começa no metabolismo/rim (HCO3), é METABÓLICO.",
     "O corpo não fica parado quando o pH desregula: ele COMPENSA. Se você tem uma acidose metabólica (bicarbonato baixo), o pulmão acelera a respiração pra jogar CO2 fora e tentar subir o pH — por isso o paciente em cetoacidose respira rápido e fundo. A compensação pulmonar é rápida (minutos); a renal é lenta (dias). Entender isso é o que te faz LER uma gasometria em vez de decorar.",
     "Na acidose metabólica ainda dividimos em dois tipos, e isso muda o diagnóstico: quando há acúmulo de um ácido novo no sangue (como na cetoacidose ou no acúmulo de lactato), o ânion gap fica ALTO. Quando o problema é perda de bicarbonato (como numa diarreia), o ânion gap fica NORMAL. O ânion gap é só uma conta que estima se tem 'ácido escondido' sobrando."],
   raciocinio:["1. Olhe o pH: está abaixo de 7,35 (acidose) ou acima de 7,45 (alcalose)?",

     "4. Cheque a compensação esperada. Se ela não bate, há um segundo distúrbio junto (distúrbio MISTO)."],
   nucleo:["Sequência fixa: 1) pH 2) HCO3 e pCO2 (distúrbio primário) 3) ânion gap 4) compensação esperada.","Acidose metabólica: ânion gap ALTO vs NORMAL/hiperclorêmica.","Compensação: fórmula de Winter (pCO2 = 1,5 x HCO3 + 8 +/- 2)."],
   pega:"Sempre cheque se há distúrbio MISTO. Gaso foi a questão 2 do ENAMED 2025 (anulada).",mne:"Ânion gap alto = MUDPILES.",sus:"Interpretação de gaso cai contextualizada em caso clínico."},
  {id:"cm-has",area:"CM",nome:"Hipertensão — manejo e metas",yield:3,
   aula:["Pressão alta é quando a força do sangue contra a parede das artérias fica cronicamente elevada. O problema é que ela quase nunca dá sintoma — a pessoa se sente bem enquanto as artérias, o coração, os rins e os olhos vão sendo lesados aos poucos. Por isso a HAS é chamada de 'assassina silenciosa', e por isso o rastreamento (medir a pressão) importa tanto na atenção primária.",
     "Pra dizer que alguém tem hipertensão você não usa uma medida só: precisa confirmar (>=140/90 em consultório em dias diferentes, ou por MAPA/MRPA, que medem fora do consultório e evitam o 'nervosismo do jaleco branco'). Diagnóstico apressado com uma única medida alta é erro clássico.",
     "O tratamento tem dois pilares. Primeiro, SEMPRE, mudança de estilo de vida: menos sal, perda de peso, atividade física, menos álcool — isso vale pra todo hipertenso. Segundo, o remédio, escolhido pelo estágio e pelo risco. As primeiras linhas são três classes: diurético tiazídico, IECA/BRA (que agem no sistema renina-angiotensina) e bloqueador de canal de cálcio. Todas baratas e disponíveis no SUS.",
     "Um detalhe que a banca adora: betabloqueador NÃO é primeira linha na hipertensão sem uma indicação específica (como doença coronariana ou insuficiência cardíaca). E é preciso separar urgência (pressão muito alta SEM lesão aguda de órgão) de emergência (COM lesão aguda — AVC, edema pulmonar) — porque a conduta e a velocidade de baixar a pressão são completamente diferentes."],
   raciocinio:["1. Confirme o diagnóstico: mais de uma medida, ou MAPA/MRPA. Não feche com uma aferição só.",

     "5. Diante de pressão muito alta, pergunte: há lesão AGUDA de órgão? Sim = emergência; não = urgência."],
   nucleo:["Diagnóstico: >=140/90 confirmado, ou MAPA/MRPA.","1ª linha: tiazídico OU IECA/BRA OU BCC.","Emergência (lesão aguda de órgão-alvo) x urgência."],
   pega:"Betabloqueador NÃO é 1ª linha sem indicação específica.",mne:"Primeiras linhas = 'TIB'.",sus:"HiperDia / linha de cuidado na APS."},
  {id:"cm-dm2",area:"CM",nome:"Diabetes tipo 2",yield:3,
   aula:["Diabetes tipo 2 é uma doença em que o corpo não consegue mais controlar bem o açúcar no sangue. Diferente do tipo 1 (que é falta de insulina), no tipo 2 o corpo até produz insulina, mas as células ficam 'surdas' a ela — é a resistência à insulina. Com o tempo o pâncreas cansa e a glicose sobe. O excesso de açúcar circulando vai lesando vasos pequenos e grandes: olhos, rins, nervos e coração.",
     "O diagnóstico se faz por qualquer um destes: glicemia de jejum >=126, HbA1c >=6,5%, glicemia 2h após o TOTG >=200, ou glicemia casual >=200 com sintomas. A HbA1c é útil porque mostra a média do açúcar dos últimos 2-3 meses — não depende de o paciente estar em jejum naquele dia.",
     "O primeiro remédio é quase sempre a metformina. Ela reduz a produção de glicose pelo fígado e melhora a resposta à insulina, é barata, segura e disponível no SUS — por isso é a 1ª linha. Só é preciso cuidado quando a função renal está muito ruim (TFG baixa), aí ela pode ser contraindicada.",
     "Tratar diabetes não é só baixar o número da glicose: é definir uma META individualizada de HbA1c (em geral abaixo de 7%, mas mais frouxa em idosos frágeis) e rastrear as complicações periodicamente — fundo de olho, função renal, exame dos pés. Um erro comum é já querer insulinizar todo mundo de cara; a insulina entra quando os orais não dão conta."],
   raciocinio:["1. Confirme o diagnóstico (jejum, HbA1c, TOTG ou casual com sintomas).",
     "2. Cheque a função renal — ela decide se a metformina pode ser usada.",
     "3. Comece metformina (1ª linha) + mudança de estilo de vida.",
     "4. Defina a meta de HbA1c conforme o perfil do paciente (mais rígida no jovem, mais frouxa no idoso frágil).",
     "5. Programe o rastreio de complicações (retina, rim, neuropatia, pés)."],
   nucleo:["Diagnóstico: jejum >=126, HbA1c >=6,5%, TOTG 2h >=200.","Metformina = 1ª linha.","Metas individualizadas; rastrear complicações."],
   pega:"Não insulinizar todo mundo de cara; ver TFG para metformina.",mne:"Metformina primeiro.",sus:"Linha de cuidado do DM na APS."},
  {id:"cm-sepse",area:"CM",nome:"Sepse e choque",yield:2,
   nucleo:["Disfunção orgânica + infecção (qSOFA/SOFA).","Pacote 1h: lactato, hemocultura antes do ATB, ATB precoce, cristaloide.","Reavaliar perfusão."],

  {id:"cir-abdome",area:"CIR",nome:"Abdome agudo",yield:3,

  {id:"ped-respiratorio",area:"PED",nome:"IVAS, bronquiolite e pneumonia",yield:3,

  {id:"tv-saudemental",area:"CM",nome:"Saúde Mental na APS (transversal)",yield:3,

  {id:"tv-sus",area:"MFC",nome:"Princípios do SUS (transversal)",yield:3,

  {id:"cm1",area:"CM",tema:"Endocrinologia — DM2",transv:[],dif:1,premium:false,enun:"Homem de 52 anos, IMC 31, HbA1c 7,4% confirmada, sem comorbidade. Conduta inicial?",alts:["Insulina NPH","Metformina","Glibenclamida","Só mudança de estilo de vida por 12 meses"],correta:1,coment:"Metformina é 1ª linha no DM2 sem contraindicação."},

];

function schedule(prev,ok){
  let {ef=2.5,intervalo=0,reps=0}=prev||{};
  if(ok){reps+=1;intervalo=reps===1?1:reps===2?3:Math.round(intervalo*ef);ef=Math.max(1.3,ef+0.1);}
  else{reps=0;intervalo=1;ef=Math.max(1.3,ef-0.2);}
  return {ef,intervalo,reps,due:new Date(Date.now()+intervalo*86400000).toISOString()};
}
function Bar({pct,color}){return <div className="bar"><i style={{width:Math.max(2,pct)+"%",background:color||"var(--acc)"}}/></div>}
const sem=p=>p>=70?"var(--acc)":p>=50?"var(--warn)":"var(--bad)";
const dias=iso=>Math.floor((Date.now()-new Date(iso).getTime())/86400000);

function App(){
  const [session,setSession]=useState(null);
  const [booting,setBooting]=useState(true);
  useEffect(()=>{
    if(!CONFIGURADO){setBooting(false);return;}
    sb.auth.getSession().then(({data})=>{setSession(data.session);setBooting(false);});
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));

  },[]);

  if(booting) return <div className="center"><div className="muted">Carregando...</div></div>;

  return <Shell session={session}/>;
}

      sb.from("assinaturas").select("*").eq("user_id",uid).order("criado_em",{ascending:false}).limit(1),

    let qs=(q.data||[]).map(x=>({id:x.id,area:x.area,tema:x.tema,transv:x.transv||[],dif:x.dificuldade,enun:x.enunciado,alts:x.alternativas,correta:x.correta,coment:x.comentario,premium:x.premium}));
    if(qs.length===0) qs=SEED; // fallback se o banco ainda nao foi populado
    setQuestoes(qs);
    setLog((r.data||[]).map(x=>({id:x.questao_id,area:x.area,tema:x.tema,ok:x.acertou})));
    const dm={};(d.data||[]).forEach(x=>dm[x.topico_id]={nivel:x.nivel,last:x.atualizado_em});setDominio(dm);
    const sr={};(s.data||[]).forEach(x=>sr[x.questao_id]={ef:x.ef,intervalo:x.intervalo,reps:x.reps,due:x.due});setSrs(sr);
    setAssinatura((a.data&&a.data[0])||{plano:"free",status:"ativa"});
    setLoading(false);
  })()},[uid]);

  const isPro = assinatura && assinatura.status==="ativa" && assinatura.plano!=="free";

  const registrar=async(q,ok)=>{
    setLog(l=>[...l,{id:q.id,area:q.area,tema:q.tema,ok}]);
    const nova=schedule(srs[q.id],ok);
    setSrs(s=>({...s,[q.id]:nova}));
    await sb.from("respostas").insert({user_id:uid,questao_id:q.id,area:q.area,tema:q.tema,acertou:ok});
    await sb.from("srs").upsert({user_id:uid,questao_id:q.id,ef:nova.ef,intervalo:nova.intervalo,reps:nova.reps,due:nova.due});
  };
  const avaliarDominio=async(topId,nivel)=>{
    setDominio(d=>({...d,[topId]:{nivel,last:new Date().toISOString()}}));
    await sb.from("dominio").upsert({user_id:uid,topico_id:topId,nivel,atualizado_em:new Date().toISOString()});
  };

  const acertoArea=useMemo(()=>{
    const m={};AREAS.forEach(a=>m[a.k]={t:0,ok:0});
    log.forEach(l=>{if(m[l.area]){m[l.area].t++;if(l.ok)m[l.area].ok++;}});
    const o={};AREAS.forEach(a=>o[a.k]=m[a.k].t?m[a.k].ok/m[a.k].t:null);return o;
  },[log]);

  const store={questoes,log,srs,dominio};

  // ---- Limites do plano FREE (amostra grátis enxuta) ----

  const FREE_QUESTOES = 2;        // só 2 questões no Treinar
  // pool grátis: apenas 2 questões (as marcadas como não-premium), limitado a FREE_QUESTOES
  const poolFree = questoes.filter(q=>!q.premium).slice(0, FREE_QUESTOES);
  const poolVisivel = isPro ? questoes : poolFree;
  const bloqueadasFree = questoes.length - poolFree.length;

  if(loading) return <div className="center"><div className="muted">Sincronizando seu progresso...</div></div>;

  return <div>
    <div className="row" style={{justifyContent:"space-between",alignItems:"flex-start"}}>

        <div className="tag" style={{color:"var(--acc)"}}>ENAMED Engine</div>

        <span className="pill" style={{color:isPro?"var(--gold)":"var(--muted)",borderColor:isPro?"var(--gold)":"var(--line)"}}>{isPro?"PRO":"Demonstração"}</span>

          <span className="link" style={{fontSize:13}} onClick={()=>setTema(tema==="escuro"?"claro":"escuro")}>{tema==="escuro"?"☀ Claro":"🌙 Escuro"}</span>

        </div>

      <div style={{marginTop:12}}><button className="btn" onClick={()=>setShowAssinar(true)}>Assinar Combo até o ENAMED</button></div>

  </div>;

/* =================== TRILHA =================== */
function prioridade(top,store,acertoArea){
  const d=store.dominio[top.id];const nivel=d?d.nivel:null;
  const need=nivel===null?1:(5-nivel)/4;
  const rec=d?Math.min(1,dias(d.last)/14):1;
  const aa=acertoArea[top.area];const fraq=aa===null?0.5:(1-aa);
  const score=top.yield*(0.55*need+0.25*rec+0.20*fraq);
  const motivos=[];
  if(top.yield>=3)motivos.push("alto rendimento na prova");
  if(nivel===null)motivos.push("voce ainda nao estudou este tema");
  else if(nivel<=2)motivos.push("seu dominio esta baixo ("+nivel+"/5)");
  if(d&&dias(d.last)>=7)motivos.push("faz "+dias(d.last)+" dias que revisou");
  if(aa!==null&&aa<0.6)motivos.push("acerta so "+Math.round(aa*100)+"% em "+areaNome(top.area));
  return {score,nivel,motivos};
}
function Trilha({store,acertoArea,avaliarDominio,irTreinar,isPro,freeTopico,onAssinar}){

  // no free o "estude agora" aponta para o unico topico liberado
  const top1=isPro?ranked[0]:(ranked.find(t=>t.id===freeTopico)||ranked[0]);
  const proximos=ranked.filter(t=>t.id!==top1.id).slice(0,3);
  const yc=y=>y>=3?"var(--gold)":y===2?"var(--acc2)":"var(--muted)";
  const yl=y=>y>=3?"ALTO RENDIMENTO":y===2?"IMPORTANTE":"COMPLEMENTAR";
  const abrir=t=>{ if(!liberado(t)){onAssinar();return;} setAberto(aberto===t.id?null:t.id); };
  const Cartao=t=>{const d=store.dominio[t.id];const rc=recall[t.id];const open=aberto===t.id;const lock=!liberado(t);
    return <div className="topico" key={t.id} style={lock?{opacity:.75}:null}>

        <div className="row" style={{gap:9}}><span className="yield" style={{color:yc(t.yield),border:"1px solid "+yc(t.yield)}}>{yl(t.yield)}</span><b style={{fontSize:14.5}}>{t.nome}</b></div>
        <div className="row" style={{gap:10}}>
          {lock?<span className="pill" style={{color:"var(--gold)",borderColor:"var(--gold)"}}>PRO</span>
               :<span className="muted" style={{fontSize:12}}>{d?("dominio "+d.nivel+"/5"):"nao estudado"}</span>}

        </div>
      </div>
      {open && !lock && <div className="body">

              <span style={{fontSize:14,lineHeight:1.5,color:"var(--ink)"}}>{r.replace(/^\d+\.\s*/,"")}</span>
            </div>)}</div>
        </div>}

        {/* 3) TIRA-DUVIDA com IA */}
        <TiraDuvida tema={t.nome} contexto={(t.aula||[]).join(" ")}/>

        {/* 4) FIXACAO — so depois de aprender */}
        <div className="tag muted" style={{margin:"18px 0 6px"}}>Fixar o que você aprendeu</div>
        <div className="row" style={{marginBottom:4}}>
          <button className="btn ghost sm" onClick={()=>setRecall(r=>({...r,[t.id]:!r[t.id]}))}>{rc?"Mostrar resumo":"Recall (testar de memória)"}</button>
          <button className="btn ghost sm" onClick={irTreinar}>Treinar questões</button>
        </div>
        {!rc?<div className="b-metodo block"><b>Resumo:</b> <ul style={{margin:"6px 0 0 18px",padding:0}}>{t.nucleo.map((n,i)=><li key={i} style={{marginBottom:4}}>{n}</li>)}</ul></div>
          :<div className="b-metodo block" style={{textAlign:"center",color:"var(--muted)"}}>Resumo escondido — tente recuperar de memória.</div>}

        <div style={{marginTop:14}}><b style={{fontSize:13}}>Consegue explicar o tema agora?</b>
          <div className="rate">{[1,2,3,4,5].map(n=><button key={n} className={d&&d.nivel===n?"on":""} onClick={()=>avaliarDominio(t.id,n)}>{n}</button>)}</div>
          <div className="muted" style={{fontSize:11,marginTop:5}}>1 = ainda não entendi · 5 = ensinaria um colega. Isto reordena sua trilha.</div>
        </div>

  return <div>

      <div style={{fontSize:14,lineHeight:1.5}}><b>Por quê:</b> {top1.motivos.length?top1.motivos.join(" · "):"tema central do blueprint"}.</div>
      <div className="row" style={{marginTop:14}}><button className="btn" onClick={()=>abrir(top1)}>Abrir e estudar</button></div>
    </div>

    {/* REVISAR HOJE — curva do esquecimento */}
    {(()=>{
      const revisar=CURRICULO.map(t=>{
        const d=store.dominio[t.id]; if(!d) return null;
        const diasDesde=dias(d.last);
        const intervalo=[0,1,2,4,7,14][d.nivel]||1; // dominio baixo revisa antes
        return diasDesde>=intervalo ? {...t,diasDesde} : null;
      }).filter(Boolean).sort((a,b)=>b.diasDesde-a.diasDesde).slice(0,4);
      if(revisar.length===0) return null;

          <span className="muted" style={{fontSize:12}}>pra não esquecer</span>
        </div>
        {revisar.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"8px 2px",borderBottom:"1px solid var(--line)"}}>
          <span style={{fontSize:14}}>{t.nome} <span className="muted">· visto há {t.diasDesde}d · domínio {store.dominio[t.id].nivel}/5</span></span>
          <button className="btn ghost sm" onClick={()=>abrir(t)}>Revisar</button>
        </div>)}
      </div>;
    })()}
    {!isPro && <div className="lock" style={{marginTop:16,textAlign:"left"}}>
      <b>Demonstração: 1 assunto liberado.</b>

    </div>}
    <div style={{marginTop:20}}><h3 style={{fontSize:15,marginBottom:6}}>Depois deste, priorize</h3>
      {proximos.map(t=><div key={t.id} className="row" style={{justifyContent:"space-between",padding:"9px 2px",borderBottom:"1px solid var(--line)"}}>
        <span style={{fontSize:14}}>{t.nome} <span className="muted">· {areaNome(t.area)}</span></span>
        <button className="btn ghost sm" onClick={()=>abrir(t)}>{liberado(t)?"Abrir":"🔒 PRO"}</button></div>)}</div>
    <div style={{marginTop:24}}><h3 style={{fontSize:15,marginBottom:2}}>Mapa completo por área</h3>
      <div className="muted" style={{fontSize:13,marginBottom:6}}>{isPro?"O domínio que você marca reordena a trilha.":"Demonstração do método. Assine para abrir todos."}</div>

        {ranked.filter(t=>t.area===a.k).sort((x,y)=>y.yield-x.yield).map(Cartao)}</div>)}</div>
  </div>;

/* =================== DASH =================== */
function Dash({store}){
  const s=useMemo(()=>{
    const byArea={};AREAS.forEach(a=>byArea[a.k]={t:0,ok:0,q:0});
    store.questoes.forEach(q=>{if(byArea[q.area])byArea[q.area].q++;});
    store.log.forEach(l=>{const b=byArea[l.area];if(b){b.t++;if(l.ok)b.ok++;}});
    const byTema={};store.log.forEach(l=>{(byTema[l.tema]=byTema[l.tema]||{t:0,ok:0,area:l.area});byTema[l.tema].t++;if(l.ok)byTema[l.tema].ok++;});
    return {byArea,byTema,tot:store.log.length,ok:store.log.filter(l=>l.ok).length};},[store]);
  const geral=s.tot?Math.round(s.ok/s.tot*100):0;
  const fracos=Object.entries(s.byTema).map(([tema,v])=>({tema,area:v.area,pct:Math.round(v.ok/v.t*100)})).sort((a,b)=>a.pct-b.pct).slice(0,6);

      <div><div className="tag muted">Temas estudados</div><div className="kpi">{Object.keys(store.dominio).length}</div></div>
    </div></div>
    <div className="card" style={{gridColumn:"1 / -1"}}><h3 style={{fontSize:16,marginBottom:12}}>Desempenho por área</h3>
      {AREAS.map(a=>{const b=s.byArea[a.k];const p=b.t?Math.round(b.ok/b.t*100):0;
        return <div key={a.k} style={{marginBottom:14}}>
          <div className="row" style={{justifyContent:"space-between"}}><div className="row" style={{gap:8}}><span className="sem" style={{background:b.t?sem(p):"#2a4a43"}}/><b style={{fontSize:14}}>{a.nome}</b><span className="muted" style={{fontSize:12}}>· {b.q} no banco</span></div><span className="muted" style={{fontSize:13}}>{b.t?p+"% ("+b.ok+"/"+b.t+")":"sem dados"}</span></div>
          <div style={{marginTop:6}}><Bar pct={p} color={b.t?sem(p):"#2a4a43"}/></div></div>;})}</div>
    <div className="card"><h3 style={{fontSize:16,marginBottom:10}}>Onde você mais erra</h3>
      {fracos.length===0&&<div className="muted" style={{fontSize:14}}>Responda questões para o mapa aparecer.</div>}
      {fracos.map(f=><div key={f.tema} style={{marginBottom:11}}><div className="row" style={{justifyContent:"space-between"}}><span style={{fontSize:13}}>{f.tema} <span className="muted">· {areaNome(f.area)}</span></span><span style={{fontSize:13,color:sem(f.pct)}}>{f.pct}%</span></div><Bar pct={f.pct} color={sem(f.pct)}/></div>)}</div>
    <div className="card"><h3 style={{fontSize:16,marginBottom:10}}>Cobertura do blueprint</h3>
      {AREAS.map(a=>{const q=s.byArea[a.k].q;const p=Math.min(100,Math.round(q/a.meta*100));
        return <div key={a.k} style={{marginBottom:10}}><div className="row" style={{justifyContent:"space-between"}}><span style={{fontSize:13}}>{a.nome}</span><span className="muted" style={{fontSize:12}}>{q}/{a.meta}</span></div><Bar pct={p} color="var(--acc2)"/></div>;})}</div>

}

/* =================== TREINAR =================== */
function QuestionCard({q,onResp,indice,total}){
  const [sel,setSel]=useState(null);useEffect(()=>setSel(null),[q.id]);const L=["A","B","C","D"];
  return <div className="card">
    <div className="row" style={{justifyContent:"space-between",marginBottom:10}}>
      <div className="row" style={{gap:8}}><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span><span className="pill">{q.tema}</span>{(q.transv||[]).map(t=><span key={t} className="pill" style={{color:"var(--acc2)"}}>{t}</span>)}</div>
      {total>1&&<span className="muted" style={{fontSize:13}}>{indice+1}/{total}</span>}</div>
    <div style={{fontSize:15.5,lineHeight:1.6,marginBottom:6}}>{q.enun}</div>
    {q.alts.map((a,i)=>{let c="alt";if(sel!==null){if(i===q.correta)c+=" correct";else if(i===sel)c+=" wrong";else c+=" dim";}
      return <button key={i} className={c} disabled={sel!==null} onClick={()=>{setSel(i);onResp(q,i===q.correta);}}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
    {sel!==null&&<div className="comment"><b style={{color:sel===q.correta?"var(--acc)":"var(--bad)"}}>{sel===q.correta?"Correto. ":"Incorreto. "}</b>{q.coment}</div>}
  </div>;
}
/* =================== PRATICAR (hub: treinar + simulado + foto) =================== */
function Praticar(props){
  const [modo,setModo]=useState("treinar");
  const sub=[["treinar","Questões"],["simulado","Simulado"],["resolver","Resolver por foto"]];
  return <div>
    <div className="row" style={{gap:6,marginBottom:16}}>

    </div>

function Treinar({pool,store,registrar,bloqueadas,isPro,onAssinar,onNovasQuestoes}){
  const [area,setArea]=useState("todas");
  const [extra,setExtra]=useState([]);   // questoes geradas na sessao
  const [gerando,setGerando]=useState(false);
  const [msg,setMsg]=useState("");
  const base = area==="todas"?pool:pool.filter(q=>q.area===area);
  const fila=useMemo(()=>{
    const todas=[...base,...extra.filter(q=>area==="todas"||q.area===area)];
    const now=Date.now();
    const due=todas.filter(q=>!store.srs[q.id]||new Date(store.srs[q.id].due).getTime()<=now);
    return (due.length?due:todas).slice().sort(()=>Math.random()-0.5);
  },[base,extra,area]);
  const [i,setI]=useState(0);const [feito,setFeito]=useState(false);
  useEffect(()=>{setI(0);setFeito(false);},[area]);
  const q=fila[i];
  const workerOk=!WORKER_URL.startsWith("COLE_");

  const mais=async()=>{
    if(!isPro){onAssinar();return;}
    if(!workerOk){setMsg("O gerador entra no ar quando o app for publicado com o Worker.");return;}
    setGerando(true);setMsg("");
    const alvoArea = area==="todas"?["CM","CIR","GO","PED","MFC"][Math.floor(Math.random()*5)]:area;
    try{
      const novas=[];
      for(let k=0;k<10;k++){
        const r=await fetch(WORKER_URL+"/gerar-questao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({area:alvoArea})});
        const d=await r.json();
        if(d.questao){
          const Q=d.questao;
          novas.push({id:"ai"+Date.now()+"_"+k,area:Q.area||alvoArea,tema:Q.tema||"Gerada por IA",transv:Q.transv||[],dif:2,enun:Q.enunciado,alts:Q.alternativas,correta:Q.correta,coment:Q.comentario||"",premium:true});
        }
      }
      if(novas.length===0) throw new Error("Não consegui gerar agora. Tente de novo.");
      setExtra(e=>[...e,...novas]);
      if(onNovasQuestoes) onNovasQuestoes(novas); // opcional: persistir no banco
      setMsg("+"+novas.length+" questões novas na fila!");
    }catch(e){setMsg(e.message);}
    setGerando(false);
  };

  if(!q)return <div className="card">
    <div className="muted" style={{marginBottom:12}}>Nenhuma questão nesta área ainda.</div>
    <button className="btn" disabled={gerando} onClick={mais}>{gerando?"Gerando...":"Gerar 10 questões com IA"}</button>
    {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}
  </div>;

  const ultimaFree = !isPro && i>=fila.length-1;
  return <div>
    <div className="row" style={{justifyContent:"space-between",marginBottom:12}}>
      <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:210}}>
        <option value="todas">Todas as áreas</option>
        {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
      </select>
      <span className="muted" style={{fontSize:13}}>{i+1} de {fila.length}</span>
    </div>
    <div className="bar" style={{marginBottom:14}}><i style={{width:((i+1)/fila.length*100)+"%",background:"var(--acc)"}}/></div>

    <QuestionCard q={q} indice={i} total={fila.length} onResp={(qq,ok)=>{registrar(qq,ok);setFeito(true);}}/>

    <div className="row" style={{marginTop:14}}>
      {ultimaFree && feito
        ? <button className="btn" onClick={onAssinar}>Liberar todas as questões (PRO)</button>
        : i<fila.length-1
          ? <button className="btn" disabled={!feito} onClick={()=>{setFeito(false);setI(x=>x+1);}}>Próxima</button>
          : <button className="btn" disabled={!feito||gerando} onClick={mais}>{gerando?"Gerando mais 10...":"✨ Mais questões deste tema"}</button>}
    </div>
    {msg&&<div className="muted" style={{fontSize:13,marginTop:10,color:"var(--acc2)"}}>{msg}</div>}

    {!isPro && feito && ultimaFree && <div className="lock" style={{marginTop:14,textAlign:"left"}}>
      <b>Você terminou a demonstração.</b>
      <div className="muted" style={{fontSize:13,marginTop:6}}>Assine o Combo até o ENAMED para treinar questões ilimitadas — inclusive geradas na hora pela IA.</div>
    </div>}
  </div>;
}

/* =================== SIMULADO =================== */
function Simulado({pool,registrar,isPro}){
  const [run,setRun]=useState(false);const [prova,setProva]=useState([]);const [resp,setResp]=useState({});const [fim,setFim]=useState(false);
  const alvo=isPro?4:2; // por área; PRO monta simulado maior
  const montar=()=>{let sel=[];AREAS.forEach(a=>{const p=pool.filter(q=>q.area===a.k).sort(()=>Math.random()-0.5);sel=sel.concat(p.slice(0,alvo));});setProva(sel.sort(()=>Math.random()-0.5));setResp({});setFim(false);setRun(true);};
  const finalizar=()=>{prova.forEach(q=>{if(resp[q.id]!==undefined)registrar(q,resp[q.id]===q.correta);});setFim(true);};
  if(!run)return <div className="card"><h3 style={{fontSize:17,marginBottom:8}}>Simulado no formato oficial</h3>
    <div className="muted" style={{fontSize:14,marginBottom:14,lineHeight:1.6}}>Respeita a proporção de 20/área (escalada ao banco). {isPro?"":"No plano free o simulado é reduzido — o completo é PRO."}</div>
    <button className="btn" onClick={montar}>Gerar simulado</button></div>;
  const L=["A","B","C","D"];const ac=prova.filter(q=>resp[q.id]===q.correta).length;
  return <div>{!fim&&<div className="muted" style={{fontSize:13,marginBottom:12}}>{prova.length} questões · responda e finalize.</div>}
    {prova.map((q,idx)=><div key={q.id} className="card" style={{marginBottom:14}}>
      <div className="row" style={{gap:8,marginBottom:8}}><span className="muted" style={{fontSize:13}}>{idx+1}.</span><span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area)}</span></div>
      <div style={{fontSize:15,lineHeight:1.55,marginBottom:4}}>{q.enun}</div>
      {q.alts.map((a,i)=>{let c="alt";if(fim){if(i===q.correta)c+=" correct";else if(resp[q.id]===i)c+=" wrong";else c+=" dim";}else if(resp[q.id]===i)c+=" correct";
        return <button key={i} className={c} disabled={fim} onClick={()=>setResp(r=>({...r,[q.id]:i}))}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
      {fim&&<div className="comment">{q.coment}</div>}</div>)}
    {!fim?<button className="btn" onClick={finalizar}>Finalizar e corrigir</button>
      :<div className="card"><div className="row" style={{gap:30}}>
        <div><div className="tag muted">Nota</div><div className="kpi" style={{color:sem(Math.round(ac/prova.length*100))}}>{ac}/{prova.length}</div></div>
        <div><div className="tag muted">Percentual</div><div className="kpi">{Math.round(ac/prova.length*100)}%</div></div>
        <button className="btn ghost" onClick={()=>setRun(false)}>Novo</button></div></div>}
  </div>;
}

/* =================== BANCO =================== */
function Banco({questoes,uid,onAdd}){
  const porArea={};
  AREAS.forEach(a=>porArea[a.k]={tot:0,temas:new Set()});
  questoes.forEach(q=>{ if(porArea[q.area]){porArea[q.area].tot++; porArea[q.area].temas.add(q.tema);} });
  return <div>
    <div className="card" style={{marginBottom:16}}>
      <h3 style={{fontSize:17,marginBottom:4}}>Banco de questões</h3>
      <div className="muted" style={{fontSize:13}}>Você tem <b>{questoes.length}</b> questões no acervo. Precisa de mais? Gere questões inéditas no estilo INEP na aba <b>Gerar questão</b> — elas entram aqui automaticamente.</div>
    </div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}}>
      {AREAS.map(a=><div key={a.k} className="card">
        <div className="row" style={{justifyContent:"space-between"}}>
          <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{a.k}</span>
          <span className="kpi" style={{fontSize:26}}>{porArea[a.k].tot}</span>
        </div>
        <div style={{fontSize:13,marginTop:4}}>{a.nome}</div>
        <div className="muted" style={{fontSize:12,marginTop:2}}>{porArea[a.k].temas.size} temas</div>
      </div>)}
    </div>
  </div>;
}

/* =================== AULA ADAPTATIVA =================== */
function AulaAdaptativa({tema,aula}){
  const [extra,setExtra]=useState(null); // texto reescrito pela IA
  const [busy,setBusy]=useState("");
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const pedir=async(modo,rotulo)=>{
    if(!workerOk){setExtra("Este recurso fica ativo quando o app estiver publicado com o Worker.");return;}
    setBusy(rotulo);setExtra(null);
    try{
      const r=await fetch(WORKER_URL+"/reexplicar",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tema,aula:aula.join(" "),modo})});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha.");
      setExtra(d.texto||"");
    }catch(e){setExtra(e.message);}
    setBusy("");
  };
  const botoes=[
    ["outro","🔄 Explica de outro jeito"],
    ["basico","🐢 Mais básico / devagar"],
    ["exemplo","🩺 Me dá um exemplo clínico"],
    ["fundo","🔬 Vai mais fundo"],
  ];
  return <div style={{marginTop:6}}>
    <div className="tag" style={{color:"var(--acc)",marginBottom:6}}>A aula</div>
    {aula.map((p,i)=><p key={i} style={{fontSize:14.5,lineHeight:1.65,margin:"0 0 12px"}}>{p}</p>)}
    <div className="muted" style={{fontSize:12,marginBottom:6}}>Não ficou claro? Peça de outro jeito:</div>
    <div className="row" style={{gap:8}}>
      {botoes.map(([m,l])=><button key={m} className="btn ghost sm" disabled={!!busy} onClick={()=>pedir(m,l)}>{busy===l?"...":l}</button>)}
    </div>
    {extra && <div className="block b-nucleo" style={{marginTop:10}}>{extra.split("\n").filter(Boolean).map((p,i)=><p key={i} style={{fontSize:14,lineHeight:1.6,margin:"0 0 8px"}}>{p}</p>)}</div>}
  </div>;
}

/* =================== TIRA-DUVIDA (IA por assunto) =================== */
function TiraDuvida({tema,contexto}){
  const [q,setQ]=useState("");
  const [msgs,setMsgs]=useState([]); // {quem:'voce'|'ia', txt}
  const [busy,setBusy]=useState(false);
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const perguntar=async()=>{
    const pergunta=q.trim();
    if(!pergunta)return;
    setMsgs(m=>[...m,{quem:"voce",txt:pergunta}]);
    setQ("");setBusy(true);
    try{
      if(!workerOk) throw new Error("O tira-dúvida por IA fica disponível quando o app estiver publicado com o Worker.");
      const r=await fetch(WORKER_URL+"/tirar-duvida",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tema,contexto,pergunta})});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao responder.");
      setMsgs(m=>[...m,{quem:"ia",txt:d.resposta||"Sem resposta."}]);
    }catch(e){ setMsgs(m=>[...m,{quem:"ia",txt:e.message}]); }
    setBusy(false);
  };
  return <div className="block b-mne" style={{marginTop:10}}>
    <b>Não entendeu algo? Pergunte</b>
    <div className="muted" style={{fontSize:12,margin:"4px 0 10px"}}>A IA explica no seu nível, sobre {tema.toLowerCase()}.</div>
    {msgs.map((m,i)=><div key={i} style={{marginBottom:8}}>
      <div className="muted" style={{fontSize:11}}>{m.quem==="voce"?"Você":"Explicação"}</div>
      <div style={{fontSize:14,lineHeight:1.55}}>{m.txt}</div>
    </div>)}
    <div className="row" style={{marginTop:6}}>
      <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&perguntar()} placeholder="Ex.: por que o pulmão compensa mais rápido que o rim?" style={{flex:1}}/>
      <button className="btn sm" disabled={busy||!q.trim()} onClick={perguntar}>{busy?"...":"Perguntar"}</button>
    </div>
  </div>;
}

/* =================== GERAR QUESTAO (IA, estilo INEP) =================== */
function GerarQuestao({uid,onSalvar}){
  const [area,setArea]=useState("CM");
  const [tema,setTema]=useState("");
  const [q,setQ]=useState(null);
  const [sel,setSel]=useState(null);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const [salvou,setSalvou]=useState(false);
  const workerOk=!WORKER_URL.startsWith("COLE_");
  const L=["A","B","C","D","E"];
  const gerar=async()=>{
    if(!workerOk){setMsg("Disponível quando o app estiver publicado com o Worker.");return;}
    setBusy(true);setMsg("");setQ(null);setSel(null);setSalvou(false);
    try{
      const r=await fetch(WORKER_URL+"/gerar-questao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({area,tema})});
      const d=await r.json();
      if(!r.ok||d.error||!d.questao) throw new Error(typeof d.error==="string"?d.error:"Falha ao gerar.");
      setQ(d.questao);
    }catch(e){setMsg(e.message);}
    setBusy(false);
  };
  const salvar=async()=>{
    if(!q)return;
    const id="ai"+Date.now();
    const row={id,area:q.area||area,tema:q.tema||tema||"Gerada por IA",transv:q.transv||[],dificuldade:2,
      enunciado:q.enunciado,alternativas:q.alternativas,correta:q.correta,comentario:q.comentario||"",premium:true};
    const {error}=await sb.from("questoes").insert(row);
    if(error){setMsg("Para salvar no banco, seu perfil precisa ser admin. Erro: "+error.message);return;}
    onSalvar({id,area:row.area,tema:row.tema,transv:row.transv,dif:2,enun:row.enunciado,alts:row.alternativas,correta:row.correta,coment:row.comentario,premium:true});
    setSalvou(true);
  };
  return <div>
    <div className="card">
      <h3 style={{fontSize:17,marginBottom:6}}>Gerar questão no estilo INEP</h3>
      <div className="muted" style={{fontSize:13,marginBottom:12,lineHeight:1.5}}>
        Questões inéditas no padrão <b>ENAMED / Revalida / ENARE</b>: caso clínico no SUS, conduta por protocolo, com a pegadinha típica da banca.
      </div>
      <div className="row" style={{gap:10}}>
        <select value={area} onChange={e=>setArea(e.target.value)} style={{maxWidth:220}}>
          {AREAS.map(a=><option key={a.k} value={a.k}>{a.nome}</option>)}
        </select>
        <input value={tema} onChange={e=>setTema(e.target.value)} placeholder="Tema (opcional): ex. dengue, HPP, sepse" style={{flex:1}}/>
      </div>
      {msg && <div className="muted" style={{fontSize:13,marginTop:10,color:"var(--warn)"}}>{msg}</div>}
      <div className="row" style={{marginTop:14}}><button className="btn" disabled={busy} onClick={gerar}>{busy?"Gerando...":"Gerar questão"}</button></div>
    </div>

    {q && <div className="card" style={{marginTop:16}}>
      <div className="row" style={{gap:8,marginBottom:8}}>
        <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)"}}>{areaNome(q.area||area)}</span>
        {q.tema && <span className="pill">{q.tema}</span>}
        {(q.transv||[]).map(t=><span key={t} className="pill" style={{color:"var(--acc2)"}}>{t}</span>)}
      </div>
      <div style={{fontSize:15.5,lineHeight:1.6,marginBottom:6}}>{q.enunciado}</div>
      {q.alternativas.map((a,i)=>{let c="alt";if(sel!==null){if(i===q.correta)c+=" correct";else if(i===sel)c+=" wrong";else c+=" dim";}
        return <button key={i} className={c} disabled={sel!==null} onClick={()=>setSel(i)}><b style={{color:"var(--muted)",marginRight:8}}>{L[i]}</b>{a}</button>;})}
      {sel!==null && <div className="comment"><b style={{color:sel===q.correta?"var(--acc)":"var(--bad)"}}>{sel===q.correta?"Correto. ":"Incorreto. "}</b>{q.comentario}</div>}
      <div className="row" style={{marginTop:14}}>
        <button className="btn ghost sm" onClick={gerar}>Gerar outra</button>
        <button className="btn sm" disabled={salvou} onClick={salvar}>{salvou?"Salva no banco ✓":"Salvar no meu banco"}</button>
      </div>
      <div className="muted" style={{fontSize:11,marginTop:10}}>Questão gerada por IA. Revise antes de usar em avaliação real.</div>
    </div>}
  </div>;
}

/* =================== RESOLVER QUESTAO (IA / visao) =================== */
function Resolver({isPro,onAssinar}){
  const [imgs,setImgs]=useState([]); // dataURLs
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);
  const [msg,setMsg]=useState("");
  const workerOk=!WORKER_URL.startsWith("COLE_");

  const addFiles=async(fileList)=>{
    setMsg("");
    const files=Array.from(fileList).slice(0,2-imgs.length);
    if(files.length===0){setMsg("Maximo de 2 imagens por vez.");return;}
    for(const f of files){
      if(!/^image\//.test(f.type)){setMsg("Envie apenas imagens (foto ou print).");continue;}
      const dataUrl=await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=err;r.readAsDataURL(f);});
      setImgs(prev=>prev.length<2?[...prev,dataUrl]:prev);
    }
  };
  const remover=i=>setImgs(prev=>prev.filter((_,idx)=>idx!==i));

  const resolver=async()=>{
    if(!workerOk){setMsg("Falta configurar a WORKER_URL no topo do arquivo.");return;}
    if(imgs.length===0){setMsg("Adicione ao menos 1 imagem.");return;}
    setBusy(true);setRes(null);setMsg("");
    try{
      const r=await fetch(WORKER_URL+"/resolver-questao",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imagens:imgs})});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao resolver.");
      setRes(d);
    }catch(e){setMsg(e.message);}
    setBusy(false);
  };

  if(!isPro) return <div className="lock" style={{textAlign:"left"}}>
    <b>Resolver questão por foto é um recurso PRO.</b>
    <div className="muted" style={{fontSize:13,margin:"8px 0 12px"}}>Fotografe ou printe qualquer questão (até 2 imagens) e receba a alternativa correta com comentário no estilo da banca.</div>
    <button className="btn" onClick={onAssinar}>Assinar para liberar</button>
  </div>;

  return <div>
    <div className="card">
      <h3 style={{fontSize:17,marginBottom:6}}>Resolver questão por imagem</h3>
      <div className="muted" style={{fontSize:13,marginBottom:12,lineHeight:1.5}}>
        Envie até <b>2 imagens</b> (foto ou print) de UMA questão. A IA devolve a alternativa correta, o comentário e a pegadinha. Ferramenta de estudo pessoal.
      </div>

      <div className="row" style={{gap:10}}>
        <label className="btn ghost" style={{margin:0}}>Adicionar imagem
          <input type="file" accept="image/*" multiple onChange={e=>addFiles(e.target.files)} style={{display:"none"}}/></label>
        <span className="muted" style={{fontSize:12}}>{imgs.length}/2</span>
      </div>

      {imgs.length>0 && <div className="row" style={{marginTop:12,gap:10}}>
        {imgs.map((src,i)=><div key={i} style={{position:"relative"}}>
          <img src={src} alt={"img"+i} style={{width:130,height:130,objectFit:"cover",borderRadius:10,border:"1px solid var(--line)"}}/>
          <button onClick={()=>remover(i)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.6)",color:"#fff",border:"none",borderRadius:99,width:24,height:24,cursor:"pointer"}}>x</button>
        </div>)}
      </div>}

      {msg && <div className="muted" style={{fontSize:13,marginTop:10,color:"var(--warn)"}}>{msg}</div>}

      <div className="row" style={{marginTop:14}}>
        <button className="btn" disabled={busy||imgs.length===0} onClick={resolver}>{busy?"Analisando...":"Resolver"}</button>
        {imgs.length>0 && <button className="btn ghost sm" onClick={()=>{setImgs([]);setRes(null);}}>Limpar</button>}
      </div>
    </div>

    {res && <div className="card" style={{marginTop:16}}>
      <div className="row" style={{gap:10,marginBottom:6}}>
        <span className="pill" style={{color:"var(--acc)",borderColor:"var(--acc)",fontSize:16,padding:"6px 14px"}}>Resposta: {res.alternativa||"?"}</span>
        {res.tema && <span className="pill">{res.tema}</span>}
      </div>
      {res.explicacao && <div className="comment" style={{marginTop:10}}><b>Por quê:</b> {res.explicacao}</div>}
      {res.pegadinha && <div className="block b-pega"><b>Pegadinha:</b> {res.pegadinha}</div>}
      {Array.isArray(res.erros) && res.erros.length>0 && <div className="block b-metodo">
        <b>Por que as outras estão erradas:</b>
        <ul style={{margin:"6px 0 0 18px",padding:0}}>{res.erros.map((e,i)=><li key={i} style={{marginBottom:4}}><b>{e.letra}:</b> {e.motivo}</li>)}</ul>
      </div>}
      <div className="muted" style={{fontSize:11,marginTop:12}}>Resposta gerada por IA para seu estudo. Confira sempre com a fonte oficial.</div>
    </div>}
  </div>;
}

/* =================== ASSINAR (checkout Pix) =================== */
function Assinar({uid,email,onClose,onVerificar}){
  const [etapa,setEtapa]=useState("plano"); // plano | carregando | pix | sucesso | erro
  const [pix,setPix]=useState(null);
  const [msg,setMsg]=useState("");
  const [copiado,setCopiado]=useState(false);
  const pollRef=React.useRef(null);
  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current);},[]);

  const workerOk = !WORKER_URL.startsWith("COLE_");

  const criar=async(plano)=>{
    if(!workerOk){setMsg("Falta configurar a WORKER_URL no topo do arquivo.");setEtapa("erro");return;}
    setEtapa("carregando");
    try{
      const r=await fetch(WORKER_URL+"/criar-pix",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid,email,plano})});
      const d=await r.json();
      if(!r.ok||d.error) throw new Error(typeof d.error==="string"?d.error:"Falha ao gerar o Pix. Confira o Worker.");
      setPix(d);setEtapa("pix");
      pollRef.current=setInterval(async()=>{const ok=await onVerificar();if(ok){clearInterval(pollRef.current);setEtapa("sucesso");}},5000);
    }catch(e){setMsg(e.message);setEtapa("erro");}
  };
  const copiar=()=>{if(pix&&pix.qr_code){navigator.clipboard.writeText(pix.qr_code);setCopiado(true);setTimeout(()=>setCopiado(false),1500);}};
  const verificarAgora=async()=>{const ok=await onVerificar();if(ok){if(pollRef.current)clearInterval(pollRef.current);setEtapa("sucesso");}};

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:18,zIndex:50};
  return <div style={overlay} onClick={onClose}>
    <div className="card" style={{maxWidth:420,width:"100%"}} onClick={e=>e.stopPropagation()}>
      <div className="row" style={{justifyContent:"space-between",marginBottom:6}}>
        <h3 style={{fontSize:18}}>Assinar</h3><span className="link" onClick={onClose}>fechar</span>
      </div>

      {etapa==="plano" && <div>
        <div className="muted" style={{fontSize:14,marginBottom:14}}>Pagamento por Pix. Acesso liberado na hora após a confirmação.</div>

        <div className="card" style={{background:"linear-gradient(135deg,#123528,#16302b)",border:"1px solid var(--gold)",marginBottom:12,position:"relative"}}>
          <span className="pill" style={{position:"absolute",top:-10,right:14,color:"#04120c",background:"var(--gold)",borderColor:"var(--gold)"}}>MAIS ESCOLHIDO</span>
          <b style={{fontSize:16}}>Combo até o ENAMED</b>
          <div style={{fontSize:26,fontWeight:800,letterSpacing:"-.02em",margin:"4px 0 0"}}>R$ 39<span style={{fontSize:13,fontWeight:600,color:"var(--muted)"}}> pagamento único</span></div>
          <div className="muted" style={{fontSize:13,margin:"2px 0 4px"}}>Acesso a tudo até a prova (13/09/2026). Sem mensalidade.</div>
          <div style={{fontSize:12,color:"var(--acc)",marginBottom:10}}>Menos que um lanche para organizar sua reta final.</div>
          <button className="btn" style={{width:"100%"}} onClick={()=>criar("combo_enamed")}>Assinar o Combo (Pix)</button>
        </div>

        <div style={{textAlign:"center",fontSize:12}} className="muted">ou, se preferir testar mês a mês</div>
        <div className="card" style={{background:"var(--panel2)",marginTop:10}}>
          <div className="row" style={{justifyContent:"space-between"}}>
            <div><b style={{fontSize:14}}>Mensal — R$ 19</b><div className="muted" style={{fontSize:12,marginTop:2}}>Acesso completo por 30 dias.</div></div>
            <button className="btn ghost sm" onClick={()=>criar("pro_mensal")}>Pix mensal</button>
          </div>
        </div>
      </div>}

      {etapa==="carregando" && <div className="muted" style={{padding:"20px 0",textAlign:"center"}}>Gerando cobrança Pix...</div>}

      {etapa==="pix" && pix && <div style={{textAlign:"center"}}>
        <div className="muted" style={{fontSize:13,marginBottom:10}}>Escaneie o QR ou use o copia-e-cola. A liberação é automática.</div>
        {pix.qr_code_base64 && <img alt="QR Pix" src={"data:image/png;base64,"+pix.qr_code_base64} style={{width:200,height:200,borderRadius:10,background:"#fff",padding:6}}/>}
        <div style={{marginTop:12}}><button className="btn ghost sm" onClick={copiar}>{copiado?"Copiado!":"Copiar código Pix"}</button></div>
        <div className="muted" style={{fontSize:12,marginTop:14}}>Aguardando pagamento...</div>
        <div style={{marginTop:8}}><button className="btn sm" onClick={verificarAgora}>Já paguei — verificar</button></div>
      </div>}

      {etapa==="sucesso" && <div style={{textAlign:"center",padding:"10px 0"}}>
        <div className="kpi" style={{color:"var(--acc)"}}>PRO ativo!</div>
        <div className="muted" style={{fontSize:14,margin:"8px 0 16px"}}>Tudo liberado. Bons estudos.</div>
        <button className="btn" onClick={onClose}>Começar</button>
      </div>}

      {etapa==="erro" && <div style={{textAlign:"center",padding:"10px 0"}}>
        <div style={{color:"var(--bad)",fontSize:14,marginBottom:14}}>{msg}</div>
        <button className="btn ghost" onClick={()=>setEtapa("plano")}>Tentar de novo</button>
      </div>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
