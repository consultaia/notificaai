function SAQDashboardView({sbUrl,sbKey,hospital,showToast}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [respostas,setRespostas]=useState([]);
  const [loading,setLoading]=useState(false);
  const [ciclo,setCiclo]=useState(saqCicloAtual());
  const N_MIN=5;

  const load=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{
      const d=await sbSelect(sbUrl,sbKey,'saq_respostas',`hospital_id=eq.${h.id}&select=*`);
      setRespostas(d||[]);
    }catch{setRespostas([]);}
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey]);

  const calcDominios=(lista)=>SAQ_DOMINIOS.map(dom=>{
    let soma=0,n=0;
    lista.forEach(r=>{
      dom.itens.forEach((item,i)=>{
        const raw=r.respostas?.[dom.id+'_'+i];
        if(raw!==undefined&&raw!==null){
          const v=item.inv?(4-raw):raw;
          soma+=v;n++;
        }
      });
    });
    if(n===0) return{...dom,pct:null};
    return{...dom,pct:Math.round((soma/n/4)*100)};
  });
  const scoreDe=(doms)=>doms.every(d=>d.pct!==null)?Math.round(doms.reduce((a,d)=>a+d.pct,0)/doms.length):null;

  const doCiclo=respostas.filter(r=>r.ciclo===ciclo);
  const dominiosGeral=calcDominios(doCiclo);
  const scoreGeral=scoreDe(dominiosGeral);

  const porSetor=h.sectors.map(s=>{
    const lista=doCiclo.filter(r=>r.setor===s);
    const doms=lista.length>=N_MIN?calcDominios(lista):null;
    return{setor:s,n:lista.length,score:doms?scoreDe(doms):null};
  }).sort((a,b)=>b.n-a.n);

  const ciclosComDados=[...new Set(respostas.map(r=>r.ciclo))];
  const ciclosSelecionaveis=[...new Set([...ciclosComDados,saqCicloAtual()])].sort().reverse();
  const tendencia=[...ciclosComDados].sort().map(c=>{
    const lista=respostas.filter(r=>r.ciclo===c);
    return{ciclo:c,n:lista.length,score:scoreDe(calcDominios(lista))||0};
  });

  const corScore=(v)=>v===null?C.muted:v>=75?C.green:v>=60?C.yellow:C.red;

  return(<div style={{padding:'20px 16px',display:'flex',flexDirection:'column',gap:14,paddingBottom:80}}>
    <div>
      <div style={{fontSize:17,fontWeight:900,color:C.text}}>Cultura de Seguranca</div>
      <div style={{fontSize:11,color:C.muted}}>SAQ - Safety Attitudes Questionnaire (Sexton et al., 2006) · respostas anonimas</div>
    </div>

    <div style={{display:'flex',gap:8,alignItems:'center'}}>
      <label style={{fontSize:11,color:C.muted,fontWeight:700}}>Ciclo:</label>
      <select value={ciclo} onChange={e=>setCiclo(e.target.value)} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none',appearance:'none'}}>
        {ciclosSelecionaveis.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
      <button onClick={load} style={{marginLeft:'auto',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>
    </div>

    {loading&&<div style={{textAlign:'center',color:C.muted,padding:20}}><Dots/></div>}

    {!loading&&doCiclo.length===0&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:20,textAlign:'center'}}>
      <div style={{fontSize:13,color:C.muted,lineHeight:1.7}}>Ainda nao ha respostas para este ciclo.<br/>Divulgue o link publico da pesquisa para a equipe (aba "Cultura" no menu publico, ou um QR code afixado no setor).</div>
    </div>}

    {!loading&&doCiclo.length>0&&<>
      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16,display:'flex',alignItems:'center',gap:16}}>
        <div style={{textAlign:'center',flexShrink:0}}>
          <div style={{fontSize:36,fontWeight:900,color:corScore(scoreGeral)}}>{scoreGeral??'-'}</div>
          <div style={{fontSize:9,color:C.muted,fontWeight:700}}>pts / 100</div>
        </div>
        <div>
          <div style={{fontSize:14,fontWeight:800,color:corScore(scoreGeral)}}>{scoreGeral===null?'Aguardando mais respostas':scoreGeral>=75?'Cultura positiva de seguranca':scoreGeral>=60?'Em desenvolvimento':'Necessita intervencao'}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:2}}>{doCiclo.length} resposta(s) neste ciclo · corte de positividade: 75 pts</div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {dominiosGeral.map(dom=>(
          <div key={dom.id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 12px'}}>
            <div style={{fontSize:11,fontWeight:700,color:dom.cor,marginBottom:6}}>{dom.label}</div>
            {dom.pct!==null?<div>
              <div style={{fontSize:18,fontWeight:900,color:dom.cor}}>{dom.pct}<span style={{fontSize:10,color:C.muted}}> pts</span></div>
              <div style={{height:4,background:C.border,borderRadius:2,marginTop:6,overflow:'hidden'}}>
                <div style={{width:dom.pct+'%',height:'100%',background:dom.cor,borderRadius:2}}/>
              </div>
            </div>:<div style={{fontSize:10,color:C.muted}}>Sem dados</div>}
          </div>
        ))}
      </div>

      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Por setor</div>
        {porSetor.map(p=>(
          <div key={p.setor} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid '+C.border+'33'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:600,color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.setor}</div>
              <div style={{fontSize:10,color:C.muted}}>{p.n} resposta(s){p.n>0&&p.n<N_MIN?' · abaixo do minimo para exibir':''}</div>
            </div>
            {p.score!==null?
              <div style={{fontSize:16,fontWeight:900,color:corScore(p.score),flexShrink:0}}>{p.score}</div>
              :<div style={{fontSize:10,color:C.muted,flexShrink:0}}>—</div>}
          </div>
        ))}
        <div style={{fontSize:10,color:C.muted,marginTop:10,lineHeight:1.5}}>Por protecao ao anonimato, setores com menos de {N_MIN} respostas nao exibem score individual.</div>
      </div>

      {tendencia.length>1&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Evolucao entre ciclos</div>
        <BarChart data={tendencia} xKey="ciclo" yKey="score" color={C.teal} height={140}/>
      </div>}
    </>}
  </div>);
}


function AnalyticsView({sbUrl,sbKey,showToast,profileMode,hospital}) {
  const [tab,setTab]=useState('graficos');
  const [narrative,setNarrative]=useState('');
  const [loadingNarr,setLoadingNarr]=useState(false);
  const [stats,setStats]=useState(null);
  const [rawData,setRawData]=useState([]);
  const [showRelatorio,setShowRelatorio]=useState(false);
  const [gerandoPPT,setGerandoPPT]=useState(false);
  const [mesPPT,setMesPPT]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});
  const [analyticsExtra,setAnalyticsExtra]=useState({treins:[],prots:[],saq:[],planos:[]});
  const hoje2=new Date();
  const mesAtual=hoje2.toLocaleDateString('pt-BR',{month:'long'});
  const [dateFrom,setDateFrom]=useState(()=>{const d=new Date();d.setDate(1);return d.toISOString().slice(0,10);});
  const [dateTo,setDateTo]=useState(()=>new Date().toISOString().slice(0,10));

  useEffect(()=>{
    if(!sbUrl||!sbKey) return;
    const hid=(hospital||DEFAULT_HOSPITAL).id;
      Promise.all([
        sbSelect(sbUrl,sbKey,'notifications',`hospital_id=eq.${hid}&is_test=neq.true&order=created_at.desc&limit=2000&select=*`),
        sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${hid}&select=*`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${hid}&select=*`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'saq_respostas',`hospital_id=eq.${hid}&select=*`).catch(()=>[]),
        sbSelect(sbUrl,sbKey,'plano_acoes',`hospital_id=eq.${hid}&select=*`).catch(()=>[]),
      ]).then(([data,treinsAn,protsAn,saqAn,planosAn])=>{setStats(computeStats(data));setRawData(data||[]);setAnalyticsExtra({treins:treinsAn||[],prots:protsAn||[],saq:saqAn||[],planos:planosAn||[]});})
      .catch(()=>showToast('Erro ao carregar analytics','error'));
  },[sbUrl,sbKey]);

  const [gerandoInst,setGerandoInst]=useState(false);
  const gerarApresentacaoInstitucional=async()=>{
    if(!window.PptxGenJS){showToast('PptxGenJS carregando, tente em 3s','error');return;}
    setGerandoInst(true);
    try{
      const top=B64_FAIXA_TOPO_INST, bot=B64_FAIXA_BASE_INST;
      const C2={navy:'000066',teal:'FFCC00',tealDk:'BF8D07',tableHead:'B4C7DC',blue:'1D6FE8',purple:'7C3AED',red:'E53E3E',yellow:'D97706',green:'059669',gray:'64748B',white:'FFFFFF'};
      const pres=new window.PptxGenJS();
      pres.layout='LAYOUT_16x9';
      const fundo=(sl)=>{
        sl.addImage({data:'data:image/png;base64,'+top,x:0,y:0,w:10,h:1.4874});
        sl.addImage({data:'data:image/png;base64,'+bot,x:0,y:4.7607,w:10,h:0.8636});
      };
      const h=hospital||DEFAULT_HOSPITAL;

      // Dados rapidos reais, para dar credibilidade ao "por que importa"
      let resumo={notif:0,protocolos:0,subnucleos:SUBNUCLEOS_HNSA.length,treinos:0};
      try{
        const [n,p,t]=await Promise.all([
          sbSelect(sbUrl,sbKey,'notifications',`hospital_id=eq.${h.id}&is_test=neq.true&select=id`).catch(()=>[]),
          sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&select=id`).catch(()=>[]),
          sbSelect(sbUrl,sbKey,'treinamentos_nsp',`hospital_id=eq.${h.id}&select=id`).catch(()=>[]),
        ]);
        resumo={notif:(n||[]).length,protocolos:(p||[]).length,subnucleos:SUBNUCLEOS_HNSA.length,treinos:(t||[]).length};
      }catch(e){}

      // 1. Capa
      let sl=pres.addSlide();
      sl.background={color:C2.navy};
      sl.addText('NotificaAI',{x:0.6,y:1.7,w:8.8,h:1,fontSize:44,bold:true,color:C2.white,margin:0});
      sl.addText('Sistema de Notificacao e Gestao de Seguranca do Paciente',{x:0.6,y:2.6,w:8.8,h:0.5,fontSize:16,color:C2.teal,margin:0});
      sl.addText(h.name||h.short_name||'',{x:0.6,y:3.1,w:8.8,h:0.4,fontSize:13,color:'C8D8E8',margin:0});
      sl.addText('Apresentacao institucional  ·  '+new Date().toLocaleDateString('pt-BR'),{x:0.6,y:4.9,w:8.8,h:0.35,fontSize:10,color:'8FA5C0',margin:0});

      // 2. O que e
      sl=pres.addSlide();
      sl.background={color:C2.white};
      fundo(sl);
      sl.addText('O que e o NotificaAI',{x:0.5,y:1.53,w:9,h:0.35,fontSize:16,bold:true,color:C2.navy,valign:'middle',margin:0});
      const oque=[
        'Plataforma digital para notificacao, analise e gestao de eventos de seguranca do paciente e ocorrencias administrativas.',
        'Substitui o registro em papel: qualquer profissional notifica em minutos, por um chat guiado, direto do celular ou computador.',
        'Organiza o trabalho do Nucleo de Seguranca do Paciente (NSP) por subnucleo, com indicadores, protocolos e treinamentos centralizados.',
        'Gera automaticamente os documentos exigidos por avaliacoes regulatorias (DSM/ANVISA, acreditacao ONA e correlatos).',
      ];
      oque.forEach((t,i)=>{
        const y=1.95+i*0.62;
        sl.addShape(pres.shapes.OVAL,{x:0.5,y:y+0.05,w:0.12,h:0.12,fill:{color:C2.teal}});
        sl.addText(t,{x:0.78,y,w:8.7,h:0.58,fontSize:11.5,color:'1E293B',valign:'top',margin:0});
      });

      // 3. Funcionalidades (tabela, mesmo estilo da tabela do congresso)
      sl=pres.addSlide();
      sl.background={color:C2.white};
      fundo(sl);
      sl.addText('Funcionalidades Principais',{x:0.5,y:1.53,w:9,h:0.33,fontSize:15,bold:true,color:C2.navy,valign:'middle',margin:0});
      const mods=[
        ['Notificacoes','Chat guiado por IA, classificacao automatica, geracao de RCA e ficha Notivisa'],
        ['Indicadores','Taxas por setor, dados mensais DSM e checklist de conformidade ANVISA'],
        ['Protocolos','Controle de vigencia (3 anos), documentos anexados, alerta de vencimento'],
        ['Treinamentos','Registro por subnucleo com lista de presenca anexada'],
        ['DSM / ANVISA','Relatorio semestral, Excel oficial da Circular 24/2023 pre-preenchido'],
        ['Auditar','Pacotes de evidencia em PPT, PDF e ZIP para auditoria e acreditacao'],
        ['Analytics','Graficos, mapa de calor, analise mensal com IA'],
        ['Pesquisa','Cultura de seguranca (HSOPSC) com dashboard de resultados'],
      ];
      const mRows=[[{text:'Modulo',options:{bold:true,color:C2.navy,fill:{color:C2.tableHead},fontSize:9.5}},{text:'O que faz',options:{bold:true,color:C2.navy,fill:{color:C2.tableHead},fontSize:9.5}}]];
      mods.forEach(([m,d],i)=>mRows.push([{text:m,options:{fontSize:9,bold:true,fill:{color:i%2?'F8FAFC':'FFFFFF'}}},{text:d,options:{fontSize:8.5,fill:{color:i%2?'F8FAFC':'FFFFFF'}}}]));
      sl.addTable(mRows,{x:0.5,y:1.95,w:9,colW:[1.9,7.1],border:{pt:0.5,color:'E2E8F0'},rowH:0.32,fontFace:'Calibri',valign:'middle'});

      // 4. Por que importa
      sl=pres.addSlide();
      sl.background={color:C2.white};
      fundo(sl);
      sl.addText('Por que o NotificaAI importa',{x:0.5,y:1.53,w:9,h:0.33,fontSize:15,bold:true,color:C2.navy,valign:'middle',margin:0});
      const pilares=[
        ['Seguranca do Paciente',C2.red,'Reduz o tempo entre o evento e a acao corretiva; RCA e planos de acao ficam rastreados do inicio ao fim.'],
        ['Conformidade Regulatoria',C2.blue,'Mantem o hospital pronto para avaliacoes ANVISA/DSM, com documentos sempre atualizados.'],
        ['Cultura de Notificacao',C2.green,'Facilita notificar, o que aumenta o volume de registros e reduz o medo de punicao.'],
        ['Decisao Baseada em Dados',C2.purple,'Indicadores por setor e subnucleo mostram onde agir primeiro, com evidencia, nao intuicao.'],
      ];
      pilares.forEach(([t,c,d],i)=>{
        const col=i%2, row=Math.floor(i/2);
        const x=0.5+col*4.6, y=1.98+row*1.32;
        sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x,y,w:4.35,h:1.18,fill:{color:c,transparency:92},rectRadius:0.08,line:{color:c,width:1.3}});
        sl.addShape(pres.shapes.RECTANGLE,{x,y,w:0.08,h:1.18,fill:{color:c}});
        sl.addText(t,{x:x+0.2,y:y+0.08,w:4.0,h:0.28,fontSize:11.5,bold:true,color:c,margin:0});
        sl.addText(d,{x:x+0.2,y:y+0.38,w:4.0,h:0.75,fontSize:8.8,color:'334155',valign:'top',margin:0});
      });

      // 5. O sistema em numeros (dado real)
      sl=pres.addSlide();
      sl.background={color:C2.white};
      fundo(sl);
      sl.addText('O Sistema em Numeros',{x:0.5,y:1.53,w:9,h:0.33,fontSize:15,bold:true,color:C2.navy,valign:'middle',margin:0});
      const nums=[
        [resumo.notif,'Notificacoes registradas',C2.navy],
        [resumo.subnucleos,'Subnucleos ativos do NSP',C2.teal.replace('FFCC00','BF8D07')],
        [resumo.protocolos,'Protocolos institucionais',C2.blue],
        [resumo.treinos,'Treinamentos e reunioes',C2.green],
      ];
      nums.forEach(([n,l,c],i)=>{
        const x=0.5+i*2.28;
        sl.addShape(pres.shapes.ROUNDED_RECTANGLE,{x,y:2.0,w:2.1,h:1.5,fill:{color:'FFFFFF'},rectRadius:0.1,line:{color:c,width:1.5},shadow:{type:'outer',blur:4,offset:1,angle:90,color:'CBD5E1',opacity:0.4}});
        sl.addText(String(n),{x,y:2.15,w:2.1,h:0.7,fontSize:32,bold:true,color:c,align:'center',margin:0});
        sl.addText(l,{x:x+0.1,y:2.85,w:1.9,h:0.55,fontSize:9,color:'334155',align:'center',valign:'top',margin:0});
      });
      sl.addText('Numeros acumulados no sistema ate a data desta apresentacao.',{x:0.5,y:3.75,w:9,h:0.3,fontSize:8.5,italic:true,color:'64748B',margin:0});
      sl.addText('Desenvolvido internamente para uso do Nucleo de Seguranca do Paciente.',{x:0.5,y:4.15,w:9,h:0.3,fontSize:9,color:'334155',margin:0});

      await pres.writeFile({fileName:'NotificaAI_Apresentacao_'+(h.short_name||'NSP')+'.pptx'});
      showToast('Apresentacao institucional gerada!','success');
    }catch(e){showToast('Erro ao gerar apresentacao: '+e.message,'error');}
    setGerandoInst(false);
  };

  recebido:{label:'Recebido',color:'#1D6FE8',bg:'#1D6FE822'},
  em_andamento:{label:'Em andamento',color:'#00C9B8',bg:'#00C9B822'},

function TicketForm({sbUrl,sbKey,hospital,showToast,onBack}) {
  const [step,setStep]=useState('type');
  const [type,setType]=useState(null);
  const [form,setForm]=useState({sector:'',responsavel:'',description:'',priority:'normal',patient_name:'',destination:'',scheduled_at:'',requester_name:''});
  const [saving,setSaving]=useState(false);
  const h=hospital||DEFAULT_HOSPITAL;
  const tt=TICKET_TYPES.find(t=>t.id===type)||TICKET_TYPES[0];

  const submit=async()=>{
    if(!form.description.trim()){showToast('Descreva o chamado','error');return;}
    setSaving(true);
    try {
      const payload={hospital_id:h.id,ticket_type:type,responsavel:form.responsavel||null,origin_sector:form.sector,description:form.description,priority:form.priority,patient_name:form.patient_name||null,requester_name:form.requester_name||null,destination_sector:tt?.dest||null,scheduled_at:form.scheduled_at||null,status:'aberto',opened_at:new Date().toISOString()};
      if(sbUrl&&sbKey) await sbInsert(sbUrl,sbKey,'tickets',payload);
      showToast('OK Chamado aberto! '+tt?.dest+' foi notificado.','success');
      setStep('done');
    } catch(e) { showToast('Erro: '+e.message,'error'); }
    setSaving(false);
  };

  const inp={background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'11px 14px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:12};
  const lbl={fontSize:11,color:C.muted,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:6};

  if(step==='done') return(<div style={{padding:32,textAlign:'center'}}>
    <div style={{fontSize:52,marginBottom:14}}>OK</div>
    <div style={{fontSize:18,fontWeight:900,color:C.text,marginBottom:8}}>Chamado aberto!</div>
    <div style={{fontSize:14,color:C.muted,marginBottom:24}}>{tt?.dest} foi notificado.</div>
    <button onClick={onBack} style={{background:C.teal,border:'none',borderRadius:12,padding:'12px 28px',color:'#06101F',fontWeight:800,fontSize:14,cursor:'pointer'}}>Ver chamados</button>
  </div>);

  if(step==='type') return(<div style={{padding:'20px 16px'}}>
    {onBack&&<button onClick={onBack} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:16}}>←</button>}
    <div style={{fontSize:17,fontWeight:900,color:C.text,marginBottom:4}}>Novo Chamado</div>
    <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Qual o tipo de chamado?</div>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {TICKET_TYPES.map(t=>(
        <button key={t.id} onClick={()=>{setType(t.id);setStep('form');}} style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:'14px 16px',display:'flex',alignItems:'center',gap:14,cursor:'pointer',textAlign:'left'}}>
          <div style={{width:44,height:44,borderRadius:12,background:t.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{ticketEmoji(t.icon)}</div>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:C.text}}>{t.label}</div><div style={{fontSize:11,color:C.muted}}> {t.dest} · {t.desc}</div></div>
        </button>
      ))}
    </div>
  </div>);

  return(<div style={{padding:'20px 16px'}}>
    <button onClick={()=>setStep('type')} style={{background:'none',border:'none',color:C.teal,cursor:'pointer',fontSize:22,marginBottom:8}}>←</button>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
      <div style={{width:44,height:44,borderRadius:12,background:tt?.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>{ticketEmoji(tt?.icon)}</div>
      <div><div style={{fontSize:16,fontWeight:800,color:C.text}}>{tt?.label}</div><div style={{fontSize:11,color:C.muted}}>-> {tt?.dest}</div></div>
    </div>
    <label style={lbl}>Setor de origem</label>
    <select value={form.sector} onChange={e=>setForm({...form,sector:e.target.value})} style={{...inp,appearance:'none'}}>
      <option value="">Selecione o setor</option>
      {h.sectors.map(s=><option key={s} value={s}>{s}</option>)}
    </select>
    <label style={lbl}>Solicitante (opcional)</label>
    <input value={form.requester_name} onChange={e=>setForm({...form,requester_name:e.target.value})} placeholder="Nome" style={inp}/>
    {type==='transporte'&&<>
      <label style={lbl}>Nome do paciente</label>

      <input value={form.responsavel} onChange={e=>setForm({...form,responsavel:e.target.value})} placeholder="Ex: 1T Almeida, Enf. Costa..." style={{...inp,marginBottom:16}}/>

      {saving?'Aguarde Enviando...':`${ticketEmoji(tt?.icon)} Abrir para ${tt?.dest}`}

}

function TicketsList({sbUrl,sbKey,hospital,showToast,profileMode}) {
  const [tickets,setTickets]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filter,setFilter]=useState('todos');
  const [commenting,setCommenting]=useState(null);
  const [commentText,setCommentText]=useState('');
  const h=hospital||DEFAULT_HOSPITAL;
  const isDsg=profileMode==='dsg';
  const isMotorista=profileMode==='motorista';
  const isGestor=profileMode==='gestor';
  const canAct=isDsg||isMotorista||isGestor;

  const load=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try {
      let data=await sbSelect(sbUrl,sbKey,'tickets',`select=*&hospital_id=eq.${h.id}&order=opened_at.desc`);
      let r=data||[];
      if(isDsg) r=r.filter(t=>t.ticket_type==='manutencao');
      if(isMotorista) r=r.filter(t=>t.ticket_type==='ambulancia');
      setTickets(r);
    } catch { showToast('Erro ao carregar chamados','error'); }
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey,profileMode]);
  useEffect(()=>{
    if(!sbUrl||!sbKey||(!isDsg&&!isMotorista)||tickets.length===0) return;
    const toMark=tickets.filter(t=>t.status==='aberto');
    toMark.forEach(async t=>{try{await sbPatch(sbUrl,sbKey,'tickets',`id=eq.${t.id}`,{status:'visualizado',viewed_at:new Date().toISOString(),viewed_by:profileMode});}catch{}});
    if(toMark.length>0) setTickets(prev=>prev.map(t=>t.status==='aberto'?{...t,status:'visualizado'}:t));
  },[tickets.length,isDsg,isMotorista]);

  const updateStatus=async(ticket,newStatus,notes)=>{
    try {
      const patch={status:newStatus,responded_at:new Date().toISOString(),...(notes!==undefined?{response_notes:notes}:{}),...(newStatus==='concluido'?{closed_at:new Date().toISOString()}:{})};
      await sbPatch(sbUrl,sbKey,'tickets',`id=eq.${ticket.id}`,patch);
      setTickets(prev=>prev.map(t=>t.id===ticket.id?{...t,...patch}:t));
      setCommenting(null);setCommentText('');
      showToast({recebido:'? Recebido!',em_andamento:'Aguarde Em andamento!',concluido:'OK Concluído!',pendente:'ATENCAO Pendente'}[newStatus]||'Atualizado!','success');
    } catch { showToast('Erro ao atualizar','error'); }
  };

  const filtered=filter==='todos'?tickets:tickets.filter(t=>t.status===filter);
  const counts={aberto:tickets.filter(t=>t.status==='aberto').length,em_andamento:tickets.filter(t=>t.status==='em_andamento').length,pendente:tickets.filter(t=>['pendente','visualizado','recebido'].includes(t.status)).length};

  const renderActions=(ticket)=>{
    if(!canAct||ticket.status==='concluido') return null;
    const st=ticket.status;
    const isComm=commenting===ticket.id;
    if(isComm) return(<div style={{marginTop:8}}>
      <textarea value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="Comentário ou observação..." style={{width:'100%',background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'10px',color:C.text,fontSize:12,outline:'none',resize:'none',height:70,fontFamily:'inherit',marginBottom:8}}/>
      <div style={{display:'flex',gap:6}}>
        <button onClick={()=>{setCommenting(null);setCommentText('');}} style={{flex:1,background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'8px',color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Cancelar</button>
        <button onClick={()=>updateStatus(ticket,st,commentText)} style={{flex:2,background:C.teal,border:'none',borderRadius:8,padding:'8px',color:'#06101F',fontSize:11,fontWeight:800,cursor:'pointer'}}>Chat Salvar</button>
      </div>
    </div>);
    return(<div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
      <button onClick={()=>setCommenting(ticket.id)} style={{flex:1,minWidth:80,background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'8px',color:C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>Chat Comentar</button>
      {st==='visualizado'&&<button onClick={()=>updateStatus(ticket,'recebido')} style={{flex:1,minWidth:80,background:C.blue+'22',border:'1px solid '+C.blue+'44',borderRadius:8,padding:'8px',color:C.blue,fontSize:11,fontWeight:700,cursor:'pointer'}}> Recebido</button>}
      {st==='recebido'&&<button onClick={()=>updateStatus(ticket,'em_andamento')} style={{flex:1,minWidth:80,background:C.teal+'22',border:'1px solid '+C.teal+'44',borderRadius:8,padding:'8px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}> Andamento</button>}
      {(st==='em_andamento'||st==='recebido')&&<button onClick={()=>updateStatus(ticket,'concluido')} style={{flex:1,minWidth:80,background:C.green+'22',border:'1px solid '+C.green+'44',borderRadius:8,padding:'8px',color:C.green,fontSize:11,fontWeight:700,cursor:'pointer'}}>Ok Concluído</button>}
    </div>);
  };

  if(!profileMode) return(<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'calc(100vh - 64px)',padding:32,textAlign:'center'}}>
    <div style={{fontSize:48,marginBottom:16}}></div>
    <div style={{fontSize:17,fontWeight:800,color:C.text,marginBottom:8}}>Acesso restrito</div>
    <div style={{fontSize:13,color:C.muted,maxWidth:260}}>Faça login para abrir ou visualizar chamados operacionais.</div>
  </div>);

  return(<div style={{padding:'0 0 80px',maxWidth:900,margin:'0 auto'}}>
    {/* Modal de edicao */}
    <BackHeader title='Chamados' subtitle={filtered.length+' chamado(s)'} right={<button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'16px'}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
      {[['aberto','Abertos',C.yellow],['em_andamento','Andamento',C.blue],['pendente','Pendentes',C.red]].map(([id,label,color])=>(
        <div key={id} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 8px',textAlign:'center'}}>
          <div style={{fontSize:22,fontWeight:900,color}}>{counts[id]||0}</div>
          <div style={{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase'}}>{label}</div>
        </div>
      ))}
    </div>
    <div style={{display:'flex',gap:6,overflowX:'auto',marginBottom:14,paddingBottom:4}}>
      {[['todos','Todos'],['aberto','Aberto'],['visualizado','Visualizado'],['recebido','Recebido'],['em_andamento','Andamento'],['concluido','Concluído']].map(([id,label])=>(
        <button key={id} onClick={()=>setFilter(id)} style={{flexShrink:0,padding:'6px 12px',borderRadius:16,border:'none',background:filter===id?C.teal:C.card,color:filter===id?'#06101F':C.muted,fontSize:11,fontWeight:700,cursor:'pointer'}}>{label}</button>
      ))}
      <button onClick={load} style={{flexShrink:0,padding:'6px 12px',borderRadius:16,border:'1px solid '+C.border,background:'transparent',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}></button>
    </div>
    {loading&&<div style={{textAlign:'center',color:C.muted,padding:32}}>Carregando...</div>}
    {!loading&&filtered.length===0&&<div style={{textAlign:'center',color:C.muted,padding:32}}>Nenhum chamado{filter!=='todos'?' com este filtro':''}.</div>}
    {filtered.map(ticket=>{
      const tt=TICKET_TYPES.find(t=>t.id===ticket.ticket_type)||{id:'outro',label:ticket.ticket_type||'Chamado',icon:String.fromCodePoint(128203),color:'#5A7AA0',dest:'Gestao',desc:''};
      const st=TICKET_STATUS[ticket.status]||TICKET_STATUS.aberto;
      return(<div key={ticket.id} style={{background:C.card,border:'1px solid '+(ticket.status==='aberto'?'#F59E0B55':C.border),borderRadius:14,padding:14,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:8}}>
          <div style={{width:40,height:40,borderRadius:10,background:tt.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{ticketEmoji(tt.icon)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
              <div style={{fontSize:13,fontWeight:700,color:C.text}}>{tt.label}</div>
              <div style={{background:st.bg,color:st.color,borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:700,flexShrink:0}}>{st.label}</div>
            </div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{ticket.origin_sector} -> {tt.dest} · {formatTime(ticket.opened_at)}</div>
            {ticket.requester_name&&<div style={{fontSize:11,color:C.teal,marginTop:2}}> {ticket.requester_name}</div>}
            {ticket.priority==='critico'&&<div style={{display:'inline-block',background:C.red+'22',color:C.red,borderRadius:4,padding:'1px 6px',fontSize:9,fontWeight:700,marginTop:3}}> CRÍTICO</div>}
            {ticket.priority==='urgente'&&<div style={{display:'inline-block',background:C.yellow+'22',color:C.yellow,borderRadius:4,padding:'1px 6px',fontSize:9,fontWeight:700,marginTop:3}}> URGENTE</div>}
          </div>
        </div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.5,marginBottom:8}}>{ticket.description}</div>
        {ticket.response_notes&&<div style={{background:C.surface,borderRadius:8,padding:'8px 10px',marginBottom:8,borderLeft:'3px solid '+(tt.color)}}>
          <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:2}}>{tt.dest}:</div>
          <div style={{fontSize:12,color:C.text}}>{ticket.response_notes}</div>
        </div>}
        {renderActions(ticket)}
      </div>);
    })}
  </div>
  </div>);
}

function ListaMensal({sbUrl,sbKey,onSelect,refreshKey,hospital}) {
  const hoje=new Date();
  const [mes,setMes]=React.useState(hoje.getMonth()+1);
  const [ano,setAno]=React.useState(hoje.getFullYear());
  const [nots,setNots]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [aberta,setAberta]=React.useState(false);
  const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const carregar=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{
      const mesStr=String(mes).padStart(2,'0');
      const inicio=`${ano}-${mesStr}-01`;
      const ultimoDia=new Date(ano,mes,0).getDate();
      const fim=`${ano}-${mesStr}-${ultimoDia}`;
      const data=await sbSelect(sbUrl,sbKey,'notifications',
        `hospital_id=eq.${(hospital||DEFAULT_HOSPITAL).id}&event_date=gte.${inicio}&event_date=lte.${fim}&is_test=neq.true&order=event_date.asc&limit=200`);
      setNots(data||[]);
    }catch(e){setNots([]);}
    setLoading(false);
  };

  React.useEffect(()=>{if(aberta)carregar();},[mes,ano,aberta,sbUrl,sbKey]);

  const getTag=(n)=>{
    if(n.notification_type==='seguranca_paciente') return{l:'SP',c:C.red};
    if(n.notification_type==='ccih'||n.event_subtype?.startsWith('CCIH')) return{l:'CCIH',c:'#7C3AED'};
    return{l:'ADM',c:C.muted};
  };

  const navMes=(dir)=>{
    let m=mes+dir, a=ano;
    if(m>12){m=1;a++;}
    if(m<1){m=12;a--;}
    setMes(m);setAno(a);
  };

  const spCount=nots.filter(n=>n.notification_type==='seguranca_paciente'||n.notification_type==='ccih').length;
  const admCount=nots.filter(n=>n.notification_type==='administrativa').length;

  return(<div style={{marginBottom:12}}>
    {/* Header clicável */}
    <button onClick={()=>setAberta(a=>{if(!a)setTimeout(carregar,50);return!a;})}
      style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}>
      <div style={{fontSize:12,fontWeight:700,color:C.text}}>
        {String.fromCodePoint(128197)} Notificações do mês
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {!aberta&&nots.length>0&&<span style={{fontSize:11,color:C.muted}}>{nots.length} registros</span>}
        <span style={{fontSize:14,color:C.muted}}>{aberta?String.fromCodePoint(9650):String.fromCodePoint(9660)}</span>
      </div>
    </button>

// Supabase Storage upload
// Monta uma aba de Excel estilizada (cabecalho navy/branco, bordas finas, largura auto) a partir de linhas de objetos.
// cols: chaves dos campos na ordem desejada. labels: rotulos em portugues na mesma ordem (opcional, usa cols se omitido).
function buildStyledSheet(rows, cols, labels) {
  const XLSX = window.XLSX;
  labels = labels || cols;
  const fmt = v => {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'boolean') return v ? 'Sim' : 'Nao';
    return v;
  };
  const aoa = [labels, ...rows.map(r => cols.map(c => fmt(r[c])))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const BORDER = { top: { style: 'thin', color: { rgb: 'D0D5DD' } }, bottom: { style: 'thin', color: { rgb: 'D0D5DD' } }, left: { style: 'thin', color: { rgb: 'D0D5DD' } }, right: { style: 'thin', color: { rgb: 'D0D5DD' } } };
  const nRows = aoa.length, nCols = cols.length;
  for (let R = 0; R < nRows; R++) {
    for (let C = 0; C < nCols; C++) {
      const ref = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[ref]) continue;
      ws[ref].s = R === 0
        ? { font: { bold: true, color: { rgb: 'FFFFFF' }, sz: 10 }, fill: { fgColor: { rgb: '0B1F3A' } }, border: BORDER, alignment: { vertical: 'center', wrapText: true } }
        : { font: { sz: 9 }, border: BORDER, alignment: { vertical: 'center' } };
    }
  }
  ws['!cols'] = cols.map((c, i) => {
    const maxLen = Math.max(String(labels[i] || '').length, ...rows.map(r => String(fmt(r[c])).length), 6);
    return { wch: Math.min(Math.max(maxLen + 2, 10), 55) };
  });
  ws['!rows'] = [{ hpt: 20 }];
  return ws;
}
// Aba de resumo (label/valor) no mesmo estilo, para a capa do pacote.
function buildResumoSheet(titulo, linhas) {
  const rows = linhas.map(([label, valor]) => ({ label, valor }));
  return buildStyledSheet(rows, ['label', 'valor'], ['Item', 'Valor']);
}

async function listarPasta(sbUrl,sbKey,prefixo){
  const r=await fetch(`${sbUrl}/storage/v1/object/list/nsp-documentos`,{method:'POST',headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey,'Content-Type':'application/json'},body:JSON.stringify({prefix:prefixo,limit:200,sortBy:{column:'name',order:'asc'}})});
  const d=await r.json();return Array.isArray(d)?d:[];
}
async function listarSubpastas(sbUrl,sbKey,prefixo){
  const pastas=await listarPasta(sbUrl,sbKey,prefixo);const arquivos=[];
  for(const item of pastas){
    if(!item.name)continue;
    if(item.metadata===null){const sub=await listarPasta(sbUrl,sbKey,`${prefixo}/${item.name}`);sub.filter(f=>f.metadata).forEach(f=>arquivos.push({...f,path:`${prefixo}/${item.name}/${f.name}`,subpasta:item.name}));}
    else{arquivos.push({...item,path:`${prefixo}/${item.name}`,subpasta:null});}
  }
  return arquivos;
}

function buildStoragePath(tipo, meta, originalName) {
  const ext = (originalName.includes('.')?originalName.split('.').pop():'pdf').toLowerCase();
  const safe = s => (s||'').replace(/[^a-zA-Z0-9\-_.]/g,'_').replace(/__+/g,'_').trim();
  const ano  = meta.ano       || String(new Date().getFullYear());
  const sem  = meta.semestre  || (new Date().getMonth()<6?'1':'2');
  const mes  = new Date().toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace(/\. |\./, '');
  if(tipo==='protocolo') return `protocolos/${ano}/${sem}S/${meta.crit||'XX'}-${safe((meta.nomeProt||'').slice(0,20))}-Rev${mes}.${ext}`;
  if(tipo==='treinamento') return `treinamentos/${ano}/${sem}S/${safe((meta.subnucleo||'nsp').slice(0,15))}/${meta.data||new Date().toISOString().slice(0,10)}${meta.participantes?'_'+meta.participantes+'p':''}.${ext}`;
  if(tipo==='relatorio') return `relatorios/${ano}/${sem}S/DSM-HNSA-${ano}-${sem}S.xlsx`;
  return `outros/${Date.now()}_${safe(originalName)}`;
}

async function uploadToStorage(file, tipo, meta, sbUrl, sbKey) {
  const path = buildStoragePath(tipo, meta, file.name);
  const resp = await fetch(`${sbUrl}/storage/v1/object/nsp-documentos/${path}`, {
    method:'POST',
    headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},
    body: file,
  });
  if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error||`Upload falhou (${resp.status})`);}
  return `${sbUrl}/storage/v1/object/public/nsp-documentos/${path}`;
}

function StorageUploadBtn({tipo, meta, sbUrl, sbKey, onUploaded, label='Anexar'}) {
  const [st,setSt]=useState(null);
  const [msg,setMsg]=useState('');
  const ref=React.useRef();
  const handle=async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    setSt('uploading');setMsg('Enviando...');
    try{
      const link=await uploadToStorage(file,tipo,meta,sbUrl,sbKey);
      setSt('done');setMsg('OK Salvo');
      onUploaded(link);
    }catch(err){setSt('error');setMsg('X '+err.message);}
    e.target.value='';
  };
  return(<div style={{display:'flex',alignItems:'center',gap:6}}>
    <input type='file' ref={ref} onChange={handle} style={{display:'none'}} accept='.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg'/>
    <button onClick={()=>ref.current?.click()} disabled={st==='uploading'}
      style={{padding:'6px 12px',background:C.card,border:'1px solid '+C.border,borderRadius:8,color:st==='done'?C.green:C.muted,fontSize:11,fontWeight:700,cursor:st==='uploading'?'default':'pointer',whiteSpace:'nowrap'}}>
      {st==='uploading'?'Enviando...':label}
    </button>
    {msg&&<span style={{fontSize:10,color:st==='done'?C.green:st==='error'?C.red:C.muted}}>{msg}</span>}
  </div>);
}

async function sbUpsertDSM(sbUrl, sbKey, tabela, data, onConflict) {
  const res = await fetch(`${sbUrl}/rest/v1/${tabela}`, {
    method:'POST',
    headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey,'Content-Type':'application/json',
              'Prefer':'resolution=merge-duplicates,return=minimal','on-conflict':onConflict},
    body:JSON.stringify(data),
  });
  if(!res.ok){const t=await res.text();throw new Error(t);}
  return true;
}

function dsmPct(n,d){if(!d||d===0)return null;return((n||0)/d*100).toFixed(1);}
function dsmSum(rows,f){return rows.reduce((a,r)=>a+(Number(r[f])||0),0);}
function dsmContain(str,terms){const s=(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return terms.some(t=>s.includes(t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));}

function ProtocolosView({sbUrl,sbKey,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [registros,setRegistros]=useState({});
  const [cfg,setCfg]=useState({});
  const [loading,setLoading]=useState(false);
  const [editando,setEditando]=useState({});
  const [hoje]=useState(new Date().toISOString().slice(0,10));

  const carregar=async()=>{
    if(!sbUrl||!sbKey)return;
    setLoading(true);
    try{
      const [prots,cfgData]=await Promise.all([
        sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&select=*`).catch(()=>[]),
        fetch(`${sbUrl}/rest/v1/config_dsm?hospital_id=eq.${h.id}&select=*`,{headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey}}).then(r=>r.json()).then(d=>d&&d[0]?d[0]:{}).catch(()=>{}),
      ]);
      const map={};(prots||[]).forEach(p=>{map[p.nome]=p;});
      setRegistros(map);setCfg(cfgData||{});
    }catch(e){showToast('Erro: '+e.message,'error');}
    setLoading(false);
  };
  useEffect(()=>{carregar();},[sbUrl,sbKey]);

  const abrirEdit=(def)=>{
    const r=registros[def.nome];
    setEditando(e=>({...e,[def.crit]:{aprovado_em:r?.aprovado_em||'',link:r?.link||'',responsavel:r?.responsavel||'',numero:r?.numero||'',saving:false}}));
  };
  const setEdit=(crit,k,v)=>setEditando(e=>({...e,[crit]:{...e[crit],[k]:v}}));

  const salvar=async(def)=>{
    const ed=editando[def.crit];
    if(!ed?.aprovado_em){showToast('Informe a data de aprovacao','error');return;}
    setEditando(e=>({...e,[def.crit]:{...e[def.crit],saving:true}}));
    try{
      const prox=new Date(ed.aprovado_em);prox.setFullYear(prox.getFullYear()+3);
      const payload={hospital_id:h.id,nome:def.nome,aprovado_em:ed.aprovado_em,proxima_revisao:prox.toISOString().slice(0,10),link:ed.link||null,responsavel:ed.responsavel||null,numero:ed.numero||null,categoria:def.sub,status:'ativo'};
      const existente=registros[def.nome];
      if(existente){await sbPatch(sbUrl,sbKey,'protocolos',`id=eq.${existente.id}`,payload);}
      else{await sbInsert(sbUrl,sbKey,'protocolos',payload);}
      showToast('Protocolo salvo!','success');
      setEditando(e=>{const n={...e};delete n[def.crit];return n;});
      carregar();
    }catch(e){showToast('Erro: '+e.message,'error');}
    setEditando(e=>({...e,[def.crit]:{...e[def.crit],saving:false}}));
  };

  const getStatus=(def)=>{
    const naMap={C6:!cfg.tem_centro_cirurgico,C7:!cfg.tem_internacao,C10:!cfg.tem_cvc,C11:!cfg.tem_cvd,C12:!cfg.tem_uti,C13:!cfg.tem_centro_cirurgico};
    if(naMap[def.crit])return'na';
    const r=registros[def.nome];
    if(!r||!r.aprovado_em)return'missing';
    const prox=r.proxima_revisao||new Date(new Date(r.aprovado_em).setFullYear(new Date(r.aprovado_em).getFullYear()+3)).toISOString().slice(0,10);
    if(prox<hoje)return'vencido';
    if(prox<=new Date(Date.now()+60*86400000).toISOString().slice(0,10))return'proximo';
    return'ok';
  };

  const ST={ok:{label:'Valido',color:C.green},proximo:{label:'Vence em 60d',color:C.yellow},vencido:{label:'VENCIDO',color:C.red},missing:{label:'Nao cadastrado',color:C.muted},na:{label:'N/A',color:C.muted}};
  const vencidos=PROTOCOLOS_DSM.filter(d=>getStatus(d)==='vencido');
  const faltando=PROTOCOLOS_DSM.filter(d=>getStatus(d)==='missing');

      {vencidos.map(d=>{const r=registros[d.nome];return(<div key={d.crit} style={{fontSize:12,color:C.muted}}>- {d.nome} - venceu em {r?.proxima_revisao?new Date(r.proxima_revisao+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</div>);})}

      return(<div key={d.id} style={{background:C.card,border:'1px solid '+stc.color+'44',borderRadius:14,padding:'12px 14px',borderLeft:'4px solid '+stc.color}}>

function ProtocoloSubnucleoWidget({sbUrl,sbKey,showToast,hospital,userSubnucleo}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [registros,setRegistros]=useState({});
  const [editando,setEditando]=useState({});
  const [hoje]=useState(new Date().toISOString().slice(0,10));
  const crits=SUB_PROTOCOLOS[userSubnucleo]||[];
  const meusProt=PROTOCOLOS_DSM.filter(p=>crits.includes(p.crit));
  const sub=SUBNUCLEOS_HNSA.find(s=>s.id===userSubnucleo)||{color:C.teal};

  const carregar=async()=>{
    if(!sbUrl||!sbKey||!meusProt.length)return;
    try{const data=await sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&select=*`);const map={};(data||[]).forEach(p=>{map[p.nome]=p;});setRegistros(map);}catch(e){console.error(e);}
  };
  useEffect(()=>{carregar();},[sbUrl,sbKey,userSubnucleo]);

  const abrirEdit=(def)=>{const r=registros[def.nome];setEditando(e=>({...e,[def.crit]:{aprovado_em:r?.aprovado_em||'',link:r?.link||'',responsavel:r?.responsavel||'',numero:r?.numero||'',saving:false}}));};
  const setEdit=(crit,k,v)=>setEditando(e=>({...e,[crit]:{...e[crit],[k]:v}}));

  const salvar=async(def)=>{
    const ed=editando[def.crit];
    if(!ed?.aprovado_em){showToast('Informe a data de aprovacao','error');return;}
    setEditando(e=>({...e,[def.crit]:{...e[def.crit],saving:true}}));
    try{
      const prox=new Date(ed.aprovado_em);prox.setFullYear(prox.getFullYear()+3);
      const payload={hospital_id:h.id,nome:def.nome,aprovado_em:ed.aprovado_em,proxima_revisao:prox.toISOString().slice(0,10),link:ed.link||null,responsavel:ed.responsavel||null,numero:ed.numero||null,categoria:def.sub,status:'ativo'};
      const existente=registros[def.nome];
      if(existente){await sbPatch(sbUrl,sbKey,'protocolos',`id=eq.${existente.id}`,payload);}
      else{await sbInsert(sbUrl,sbKey,'protocolos',payload);}
      showToast('Protocolo atualizado!','success');
      setEditando(e=>{const n={...e};delete n[def.crit];return n;});
      carregar();
    }catch(e){showToast('Erro: '+e.message,'error');}
    setEditando(e=>({...e,[def.crit]:{...e[def.crit],saving:false}}));
  };

  const getStatus=(def)=>{
    const r=registros[def.nome];if(!r||!r.aprovado_em)return{s:'missing',label:'Nao cadastrado',color:C.muted};
    const prox=r.proxima_revisao||new Date(new Date(r.aprovado_em).setFullYear(new Date(r.aprovado_em).getFullYear()+3)).toISOString().slice(0,10);
    if(prox<hoje)return{s:'vencido',label:'VENCIDO',color:C.red};
    if(prox<=new Date(Date.now()+60*86400000).toISOString().slice(0,10))return{s:'proximo',label:'Vence em 60d',color:C.yellow};
    return{s:'ok',label:'Valido',color:C.green};
  };

  if(!meusProt.length)return null;
  const inp={background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'8px 10px',color:C.text,fontSize:12,outline:'none',width:'100%'};

  return(<div style={{background:C.card,border:'1px solid '+(sub.color||C.teal)+'44',borderRadius:14,padding:16,marginTop:14,borderLeft:'3px solid '+(sub.color||C.teal)}}>
    <div style={{fontSize:13,fontWeight:800,color:C.text,marginBottom:12}}>
      {meusProt.length===1?'Meu Protocolo':'Meus Protocolos'}
      <span style={{fontSize:11,fontWeight:400,color:C.muted,marginLeft:8}}>clique para atualizar</span>
    </div>
    {meusProt.map(def=>{
      const st=getStatus(def);const r=registros[def.nome];const ed=editando[def.crit];

            <div><label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>N / codigo</label><input type='text' value={ed.numero} onChange={e=>setEdit(def.crit,'numero',e.target.value)} placeholder='POP-NSP-003' style={inp}/></div>
          </div>
          <div><label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>Responsavel</label><input type='text' value={ed.responsavel} onChange={e=>setEdit(def.crit,'responsavel',e.target.value)} placeholder='Nome ou cargo' style={inp}/></div>
          <div><label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>Link do documento</label>
            <div style={{display:'flex',gap:6}}>
              <input type='text' value={ed.link} onChange={e=>setEdit(def.crit,'link',e.target.value)} placeholder='https://' style={{...inp,flex:1}}/>
              <StorageUploadBtn tipo='protocolo' sbUrl={sbUrl} sbKey={sbKey} meta={{crit:def.crit,nomeProt:def.nome,ano:String(new Date().getFullYear()),semestre:new Date().getMonth()<6?'1':'2'}} onUploaded={link=>setEdit(def.crit,'link',link)} label='Anexar'/>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>setEditando(e=>{const n={...e};delete n[def.crit];return n;})} style={{flex:1,background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'8px',color:C.muted,fontSize:12,fontWeight:700,cursor:'pointer'}}>Cancelar</button>
            <button onClick={()=>salvar(def)} disabled={ed.saving} style={{flex:2,background:ed.saving?C.border:C.teal,border:'none',borderRadius:8,padding:'8px',color:ed.saving?C.muted:'#06101F',fontSize:12,fontWeight:800,cursor:ed.saving?'default':'pointer'}}>{ed.saving?'Salvando...':'Salvar'}</button>
          </div>
        </div>}
      </div>);
    })}
  </div>);
}

function IndicadoresSubnucleoWidget({sbUrl,sbKey,showToast,hospital,userSubnucleo}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const hoje=new Date();
  const [mes,setMes]=useState(`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`);
  const [form,setForm]=useState({paciente_dia_total:''});
  const [salvando,setSalvando]=useState(false);
  const sub=SUBNUCLEOS_HNSA.find(s=>s.id===userSubnucleo);
  const campos=DSM_CAMPOS_SUB[userSubnucleo]||[];
  const mesRef=mes+'-01';
  const inp={width:'100%',padding:'8px 10px',borderRadius:8,boxSizing:'border-box',border:'1px solid '+C.border,background:C.surface,color:C.text,fontSize:13,outline:'none'};

  useEffect(()=>{
    if(!sbUrl||!sbKey)return;
    fetch(`${sbUrl}/rest/v1/indicadores_dsm?hospital_id=eq.${h.id}&mes=eq.${mesRef}&select=*`,{headers:{'apikey':sbKey,'Authorization':'Bearer '+sbKey}})
      .then(r=>r.ok?r.json():Promise.resolve([])).then(d=>{
        if(d&&d[0]){const vals={paciente_dia_total:d[0].paciente_dia_total||''};campos.forEach(f=>{vals[f.key]=d[0][f.key]!==null&&d[0][f.key]!==undefined?d[0][f.key]:'';});setForm(vals);}
        else{const blank={paciente_dia_total:''};campos.forEach(f=>{blank[f.key]='';});setForm(blank);}
      }).catch(()=>{});
  },[mes,h.id,sbUrl,sbKey]);

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const salvar=async()=>{
    if(!sbUrl||!sbKey){showToast('Sem conexao','error');return;}
    setSalvando(true);
    const payload={hospital_id:h.id,mes:mesRef,updated_at:new Date().toISOString(),paciente_dia_total:Number(form.paciente_dia_total)||null};
    campos.forEach(f=>{payload[f.key]=form[f.key]!==''?Number(form[f.key]):null;});
    try{await sbUpsertDSM(sbUrl,sbKey,'indicadores_dsm',payload,'hospital_id,mes');showToast('Indicadores salvos!','success');}
    catch(e){showToast('Erro: '+e.message,'error');}
    setSalvando(false);
  };

  if(campos.length===0)return(<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16,marginTop:14}}>
    <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}>{sub?.icon} Indicadores - {sub?.label||userSubnucleo}</div>
    <div style={{fontSize:12,color:C.muted}}>Seu subnucleo nao possui indicadores quantitativos mensais. Registre treinamentos acima.</div>
  </div>);

  return(<div style={{background:C.card,border:'1px solid '+(sub?.color||C.teal)+'44',borderRadius:14,padding:16,marginTop:14,borderLeft:'3px solid '+(sub?.color||C.teal)}}>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:800,color:C.text}}>{sub?.icon} Meus Indicadores - {sub?.label||userSubnucleo}</div>
      <div style={{fontSize:11,color:C.muted,marginTop:2}}>Preencha os dados do mes. O gestor ve no Relatorio DSM.</div>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
      <input type='month' value={mes} onChange={e=>setMes(e.target.value)} style={{...inp,width:'auto',padding:'8px 12px',cursor:'pointer'}}/>
      <button onClick={salvar} disabled={salvando} style={{padding:'9px 20px',background:salvando?C.border:(sub?.color||C.teal),border:'none',borderRadius:10,color:salvando?C.muted:'#fff',fontWeight:800,fontSize:13,cursor:salvando?'default':'pointer'}}>
        {salvando?'Salvando...':'Salvar'}
      </button>
    </div>
    <div style={{marginBottom:10}}>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>Pacientes-dia total no mes</label>
      <input type='number' min={0} value={form.paciente_dia_total} onChange={e=>set('paciente_dia_total',e.target.value)} style={inp}/>
    </div>
    {userSubnucleo==='ccih'?(
      Object.entries(campos.reduce((acc,f)=>{const g=f.grupo||'Geral';if(!acc[g])acc[g]=[];acc[g].push(f);return acc;},{})).map(([grupo,itens])=>(
        <div key={grupo} style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8,paddingBottom:4,borderBottom:'1px solid '+C.border}}>{grupo}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:8}}>
            {itens.map(f=>(<div key={f.key}><label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>{f.label}</label><input type='number' min={0} value={form[f.key]||''} onChange={e=>set(f.key,e.target.value)} style={inp}/></div>))}
          </div>
        </div>
      ))
    ):(
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:10}}>
        {campos.map(f=>(<div key={f.key}><label style={{fontSize:11,color:C.muted,display:'block',marginBottom:3}}>{f.label}</label><input type='number' min={0} value={form[f.key]||''} onChange={e=>set(f.key,e.target.value)} style={inp}/></div>))}
      </div>
    )}
  </div>);
}

  useEffect(()=>{
    if(!sbUrl||!sbKey)return;

  useEffect(()=>{

      .then(r=>r.json()).then(d=>setHist(d||[])).catch(()=>{});

  const set=(k,v)=>setForm(f=>({...f,[k]:v===''?null:Number(v)}));

  // Ponte com a aba Por Setor: soma dos paciente-dia lancados em indicadores_mensais
  const [pdPonte,setPdPonte]=useState(null);
  useEffect(()=>{
    if(!sbUrl||!sbKey){setPdPonte(null);return;}

        if(d&&d[0]){
          const soma=o=>o?Object.values(o).reduce((a,v)=>a+(Number(v)||0),0):0;
          setPdPonte({geral:soma(d[0].pd_setores),lpp:soma(d[0].pd_lpp_setores)});
        }else setPdPonte(null);
      }).catch(()=>setPdPonte(null));
  },[mes,h.id,sbUrl,sbKey]);
  const BotaoPonte=({valor,campo})=>valor>0&&form[campo]!==valor?(
    <button onClick={()=>set(campo,String(valor))} style={{marginTop:4,fontSize:10,background:C.teal+'18',border:'1px solid '+C.teal+'55',borderRadius:6,padding:'3px 8px',color:C.teal,fontWeight:700,cursor:'pointer'}}>
      Usar soma dos setores: {valor}
    </button>
  ):null;
  const salvar=async()=>{
    setSalvando(true);
    try{
      await sbUpsertDSM(sbUrl,sbKey,'indicadores_dsm',{...form,hospital_id:h.id,mes:mesRef,updated_at:new Date().toISOString()},'hospital_id,mes');
      sbAuditLog(sbUrl,sbKey,h.id,null,'DSM_INDICADORES_SALVOS','mes','',mesRef,usuario||perfil||'gestor',perfil||'gestor').catch(()=>{});

    {titulo:'C.3 Higienizacao das Maos',sub:'ccih',campos:[{label:'Alcool gel consumido (mL)',key:'alcool_gel_ml'},{label:'Clorexidina consumida (mL)',key:'clorexidina_ml'},{label:'Sabonete liquido consumido (mL)',key:'sabonete_ml'},{label:'Acoes de HM realizadas',key:'hm_acoes_realizadas'},{label:'Oportunidades de HM observadas',key:'hm_oportunidades'}]},
    {titulo:'C.4 Identificacao',sub:'identificacao',campos:[{label:'Pacientes com pulseira',key:'pacientes_identificados'},{label:'Total de pacientes atendidos',key:'pacientes_atendidos'}]},
    {titulo:'C.6 Cirurgia Segura',sub:'cirurgia',campos:[{label:'LVCS preenchidas',key:'lvcs_preenchidas'},{label:'Total de cirurgias',key:'cirurgias_realizadas'},{label:'Antibioticoprofilaxia adequada',key:'antibiotico_adequado'},{label:'Total cirurgias (antibiotico)',key:'cirurgias_periodo'},{label:'Obitos cirurgicos ate 7d',key:'obitos_cirurgicos_7d'},{label:'Total cirurgias (mortalidade)',key:'total_cirurgias'}]},
    {titulo:'C.7 LPP',sub:'lpp',campos:[{label:'Avaliacao risco LPP admissao',key:'lpp_avaliacao_admissao'},{label:'Total admitidos',key:'total_admitidos'},{label:'Medidas preventivas LPP',key:'lpp_medidas_preventivas'},{label:'Pacientes com risco LPP',key:'lpp_pacientes_risco'},{label:'Avaliacao diaria LPP',key:'lpp_avaliacao_diaria'},{label:'Internados com risco LPP',key:'lpp_internados_risco'},{label:'Casos novos de LPP',key:'lpp_casos_novos'},{label:'Pac-dia risco LPP',key:'lpp_paciente_dia_risco'}]},
    {titulo:'C.8 Quedas',sub:'queda',campos:[{label:'Prontuarios com avaliacao de risco ok',key:'queda_prontuarios_ok'},{label:'Total prontuarios analisados',key:'queda_prontuarios_total'},{label:'Quedas com dano',key:'quedas_com_dano'},{label:'Total de quedas',key:'quedas_total'}]},
    {titulo:'C.9 Medicamentos',sub:'medicamentos',campos:[{label:'Erros na prescricao',key:'erros_prescricao'},{label:'Total prescricoes',key:'total_prescricoes'},{label:'Erros na dispensacao',key:'erros_dispensacao'},{label:'Total dispensacoes',key:'total_dispensacoes'},{label:'Erros na administracao',key:'erros_administracao'},{label:'Total doses administradas',key:'total_doses'}]},
    {titulo:'C.10 IPCS/CVC',sub:'ccih',campos:[{label:'IRAS associadas a CVC',key:'ipcs_cvc'},{label:'Cateter-dia CVC',key:'cateter_dia_cvc'}]},
    {titulo:'C.11 ITU/CVD',sub:'ccih',campos:[{label:'ITU associadas ao CVD',key:'itu_cvd'},{label:'Pacientes-dia com CVD',key:'paciente_dia_cvd'}]},
    {titulo:'C.12 PAV',sub:'ccih',campos:[{label:'Casos novos de PAV',key:'pav_casos_novos'},{label:'Pacientes em VM',key:'pacientes_vm'}]},
    {titulo:'C.13 ISC',sub:'ccih',campos:[{label:'Infeccoes sitio cirurgico',key:'isc_casos'},{label:'Procedimentos cirurgicos',key:'procedimentos_cirurgicos'}]},
    {titulo:'C.22 Antimicrobianos UTI (DDD)',sub:'ccih',campos:[{label:'DDD total de antimicrobianos no mes',key:'ddd_antimicrobianos',hint:'Dose Diaria Definida - OMS/ATC. Consultar farmacia.'},{label:'Paciente-dia UTI adulto',key:'paciente_dia_uti'}]},
  ];

  return(<div style={{padding:'0 0 80px',maxWidth:900,margin:'0 auto'}}>
    {!embedded&&<BackHeader title='Indicadores Mensais DSM' subtitle='Dados quantitativos para o relatorio C.1-C.15'/>}
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
      <input type='month' value={mes} onChange={e=>setMes(e.target.value)} style={{...inp,width:'auto',cursor:'pointer',padding:'9px 14px'}}/>
      <button onClick={salvar} disabled={salvando} style={{padding:'9px 22px',background:salvando?C.border:C.teal,border:'none',borderRadius:10,color:salvando?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:salvando?'default':'pointer'}}>
        {salvando?'Salvando...':'Salvar'}
      </button>
    </div>
    {grupos.length>0&&(()=>{ 
      const completo=g=>g.campos.every(c=>form[c.key]!==null&&form[c.key]!==undefined&&form[c.key]!=='');
      const parcial=g=>!completo(g)&&g.campos.some(c=>form[c.key]!==null&&form[c.key]!==undefined&&form[c.key]!=='');
      const nComp=grupos.filter(completo).length;
      return(<div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px',marginBottom:14}}>

          <div style={{fontSize:12,fontWeight:800,color:C.text}}>Completude do mes por subnucleo</div>
          <div style={{fontSize:11,fontWeight:800,color:nComp===grupos.length?C.green:C.yellow}}>{nComp} de {grupos.length} blocos completos</div>

          {grupos.map(g=>{
            const sn=SUBNUCLEOS_HNSA.find(x=>x.id===g.sub);
            const st=completo(g)?'ok':parcial(g)?'parc':'vazio';
            const cor=st==='ok'?C.green:st==='parc'?C.yellow:C.muted;
            return(<div key={g.titulo} style={{display:'flex',alignItems:'center',gap:5,background:cor+'15',border:'1px solid '+cor+'44',borderRadius:8,padding:'4px 9px'}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:cor,display:'inline-block'}}></span>
              <span style={{fontSize:10,fontWeight:700,color:C.text}}>{g.titulo}</span>
              {sn&&<span style={{fontSize:9,color:sn.color,fontWeight:700}}>{sn.label.split(' ')[0]}</span>}
            </div>);
          })}
        </div>
        <div style={{fontSize:10,color:C.muted,marginTop:8,lineHeight:1.5}}>Cada subnucleo alimenta os seus blocos ao longo do mes; o bloco fica verde quando todos os campos estao preenchidos. Toda gravacao e registrada na trilha de auditoria com autor e perfil.</div>
      </div>);
    })()}
    {[...grupos].sort((a,b)=>{
      if(!userSubnucleo)return 0;
      const am=a.sub===userSubnucleo?0:1;const bm=b.sub===userSubnucleo?0:1;
      return am-bm;
    }).map(g=>{
      const sn=SUBNUCLEOS_HNSA.find(x=>x.id===g.sub);
      const meu=userSubnucleo&&g.sub===userSubnucleo;
      return(<div key={g.titulo} style={{background:C.card,border:'1px solid '+(meu?(sn?sn.color:C.teal)+'88':C.border),borderLeft:meu?'4px solid '+(sn?sn.color:C.teal):'1px solid '+C.border,borderRadius:12,padding:16,marginBottom:10}}>
      <div style={{fontSize:13,fontWeight:800,color:C.text,marginBottom:12,borderBottom:'1px solid '+C.border,paddingBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <span>{g.titulo}</span>
        <span style={{display:'flex',gap:6,alignItems:'center'}}>
          {sn&&<span style={{fontSize:9,fontWeight:800,color:sn.color,background:sn.color+'18',border:'1px solid '+sn.color+'44',borderRadius:6,padding:'2px 8px',whiteSpace:'nowrap'}}>{sn.label}</span>}
          {meu&&<span style={{fontSize:9,fontWeight:800,color:'#06101F',background:sn?sn.color:C.teal,borderRadius:6,padding:'2px 8px'}}>Seu subnucleo</span>}
        </span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:10}}>
        {g.campos.map(campo=>(<div key={campo.key}>
          <label style={{display:'block',fontSize:11,fontWeight:700,color:C.muted,marginBottom:3}}>{campo.label}</label>
          {campo.hint&&<div style={{fontSize:10,color:C.muted,opacity:0.7,marginBottom:2}}>{campo.hint}</div>}
          <input type='number' min={0} value={form[campo.key]!==null&&form[campo.key]!==undefined?form[campo.key]:''} onChange={e=>set(campo.key,e.target.value)} style={inp}/>
          {campo.key==='paciente_dia_total'&&pdPonte&&<BotaoPonte valor={pdPonte.geral} campo='paciente_dia_total'/>}
          {campo.key==='lpp_paciente_dia_risco'&&pdPonte&&<BotaoPonte valor={pdPonte.lpp} campo='lpp_paciente_dia_risco'/>}
        </div>))}
      </div>
    </div>);})}
    {hist.length>0&&<div style={{marginBottom:10}}>
      <div style={{fontSize:13,fontWeight:800,color:C.text,marginBottom:10}}>Dashboard de Indicadores — Acumulado ({hist.length} {hist.length===1?'mes':'meses'})</div>
      {(()=>{
        const sum=(k)=>hist.reduce((a,r)=>a+(Number(r[k])||0),0);
        // Tendência: compara a TAXA (num/den) do mês mais recente COM DADOS vs a média
        // dos meses anteriores com dados. Mês sem preenchimento é ignorado, nunca vira zero.
        const tendencia=(k,inv=false,dk=null)=>{
          const validos=hist.filter(r=>{
            const temNum=r[k]!==null&&r[k]!==undefined&&r[k]!=='';
            const temDen=!dk||Number(r[dk])>0;
            return temNum&&temDen;
          });
          if(validos.length<2) return null;
          const valor=r=>dk?Number(r[k]||0)/Number(r[dk]):Number(r[k]||0);
          const ult=valor(validos[0]);
          const ant=validos.slice(1);
          const med=ant.reduce((a,r)=>a+valor(r),0)/ant.length;
          if(med===0) return null;
          const delta=(ult-med)/med*100;
          if(Math.abs(delta)<5) return {seta:'→',cor:C.muted,delta:0};
          const melhorou=inv?delta<0:delta>0;
          return{seta:delta>0?'↑':'↓',cor:melhorou?C.green:C.red,delta:Math.abs(delta).toFixed(0)+'%'};
        };
        const pct=(n,d,dec=1)=>d>0?((n/d)*100).toFixed(dec)+'%':'N/D';
        const taxa=(n,d,mul=1000,dec=2)=>d>0?((n/d)*mul).toFixed(dec):null;
        const pacDia=sum('paciente_dia_total');
        const pdRiscoLpp=sum('lpp_paciente_dia_risco')||pacDia;
        const indicadores=[
          {label:'Taxa de conformidade HM',formula:'acoes/oportunidades',val:pct(sum('hm_acoes_realizadas'),sum('hm_oportunidades')),meta:'>=80%',color:C.teal,
            tend:tendencia('hm_acoes_realizadas',false,'hm_oportunidades'),ok:sum('hm_oportunidades')>0&&(sum('hm_acoes_realizadas')/sum('hm_oportunidades'))>=0.8},
          {label:'Taxa de identificacao',formula:'pulseiras/total pacientes',val:pct(sum('pacientes_identificados'),sum('pacientes_atendidos')),meta:'>=95%',color:'1D6FE8',
            tend:tendencia('pacientes_identificados',false,'pacientes_atendidos'),ok:sum('pacientes_atendidos')>0&&(sum('pacientes_identificados')/sum('pacientes_atendidos'))>=0.95},
          {label:'Conformidade avaliacao LPP admissao',formula:'avaliacoes/admitidos',val:pct(sum('lpp_avaliacao_admissao'),sum('total_admitidos')),meta:'>=90%',color:'EF4444',
            tend:tendencia('lpp_avaliacao_admissao',false,'total_admitidos'),ok:sum('total_admitidos')>0&&(sum('lpp_avaliacao_admissao')/sum('total_admitidos'))>=0.9},
          {label:'Incidencia de LPP',formula:'casos/pac-dia risco × 100',val:taxa(sum('lpp_casos_novos'),pdRiscoLpp,100,1)?taxa(sum('lpp_casos_novos'),pdRiscoLpp,100,1)+'%':'N/D',meta:'<4%',color:'EF4444',
            tend:tendencia('lpp_casos_novos',true,'paciente_dia_total'),ok:pdRiscoLpp>0&&(sum('lpp_casos_novos')/pdRiscoLpp*100)<4},
          {label:'Conformidade avaliacao de risco queda',formula:'prontuarios ok/total ('+sum('queda_prontuarios_ok')+'/'+sum('queda_prontuarios_total')+')',val:pct(sum('queda_prontuarios_ok'),sum('queda_prontuarios_total')),meta:'>=90%',color:'F59E0B',
            tend:tendencia('queda_prontuarios_ok',false,'queda_prontuarios_total'),ok:sum('queda_prontuarios_total')>0&&(sum('queda_prontuarios_ok')/sum('queda_prontuarios_total'))>=0.9},
          {label:'Taxa de queda com dano',formula:'quedas c/ dano / total quedas ('+sum('quedas_com_dano')+'/'+sum('quedas_total')+')',val:pct(sum('quedas_com_dano'),sum('quedas_total')),meta:'<10%',color:'F59E0B',
            tend:tendencia('quedas_com_dano',true,'quedas_total'),ok:sum('quedas_total')>0&&(sum('quedas_com_dano')/sum('quedas_total'))<0.1},
          {label:'Taxa de erro na prescricao',formula:'erros/total prescricoes',val:pct(sum('erros_prescricao'),sum('total_prescricoes')),meta:'<1%',color:'8B5CF6',
            tend:tendencia('erros_prescricao',true,'total_prescricoes'),ok:sum('total_prescricoes')>0&&(sum('erros_prescricao')/sum('total_prescricoes'))<0.01},
          {label:'Densidade de IPCS/CVC',formula:'IRAS/cateter-dia × 100',val:taxa(sum('ipcs_cvc'),sum('cateter_dia_cvc'),100,1)?taxa(sum('ipcs_cvc'),sum('cateter_dia_cvc'),100,1)+'%':'N/D',meta:'<0.2%',color:'06B6D4',
            tend:tendencia('ipcs_cvc',true,'cateter_dia_cvc'),ok:sum('cateter_dia_cvc')>0&&(sum('ipcs_cvc')/sum('cateter_dia_cvc')*100)<0.2},
          {label:'Densidade de ITU/CVD',formula:'ITU/pac-dia CVD × 100',val:taxa(sum('itu_cvd'),sum('paciente_dia_cvd'),100,1)?taxa(sum('itu_cvd'),sum('paciente_dia_cvd'),100,1)+'%':'N/D',meta:'<0.3%',color:'06B6D4',
            tend:tendencia('itu_cvd',true,'paciente_dia_cvd'),ok:sum('paciente_dia_cvd')>0&&(sum('itu_cvd')/sum('paciente_dia_cvd')*100)<0.3},
          {label:'Densidade de PAV',formula:'casos/VM-dia × 100',val:taxa(sum('pav_casos_novos'),sum('pacientes_vm'),100,1)?taxa(sum('pav_casos_novos'),sum('pacientes_vm'),100,1)+'%':'N/D',meta:'<0.5%',color:'EF4444',
            tend:tendencia('pav_casos_novos',true,'pacientes_vm'),ok:sum('pacientes_vm')>0&&(sum('pav_casos_novos')/sum('pacientes_vm')*100)<0.5},
          {label:'Conformidade LVCS (cirurgia segura)',formula:'LVCS preenchidas/cirurgias',val:pct(sum('lvcs_preenchidas'),sum('cirurgias_realizadas')),meta:'>=95%',color:'10B981',
            tend:tendencia('lvcs_preenchidas',false,'cirurgias_realizadas'),ok:sum('cirurgias_realizadas')>0&&(sum('lvcs_preenchidas')/sum('cirurgias_realizadas'))>=0.95},
          {label:'Consumo alcool gel',formula:'mL/pac-dia',val:pacDia>0?((sum('alcool_gel_ml')/pacDia)).toFixed(1)+' mL/pac-dia':'N/D',meta:'>20 mL/pac-dia',color:C.teal,
            tend:tendencia('alcool_gel_ml',false,'paciente_dia_total'),ok:pacDia>0&&(sum('alcool_gel_ml')/pacDia)>=20},
        ];
        const semaforo=(ind)=>ind.val==='N/D'?C.muted:ind.ok?C.green:C.red;
        return(<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:8}}>
          {indicadores.map((ind,i)=>(
            <div key={i} style={{background:C.card,border:'1px solid '+semaforo(ind)+'44',borderRadius:10,padding:'10px 12px',borderLeft:'3px solid '+semaforo(ind)}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                <div style={{fontSize:11,fontWeight:700,color:C.text,flex:1,lineHeight:1.3}}>{ind.label}</div>
                <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                  {ind.tend&&<span style={{fontSize:14,color:ind.tend.cor,fontWeight:900}} title={'vs media anterior: '+(ind.tend.delta||'estavel')}>{ind.tend.seta}{ind.tend.delta&&<span style={{fontSize:9}}>{ind.tend.delta}</span>}</span>}
                  <div style={{fontSize:18,fontWeight:900,color:semaforo(ind)}}>{ind.val}</div>
                </div>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:9,color:C.muted}}>{ind.formula}</div>
                <div style={{fontSize:9,fontWeight:700,color:semaforo(ind),background:semaforo(ind)+'15',borderRadius:4,padding:'1px 5px'}}>

                </div>
              </div>

          ))}
        </div>);
      })()}
    </div>}
    {hist.length>0&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:14,marginTop:4}}>
      <div style={{fontSize:12,fontWeight:700,color:C.muted,marginBottom:8}}>Historico recente</div>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
        <thead><tr style={{background:C.surface}}>{['Mes','Pac.-dia','Alcool gel (mL)','LPP novos','Quedas'].map(h=>(<th key={h} style={{padding:'7px 10px',textAlign:'left',fontWeight:700,borderBottom:'1px solid '+C.border}}>{h}</th>))}</tr></thead>
        <tbody>{hist.map((r,i)=>(<tr key={r.mes} style={{background:i%2===0?'transparent':C.surface}}>

          <td style={{padding:'6px 10px'}}>{r.paciente_dia_total||'-'}</td>
          <td style={{padding:'6px 10px'}}>{r.alcool_gel_ml||'-'}</td>
