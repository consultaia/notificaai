// --- INDICADORES DE PROCESSO -------------------------------------------------
function IndicadoresView({sbUrl,sbKey,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [dados,setDados]=useState(null);
  const [loading,setLoading]=useState(false);
  const [mesRef,setMesRef]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});
  // Paciente-dia geral e por setor
  const [pdGeral,setPdGeral]=useState('');
  const [pdUPG,setPdUPG]=useState('');
  const [pdAlaA,setPdAlaA]=useState('');

  const calcular=async()=>{
    if(!sbUrl||!sbKey) return;
    if(!pdGeral&&!pdUPG&&!pdAlaA){showToast('Informe ao menos um total de paciente-dia','error');return;}
    setLoading(true);
    try{
      const [ano,mes]=mesRef.split('-').map(Number);
      const inicio=new Date(ano,mes-1,1).toISOString().slice(0,10);
      const fim=new Date(ano,mes,0).toISOString().slice(0,10);
      const nots=await sbSelect(sbUrl,sbKey,'notifications',`event_date=gte.${inicio}&event_date=lte.${fim}&is_test=eq.false&select=*`);

      const pd=Number(pdGeral)||1;
      const pdU=Number(pdUPG)||0;
      const pdA=Number(pdAlaA)||0;

      // Filtros por tipo de evento
      const isQueda=n=>n.event_subtype?.toLowerCase().includes('queda')||n.description?.toLowerCase().includes('queda');
      const isLPP=n=>n.event_subtype?.toLowerCase().includes('press')||n.event_subtype?.toLowerCase().includes('lpp')||n.description?.toLowerCase().includes('pressao');
      const isIRAS=n=>n.notification_type==='ccih';
      const isMed=n=>n.event_subtype?.toLowerCase().includes('medic')||n.description?.toLowerCase().includes('medic');
      const isNearMiss=n=>n.gravidade==='Near miss';
      const isSentinela=n=>n.gravidade==='Evento sentinela';

      // --- GERAL ---
      const geral={
        total:nots.length,
        quedas:nots.filter(isQueda).length,
        lp:nots.filter(isLPP).length,
        iras:nots.filter(isIRAS).length,
        medicacao:nots.filter(isMed).length,
        nearMiss:nots.filter(isNearMiss).length,
        sentinela:nots.filter(isSentinela).length,
        pd,
      };
      geral.txQueda=(geral.quedas/pd*1000).toFixed(2);
      geral.txLP=(geral.lp/pd*1000).toFixed(2);
      geral.txIRAS=(geral.iras/pd*1000).toFixed(2);
      geral.txMed=(geral.medicacao/pd*1000).toFixed(2);
      geral.txNearMiss=geral.total>0?Math.round(geral.nearMiss/geral.total*100):0;

      // --- UPG ---
      let upg=null;
      if(pdU>0){
        const notsUPG=nots.filter(n=>n.sector==='UPG');
        upg={
          total:notsUPG.length,
          quedas:notsUPG.filter(isQueda).length,
          lp:notsUPG.filter(isLPP).length,
          iras:notsUPG.filter(isIRAS).length,
          medicacao:notsUPG.filter(isMed).length,
          nearMiss:notsUPG.filter(isNearMiss).length,
          sentinela:notsUPG.filter(isSentinela).length,
          pd:pdU,
        };
        upg.txQueda=(upg.quedas/pdU*1000).toFixed(2);
        upg.txLP=(upg.lp/pdU*1000).toFixed(2);
        upg.txIRAS=(upg.iras/pdU*1000).toFixed(2);
        upg.txMed=(upg.medicacao/pdU*1000).toFixed(2);
        upg.txNearMiss=upg.total>0?Math.round(upg.nearMiss/upg.total*100):0;
      }

      // --- ALA A ---
      let alaA=null;
      if(pdA>0){
        const notsAlaA=nots.filter(n=>n.sector==='Ala A');
        alaA={
          total:notsAlaA.length,
          quedas:notsAlaA.filter(isQueda).length,
          lp:notsAlaA.filter(isLPP).length,
          iras:notsAlaA.filter(isIRAS).length,
          medicacao:notsAlaA.filter(isMed).length,
          nearMiss:notsAlaA.filter(isNearMiss).length,
          sentinela:notsAlaA.filter(isSentinela).length,
          pd:pdA,
        };
        alaA.txQueda=(alaA.quedas/pdA*1000).toFixed(2);
        alaA.txLP=(alaA.lp/pdA*1000).toFixed(2);
        alaA.txIRAS=(alaA.iras/pdA*1000).toFixed(2);
        alaA.txMed=(alaA.medicacao/pdA*1000).toFixed(2);
        alaA.txNearMiss=alaA.total>0?Math.round(alaA.nearMiss/alaA.total*100):0;
      }

      setDados({geral,upg,alaA});
    }catch{showToast('Erro ao calcular indicadores','error');}
    setLoading(false);
  };

  const INDICADORES_DEF=[
    {key:'txQueda',label:'Taxa de quedas',unidade:'/1000 p-d',meta:1.5,menor:true,desc:'Quedas / paciente-dia x 1000'},
    {key:'txLP',label:'Taxa de LPP',unidade:'/1000 p-d',meta:0.8,menor:true,desc:'LPP adquirida / paciente-dia x 1000'},
    {key:'txIRAS',label:'Taxa de IRAS',unidade:'/1000 p-d',meta:2.0,menor:true,desc:'Infeccoes / paciente-dia x 1000'},
    {key:'txMed',label:'Erros de medicacao',unidade:'/1000 p-d',meta:0.5,menor:true,desc:'Erros medicacao / paciente-dia x 1000'},
    {key:'txNearMiss',label:'Taxa de near miss',unidade:'%',meta:20,menor:false,desc:'Near miss / total notificacoes x 100'},
  ];

  const SetorCard=({titulo,cor,dados:d,icon})=>{
    if(!d) return null;
    return(<div style={{background:C.card,border:'2px solid '+cor+'44',borderRadius:14,padding:16,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <span style={{fontSize:20}}>{icon}</span>
        <div>
          <div style={{fontSize:14,fontWeight:800,color:cor}}>{titulo}</div>
          <div style={{fontSize:11,color:C.muted}}>{d.pd} paciente-dia · {d.total} notificacao(oes)</div>
        </div>
      </div>
      {INDICADORES_DEF.map((ind,i)=>{
        const val=Number(d[ind.key]);
        const ok=ind.menor?val<ind.meta:val>=ind.meta;
        return(<div key={i} style={{background:C.surface,borderRadius:10,padding:'10px 12px',marginBottom:8,display:'flex',alignItems:'center',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text}}>{ind.label}</div>
            <div style={{fontSize:10,color:C.muted}}>{ind.desc} · Meta: {ind.menor?'< ':'> '}{ind.meta}{ind.unidade}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontSize:20,fontWeight:900,color:ok?C.green:C.red,lineHeight:1}}>{d[ind.key]}{ind.unidade==='%'?'%':''}</div>
            <div style={{fontSize:9,color:C.muted}}>{ind.unidade!=='%'?ind.unidade:''}</div>
          </div>
          <div style={{background:ok?C.green+'22':C.red+'22',color:ok?C.green:C.red,borderRadius:6,padding:'2px 7px',fontSize:9,fontWeight:700,flexShrink:0}}>{ok?'Meta':'Alerta'}</div>
        </div>);
      })}
      {d.sentinela>0&&<div style={{background:C.red+'22',border:'1px solid '+C.red+'44',borderRadius:8,padding:'8px 12px',fontSize:11,color:C.red,fontWeight:700}}>
        {d.sentinela} evento(s) sentinela - RCA obrigatorio
      </div>}
    </div>);
  };

  return(<div style={{paddingBottom:80}}>
    <BackHeader title='Indicadores de Processo' subtitle='RDC 36/2013 - Metas OMS - por setor'/>
    <div style={{padding:'16px',display:'flex',flexDirection:'column',gap:14}}>

    {/* Parametros */}
    <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Parametros de calculo</div>

      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Mes de referencia</label>
      <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)}
        style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 10px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:12}}/>

      {/* Paciente-dia por setor */}
      <div style={{background:C.surface,border:'1px solid '+C.border,borderRadius:10,padding:'12px 14px',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:10}}>Total paciente-dia (soma dos dias de internacao no mes)</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr',gap:10}}>
          <div>
            <label style={{fontSize:11,color:C.muted,display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{width:10,height:10,borderRadius:'50%',background:C.teal,display:'inline-block'}}/>
              Hospital (geral)
            </label>
            <input type="number" value={pdGeral} onChange={e=>setPdGeral(e.target.value)} placeholder="Ex: 620 (total hospital)"
              style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'9px 10px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:C.muted,display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{width:10,height:10,borderRadius:'50%',background:C.red,display:'inline-block'}}/>
              UPG - Unidade de Pacientes Graves
            </label>
            <input type="number" value={pdUPG} onChange={e=>setPdUPG(e.target.value)} placeholder="Ex: 180 (somente UPG)"
              style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'9px 10px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:C.muted,display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{width:10,height:10,borderRadius:'50%',background:C.blue,display:'inline-block'}}/>
              Ala A - Internacao Geral
            </label>
            <input type="number" value={pdAlaA} onChange={e=>setPdAlaA(e.target.value)} placeholder="Ex: 310 (somente Ala A)"
              style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'9px 10px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
          </div>
        </div>
        <div style={{fontSize:10,color:C.muted,marginTop:10,lineHeight:1.6,borderTop:'1px solid '+C.border,paddingTop:8}}>
          Deixe em branco os setores que nao deseja calcular individualmente. O paciente-dia e obtido no censo hospitalar ou SAME.
        </div>
      </div>

      <button onClick={calcular} disabled={loading||(!pdGeral&&!pdUPG&&!pdAlaA)}
        style={{width:'100%',background:loading||(!pdGeral&&!pdUPG&&!pdAlaA)?C.border:C.teal,border:'none',borderRadius:10,padding:'12px',color:loading||(!pdGeral&&!pdUPG&&!pdAlaA)?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:loading||(!pdGeral&&!pdUPG&&!pdAlaA)?'default':'pointer'}}>
        {loading?'Calculando...':'Calcular Indicadores'}
      </button>
    </div>

    {/* Resultados */}
    {dados&&<div>
      <div style={{fontSize:11,color:C.muted,textTransform:'uppercase',letterSpacing:'0.08em',fontWeight:700,marginBottom:12}}>
        {new Date(mesRef+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
      </div>

      {/* Comparativo rapido se tem setores */}
      {(dados.upg||dados.alaA)&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Comparativo por Setor</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
            <thead>
              <tr>
                <th style={{padding:'6px 8px',textAlign:'left',color:C.muted,borderBottom:'1px solid '+C.border,fontWeight:700}}>Indicador</th>
                {dados.geral&&<th style={{padding:'6px 8px',textAlign:'center',color:C.teal,borderBottom:'1px solid '+C.border,fontWeight:700}}>Geral</th>}
                {dados.upg&&<th style={{padding:'6px 8px',textAlign:'center',color:C.red,borderBottom:'1px solid '+C.border,fontWeight:700}}>UPG</th>}
                {dados.alaA&&<th style={{padding:'6px 8px',textAlign:'center',color:C.blue,borderBottom:'1px solid '+C.border,fontWeight:700}}>Ala A</th>}
                <th style={{padding:'6px 8px',textAlign:'center',color:C.muted,borderBottom:'1px solid '+C.border,fontWeight:700}}>Meta</th>
              </tr>
            </thead>
            <tbody>
              {INDICADORES_DEF.map((ind,i)=>{
                const vG=Number(dados.geral?.[ind.key]||0);
                const vU=dados.upg?Number(dados.upg[ind.key]||0):null;
                const vA=dados.alaA?Number(dados.alaA[ind.key]||0):null;
                const cor=(v)=>{if(v===null)return C.muted;const ok=ind.menor?v<ind.meta:v>=ind.meta;return ok?C.green:C.red;};
                return(<tr key={i} style={{borderBottom:'1px solid '+C.border+'22'}}>
                  <td style={{padding:'6px 8px',color:C.text,fontSize:11}}>{ind.label}</td>
                  {dados.geral&&<td style={{padding:'6px 8px',textAlign:'center',fontWeight:700,color:cor(vG)}}>{vG}{ind.unidade==='%'?'%':''}</td>}
                  {dados.upg&&<td style={{padding:'6px 8px',textAlign:'center',fontWeight:700,color:cor(vU)}}>{vU}{ind.unidade==='%'?'%':''}</td>}
                  {dados.alaA&&<td style={{padding:'6px 8px',textAlign:'center',fontWeight:700,color:cor(vA)}}>{vA}{ind.unidade==='%'?'%':''}</td>}
                  <td style={{padding:'6px 8px',textAlign:'center',color:C.muted,fontSize:10}}>{ind.menor?'< ':'> '}{ind.meta}{ind.unidade}</td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </div>}

      {/* Cards detalhados por setor */}
      <SetorCard titulo="Hospital - Geral" cor={C.teal} dados={dados.geral} icon="🏥"/>
      <SetorCard titulo="UPG - Unidade de Pacientes Graves" cor={C.red} dados={dados.upg} icon="🔴"/>
      <SetorCard titulo="Ala A - Internacao Geral" cor={C.blue} dados={dados.alaA} icon="🔵"/>

      <div style={{background:C.card,border:'1px solid '+C.border,borderRadius:12,padding:'12px 14px'}}>
        <div style={{fontSize:10,color:C.muted,lineHeight:1.6}}>As taxas sao calculadas com base nas notificacoes registradas. A qualidade depende da completude das notificacoes. Indicadores subnotificados subestimam os valores reais.</div>
      </div>
    </div>}
  </div>
  </div>);
}


// --- GESTÃO DE PROTOCOLOS -----------------------------------------------------
function ProtocolosView({sbUrl,sbKey,showToast,hospital}) {
  const [protocolos,setProtocolos]=useState([]);
  const [loading,setLoading]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [saving,setSaving]=useState(false);
  const [form,setForm]=useState({nome:'',categoria:'',responsavel:'',aprovado_em:'',validade_anos:3,numero:'',link:''});
  const h=hospital||DEFAULT_HOSPITAL;

  const OBRIGATORIOS=[
    {nome:'Higienização das Mãos',cat:'CCIH',base:'RDC 36/2013 + Meta 5 OMS'},
    {nome:'Cirurgia Segura',cat:'Cirúrgico',base:'RDC 36/2013 + Meta 4 OMS'},
    {nome:'Identificação do Paciente',cat:'Segurança',base:'RDC 36/2013 + Meta 1 OMS'},
    {nome:'Prevenção de Quedas',cat:'Segurança',base:'RDC 36/2013 + Meta 6 OMS'},
    {nome:'Prevenção de Lesão por Pressão',cat:'Segurança',base:'RDC 36/2013 + Meta 6 OMS'},
    {nome:'Comunicação Efetiva',cat:'Segurança',base:'RDC 36/2013 + Meta 2 OMS'},
    {nome:'Segurança na Prescrição e Uso de Medicamentos',cat:'Farmácia',base:'RDC 36/2013 + Meta 3 OMS'},
  ];

  const load=async()=>{
    if(!sbUrl||!sbKey){setProtocolos([]);return;}
    setLoading(true);
    try{const d=await sbSelect(sbUrl,sbKey,'protocolos',`hospital_id=eq.${h.id}&order=aprovado_em.desc`);setProtocolos(d||[]);}
    catch{setProtocolos([]);}
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey]);

  const salvar=async()=>{
    if(!form.nome.trim()||!form.aprovado_em){showToast('Nome e data de aprovação obrigatórios','error');return;}
    setSaving(true);
    const proxRevisao=new Date(form.aprovado_em);
    proxRevisao.setFullYear(proxRevisao.getFullYear()+Number(form.validade_anos));
    try{
      await sbInsert(sbUrl,sbKey,'protocolos',{hospital_id:h.id,...form,proxima_revisao:proxRevisao.toISOString().slice(0,10),status:'ativo'});
      await load();setShowForm(false);setForm({nome:'',categoria:'',responsavel:'',aprovado_em:'',validade_anos:3,numero:'',link:''});
      showToast('OK Protocolo cadastrado!','success');
    }catch{showToast('Erro ao salvar','error');}
    setSaving(false);
  };

  const hoje=new Date().toISOString().slice(0,10);
  const vencidos=protocolos.filter(p=>p.proxima_revisao&&p.proxima_revisao<hoje);
  const proximos60=protocolos.filter(p=>p.proxima_revisao&&p.proxima_revisao>=hoje&&new Date(p.proxima_revisao)<=new Date(Date.now()+60*86400000));
  const cadastrados=new Set(protocolos.map(p=>p.nome.toLowerCase()));
  const faltando=OBRIGATORIOS.filter(o=>![...cadastrados].some(c=>c.includes(o.nome.toLowerCase().slice(0,10))));

  const inp={background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%',marginBottom:10};
  const STATUS_COLOR={ativo:C.green,vencido:C.red,proximo:C.yellow};

  const getStatus=(p)=>{if(!p.proxima_revisao)return'ativo';if(p.proxima_revisao<hoje)return'vencido';if(new Date(p.proxima_revisao)<=new Date(Date.now()+60*86400000))return'proximo';return'ativo';};

  return(<div style={{padding:'20px 16px',display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div>
        <div style={{fontSize:17,fontWeight:900,color:C.text}}>Protocolos Institucionais</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>Controle de validade trienal · RDC 36/2013</div>
      </div>
      <button onClick={()=>setShowForm(!showForm)} style={{background:C.teal,border:'none',borderRadius:10,padding:'8px 14px',color:'#06101F',fontWeight:800,fontSize:12,cursor:'pointer'}}>+ Novo</button>
    </div>

    {/* Alertas */}
    {vencidos.length>0&&<div style={{background:C.red+'15',border:'1px solid '+C.red+'44',borderRadius:12,padding:'12px 14px'}}>
      <div style={{fontSize:13,fontWeight:700,color:C.red,marginBottom:4}}>🔴 {vencidos.length} protocolo(s) com revisão vencida</div>
      {vencidos.map(p=><div key={p.id} style={{fontSize:12,color:C.muted}}>→ {p.nome} · venceu em {new Date(p.proxima_revisao).toLocaleDateString('pt-BR')}</div>)}
    </div>}
    {proximos60.length>0&&<div style={{background:C.yellow+'15',border:'1px solid '+C.yellow+'44',borderRadius:12,padding:'12px 14px'}}>
      <div style={{fontSize:13,fontWeight:700,color:C.yellow,marginBottom:4}}>🟡 {proximos60.length} protocolo(s) vencem em 60 dias</div>
      {proximos60.map(p=><div key={p.id} style={{fontSize:12,color:C.muted}}>→ {p.nome} · vence em {new Date(p.proxima_revisao).toLocaleDateString('pt-BR')}</div>)}
    </div>}

    {/* Protocolos obrigatórios faltando */}
    {faltando.length>0&&<div style={{background:C.card,border:'1px solid '+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>⚠️ Protocolos obrigatórios não cadastrados ({faltando.length})</div>
      {faltando.map((p,i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',gap:10,paddingBottom:8,marginBottom:8,borderBottom:'1px solid '+C.border+'22'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:C.red,flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:600,color:C.text}}>{p.nome}</div>
            <div style={{fontSize:10,color:C.muted}}>{p.cat} · {p.base}</div>
          </div>
          <button onClick={()=>{setForm({...form,nome:p.nome,categoria:p.cat});setShowForm(true);}} style={{background:C.teal+'22',border:'1px solid '+C.teal+'44',borderRadius:7,padding:'4px 10px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>+ Cadastrar</button>
        </div>
      ))}
    </div>}

    {/* Form */}
    {showForm&&<div style={{background:C.card,border:'1px solid '+C.teal+'44',borderRadius:14,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}}>Novo protocolo</div>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Nome do protocolo *</label>
      <input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Ex: Protocolo de Higienização das Mãos" style={inp}/>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Número / código interno</label>
      <input value={form.numero} onChange={e=>setForm({...form,numero:e.target.value})} placeholder="Ex: POP-NSP-001" style={inp}/>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Categoria</label>
      <select value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})} style={{...inp,appearance:'none'}}>
        <option value="">Selecione</option>
        {['Segurança','CCIH','Cirúrgico','Farmácia','Emergência','Administrativo','Outro'].map(c=><option key={c}>{c}</option>)}
      </select>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Responsável pela revisão</label>
      <input value={form.responsavel} onChange={e=>setForm({...form,responsavel:e.target.value})} placeholder="Cargo ou nome" style={inp}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Data de aprovação *</label>
          <input type="date" value={form.aprovado_em} onChange={e=>setForm({...form,aprovado_em:e.target.value})} style={inp}/>
        </div>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Validade (anos)</label>
          <select value={form.validade_anos} onChange={e=>setForm({...form,validade_anos:e.target.value})} style={{...inp,appearance:'none'}}>
            <option value={1}>1 ano</option><option value={2}>2 anos</option><option value={3}>3 anos (padrão RDC)</option><option value={5}>5 anos</option>
          </select>
        </div>
      </div>
      <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Link do documento (opcional)</label>
      <input value={form.link} onChange={e=>setForm({...form,link:e.target.value})} placeholder="https://drive.google.com/..." style={inp}/>
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button onClick={()=>setShowForm(false)} style={{flex:1,background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px',color:C.muted,fontSize:12,fontWeight:700,cursor:'pointer'}}>Cancelar</button>
        <button onClick={salvar} disabled={saving} style={{flex:2,background:C.teal,border:'none',borderRadius:8,padding:'9px',color:'#06101F',fontSize:12,fontWeight:800,cursor:'pointer'}}>{saving?'Salvando...':'Ok Cadastrar'}</button>
      </div>
      <div style={{fontSize:10,color:C.muted,marginTop:10,lineHeight:1.6}}>⚠ Execute no Supabase: <span style={{fontFamily:'monospace',color:'#9ECFFF'}}>CREATE TABLE IF NOT EXISTS protocolos (id UUID DEFAULT gen_random_uuid() PRIMARY KEY, created_at TIMESTAMPTZ DEFAULT NOW(), hospital_id TEXT, nome TEXT, numero TEXT, categoria TEXT, responsavel TEXT, aprovado_em DATE, validade_anos INT DEFAULT 3, proxima_revisao DATE, link TEXT, status TEXT DEFAULT 'ativo');</span></div>
    </div>}

    {/* Lista */}
    {loading&&<div style={{textAlign:'center',color:C.muted,padding:20}}>Carregando...</div>}
    {!loading&&protocolos.length===0&&<div style={{textAlign:'center',color:C.muted,padding:20,fontSize:12}}>Nenhum protocolo cadastrado ainda.</div>}
    {protocolos.map(p=>{
      const st=getStatus(p);const stColor=STATUS_COLOR[st]||C.muted;
      return(<div key={p.id} style={{background:C.card,border:'1px solid '+stColor+'44',borderRadius:12,padding:'12px 14px',marginBottom:8}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:C.text}}>{p.nome}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>{p.numero?p.numero+' · ':''}{p.categoria||'-'}{p.responsavel?' · '+p.responsavel:''}</div>
          </div>
          <div style={{background:stColor+'22',color:stColor,borderRadius:6,padding:'3px 8px',fontSize:10,fontWeight:700,flexShrink:0}}>
            {st==='ativo'?'Ok Válido':st==='vencido'?'ATENCAO Vencido':'relogio Vence em breve'}
          </div>
        </div>
        <div style={{display:'flex',gap:12,fontSize:11,color:C.muted}}>
          <span>Aprovado: {p.aprovado_em?new Date(p.aprovado_em+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</span>
          <span style={{color:stColor}}>Revisão: {p.proxima_revisao?new Date(p.proxima_revisao+'T12:00:00').toLocaleDateString('pt-BR'):'-'}</span>
        </div>
        {p.link&&<a href={p.link} target="_blank" rel="noreferrer" style={{display:'inline-block',marginTop:6,fontSize:11,color:C.teal,fontWeight:600}}>📄 Abrir documento →</a>}
      </div>);
    })}
  </div>);
}

// --- RELATÓRIO MENSAL PDF -----------------------------------------------------
function RelatorioMensalPanel({sbUrl,sbKey,showToast,hospital,onClose}) {
  const [loading,setLoading]=useState(false);
  const [dados,setDados]=useState(null);
  const [mes,setMes]=useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')||'01'}`;});
  const [gestor,setGestor]=useState('');
  const [diretoria,setDiretoria]=useState('');
  const h=hospital||DEFAULT_HOSPITAL;

  const gerar=async()=>{
    if(!sbUrl||!sbKey){showToast('Supabase necessário','error');return;}
    setLoading(true);
    try{
      const [ano,m]=mes.split('-').map(Number);
      const mesCorr=m===0?{a:ano-1,m:12}:{a:ano,m};
      const inicio=new Date(mesCorr.a,mesCorr.m-1,1).toISOString().slice(0,10);
      const fim=new Date(mesCorr.a,mesCorr.m,0).toISOString().slice(0,10);
      const nots=await sbSelect(sbUrl,sbKey,'notifications',`event_date=gte.${inicio}&event_date=lte.${fim}&is_test=eq.false&select=*`);
      const s=computeStats(nots);
      setDados({nots,s,inicio,fim,mesCorr,total:nots.length});
    }catch{showToast('Erro ao gerar relatório','error');}
    setLoading(false);
  };

  const imprimir=()=>{
    const el=document.getElementById('relatorio-pdf');

    const w=window.open('','_blank');

    w.document.close();w.print();
  };

  const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  return(<div style={{position:'fixed',inset:0,background:'#000b',zIndex:200,display:'flex',alignItems:'flex-end'}}>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:800,color:C.text}}>Doc Relatório Mensal NSP</div>
        <button onClick={onClose} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:20}}>X</button>
      </div>

      {!dados&&(<div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Mês de referência</label>
          <input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
        </div>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Gestor / Coordenador NSP</label>
          <input value={gestor} onChange={e=>setGestor(e.target.value)} placeholder="Ex: Cap Ten Janan Almeida" style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
        </div>
        <div>
          <label style={{fontSize:11,color:C.muted,display:'block',marginBottom:4}}>Diretoria / Chefia (destinatário)</label>
          <input value={diretoria} onChange={e=>setDiretoria(e.target.value)} placeholder="Ex: Diretor-Geral HNSA" style={{background:C.surface,border:'1px solid '+C.border,borderRadius:8,padding:'9px 12px',color:C.text,fontSize:13,outline:'none',width:'100%'}}/>
        </div>
        <button onClick={gerar} disabled={loading} style={{background:loading?C.border:C.teal,border:'none',borderRadius:12,padding:'13px',color:loading?C.muted:'#06101F',fontWeight:800,fontSize:13,cursor:loading?'default':'pointer'}}>

      {dados&&(<div>

          <div style={{background:'#c8102e',color:'white',padding:'20px 20px 16px'}}>
            <div style={{fontSize:10,opacity:.8,marginBottom:4}}>MARINHA DO BRASIL · HOSPITAL NAVAL DE SALVADOR</div>

          <div style={{padding:'16px 20px'}}>
            {/* Identificação */}
            <div style={{marginBottom:16,paddingBottom:12,borderBottom:'2px solid #c8102e'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <tbody>
                  <tr><td style={{padding:'3px 0',color:'#666',width:160}}>Período de referência:</td><td style={{fontWeight:700}}>{new Date(dados.inicio+'T12:00:00').toLocaleDateString('pt-BR')} a {new Date(dados.fim+'T12:00:00').toLocaleDateString('pt-BR')}</td></tr>
                  {gestor&&<tr><td style={{padding:'3px 0',color:'#666'}}>Elaborado por:</td><td style={{fontWeight:700}}>{gestor} - NSP {h.short_name}</td></tr>}
                  {diretoria&&<tr><td style={{padding:'3px 0',color:'#666'}}>Destinatário:</td><td style={{fontWeight:700}}>{diretoria}</td></tr>}
                  <tr><td style={{padding:'3px 0',color:'#666'}}>Data de emissão:</td><td style={{fontWeight:700}}>{new Date().toLocaleDateString('pt-BR')}</td></tr>

            {/* 1. Sumário executivo */}

              <tbody>
                {[
                  ['Total de notificações',dados.total,'100%'],
                  ['Segurança do Paciente',dados.s.sp,dados.total?Math.round(dados.s.sp/dados.total*100)+'%':'-'],
                  ['CCIH / Infecções',dados.s.ccih,dados.total?Math.round(dados.s.ccih/dados.total*100)+'%':'-'],
                  ['Administrativa',dados.s.adm,dados.total?Math.round(dados.s.adm/dados.total*100)+'%':'-'],

                  ['Near miss',dados.s.semRCA||0,dados.total?'-':'-'],
                ].map(([l,v,p])=><tr key={l}><td style={{border:'1px solid #ddd',padding:'5px 10px'}}>{l}</td><td style={{border:'1px solid #ddd',padding:'5px 10px',fontWeight:700,textAlign:'center'}}>{v}</td><td style={{border:'1px solid #ddd',padding:'5px 10px',textAlign:'center',color:'#666'}}>{p}</td></tr>)}
              </tbody>
            </table>

            {/* 2. Distribuição setorial */}
            <h2 style={{fontSize:14,borderBottom:'2px solid #c8102e',paddingBottom:4,marginBottom:10,color:'#1a1a1a'}}>2. Distribuição por Setor</h2>
            <table style={{width:'100%',borderCollapse:'collapse',marginBottom:16}}>
              <thead><tr style={{background:'#f5f5f5'}}>{['Setor','Notificações'].map(h=><th key={h} style={{border:'1px solid #ddd',padding:'6px 10px',textAlign:'left',fontSize:11}}>{h}</th>)}</tr></thead>
              <tbody>
                {dados.s.sectorData.map(s=><tr key={s.setor}><td style={{border:'1px solid #ddd',padding:'5px 10px'}}>{s.setor}</td><td style={{border:'1px solid #ddd',padding:'5px 10px',fontWeight:700,textAlign:'center'}}>{s.eventos}</td></tr>)}
                {dados.s.sectorData.length===0&&<tr><td colSpan={2} style={{border:'1px solid #ddd',padding:'5px 10px',color:'#999',textAlign:'center'}}>Nenhum dado setorial</td></tr>}

              <tbody>
                {dados.s.typeData.slice(0,6).map(t=><tr key={t.name}><td style={{border:'1px solid #ddd',padding:'5px 10px'}}>{t.name}</td><td style={{border:'1px solid #ddd',padding:'5px 10px',fontWeight:700,textAlign:'center'}}>{t.value}</td></tr>)}
                {dados.s.typeData.length===0&&<tr><td colSpan={2} style={{border:'1px solid #ddd',padding:'5px 10px',color:'#999',textAlign:'center'}}>Nenhum dado de tipo</td></tr>}

            {/* 4. Ações e encaminhamentos */}

// --- ABA NOTIFICAÇÕES COMPLETA ------------------------------------------------
function NotificacoesView({sbUrl,sbKey,showToast,hospital}) {
  const h=hospital||DEFAULT_HOSPITAL;
  const [notifications,setNotifications]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filtroTipo,setFiltroTipo]=useState('todos');
  const [filtroSetor,setFiltroSetor]=useState('todos');
  const [filtroRCA,setFiltroRCA]=useState('todos');
  const [filtroNotivisa,setFiltroNotivisa]=useState('todos');
  const [filtroPeriodo,setFiltroPeriodo]=useState('');
  const [pagina,setPagina]=useState(1);
  const POR_PAGINA=20;
  const [rcaTarget,setRcaTarget]=useState(null);
  const [notiVisaTarget,setNotiVisaTarget]=useState(null);
  const [riscoTarget,setRiscoTarget]=useState(null);
  const [planoTarget,setPlanoTarget]=useState(null);
  const [busca,setBusca]=useState('');

  const load=async()=>{
    if(!sbUrl||!sbKey) return;
    setLoading(true);
    try{
      const data=await sbSelect(sbUrl,sbKey,'notifications','select=*&is_test=eq.false&order=created_at.desc&limit=500');
      setNotifications(data||[]);
    }catch{showToast('Erro ao carregar notificações','error');}
    setLoading(false);
  };
  useEffect(()=>{load();},[sbUrl,sbKey]);

  const filtered=notifications.filter(n=>{
    if(filtroTipo!=='todos'&&n.notification_type!==filtroTipo) return false;
    if(filtroSetor!=='todos'&&n.sector!==filtroSetor) return false;
    if(filtroRCA==='sem'&&n.rca_gerado) return false;
    if(filtroRCA==='com'&&!n.rca_gerado) return false;
    if(filtroNotivisa==='sem'&&n.notivisa_enviado) return false;
    if(filtroNotivisa==='com'&&!n.notivisa_enviado) return false;
    if(filtroPeriodo){
      const [ano,mes]=filtroPeriodo.split('-');
      const d=new Date(n.created_at);
      if(d.getFullYear()!==Number(ano)||d.getMonth()+1!==Number(mes)) return false;
    }
    if(busca){
      const b=busca.toLowerCase();
      const txt=((n.description||'')+(n.event_subtype||'')+(n.sector||'')+(n.ai_summary||'')).toLowerCase();
      if(!txt.includes(b)) return false;
    }
    return true;
  });

  const totalPags=Math.ceil(filtered.length/POR_PAGINA);
  const pagAtual=filtered.slice((pagina-1)*POR_PAGINA,pagina*POR_PAGINA);
  const setores=[...new Set(notifications.map(n=>n.sector).filter(Boolean))].sort();

  const statsSP=notifications.filter(n=>n.notification_type==='seguranca_paciente'&&!n.is_test).length;
  const statsSemRCA=notifications.filter(n=>n.notification_type==='seguranca_paciente'&&!n.rca_gerado&&!n.is_test).length;
  const statsSemNotivisa=notifications.filter(n=>n.notification_type==='seguranca_paciente'&&!n.notivisa_enviado&&!n.is_test).length;

  const updateNot=(id,patch)=>setNotifications(prev=>prev.map(n=>n.id===id?{...n,...patch}:n));

  const sel={background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none',appearance:'none'};

  return(<div style={{padding:'0 0 80px'}}>
    <BackHeader title='Notificacoes' subtitle={filtered.length+' resultado(s) de '+notifications.length+' total'} right={<button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'6px 12px',color:C.teal,fontSize:11,fontWeight:700,cursor:'pointer'}}>Atualizar</button>}/>
    <div style={{padding:'16px'}}>
    {rcaTarget&&<RCAPanel notification={rcaTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>{setRcaTarget(null);updateNot(rcaTarget.id,{rca_gerado:true});}}/>}
    {notiVisaTarget&&<NotiVisaPanel notification={notiVisaTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>{setNotiVisaTarget(null);updateNot(notiVisaTarget.id,{notivisa_enviado:true});}}/>}
    {riscoTarget&&<MatrizRisco notification={riscoTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setRiscoTarget(null)} onSaved={n=>updateNot(n.id,{risco_classificacao:n.risco_classificacao,risco_score:n.risco_score})}/>}
    {planoTarget&&<PlanoAcaoPanel notification={planoTarget} sbUrl={sbUrl} sbKey={sbKey} showToast={showToast} onClose={()=>setPlanoTarget(null)}/>}

    {/* Header */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div>
        <div style={{fontSize:17,fontWeight:900,color:C.text}}>Notificacoes</div>
        <div style={{fontSize:11,color:C.muted}}>{filtered.length} resultado(s) de {notifications.length} total</div>
      </div>
      <button onClick={load} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 12px',color:C.teal,fontSize:12,fontWeight:700,cursor:'pointer'}}>Atualizar</button>
    </div>

    {/* Cards de resumo */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
      {[['Total SP',statsSP,C.red],['Sem RCA',statsSemRCA,C.yellow],['Sem Notivisa',statsSemNotivisa,C.purple]].map(([l,v,c])=>(
        <div key={l} style={{background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'10px 8px',textAlign:'center'}}>
          <div style={{fontSize:20,fontWeight:900,color:c}}>{v}</div>
          <div style={{fontSize:9,color:C.muted,fontWeight:700,textTransform:'uppercase',marginTop:2}}>{l}</div>
        </div>
      ))}
    </div>

    {/* Busca */}
    <input value={busca} onChange={e=>{setBusca(e.target.value);setPagina(1);}} placeholder="Buscar por descricao, tipo, setor..."
      style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:10,padding:'9px 14px',color:C.text,fontSize:13,outline:'none',marginBottom:10}}/>

    {/* Filtros */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
      <select value={filtroTipo} onChange={e=>{setFiltroTipo(e.target.value);setPagina(1);}} style={sel}>
        <option value="todos">Todos os tipos</option>
        <option value="seguranca_paciente">Seguranca do Paciente</option>
        <option value="ccih">CCIH / Infeccao</option>
        <option value="administrativa">Administrativa</option>
      </select>
      <select value={filtroSetor} onChange={e=>{setFiltroSetor(e.target.value);setPagina(1);}} style={sel}>
        <option value="todos">Todos os setores</option>
        {setores.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <select value={filtroRCA} onChange={e=>{setFiltroRCA(e.target.value);setPagina(1);}} style={sel}>
        <option value="todos">RCA: todos</option>
        <option value="sem">Sem RCA</option>
        <option value="com">Com RCA</option>
      </select>
      <select value={filtroNotivisa} onChange={e=>{setFiltroNotivisa(e.target.value);setPagina(1);}} style={sel}>
        <option value="todos">Notivisa: todos</option>
        <option value="sem">Sem Notivisa</option>
        <option value="com">Com Notivisa</option>
      </select>
    </div>
    <input type="month" value={filtroPeriodo} onChange={e=>{setFiltroPeriodo(e.target.value);setPagina(1);}}
      style={{width:'100%',background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 10px',color:C.text,fontSize:12,outline:'none',marginBottom:12}}/>

    {/* Lista */}
    {loading&&<div style={{textAlign:'center',padding:40}}><Dots/></div>}
    {!loading&&pagAtual.length===0&&<div style={{textAlign:'center',color:C.muted,padding:40,fontSize:13}}>Nenhuma notificacao encontrada.</div>}
    {pagAtual.map(n=>{
      const tag=getTag(n);const title=getTitle(n);
      const isSentinela=n.gravidade==='Evento sentinela';
      const isSP=n.notification_type==='seguranca_paciente';
      const riscoColor={'BAIXO':C.green,'MEDIO':C.yellow,'ALTO':C.red,'EXTREMO':'#7C0000'}[n.risco_classificacao]||C.muted;

        </div>

        {/* Descricao */}
        {n.description&&<div style={{fontSize:12,color:C.muted,marginBottom:8,lineHeight:1.5,borderLeft:'2px solid '+C.border,paddingLeft:8}}>{n.description.slice(0,150)}{n.description.length>150?'...':''}</div>}

        {/* NIP / dados paciente */}
        {n.admission_reason&&<div style={{fontSize:11,color:C.teal,marginBottom:8}}>Paciente: {n.admission_reason}</div>}

        {/* Status badges */}
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          <span style={{fontSize:10,background:n.rca_gerado?C.green+'20':C.yellow+'20',color:n.rca_gerado?C.green:C.yellow,borderRadius:4,padding:'2px 7px',fontWeight:700}}>{n.rca_gerado?'RCA':'Sem RCA'}</span>
          <span style={{fontSize:10,background:n.notivisa_enviado?C.green+'20':C.muted+'20',color:n.notivisa_enviado?C.green:C.muted,borderRadius:4,padding:'2px 7px',fontWeight:700}}>{n.notivisa_enviado?'Notivisa':'Sem Notivisa'}</span>
          {n.risco_classificacao&&<span style={{fontSize:10,background:riscoColor+'20',color:riscoColor,borderRadius:4,padding:'2px 7px',fontWeight:700}}>{n.risco_classificacao}</span>}
          {n.gravidade&&<span style={{fontSize:10,background:C.surface,color:C.muted,borderRadius:4,padding:'2px 7px'}}>{n.gravidade}</span>}
        </div>

        {/* Botoes de acao */}
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {isSP&&!n.rca_gerado&&<button onClick={()=>setRcaTarget(n)} style={{background:C.blue+'20',color:C.blue,border:'1px solid '+C.blue+'33',borderRadius:7,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>RCA</button>}
          {isSP&&!n.notivisa_enviado&&<button onClick={()=>setNotiVisaTarget(n)} style={{background:C.purple+'20',color:C.purple,border:'1px solid '+C.purple+'33',borderRadius:7,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>Notivisa</button>}
          <button onClick={()=>setRiscoTarget(n)} style={{background:C.yellow+'20',color:C.yellow,border:'1px solid '+C.yellow+'33',borderRadius:7,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>{n.risco_classificacao?'Risco: '+n.risco_classificacao:'Avaliar Risco'}</button>
          <button onClick={()=>setPlanoTarget(n)} style={{background:C.orange+'20',color:C.orange,border:'1px solid '+C.orange+'33',borderRadius:7,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>Plano de Acao</button>
        </div>
      </div>);
    })}

    {/* Paginacao */}
    {totalPags>1&&<div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16,flexWrap:'wrap'}}>
      <button onClick={()=>setPagina(p=>Math.max(1,p-1))} disabled={pagina===1} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 14px',color:pagina===1?C.muted:C.teal,fontSize:12,fontWeight:700,cursor:pagina===1?'default':'pointer'}}>Anterior</button>
      <span style={{padding:'7px 14px',fontSize:12,color:C.muted}}>{pagina}/{totalPags}</span>
      <button onClick={()=>setPagina(p=>Math.min(totalPags,p+1))} disabled={pagina===totalPags} style={{background:C.card,border:'1px solid '+C.border,borderRadius:8,padding:'7px 14px',color:pagina===totalPags?C.muted:C.teal,fontSize:12,fontWeight:700,cursor:pagina===totalPags?'default':'pointer'}}>Proxima</button>
    </div>}
  </div>
  </div>);
}
